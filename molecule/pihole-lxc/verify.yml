---
- name: Reconstruct pihole dynamic group
  hosts: dns_nodes
  gather_facts: false
  tasks:
    - name: Include group reconstruction
      ansible.builtin.include_tasks: ../../tasks/reconstruct_pihole_group.yml

- name: Container readiness gate
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Query pihole readiness from API
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ lookup('env', 'WEBUI_PORT') | default('52500', true) }}/api/container/pihole/ready"
        return_content: true
      register: _container_api
      failed_when: false

    - name: Set API readiness fact
      ansible.builtin.set_fact:
        _container_api_ready: "{{ (_container_api.json.ready | default(false)) | bool }}"

    - name: Report readiness path
      ansible.builtin.debug:
        msg: "{{ 'API ready — skipping SSH health checks' if (_container_api_ready | bool) else 'SSH fallback mode' }}"

- name: Verify Pi-hole LXC container
  hosts: dns_nodes
  gather_facts: false
  vars:
    pihole_ct_id: 102
    _api_ready: "{{ hostvars['localhost']._container_api_ready | default(false) | bool }}"
  tasks:
    # ── Container state ──────────────────────────────────────────

    - name: Read container state and config
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          pct status {{ pihole_ct_id }}
          pct config {{ pihole_ct_id }}
        executable: /bin/bash
      register: _pihole_cfg
      changed_when: false

    - name: Assert container is running
      ansible.builtin.assert:
        that: "'running' in _pihole_cfg.stdout"
        fail_msg: "Container {{ pihole_ct_id }} is not running"

    - name: Assert onboot is enabled
      ansible.builtin.assert:
        that: "'onboot: 1' in _pihole_cfg.stdout"
        fail_msg: "Container {{ pihole_ct_id }} missing onboot: 1"

    - name: Assert startup order is 3
      ansible.builtin.assert:
        that: _pihole_cfg.stdout is regex('startup:.*order=3')
        fail_msg: "Container {{ pihole_ct_id }} missing startup order=3"

    - name: Assert nesting is enabled
      ansible.builtin.assert:
        that: "'nesting=1' in _pihole_cfg.stdout"
        fail_msg: "Container {{ pihole_ct_id }} missing nesting=1"

    # ── Pi-hole health checks (batched single pct exec) ──────────

    - name: Run Pi-hole container health checks (single pct exec)
      ansible.builtin.shell:
        cmd: >-
          pct exec {{ pihole_ct_id }} -- /bin/sh -c '
          echo "FTL=$(/usr/local/bin/pihole status 2>/dev/null | head -3)";
          echo "WEB=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1/admin/ 2>/dev/null)";
          echo "DHCP=$(/usr/bin/pihole-FTL --config dhcp.active 2>/dev/null)"
          '
      register: _pihole_health
      changed_when: false
      when: not (_api_ready | bool)

    - name: Assert FTL is active
      ansible.builtin.assert:
        that: "'FTL' in _pihole_health.stdout or 'Enabled' in _pihole_health.stdout or 'Active' in _pihole_health.stdout"
        fail_msg: "Pi-hole FTL not active"
      when: not (_api_ready | bool)

    - name: Parse web admin status
      ansible.builtin.set_fact:
        _pihole_web_code: "{{ _pihole_health.stdout | regex_search('WEB=(\\d+)', '\\1') | first }}"
      when: not (_api_ready | bool)

    - name: Assert web admin returns 200 or 301
      ansible.builtin.assert:
        that: _pihole_web_code in ['200', '301']
        fail_msg: "Web admin HTTP status: {{ _pihole_web_code }}, expected 200 or 301"
      when: not (_api_ready | bool)

    # ── DNS resolution ───────────────────────────────────────────

    - name: Wait for FTL to listen on TCP+UDP port 53
      ansible.builtin.shell:
        cmd: >-
          pct exec {{ pihole_ct_id }} -- /bin/sh -c '
          tcp=$(ss -tlnp 2>/dev/null | grep -c ":53 ");
          udp=$(ss -ulnp 2>/dev/null | grep -c ":53 ");
          [ "$tcp" -gt 0 ] && [ "$udp" -gt 0 ]
          && echo BOTH || echo MISSING
          '
      register: _ftl_listen
      changed_when: false
      retries: 3
      delay: 3
      until: "'BOTH' in _ftl_listen.stdout"

    - name: Restart FTL if listeners are incomplete
      ansible.builtin.command:
        cmd: >-
          pct exec {{ pihole_ct_id }} -- /bin/sh -c
          'systemctl restart pihole-FTL && sleep 3'
      when: "'BOTH' not in _ftl_listen.stdout"
      changed_when: true

    - name: Pi-hole DNS resolution test
      block:
        - name: Test DNS via FTL
          ansible.builtin.command:
            cmd: >-
              pct exec {{ pihole_ct_id }} --
              dig @127.0.0.1 google.com +short +time=5
          register: _pihole_dns
          changed_when: false
          retries: 3
          delay: 5
          until: >-
            _pihole_dns.rc == 0 and
            (_pihole_dns.stdout | trim | length > 0) and
            ('timed out' not in _pihole_dns.stdout)
      rescue:
        - name: Collect FTL diagnostics
          ansible.builtin.shell:
            cmd: |
              set -o pipefail
              pct exec {{ pihole_ct_id }} -- /bin/sh -c '
                echo "FTL_PID=$(pidof pihole-FTL 2>/dev/null || echo dead)"
                echo "RESOLV=$(cat /etc/resolv.conf 2>/dev/null)"
                echo "UPSTREAM=$(/usr/bin/pihole-FTL --config dns.upstreams 2>/dev/null)"
                echo "ROUTE=$(ip route show default 2>/dev/null)"
                gw=$(ip route show default | awk "/default/{print \$3}" | head -1)
                echo "GW_PING=$(ping -c1 -W2 $gw 2>&1 | tail -1)"
                echo "EXT_PING=$(ping -c1 -W2 1.1.1.1 2>&1 | tail -1)"
                echo "DIG_GW=$(dig @${gw} google.com +short +time=3 2>&1 | head -3)"
                echo "DIG_EXT=$(dig @1.1.1.1 google.com +short +time=3 2>&1 | head -3)"
              '
            executable: /bin/bash
          register: _ftl_diag
          changed_when: false

        - name: Show FTL diagnostics
          ansible.builtin.debug:
            var: _ftl_diag.stdout_lines

        - name: Restart FTL and retry DNS
          ansible.builtin.shell:
            cmd: >-
              pct exec {{ pihole_ct_id }} -- /bin/sh -c
              'systemctl restart pihole-FTL && sleep 5' &&
              pct exec {{ pihole_ct_id }} --
              dig @127.0.0.1 google.com +short +time=5
          register: _pihole_dns
          changed_when: false
          retries: 2
          delay: 10
          until: >-
            _pihole_dns.rc == 0 and
            (_pihole_dns.stdout | trim | length > 0) and
            ('timed out' not in _pihole_dns.stdout)

    - name: Assert DNS resolves
      ansible.builtin.assert:
        that:
          - _pihole_dns.stdout | trim | length > 0
          - "'timed out' not in _pihole_dns.stdout"
        fail_msg: >-
          DNS resolution failed:
          {{ _pihole_dns.stdout | default('no output') }}

    # ── Ad blocking ──────────────────────────────────────────────

    - name: Test known ad domain is blocked
      ansible.builtin.command:
        cmd: pct exec {{ pihole_ct_id }} -- dig @127.0.0.1 doubleclick.net +short +time=5
      register: _pihole_adblock
      changed_when: false
      failed_when: false

    - name: Report ad blocking result
      ansible.builtin.debug:
        msg: "Ad block test (doubleclick.net): {{ _pihole_adblock.stdout | default('no response') | trim }}"

    - name: Assert DHCP is disabled
      ansible.builtin.assert:
        that: "'false' in _pihole_health.stdout"
        fail_msg: "DHCP is active in Pi-hole — should be disabled"
      when: not (_api_ready | bool)

    # ── Report ───────────────────────────────────────────────────

    - name: Report Pi-hole verification
      ansible.builtin.debug:
        msg: >-
          Pi-hole per-feature verify passed:
          ct={{ pihole_ct_id }}, running=yes,
          web={{ _pihole_web_code | default('skipped (API ready)') }},
          dns={{ 'working' if _pihole_dns.stdout | trim | length > 0 else 'failed' }}
