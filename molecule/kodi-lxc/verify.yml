---
- name: Reconstruct kodi dynamic group
  hosts: media_nodes
  gather_facts: false
  tasks:
    - name: Include group reconstruction
      ansible.builtin.include_tasks: ../../tasks/reconstruct_kodi_group.yml

- name: Container readiness gate
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Query kodi readiness from API
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ lookup('env', 'WEBUI_PORT') | default('52500', true) }}/api/container/kodi/ready"
        return_content: true
      register: _container_api
      failed_when: false

    - name: Set API readiness fact
      ansible.builtin.set_fact:
        _container_api_ready: "{{ (_container_api.json.ready | default(false)) | bool }}"

    - name: Report readiness path
      ansible.builtin.debug:
        msg: "{{ 'API ready — skipping SSH health checks' if (_container_api_ready | bool) else 'SSH fallback mode' }}"

- name: Verify Kodi LXC container
  hosts: media_nodes
  gather_facts: false
  vars:
    kodi_ct_id: 301
    _api_ready: "{{ hostvars['localhost']._container_api_ready | default(false) | bool }}"
  tasks:
    # ── Container state ──────────────────────────────────────────

    - name: Read container state and config
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          pct status {{ kodi_ct_id }}
          pct config {{ kodi_ct_id }}
        executable: /bin/bash
      register: _kodi_cfg
      changed_when: false

    - name: Assert container is running
      ansible.builtin.assert:
        that: "'running' in _kodi_cfg.stdout"
        fail_msg: "Container {{ kodi_ct_id }} is not running"

    - name: Assert onboot is disabled (on-demand container)
      ansible.builtin.assert:
        that: "'onboot: 0' in _kodi_cfg.stdout"
        fail_msg: "Container {{ kodi_ct_id }} should have onboot: 0"

    # ── Headless VNC stack (sway + wayvnc + websockify) ──────────

    - name: Check headless VNC stack inside container
      ansible.builtin.shell:
        cmd: >-
          pct exec {{ kodi_ct_id }} -- /bin/sh -c '
          echo "SWAY=$(command -v sway >/dev/null 2>&1 && echo yes || echo no)";
          echo "WAYVNC=$(command -v wayvnc >/dev/null 2>&1 && echo yes || echo no)";
          echo "WEBSOCKIFY=$(command -v websockify >/dev/null 2>&1 && echo yes || echo no)";
          echo "DISPLAY_SVC=$(systemctl is-enabled kodi-display 2>/dev/null || echo missing)";
          echo "VNC_SVC=$(systemctl is-enabled kodi-vnc 2>/dev/null || echo missing)";
          echo "VNC_WS_SVC=$(systemctl is-enabled kodi-vnc-ws 2>/dev/null || echo missing)"
          '
      register: _kodi_vnc_health
      changed_when: false

    - name: Assert headless VNC stack is present and enabled
      ansible.builtin.assert:
        that:
          - "'SWAY=yes' in _kodi_vnc_health.stdout"
          - "'WAYVNC=yes' in _kodi_vnc_health.stdout"
          - "'WEBSOCKIFY=yes' in _kodi_vnc_health.stdout"
          - "'DISPLAY_SVC=enabled' in _kodi_vnc_health.stdout"
          - "'VNC_SVC=enabled' in _kodi_vnc_health.stdout"
          - "'VNC_WS_SVC=enabled' in _kodi_vnc_health.stdout"
        fail_msg: "Headless VNC stack missing or not enabled: {{ _kodi_vnc_health.stdout }}"

    # ── Kodi packages and service ────────────────────────────────

    - name: Run Kodi container package and config checks (pct exec)
      ansible.builtin.shell:
        cmd: >-
          pct exec {{ kodi_ct_id }} -- /bin/sh -c '
          echo "KODI_PKG=$(dpkg -l kodi 2>/dev/null | grep -c ^ii)";
          echo "SETTINGS=$(test -f /home/kodi/.kodi/userdata/advancedsettings.xml && echo exists || echo missing)";
          echo "KODI_USER=$(id kodi 2>/dev/null && echo exists || echo missing)"
          '
      register: _kodi_health
      changed_when: false

    - name: Assert Kodi package is installed
      ansible.builtin.assert:
        that: "'KODI_PKG=1' in _kodi_health.stdout"
        fail_msg: "kodi package not installed"

    - name: Assert kodi user exists
      ansible.builtin.assert:
        that: "'KODI_USER=exists' in _kodi_health.stdout or 'uid=' in _kodi_health.stdout"
        fail_msg: "kodi user not found"

    # ── Web interface config ─────────────────────────────────────

    - name: Check web interface config
      ansible.builtin.command:
        cmd: pct exec {{ kodi_ct_id }} -- test -f /home/kodi/.kodi/userdata/guisettings.xml
      register: _gui_settings
      changed_when: false
      failed_when: false

    - name: Assert web interface config exists
      ansible.builtin.assert:
        that: _gui_settings.rc == 0
        fail_msg: "guisettings.xml not found"

    # ── Host-side VNC proxy ──────────────────────────────────────

    - name: Check kodi-vnc-proxy service on host
      ansible.builtin.command:
        cmd: systemctl is-active kodi-vnc-proxy
      register: _kodi_vnc_proxy
      changed_when: false
      failed_when: false

    - name: Assert kodi-vnc-proxy is running
      ansible.builtin.assert:
        that: "'active' in _kodi_vnc_proxy.stdout"
        fail_msg: "kodi-vnc-proxy not active on {{ inventory_hostname }}"

    # ── Report ───────────────────────────────────────────────────

    - name: Report Kodi verification
      ansible.builtin.debug:
        msg: >-
          Kodi per-feature verify passed:
          ct={{ kodi_ct_id }}, running=yes,
          kodi={{ 'installed' if 'KODI_PKG=1' in _kodi_health.stdout else 'missing' }},
          vnc_stack={{ 'complete' if 'SWAY=yes' in _kodi_vnc_health.stdout else 'incomplete' }},
          proxy={{ 'active' if 'active' in (_kodi_vnc_proxy.stdout | default('')) else 'inactive' }}
