---
- name: Verify image version sidecars exist
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _project_root: "{{ playbook_dir }}/../.."
    images_dir: "{{ _project_root }}/images"
    _required_version_files:
      - pihole
      - rsyslog
      - jellyfin
      - netdata
      - wireguard
      - homeassistant
      - kodi
      - moonlight
      - kiosk
      - gaming
      - mesh
      - router
      - desktop
  tasks:
    - name: Check version sidecar files exist
      ansible.builtin.stat:
        path: "{{ images_dir }}/{{ item }}.version"
      loop: "{{ _required_version_files }}"
      register: _version_checks

    - name: Identify missing version files
      ansible.builtin.set_fact:
        missing_versions: >-
          {{ _version_checks.results
             | selectattr('stat.exists', 'false')
             | map(attribute='item')
             | list }}

    - name: Fail if version files are missing
      ansible.builtin.fail:
        msg: |-
          Missing version sidecar files:
          {% for v in missing_versions %}
            - images/{{ v }}.version
          {% endfor %}

          Build them with: ./build-images.sh
      when: missing_versions | length > 0

- name: Start heartbeat API server
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _project_root: "{{ playbook_dir }}/../.."
  tasks:
    - name: Clear stale nodes.json from previous runs
      ansible.builtin.file:
        path: "{{ _project_root }}/.state/nodes.json"
        state: absent

    - name: Detect controller IP and start API server
      ansible.builtin.command:
        cmd: "{{ _project_root }}/.venv/bin/python3 {{ _project_root }}/scripts/start_test_api.py"
      register: _api_start
      changed_when: true

    - name: Report API server URL
      ansible.builtin.debug:
        msg: "Heartbeat API server: {{ _api_start.stdout }}"
