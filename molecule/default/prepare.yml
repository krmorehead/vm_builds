---
- name: Assert all required images exist
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _project_root: "{{ playbook_dir }}/../.."
    images_dir: "{{ _project_root }}/images"
    _manifest: "{{ lookup('file', _project_root + '/images/manifest.json') | from_json }}"
    _optional_images:
      - sunshine
    required_images: >-
      {{ _manifest.images | dict2items
         | rejectattr('key', 'in', _optional_images)
         | map(attribute='value.filename') | list }}
  tasks:
    - name: Verify manifest.json exists and is valid
      ansible.builtin.assert:
        that:
          - _manifest.schema_version is defined
          - _manifest.images | length > 0
        fail_msg: >-
          images/manifest.json is missing or invalid.
          This file tracks image versions. It should be committed to git.

    - name: Check which images exist
      ansible.builtin.stat:
        path: "{{ images_dir }}/{{ item }}"
      loop: "{{ required_images }}"
      register: _image_checks

    - name: Identify missing images
      ansible.builtin.set_fact:
        missing_images: >-
          {{ _image_checks.results
             | selectattr('stat.exists', 'false')
             | map(attribute='item')
             | list }}

    - name: Fail if images are missing
      ansible.builtin.fail:
        msg: |-
          Missing images for E2E test:
          {% for img in missing_images %}
            - {{ img }}
          {% endfor %}

          Build them with:
            ./build-images.sh --parallel

          Or build individually:
            ./build-images.sh --host <ip> --only <target>
      when: missing_images | length > 0

- name: Start heartbeat API server
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _project_root: "{{ playbook_dir }}/../.."
  tasks:
    - name: Clear stale nodes.json from previous runs
      ansible.builtin.file:
        path: "{{ _project_root }}/.state/nodes.json"
        state: absent

    - name: Detect controller IP and start API server
      ansible.builtin.command:
        cmd: "{{ _project_root }}/.venv/bin/python3 {{ _project_root }}/scripts/start_test_api.py"
      register: _api_start
      changed_when: true

    - name: Report API server URL
      ansible.builtin.debug:
        msg: "Heartbeat API server: {{ _api_start.stdout }}"
