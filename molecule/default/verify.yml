# ── Play 12: Kiosk health (kiosk_nodes) ──────────────────────────
# Deep Kiosk checks (Cage, Chromium, dashboard file, systemd service)
# live in molecule/kiosk-lxc/verify.yml.

- name: Verify Kiosk on kiosk nodes
  hosts: kiosk_nodes
  gather_facts: false
  vars:
    _api_ready: "{{ hostvars['localhost']._fleet_api_ready | default(false) | bool }}"
    _api_base: "http://127.0.0.1:{{ lookup('env', 'WEBUI_PORT') | default('52500', true) }}"
  tasks:
    - name: Read Kiosk container state and config
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          pct status {{ kiosk_ct_id }}
          pct config {{ kiosk_ct_id }}
        executable: /bin/bash
      register: _kiosk_cfg
      changed_when: false

    - name: Assert Kiosk container config is correct
      ansible.builtin.assert:
        that:
          - "'status: ' in _kiosk_cfg.stdout"
          - "'onboot: 1' in _kiosk_cfg.stdout"
          - _kiosk_cfg.stdout is regex('startup:.*order=6')
        fail_msg: "Kiosk container {{ kiosk_ct_id }} config incorrect on {{ inventory_hostname }}"

    - name: Verify DRI passthrough in Kiosk config
      ansible.builtin.assert:
        that:
          - _kiosk_cfg.stdout is regex('lxc\\.mount\\.entry.*dev/dri')
        fail_msg: >-
          Kiosk container {{ kiosk_ct_id }} missing DRI passthrough on {{ inventory_hostname }}.
          Config: {{ _kiosk_cfg.stdout_lines | select('match', '.*lxc\\.mount') | list }}
      failed_when: false

    - name: Check if Desktop VM is running (display-exclusive stops Kiosk)
      ansible.builtin.command:
        cmd: qm status {{ desktop_vm_id }}
      register: _desktop_status_for_kiosk
      changed_when: false
      failed_when: false

    - name: Assert Kiosk is running OR stopped by display-exclusive hookscript
      ansible.builtin.assert:
        that: >-
          'running' in _kiosk_cfg.stdout or
          ('stopped' in _kiosk_cfg.stdout and 'running' in (_desktop_status_for_kiosk.stdout | default('')))
        fail_msg: >-
          Kiosk container {{ kiosk_ct_id }} is stopped but Desktop VM is not running —
          expected either Kiosk running or Kiosk stopped due to display-exclusive hookscript

    - name: Check Kiosk services, NiceGUI files, and 4-tier config (single pct exec)
      ansible.builtin.shell:
        cmd: >-
          pct exec {{ kiosk_ct_id }} -- /bin/sh -c '
          echo "DISPLAY_SVC=$(systemctl is-enabled kiosk-display 2>/dev/null || echo disabled)";
          echo "WEB_SVC=$(systemctl is-enabled kiosk-web 2>/dev/null || echo disabled)";
          echo "WEB_ACTIVE=$(systemctl is-active kiosk-web 2>/dev/null || echo inactive)";
          echo "CONFIG=$(test -f /opt/kiosk/config.json && echo yes || echo no)";
          echo "BUILD_PY=$(test -f /opt/kiosk/build.py && echo yes || echo no)";
          echo "SERVER=$(test -f /opt/kiosk/scripts/webui/kiosk_server.py && echo yes || echo no)";
          echo "HUB=$(test -f /opt/kiosk/scripts/webui/pages/hub.py && echo yes || echo no)";
          echo "LAUNCH=$(test -f /opt/kiosk/scripts/webui/pages/launch.py && echo yes || echo no)";
          echo "VIEWER=$(test -f /opt/kiosk/scripts/webui/pages/viewer.py && echo yes || echo no)";
          echo "MANAGER=$(test -f /opt/kiosk/scripts/webui/manager.py && echo yes || echo no)";
          echo "SCRIPTS_INIT=$(test -f /opt/kiosk/scripts/__init__.py && echo yes || echo no)";
          MGMT=$(python3 -c "import json; print(json.load(open(\"/opt/kiosk/config.json\")).get(\"MANAGEMENT_SERVER\",\"\"))" 2>/dev/null || echo "");
          echo "MGMT_SERVER=$MGMT";
          PK=$(python3 -c "import json; print(json.load(open(\"/opt/kiosk/config.json\")).get(\"CALLHOME_PUBLIC_KEY\",\"\"))" 2>/dev/null || echo "");
          echo "HAS_PUBLIC_KEY=$([ -n \"$PK\" ] && echo yes || echo no)"
          '
      register: _kiosk_health
      changed_when: false
      when: not (_api_ready | bool)

    - name: Assert Kiosk services enabled, files present, and 4-tier configured
      ansible.builtin.assert:
        that:
          - "'DISPLAY_SVC=enabled' in _kiosk_health.stdout"
          - "'WEB_SVC=enabled' in _kiosk_health.stdout"
          - "'WEB_ACTIVE=active' in _kiosk_health.stdout"
          - "'CONFIG=yes' in _kiosk_health.stdout"
          - "'BUILD_PY=yes' in _kiosk_health.stdout"
          - "'SERVER=yes' in _kiosk_health.stdout"
          - "'HUB=yes' in _kiosk_health.stdout"
          - "'LAUNCH=yes' in _kiosk_health.stdout"
          - "'VIEWER=yes' in _kiosk_health.stdout"
          - "'MANAGER=yes' in _kiosk_health.stdout"
          - "'SCRIPTS_INIT=yes' in _kiosk_health.stdout"
          - "'MGMT_SERVER=http' in _kiosk_health.stdout"
          - "'HAS_PUBLIC_KEY=yes' in _kiosk_health.stdout"
        fail_msg: "Kiosk health check failed on {{ inventory_hostname }}: {{ _kiosk_health.stdout }}"
      when: not (_api_ready | bool)

    - name: Query kiosk extensions from API
      ansible.builtin.uri:
        url: "{{ _api_base }}/api/container/kiosk/ready"
        return_content: true
      register: _kiosk_api
      delegate_to: localhost
      when: _api_ready | bool
      failed_when: false

    - name: Set kiosk config keys from API
      ansible.builtin.set_fact:
        _kiosk_config_keys: "{{ _kiosk_api.json.extensions.config_files['/opt/kiosk/config.json']['keys'] }}"
      when: >-
        _api_ready | bool
        and (_kiosk_api.json.extensions.config_files | default(none)) is not none

    - name: Read kiosk config.json via SSH (fallback)
      ansible.builtin.command:
        cmd: pct exec {{ kiosk_ct_id }} -- cat /opt/kiosk/config.json
      register: _kiosk_config
      changed_when: false
      when: _kiosk_config_keys is not defined

    - name: Set kiosk config keys from SSH (fallback)
      ansible.builtin.set_fact:
        _kiosk_config_keys: "{{ (_kiosk_config.stdout | from_json).keys() | list }}"
      when: _kiosk_config_keys is not defined

    - name: Assert kiosk config has all service URL and 4-tier keys
      ansible.builtin.assert:
        that:
          - "'DESKTOP_URL' in _kiosk_config_keys"
          - "'JELLYFIN_URL' in _kiosk_config_keys"
          - "'KODI_URL' in _kiosk_config_keys"
          - "'HOMEASSISTANT_URL' in _kiosk_config_keys"
          - "'MOONLIGHT_URL' in _kiosk_config_keys"
          - "'GAMING_URL' in _kiosk_config_keys"
          - "'OPENWRT_URL' in _kiosk_config_keys"
          - "'PIHOLE_URL' in _kiosk_config_keys"
          - "'WIREGUARD_URL' in _kiosk_config_keys"
          - "'NETDATA_URL' in _kiosk_config_keys"
          - "'RSYSLOG_URL' in _kiosk_config_keys"
          - "'MANAGEMENT_SERVER' in _kiosk_config_keys"
          - "'CALLHOME_PUBLIC_KEY' in _kiosk_config_keys"
          - "'HOST_NAME' in _kiosk_config_keys"
          - "'HOST_IP' in _kiosk_config_keys"
        fail_msg: "Kiosk config missing required keys on {{ inventory_hostname }}: {{ _kiosk_config_keys }}"

    - name: Check display-exclusive hookscript exists
      ansible.builtin.stat:
        path: /var/lib/vz/snippets/display-exclusive.sh
      register: _hookscript_verify

    - name: Assert display-exclusive hookscript deployed
      ansible.builtin.assert:
        that: _hookscript_verify.stat.exists
        fail_msg: "Display-exclusive hookscript missing on {{ inventory_hostname }}"

    - name: Assert stamp contains kiosk_lxc
      ansible.builtin.assert:
        that: "'kiosk_lxc' in stamp.plays"
        fail_msg: "deploy_stamp missing kiosk_lxc entry"

