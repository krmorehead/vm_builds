# ── Play 13b: Container NAT networking regression check ───────────
# Verify that NO NAT-eligible container on WAN hosts has a 192.168.86.x IP.
# All WAN containers should use 10.99.{host_id}.{offset} via NAT bridge.
# OpenWrt bridge (CT 104) and mesh (CT 103) are excluded — they need
# L2 WAN access for WiFi bridging and are intentionally on the WAN bridge.

- name: Verify no WAN containers use household subnet IPs
  hosts: proxmox:!router_nodes:!lan_hosts
  gather_facts: false
  tasks:
    - name: List NAT-eligible container IPs on this host
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          for ctid in $(pct list 2>/dev/null | awk 'NR>1 {print $1}'); do
            # Skip OpenWrt mesh and bridge — they use L2 WAN access
            [ "$ctid" = "{{ meshwifi_ct_id }}" ] || [ "$ctid" = "{{ bridge_ct_id }}" ] && continue
            ip=$(pct config "$ctid" 2>/dev/null | grep 'net0:' | grep -oP 'ip=\K[^/,]+' || true)
            [ -n "$ip" ] && echo "$ctid=$ip"
          done
        executable: /bin/bash
      register: _ct_ips
      changed_when: false
      failed_when: false

    - name: Assert no NAT-eligible container uses 192.168.86.x (household subnet)
      ansible.builtin.assert:
        that: "'192.168.86.' not in _ct_ips.stdout"
        fail_msg: >-
          REGRESSION: Container(s) on WAN host {{ inventory_hostname }} have
          192.168.86.x IPs (household subnet). All WAN containers (except
          mesh/bridge which need L2 access) should use 10.99.x.x via the NAT
          bridge. Found: {{ _ct_ips.stdout_lines | select('search', '192.168.86') | list }}
      when: _ct_ips.stdout | length > 0

# ── Play 14: 4-tier heartbeat integrity ──────────────────────────
# Verifies the 4-tier data flow: Container → NodeManager → ClusterManager → SuperManager.
# Only physical hosts should appear on the SuperManager. Container
# names (pihole, wireguard, etc.) must NOT appear as top-level nodes.

- name: Verify 4-tier heartbeat integrity
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _api_base: "http://127.0.0.1:{{ lookup('env', 'WEBUI_PORT') | default('52500', true) }}"
    _container_names:
      - pihole
      - rsyslog
      - netdata
      - wireguard
      - homeassistant
      - jellyfin
      - kodi
      - moonlight
      - kiosk
      - gaming
      - desktop
      - openwrt-bridge
      - openwrt-mesh
      - unknown
      - unidentified
    _expected_hosts:
      - home
      - mesh1
      - ai
      - mesh2
      - bridge-1
      - bridge-2
  tasks:
    - name: Wait for all 6 physical hosts to register on SuperManager
      ansible.builtin.uri:
        url: "{{ _api_base }}/api/nodes"
        return_content: true
        headers:
          X-Callhome-Token: "{{ lookup('env', 'CALLHOME_PUBLIC_KEY') }}"
      register: _sm_nodes
      retries: 6
      delay: 10
      until: >-
        (_sm_nodes.status | default(0)) == 200
        and (_sm_nodes.json | default([])
             | map(attribute='hostname') | list
             | difference(_container_names) | length) >= 6
      failed_when: false

    - name: Debug SM nodes if not all present
      ansible.builtin.debug:
        msg: >-
          SM has {{ _sm_nodes.json | default([]) | map(attribute='hostname') | list | length }} nodes:
          {{ _sm_nodes.json | default([]) | map(attribute='hostname') | list | join(', ') }}
      when: >-
        (_sm_nodes.json | default([]) | map(attribute='hostname') | list | length) < 6

    - name: Extract node hostnames from SuperManager
      ansible.builtin.set_fact:
        _sm_hostnames: "{{ _sm_nodes.json | default([]) | map(attribute='hostname') | list }}"
      when: (_sm_nodes.status | default(0)) == 200

    - name: Check for container names as top-level SuperManager nodes
      ansible.builtin.debug:
        msg: >-
          4-TIER WARNING: {{ item }} appears as a top-level node on the
          SuperManager. Containers should relay through their local NodeManager.
      loop: "{{ _container_names }}"
      when:
        - _sm_hostnames is defined and (_sm_hostnames | length) > 0
        - item in (_sm_hostnames | default([]))

    - name: Compute physical hosts from SuperManager node list
      ansible.builtin.set_fact:
        _sm_physical_hosts: >-
          {{ _sm_hostnames | default([]) | difference(_container_names) | list }}

    - name: Fail if SuperManager API was unreachable
      ansible.builtin.fail:
        msg: >-
          SuperManager API never returned 200 after retries.
          Last status={{ _sm_nodes.status | default('none') }}.
          Fix: ensure supermanager-relay.service is running on the router node,
          SSH tunnel is active, and the API server is running on the controller.
      when: (_sm_nodes.status | default(0)) != 200

    - name: Assert ALL 6 physical hosts registered on SuperManager
      ansible.builtin.assert:
        that:
          - (_sm_physical_hosts | length) >= 6
          - (_sm_hostnames | default([]) | intersect(_container_names) | length) == 0
        fail_msg: >-
          HEARTBEAT RELAY: only {{ _sm_physical_hosts | length }} of 6 physical hosts.
          Present={{ _sm_physical_hosts | join(', ') }}.
          Missing={{ _expected_hosts | difference(_sm_physical_hosts) | join(', ') }}.
          Container phantoms={{ _sm_hostnames | default([]) | intersect(_container_names) | join(', ') }}.
          Fix: ensure kiosk-manager-proxy.service is running on each host
          and all kiosk containers have correct MANAGEMENT_SERVER config.

    - name: Wait for all 5 child Managers on Cluster Manager (API)
      ansible.builtin.uri:
        url: "http://{{ hostvars[groups['router_nodes'][0]]['vpn_ip'] }}:{{ kiosk_manager_port }}/api/nodes"
        return_content: true
        timeout: 10
      register: _cm_nodes_raw
      failed_when: false
      retries: 6
      delay: 10
      until: >-
        (_cm_nodes_raw.status | default(0)) == 200
        and (_cm_nodes_raw.json.nodes | default([]) | length) >= 5

    - name: Parse Cluster Manager fleet response
      ansible.builtin.set_fact:
        _cm_hostnames: >-
          {{ _cm_nodes_raw.json.nodes | default([]) | map(attribute='hostname') | list }}
      when: (_cm_nodes_raw.status | default(0)) == 200

    - name: Fail if Cluster Manager API was unreachable
      ansible.builtin.fail:
        msg: >-
          Cluster Manager API never returned 200 after retries.
          Status={{ _cm_nodes_raw.status | default('none') }}.
          Fix: check kiosk_server is running in CT {{ kiosk_ct_id }},
          kiosk-manager-proxy.service on router node, and VPN routing.
      when: (_cm_nodes_raw.status | default(0)) != 200

    - name: Assert ALL 5 child Managers registered with Cluster Manager
      ansible.builtin.assert:
        that:
          - (_cm_hostnames | default([]) | length) >= 5
          - "'mesh1' in _cm_hostnames"
          - "'ai' in _cm_hostnames"
          - "'mesh2' in _cm_hostnames"
          - "'bridge-1' in _cm_hostnames"
          - "'bridge-2' in _cm_hostnames"
        fail_msg: >-
          CLUSTER MANAGER: only {{ _cm_hostnames | default([]) | length }} of 5
          child Managers. Present={{ _cm_hostnames | default([]) | join(', ') }}.
          Missing={{ ['mesh1','ai','mesh2','bridge-1','bridge-2']
             | difference(_cm_hostnames | default([])) | join(', ') }}.
          Fix: check MANAGEMENT_SERVER in kiosk config.json,
          kiosk-manager-proxy.service on each host, and VPN routing.

# ── Image version pipeline ──────────────────────────────────────────
# Verify per-image .version sidecar files exist and contain valid semver,
# and that Node Managers report deployed versions via their API.

- name: Verify image version pipeline
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _project_root: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
    _expected_services:
      - mesh
      - router
      - pihole
      - rsyslog
      - jellyfin
      - netdata
      - wireguard
      - homeassistant
      - kodi
      - moonlight
      - kiosk
      - gaming
      - sunshine
      - desktop
  tasks:
    - name: Check sidecar version files exist
      ansible.builtin.stat:
        path: "{{ _project_root }}/images/{{ item }}.version"
      register: _sidecar_stats
      loop: "{{ _expected_services }}"

    - name: Assert all sidecar version files exist
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: >-
          Missing version sidecar: images/{{ item.item }}.version.
          Run ./build-images.sh --only {{ item.item }} to create it.
      loop: "{{ _sidecar_stats.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read sidecar version contents
      ansible.builtin.slurp:
        src: "{{ _project_root }}/images/{{ item }}.version"
      register: _sidecar_contents
      loop: "{{ _expected_services }}"

    - name: Assert sidecar versions are valid semver
      ansible.builtin.assert:
        that: (item.content | b64decode | trim) is match('^[0-9]+\.[0-9]+\.[0-9]+$')
        fail_msg: >-
          Invalid version in images/{{ item.item }}.version:
          '{{ item.content | b64decode | trim }}'.
          Expected semver (e.g. 1.0.0).
      loop: "{{ _sidecar_contents.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Query fleet versions from SuperManager
      ansible.builtin.uri:
        url: >-
          http://127.0.0.1:{{ lookup('env', 'WEBUI_PORT') | default('52500', true) }}/api/fleet/versions
        return_content: true
        timeout: 10
      register: _fleet_versions
      failed_when: false

    - name: Report fleet version visibility
      ansible.builtin.debug:
        msg: >-
          Fleet versions API:
          {{ 'available — ' + (_fleet_versions.json | to_nice_json)
             if (_fleet_versions.status | default(0)) == 200
             else 'not available (SuperManager may not be running)' }}

# ── Play: Manager host state assertions ──────────────────────────
# Verify the Manager has been populated with infrastructure and
# container state by the provisioning roles (M2+M3 of Manager as
# Source of Truth project).

- name: Verify Manager host state (source of truth)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _api_base: >-
      http://127.0.0.1:{{ lookup('env', 'WEBUI_PORT') | default('52500', true) }}
  tasks:
    - name: Query Manager for home host state
      ansible.builtin.uri:
        url: "{{ _api_base }}/api/host/home/state"
        return_content: true
        status_code: [200, 404]
      register: _home_state
      failed_when: false

    - name: Set Manager state availability
      ansible.builtin.set_fact:
        _manager_state_available: "{{ _home_state.status | default(0) == 200 }}"

    - name: Assert Manager has home host state
      ansible.builtin.assert:
        that: _manager_state_available | bool
        fail_msg: >-
          Manager has no state for 'home'. Infrastructure roles did not
          register their findings. Check proxmox_bridges, proxmox_pci_passthrough,
          and proxmox_igpu roles for manager_register.yml include failures.

    - name: Assert Manager has bridge topology for home
      ansible.builtin.assert:
        that:
          - _home_state.json.bridges.wan_bridge | length > 0
          - _home_state.json.bridges.bridges | length > 0
        fail_msg: >-
          Manager state for home is missing bridge topology.
          bridges={{ _home_state.json.bridges }}
      when: _manager_state_available | bool

    - name: Check Manager has containers registered for home
      ansible.builtin.debug:
        msg: >-
          Manager state: {{ _home_state.json.containers | length }} containers
          registered for home.
          {{ 'WARNING: No containers registered. manager_register.yml may
          not be receiving data from provisioning roles.'
          if (_home_state.json.containers | length) == 0 else '' }}
      when: _manager_state_available | bool
