# ── Play 13b: Container NAT networking regression check ───────────
# Verify that NO NAT-eligible container on WAN hosts has a 192.168.86.x IP.
# All WAN containers should use 10.99.{host_id}.{offset} via NAT bridge.
# OpenWrt bridge (CT 104) and mesh (CT 103) are excluded — they need
# L2 WAN access for WiFi bridging and are intentionally on the WAN bridge.

- name: Verify no WAN containers use household subnet IPs
  hosts: proxmox:!router_nodes:!lan_hosts
  gather_facts: false
  tasks:
    - name: List NAT-eligible container IPs on this host
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          for ctid in $(pct list 2>/dev/null | awk 'NR>1 {print $1}'); do
            # Skip OpenWrt mesh (103) and bridge (104) — they use L2 WAN access
            [ "$ctid" = "103" ] || [ "$ctid" = "104" ] && continue
            ip=$(pct config "$ctid" 2>/dev/null | grep 'net0:' | grep -oP 'ip=\K[^/,]+' || true)
            [ -n "$ip" ] && echo "$ctid=$ip"
          done
        executable: /bin/bash
      register: _ct_ips
      changed_when: false
      failed_when: false

    - name: Assert no NAT-eligible container uses 192.168.86.x (household subnet)
      ansible.builtin.assert:
        that: "'192.168.86.' not in _ct_ips.stdout"
        fail_msg: >-
          REGRESSION: Container(s) on WAN host {{ inventory_hostname }} have
          192.168.86.x IPs (household subnet). All WAN containers (except
          mesh/bridge which need L2 access) should use 10.99.x.x via the NAT
          bridge. Found: {{ _ct_ips.stdout_lines | select('search', '192.168.86') | list }}
      when: _ct_ips.stdout | length > 0

# ── Play 14: 4-tier heartbeat integrity ──────────────────────────
# Verifies the 4-tier data flow: Container → NodeManager → ClusterManager → SuperManager.
# Only physical hosts should appear on the SuperManager. Container
# names (pihole, wireguard, etc.) must NOT appear as top-level nodes.

- name: Verify 4-tier heartbeat integrity
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _api_base: "http://127.0.0.1:{{ lookup('env', 'WEBUI_PORT') | default('52500', true) }}"
    _container_names:
      - pihole
      - rsyslog
      - netdata
      - wireguard
      - homeassistant
      - jellyfin
      - kodi
      - moonlight
      - kiosk
      - gaming
  tasks:
    - name: Query all nodes from SuperManager
      ansible.builtin.uri:
        url: "{{ _api_base }}/api/nodes"
        return_content: true
        headers:
          X-Callhome-Token: "{{ lookup('env', 'CALLHOME_PUBLIC_KEY') }}"
      register: _sm_nodes
      failed_when: false

    - name: Extract node hostnames from SuperManager
      ansible.builtin.set_fact:
        _sm_hostnames: "{{ _sm_nodes.json | default([]) | map(attribute='hostname') | list }}"
      when: _sm_nodes is not failed and _sm_nodes.status == 200

    - name: Assert no container names appear as top-level SuperManager nodes
      ansible.builtin.assert:
        that: item not in (_sm_hostnames | default([]))
        fail_msg: >-
          4-TIER VIOLATION: {{ item }} appears as a top-level node on the
          SuperManager. Containers must NEVER send heartbeats directly to
          the SuperManager — they must go through their local NodeManager.
      loop: "{{ _container_names }}"
      when: _sm_hostnames is defined and _sm_hostnames | length > 0

    - name: Assert at least one physical host appears on SuperManager
      ansible.builtin.assert:
        that: _sm_hostnames | default([]) | length > 0
        fail_msg: >-
          No hosts registered on SuperManager. The 4-tier relay is not
          working — NodeManagers are not relaying heartbeats UP to the
          SuperManager.
      when: _sm_nodes is not failed and _sm_nodes.status == 200
