---
# ── Play 0: 4-tier architecture gate ─────────────────────────────
# Every Proxmox host MUST be in kiosk_nodes (NodeManager tier).
# A host without a NodeManager cannot participate in the 4-tier heartbeat
# system (Container -> NodeManager -> ClusterManager -> SuperManager). Hard-fail immediately.

- name: Verify 4-tier Manager coverage
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Assert every Proxmox host has a Manager (kiosk_nodes membership)
      ansible.builtin.assert:
        that:
          - item in groups['kiosk_nodes']
        fail_msg: >-
          SHOW STOPPER: {{ item }} is in proxmox but NOT in kiosk_nodes.
          Every physical host MUST have a NodeManager (Kiosk LXC) for 4-tier
          heartbeat (Container -> NodeManager -> ClusterManager -> SuperManager). Add {{ item }}
          to kiosk_nodes in inventory/hosts.yml and molecule inventory.
      loop: "{{ groups['proxmox'] }}"

# ── Play 1: Common infrastructure (all Proxmox hosts) ────────────

- name: Verify common Proxmox infrastructure
  hosts: proxmox
  gather_facts: false
  tasks:
    # ── Bridge discovery ──────────────────────────────────────────

    - name: List physical-NIC-backed bridges
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          for br in /sys/class/net/vmbr*/; do
            brname=$(basename "$br")
            for iface in $(ls "$br/brif/" 2>/dev/null); do
              if [ -e "/sys/class/net/$iface/device" ]; then
                echo "$brname"
                break
              fi
            done
          done
        executable: /bin/bash
      register: bridge_list
      changed_when: false

    - name: Assert at least one physical bridge exists
      ansible.builtin.assert:
        that: bridge_list.stdout_lines | length >= 1
        fail_msg: >-
          Expected at least 1 physical-NIC bridge, found
          {{ bridge_list.stdout_lines | length }}

    # ── IOMMU ─────────────────────────────────────────────────────

    - name: Check IOMMU status
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          dmesg | grep -i -c 'IOMMU enabled\|DMAR.*IOMMU\|Adding to iommu group'
        executable: /bin/bash
      register: iommu_verify
      changed_when: false
      failed_when: false

    - name: Report IOMMU status
      ansible.builtin.debug:
        msg: >-
          IOMMU {{ 'active' if (iommu_verify.stdout | int) > 0
          else 'not active (no WiFi passthrough)' }}

    # ── Container NAT bridge (WAN hosts only) ───────────────────────

    - name: Determine if host should have container NAT bridge
      ansible.builtin.set_fact:
        _verify_needs_ct_bridge: >-
          {{ 'router_nodes' not in group_names and 'lan_hosts' not in group_names }}

    - name: Check container bridge exists (WAN hosts)
      ansible.builtin.command:
        cmd: ip link show vmbr_ct
      register: _ct_bridge_check
      changed_when: false
      failed_when: false
      when: _verify_needs_ct_bridge | bool

    - name: Assert container bridge exists on WAN hosts
      ansible.builtin.assert:
        that: _ct_bridge_check.rc == 0
        fail_msg: >-
          Container NAT bridge (vmbr_ct) not found on WAN host {{ inventory_hostname }}.
          The proxmox_bridges role should create it for non-LAN hosts.
      when: _verify_needs_ct_bridge | bool

    - name: Get container bridge IP (WAN hosts)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ip -4 addr show vmbr_ct | grep -oP 'inet \K[0-9./]+'
        executable: /bin/bash
      register: _ct_bridge_ip
      changed_when: false
      when:
        - _verify_needs_ct_bridge | bool
        - _ct_bridge_check.rc == 0

    - name: Assert container bridge has correct subnet IP
      ansible.builtin.assert:
        that:
          - "'10.99.' + (container_subnet_id | string) + '.1/24' == _ct_bridge_ip.stdout | trim"
        fail_msg: >-
          Container bridge IP mismatch. Expected 10.99.{{ container_subnet_id }}.1/24,
          got {{ _ct_bridge_ip.stdout | trim }}
      when:
        - _verify_needs_ct_bridge | bool
        - _ct_bridge_check.rc == 0

    - name: Check iptables MASQUERADE rule for container subnet (WAN hosts)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          iptables -t nat -S POSTROUTING | grep -c '10\.99\.{{ container_subnet_id }}\.0/24.*MASQUERADE'
        executable: /bin/bash
      register: _nat_rule_check
      changed_when: false
      failed_when: false
      when: _verify_needs_ct_bridge | bool

    - name: Assert MASQUERADE rule exists on WAN hosts
      ansible.builtin.assert:
        that: (_nat_rule_check.stdout | int) > 0
        fail_msg: >-
          Missing iptables MASQUERADE rule for container subnet
          10.99.{{ container_subnet_id }}.0/24 on {{ inventory_hostname }}
      when: _verify_needs_ct_bridge | bool

    - name: Check IP forwarding is enabled (WAN hosts)
      ansible.builtin.command:
        cmd: sysctl -n net.ipv4.ip_forward
      register: _ip_fwd_check
      changed_when: false
      when: _verify_needs_ct_bridge | bool

    - name: Assert IP forwarding is enabled on WAN hosts
      ansible.builtin.assert:
        that: _ip_fwd_check.stdout | trim == "1"
        fail_msg: "IP forwarding not enabled on {{ inventory_hostname }}"
      when: _verify_needs_ct_bridge | bool

    - name: Assert container bridge does NOT exist on LAN hosts
      ansible.builtin.command:
        cmd: ip link show vmbr_ct
      register: _ct_bridge_lan_check
      changed_when: false
      failed_when: false
      when: not (_verify_needs_ct_bridge | bool)

    - name: Assert no container bridge on LAN hosts
      ansible.builtin.assert:
        that: _ct_bridge_lan_check.rc != 0
        fail_msg: >-
          Container NAT bridge (vmbr_ct) found on LAN host {{ inventory_hostname }}.
          LAN hosts should NOT have a container bridge — they use OpenWrt LAN.
      when: not (_verify_needs_ct_bridge | bool)

    # ── iGPU detection (Intel or AMD) ──────────────────────────────

    - name: Detect iGPU vendor, PCI address, and driver in one pass
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          lspci_out=$(lspci -nn)
          intel=$(echo "$lspci_out" | grep -ic 'VGA compatible controller.*Intel' || true)
          amd=$(echo "$lspci_out" | grep -icE 'VGA compatible controller.*(AMD|ATI)|Display controller.*(AMD|ATI)' || true)
          if [ "$intel" -gt 0 ]; then
            vendor=intel
            pci_addr=$(echo "$lspci_out" | grep -i 'VGA compatible controller.*Intel' | head -1 | awk '{print $1}')
            driver_loaded=$(lsmod | grep -c '^i915' || true)
          elif [ "$amd" -gt 0 ]; then
            vendor=amd
            pci_addr=$(echo "$lspci_out" | grep -iE 'VGA compatible controller.*(AMD|ATI)|Display controller.*(AMD|ATI)' | head -1 | awk '{print $1}')
            driver_loaded=$(lsmod | grep -c '^amdgpu' || true)
          else
            vendor=none
            pci_addr=""
            driver_loaded=0
          fi
          passthrough="host"
          if [ -n "$pci_addr" ]; then
            drv=$(readlink "/sys/bus/pci/devices/0000:${pci_addr}/driver" 2>/dev/null || true)
            case "$drv" in *vfio-pci) passthrough="passthrough" ;; esac
          fi
          echo "VENDOR=$vendor"
          echo "PCI_ADDR=$pci_addr"
          echo "DRIVER_LOADED=$driver_loaded"
          echo "PASSTHROUGH=$passthrough"
        executable: /bin/bash
      register: _igpu_probe
      changed_when: false

    - name: Set iGPU facts from probe
      ansible.builtin.set_fact:
        _verify_igpu_vendor: "{{ _igpu_probe.stdout | regex_search('VENDOR=(\\S+)', '\\1') | first }}"
        _verify_igpu_present: "{{ _igpu_probe.stdout | regex_search('VENDOR=(\\S+)', '\\1') | first != 'none' }}"
        _verify_igpu_pci_address: "{{ _igpu_probe.stdout | regex_search('PCI_ADDR=(\\S*)', '\\1') | first }}"
        _verify_driver_loaded: "{{ (_igpu_probe.stdout | regex_search('DRIVER_LOADED=(\\d+)', '\\1') | first | int) > 0 }}"
        _verify_igpu_passthrough: "{{ _igpu_probe.stdout | regex_search('PASSTHROUGH=(\\S+)', '\\1') | first }}"

    - name: Assert an iGPU is present
      ansible.builtin.assert:
        that: _verify_igpu_present | bool
        fail_msg: "No iGPU (Intel or AMD) found on {{ inventory_hostname }}"

    - name: Assert GPU driver is loaded
      ansible.builtin.assert:
        that: _verify_driver_loaded | bool
        fail_msg: >-
          {{ _verify_igpu_vendor }} iGPU detected but
          {{ 'i915' if _verify_igpu_vendor == 'intel' else 'amdgpu' }}
          driver is not loaded
      when: _verify_igpu_present | bool

    - name: Detect render device
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ls /dev/dri/renderD* 2>/dev/null | head -1
        executable: /bin/bash
      register: _verify_render_dev
      changed_when: false
      when:
        - _verify_igpu_present | bool
        - _verify_igpu_passthrough != 'passthrough'

    - name: Assert render device exists
      ansible.builtin.assert:
        that: _verify_render_dev.stdout | trim | length > 0
        fail_msg: "No render device found in /dev/dri/ despite iGPU and loaded driver"
      when:
        - _verify_igpu_present | bool
        - _verify_igpu_passthrough != 'passthrough'

    - name: Verify vainfo is installed
      ansible.builtin.command:
        cmd: which vainfo
      changed_when: false
      when: _verify_igpu_present | bool

    - name: Verify enterprise repos are disabled
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/pve-enterprise.sources
      register: enterprise_repo

    - name: Assert enterprise repo is disabled
      ansible.builtin.assert:
        that: not enterprise_repo.stat.exists
        fail_msg: "pve-enterprise.sources still active"

    - name: Report iGPU status
      ansible.builtin.debug:
        msg: >-
          iGPU: vendor={{ _verify_igpu_vendor }},
          {{ 'driver loaded, vainfo installed'
          if _verify_igpu_present | bool
          else 'not detected' }}

    # ── Backup manifest ────────────────────────────────────────

    - name: Check backup manifest exists
      ansible.builtin.stat:
        path: /var/lib/ansible-backup/manifest.json
      register: backup_manifest

    - name: Assert backup manifest was created
      ansible.builtin.assert:
        that: backup_manifest.stat.exists
        fail_msg: "Backup manifest not found at /var/lib/ansible-backup/manifest.json"

    - name: Read backup manifest
      ansible.builtin.slurp:
        src: /var/lib/ansible-backup/manifest.json
      register: backup_manifest_raw

    - name: Parse backup manifest
      ansible.builtin.set_fact:
        backup_data: "{{ backup_manifest_raw.content | b64decode | from_json }}"

    - name: Assert backup manifest has required fields
      ansible.builtin.assert:
        that:
          - backup_data.timestamp is defined
          - backup_data.project_version is defined
          - backup_data.host is defined
          - backup_data.host_config is defined
        fail_msg: >-
          Backup manifest missing required fields.
          Contents: {{ backup_data }}

    - name: Check host config archive exists
      ansible.builtin.stat:
        path: "{{ backup_data.host_config }}"
      register: host_config_archive

    - name: Assert host config archive exists
      ansible.builtin.assert:
        that: host_config_archive.stat.exists
        fail_msg: >-
          Host config archive {{ backup_data.host_config }} referenced
          in manifest but not found on disk

    - name: Report backup status
      ansible.builtin.debug:
        msg: >-
          Backup: timestamp={{ backup_data.timestamp }},
          host={{ backup_data.host }},
          VMs={{ backup_data.vm_ids | default([]) | join(', ') | default('none') }},
          archive={{ backup_data.host_config }}

    # ── Deployment tracking ─────────────────────────────────────

    - name: Check deploy_stamp fact file exists
      ansible.builtin.stat:
        path: /etc/ansible/facts.d/vm_builds.fact
      register: stamp_file

    - name: Assert deploy_stamp was written
      ansible.builtin.assert:
        that: stamp_file.stat.exists
        fail_msg: "/etc/ansible/facts.d/vm_builds.fact not found"

    - name: Read deploy_stamp fact file
      ansible.builtin.slurp:
        src: /etc/ansible/facts.d/vm_builds.fact
      register: stamp_raw

    - name: Parse deploy_stamp
      ansible.builtin.set_fact:
        stamp: "{{ stamp_raw.content | b64decode | from_json }}"

    - name: Assert stamp contains project_version
      ansible.builtin.assert:
        that: stamp.project_version is defined
        fail_msg: "deploy_stamp missing project_version"

    - name: Assert stamp contains common plays
      ansible.builtin.assert:
        that:
          - "'backup' in stamp.plays"
          - "'infrastructure' in stamp.plays"
        fail_msg: "deploy_stamp missing common play entries: {{ stamp.plays.keys() | list }}"

    - name: Assert stamp contains openwrt_vm (router nodes only)
      ansible.builtin.assert:
        that: "'openwrt_vm' in stamp.plays"
        fail_msg: "deploy_stamp missing openwrt_vm entry: {{ stamp.plays.keys() | list }}"
      when: "'router_nodes' in group_names"

    - name: Assert stamp contains wireguard_lxc (vpn nodes only)
      ansible.builtin.assert:
        that: "'wireguard_lxc' in stamp.plays"
        fail_msg: "deploy_stamp missing wireguard_lxc entry: {{ stamp.plays.keys() | list }}"
      when: "'vpn_nodes' in group_names"

    - name: Assert stamp contains pihole_lxc (dns nodes only)
      ansible.builtin.assert:
        that: "'pihole_lxc' in stamp.plays"
        fail_msg: "deploy_stamp missing pihole_lxc entry: {{ stamp.plays.keys() | list }}"
      when: "'dns_nodes' in group_names"

    - name: Assert stamp contains rsyslog_lxc (monitoring nodes only)
      ansible.builtin.assert:
        that: "'rsyslog_lxc' in stamp.plays"
        fail_msg: "deploy_stamp missing rsyslog_lxc entry: {{ stamp.plays.keys() | list }}"
      when: "'monitoring_nodes' in group_names"

    - name: Assert stamp contains netdata_lxc (monitoring nodes only)
      ansible.builtin.assert:
        that: "'netdata_lxc' in stamp.plays"
        fail_msg: "deploy_stamp missing netdata_lxc entry: {{ stamp.plays.keys() | list }}"
      when: "'monitoring_nodes' in group_names"

    - name: Assert stamp contains openwrt_mesh_lxc (mesh wifi nodes only)
      ansible.builtin.assert:
        that: "'openwrt_mesh_lxc' in stamp.plays"
        fail_msg: "deploy_stamp missing openwrt_mesh_lxc entry: {{ stamp.plays.keys() | list }}"
      when:
        - "'wifi_nodes' in group_names"
        - "'router_nodes' not in group_names"

    - name: Assert stamp contains openwrt_bridge_lxc (bridge nodes only)
      ansible.builtin.assert:
        that: "'openwrt_bridge_lxc' in stamp.plays"
        fail_msg: "deploy_stamp missing openwrt_bridge_lxc entry: {{ stamp.plays.keys() | list }}"
      when: "'bridge_nodes' in group_names"

    - name: Assert stamp contains homeassistant_lxc (service nodes only)
      ansible.builtin.assert:
        that: "'homeassistant_lxc' in stamp.plays"
        fail_msg: "deploy_stamp missing homeassistant_lxc entry: {{ stamp.plays.keys() | list }}"
      when: "'service_nodes' in group_names"

    - name: Report deploy_stamp contents
      ansible.builtin.debug:
        msg: >-
          deploy_stamp: version={{ stamp.project_version }},
          plays={{ stamp.plays.keys() | list | join(', ') }},
          last_run={{ stamp.last_run }}

    # ── Host recoverability ──────────────────────────────────────
    # Hosts without WoL must never be shut down or crashed by
    # automation. Verify that wol_capable is set for every host
    # and that non-WoL hosts are not in wol.sh.

    - name: Assert wol_capable is defined for every host
      ansible.builtin.assert:
        that: wol_capable is defined
        fail_msg: >-
          {{ inventory_hostname }} has no wol_capable host var.
          Every host MUST declare wol_capable (true/false).

    - name: Extract WoL host entries from wol.sh
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          grep -E '^\s*\[' {{ playbook_dir }}/../../scripts/wol.sh | sed 's/.*\[\(.*\)\].*/\1/'
        executable: /bin/bash
      register: _wol_entries
      changed_when: false
      delegate_to: localhost
      run_once: true

    - name: Assert non-WoL hosts are excluded from wol.sh arrays
      ansible.builtin.assert:
        that: >-
          inventory_hostname not in _wol_entries.stdout
        fail_msg: >-
          {{ inventory_hostname }} has wol_capable=false but appears
          in wol.sh host arrays. Non-WoL hosts must never be in the
          WoL script — they cannot be recovered if shut down.
      when: not (wol_capable | bool)

# ── Play 2: Router node assertions (home-specific) ────────────────

- name: Verify router node state
  hosts: router_nodes
  gather_facts: false
  vars:
    proxmox_lan_mgmt_ip_offset: 2
  tasks:
    # ── Bridge topology ──────────────────────────────────────────

    - name: List physical-NIC-backed bridges
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          for br in /sys/class/net/vmbr*/; do
            brname=$(basename "$br")
            for iface in $(ls "$br/brif/" 2>/dev/null); do
              if [ -e "/sys/class/net/$iface/device" ]; then
                echo "$brname"
                break
              fi
            done
          done
        executable: /bin/bash
      register: bridge_list
      changed_when: false

    - name: Assert at least two physical bridges exist
      ansible.builtin.assert:
        that: bridge_list.stdout_lines | length >= 2
        fail_msg: >-
          Expected at least 2 physical-NIC bridges, found
          {{ bridge_list.stdout_lines | length }}

    # ── WAN bridge detection ──────────────────────────────────────

    - name: Detect WAN bridge from default route
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ip -o route show default | awk '{print $5}' | head -1
        executable: /bin/bash
      register: wan_bridge_raw
      changed_when: false

    - name: Set WAN and LAN bridge facts
      ansible.builtin.set_fact:
        wan_bridge: "{{ wan_bridge_raw.stdout | trim }}"
        lan_bridges: >-
          {{ bridge_list.stdout_lines
             | difference([wan_bridge_raw.stdout | trim])
             | sort }}

    - name: Assert WAN bridge is a known physical bridge
      ansible.builtin.assert:
        that: wan_bridge in bridge_list.stdout_lines
        fail_msg: >-
          WAN bridge {{ wan_bridge }} not found in physical bridges
          {{ bridge_list.stdout_lines | join(', ') }}

    - name: Set primary LAN bridge
      ansible.builtin.set_fact:
        lan_bridge: "{{ lan_bridges | first }}"

    - name: Report detected topology
      ansible.builtin.debug:
        msg: >-
          WAN={{ wan_bridge }}, LAN={{ lan_bridges | join(', ') }},
          primary LAN={{ lan_bridge }}

    # ── VM state ──────────────────────────────────────────────────

    - name: Read OpenWrt VM state and config
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          qm status {{ openwrt_vm_id }}
          qm config {{ openwrt_vm_id }}
        executable: /bin/bash
      register: vm_cfg
      changed_when: false

    - name: Assert VM is in running state
      ansible.builtin.assert:
        that: "'running' in vm_cfg.stdout"
        fail_msg: "VM {{ openwrt_vm_id }} is not running"

    - name: Assert VM is configured to start on boot
      ansible.builtin.assert:
        that: "'onboot: 1' in vm_cfg.stdout"
        fail_msg: "VM {{ openwrt_vm_id }} missing onboot: 1"

    - name: Assert VM has startup order 1
      ansible.builtin.assert:
        that: vm_cfg.stdout is regex('startup:.*order=1')
        fail_msg: "VM {{ openwrt_vm_id }} missing startup order=1"

    - name: Assert VM has WiFi PCI passthrough
      ansible.builtin.assert:
        that: "'hostpci' in vm_cfg.stdout"
        fail_msg: >-
          Router VM {{ openwrt_vm_id }} has no WiFi PCI passthrough (no hostpci).
          The mesh WDS AP requires WiFi hardware passed through to the VM.
          Check proxmox_pci_passthrough role and wifi_pci_devices fact.

    - name: Assert VM uses q35 machine type for PCI passthrough
      ansible.builtin.assert:
        that: "'q35' in vm_cfg.stdout"
        fail_msg: >-
          Router VM {{ openwrt_vm_id }} missing q35 machine type.
          PCI passthrough requires q35.

    - name: Extract net0 bridge from cached config
      ansible.builtin.set_fact:
        vm_net0_bridge_value: "{{ vm_cfg.stdout | regex_search('net0:.*bridge=([^,\\s]+)', '\\1') | first }}"

    - name: Assert net0 is the WAN bridge
      ansible.builtin.assert:
        that: vm_net0_bridge_value == wan_bridge
        fail_msg: >-
          VM net0 is on {{ vm_net0_bridge_value }},
          expected WAN bridge {{ wan_bridge }}

    # ── Proxmox LAN management IP ────────────────────────────────

    - name: Check Proxmox LAN management IP on LAN bridge
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ip -o -4 addr show dev {{ lan_bridge }} \
            | awk '{print $4}' | cut -d/ -f1
        executable: /bin/bash
      register: lan_bridge_ips
      changed_when: false

    - name: Assert Proxmox has at least one IP on LAN bridge
      ansible.builtin.assert:
        that: lan_bridge_ips.stdout_lines | length > 0
        fail_msg: >-
          No IPv4 address found on LAN bridge {{ lan_bridge }}.
          Proxmox LAN management IP was not configured.

    - name: Set Proxmox LAN IP fact
      ansible.builtin.set_fact:
        proxmox_lan_ip: "{{ lan_bridge_ips.stdout_lines | first }}"

    - name: Compute expected OpenWrt LAN IP from Proxmox LAN IP
      ansible.builtin.set_fact:
        openwrt_lan_ip: >-
          {{ proxmox_lan_ip.split('.')[0:3] | join('.') }}.1

    - name: Read ansible-bridges.conf for LAN bridge DHCP check
      ansible.builtin.slurp:
        src: /etc/network/interfaces.d/ansible-bridges.conf
      register: bridges_conf_raw

    - name: Assert LAN bridge uses DHCP in bridges config
      ansible.builtin.assert:
        that:
          - "'iface ' ~ lan_bridge ~ ' inet dhcp' in (bridges_conf_raw.content | b64decode)"
        fail_msg: >-
          LAN bridge {{ lan_bridge }} is not configured as 'inet dhcp' in
          ansible-bridges.conf. The Proxmox host will not auto-acquire a
          LAN management IP on boot.
          Content: {{ bridges_conf_raw.content | b64decode }}

    - name: Assert separate LAN management config is absent
      ansible.builtin.stat:
        path: /etc/network/interfaces.d/ansible-proxmox-lan.conf
      register: old_lan_conf

    - name: Verify old separate LAN config was removed
      ansible.builtin.assert:
        that: not old_lan_conf.stat.exists
        fail_msg: >-
          Stale ansible-proxmox-lan.conf still exists. It should be removed
          since the LAN bridge DHCP config is now in ansible-bridges.conf.

    - name: Verify Proxmox GUI port 8006 is accessible on LAN IP
      ansible.builtin.wait_for:
        host: "{{ proxmox_lan_ip }}"
        port: 8006
        timeout: 10

    - name: Check bridge has auto directive for boot persistence  # noqa command-instead-of-shell
      ansible.builtin.shell:
        cmd: >-
          grep -c 'auto {{ lan_bridge }}' /etc/network/interfaces.d/ansible-bridges.conf
      register: bridge_auto_check
      changed_when: false

    - name: Assert bridge comes up automatically on boot
      ansible.builtin.assert:
        that: (bridge_auto_check.stdout | trim | int) > 0
        fail_msg: >-
          Bridge {{ lan_bridge }} does not have 'auto' directive.
          It will not start automatically on boot.

    - name: Report Proxmox LAN management
      ansible.builtin.debug:
        msg: >-
          Proxmox LAN IP={{ proxmox_lan_ip }} on {{ lan_bridge }} (DHCP via bridges.conf),
          bridge_auto=yes, DHCP_config=yes,
          GUI port 8006=accessible,
          OpenWrt LAN IP={{ openwrt_lan_ip }}

    # ── OpenWrt connectivity and configuration ────────────────────

    - name: Set OpenWrt SSH command
      ansible.builtin.set_fact:
        openwrt_ssh: >-
          sshpass -p '' ssh
          -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
          -o PubkeyAuthentication=no -o ConnectTimeout=10
          root@{{ openwrt_lan_ip }}

    - name: Wait for OpenWrt SSH on LAN
      ansible.builtin.wait_for:
        host: "{{ openwrt_lan_ip }}"
        port: 22
        delay: 5
        timeout: 60

    - name: Check OpenWrt WAN/LAN info (batched)
      ansible.builtin.shell:
        cmd: >-
          {{ openwrt_ssh }}
          "wan_dev=\$(ip -o route show default | sed -n 's/.*dev \([^ ]*\).*/\1/p' | head -1);
          echo \"WAN_INFO=\$(ip -o -4 addr show dev \$wan_dev 2>/dev/null | awk '{print \$2, \$4}')\";
          echo \"WAN_PREFIX=\$(ip -o -4 addr show dev \$wan_dev | awk '{print \$4}' | cut -d/ -f1 | cut -d. -f1-3)\";
          echo \"LAN_IP=\$(uci get network.lan.ipaddr)\""
      register: _openwrt_net_batch
      changed_when: false

    - name: Parse batched WAN/LAN results
      ansible.builtin.set_fact:
        wan_info_line: "{{ _openwrt_net_batch.stdout | regex_search('WAN_INFO=(.*)', '\\1') | first | default('') }}"
        wan_prefix_line: "{{ _openwrt_net_batch.stdout | regex_search('WAN_PREFIX=(.*)', '\\1') | first | default('') }}"
        lan_ip_line: "{{ _openwrt_net_batch.stdout | regex_search('LAN_IP=(.*)', '\\1') | first | default('') }}"

    - name: Assert WAN has an IP address
      ansible.builtin.assert:
        that: wan_info_line | trim | length > 0
        fail_msg: "WAN interface has no IPv4 address"

    - name: Compute LAN prefix
      ansible.builtin.set_fact:
        lan_prefix: "{{ (lan_ip_line | trim).split('.')[0:3] | join('.') }}"

    - name: Assert LAN subnet does not collide with WAN
      ansible.builtin.assert:
        that: lan_prefix != (wan_prefix_line | trim)
        fail_msg: >-
          LAN prefix {{ lan_prefix }} collides with WAN prefix
          {{ wan_prefix_line | trim }}

    # ── DHCP configuration ──────────────────────────────────────

    - name: Check OpenWrt DHCP config (batched)
      ansible.builtin.shell:
        cmd: >-
          {{ openwrt_ssh }}
          "echo \"DHCP_START=\$(uci get dhcp.lan.start)\";
          echo \"DHCP_LIMIT=\$(uci get dhcp.lan.limit)\";
          echo \"DHCP_LEASETIME=\$(uci get dhcp.lan.leasetime)\""
      register: _dhcp_batch
      changed_when: false

    - name: Parse batched DHCP results
      ansible.builtin.set_fact:
        dhcp_start_val: "{{ _dhcp_batch.stdout | regex_search('DHCP_START=(.*)', '\\1') | first | default('0') }}"
        dhcp_limit_val: "{{ _dhcp_batch.stdout | regex_search('DHCP_LIMIT=(.*)', '\\1') | first | default('0') }}"
        dhcp_leasetime_val: "{{ _dhcp_batch.stdout | regex_search('DHCP_LEASETIME=(.*)', '\\1') | first | default('') }}"

    - name: Assert DHCP start is configured
      ansible.builtin.assert:
        that: (dhcp_start_val | trim | int) > 0
        fail_msg: "DHCP start not set or zero: {{ dhcp_start_val | trim }}"

    - name: Assert DHCP limit is configured
      ansible.builtin.assert:
        that: (dhcp_limit_val | trim | int) > 0
        fail_msg: "DHCP limit not set or zero: {{ dhcp_limit_val | trim }}"

    - name: Assert DHCP leasetime is configured
      ansible.builtin.assert:
        that: (dhcp_leasetime_val | trim | length) > 0
        fail_msg: "DHCP leasetime not set"

    - name: Get Proxmox LAN bridge MAC for reservation check  # noqa command-instead-of-shell
      ansible.builtin.shell:
        cmd: cat /sys/class/net/{{ lan_bridge }}/address
      register: lan_bridge_mac_raw
      delegate_to: "{{ inventory_hostname }}"
      changed_when: false

    - name: Check DHCP reservation for Proxmox host (batched)
      ansible.builtin.shell:
        cmd: >-
          {{ openwrt_ssh }}
          "dhcp_dump=\$(uci show dhcp);
          echo \"MAC_MATCH=\$(echo \"\$dhcp_dump\" | grep -i '{{ lan_bridge_mac_raw.stdout | trim }}' || echo 'no_reservation')\";
          echo \"IP_MATCH=\$(echo \"\$dhcp_dump\" | grep '.ip=' | grep '{{ proxmox_lan_ip }}' || echo 'ip_mismatch')\""
      register: _dhcp_res_batch
      changed_when: false

    - name: Assert DHCP reservation exists for Proxmox host
      ansible.builtin.assert:
        that: "'no_reservation' not in _dhcp_res_batch.stdout"
        fail_msg: >-
          No DHCP static lease found on OpenWrt for Proxmox LAN bridge
          MAC {{ lan_bridge_mac_raw.stdout | trim }}. The Proxmox host
          will not get a predictable LAN IP on boot.
          Output: {{ _dhcp_res_batch.stdout }}

    - name: Assert DHCP reservation IP is correct
      ansible.builtin.assert:
        that: "'ip_mismatch' not in _dhcp_res_batch.stdout"
        fail_msg: >-
          DHCP reservation IP does not match expected {{ proxmox_lan_ip }}.
          Output: {{ _dhcp_res_batch.stdout }}

    - name: Report DHCP configuration
      ansible.builtin.debug:
        msg: >-
          DHCP: start={{ dhcp_start_val | trim }},
          limit={{ dhcp_limit_val | trim }},
          leasetime={{ dhcp_leasetime_val | trim }},
          proxmox_reservation={{ 'yes' if 'no_reservation' not in _dhcp_res_batch.stdout else 'no' }}

    # ── Proxmox GUI from LAN (leaf node perspective) ───────────────

    - name: Test Proxmox GUI reachable from OpenWrt VM (leaf node view)
      ansible.builtin.shell:
        cmd: >-
          {{ openwrt_ssh }}
          "(echo QUIT | nc {{ proxmox_lan_ip }} 8006) </dev/null >/dev/null 2>&1; echo exit=\$?"
      register: gui_from_lan
      changed_when: false

    - name: Assert Proxmox GUI is reachable from LAN
      ansible.builtin.assert:
        that: "'exit=0' in gui_from_lan.stdout"
        fail_msg: >-
          Cannot reach Proxmox GUI at {{ proxmox_lan_ip }}:8006 from
          OpenWrt VM. Leaf nodes cannot access the Proxmox web interface.
          Output: {{ gui_from_lan.stdout }}

    # ── WAN MAC address cloning ────────────────────────────────────

    - name: Get WAN MAC from UCI and deferred file (batched)
      ansible.builtin.shell:
        cmd: >-
          {{ openwrt_ssh }}
          "echo \"UCI_MAC=\$(uci get network.wan.macaddr 2>/dev/null || echo '')\";
          echo \"DEFERRED_MAC=\$(cat /etc/openwrt_wan_mac_deferred 2>/dev/null || echo '')\""
      register: _wan_mac_batch
      changed_when: false

    - name: Set WAN MAC test facts
      ansible.builtin.set_fact:
        _wan_mac_env: "{{ lookup('env', 'WAN_MAC') | default('') }}"
        _wan_mac_uci: "{{ _wan_mac_batch.stdout | regex_search('UCI_MAC=(.*)', '\\1') | first | default('') }}"
        _wan_mac_deferred: "{{ _wan_mac_batch.stdout | regex_search('DEFERRED_MAC=(.*)', '\\1') | first | default('') }}"

    - name: Assert MAC applied OR deferred when WAN_MAC is set
      ansible.builtin.assert:
        that: >-
          (_wan_mac_uci | upper) == (_wan_mac_env | upper)
          or (_wan_mac_deferred | upper) == (_wan_mac_env | upper)
        fail_msg: >-
          WAN_MAC={{ _wan_mac_env }} but neither UCI ({{ _wan_mac_uci }})
          nor deferred file ({{ _wan_mac_deferred }}) contains it
      when: _wan_mac_env | length > 0

    - name: Warn if MAC in both UCI and deferred file
      ansible.builtin.debug:
        msg: >-
          WAN MAC in both UCI ({{ _wan_mac_uci }}) and deferred file
          ({{ _wan_mac_deferred }}). This is expected when the old router is
          still on the network — the init script retains the deferred file
          as a safety net until the conflict resolves.
      when:
        - _wan_mac_env | length > 0
        - _wan_mac_uci | length > 0
        - _wan_mac_deferred | length > 0

    - name: Assert no WAN MAC artifacts when not configured
      ansible.builtin.assert:
        that:
          - _wan_mac_uci == ""
          - _wan_mac_deferred == ""
        fail_msg: >-
          WAN_MAC not set but found UCI={{ _wan_mac_uci }},
          deferred={{ _wan_mac_deferred }}
      when: _wan_mac_env | length == 0

    - name: Check WAN MAC init script status (batched)
      ansible.builtin.shell:
        cmd: >-
          {{ openwrt_ssh }}
          "echo \"INIT=\$(test -x /etc/init.d/wan_mac_apply && echo present || echo missing)\";
          echo \"ENABLED=\$(test -e /etc/rc.d/S99wan_mac_apply && echo enabled || echo disabled)\""
      register: _mac_init_batch
      changed_when: false
      when: _wan_mac_deferred | length > 0

    - name: Assert init script deployed and enabled when MAC deferred
      ansible.builtin.assert:
        that:
          - "'INIT=present' in _mac_init_batch.stdout"
          - "'ENABLED=enabled' in _mac_init_batch.stdout"
        fail_msg: >-
          WAN MAC deferred but init script state: {{ _mac_init_batch.stdout }}.
          The MAC would never be auto-applied on reboot.
      when: _wan_mac_deferred | length > 0

    - name: Check dmesg for IPv6 duplicate address errors
      ansible.builtin.shell:
        cmd: >-
          {{ openwrt_ssh }} "dmesg | grep -c 'IPv6 duplicate address' 2>/dev/null || echo 0"
      register: ipv6_dup_count
      changed_when: false

    - name: Assert no IPv6 duplicate address errors
      ansible.builtin.assert:
        that: (ipv6_dup_count.stdout | trim | int) == 0
        fail_msg: >-
          Found {{ ipv6_dup_count.stdout | trim }} IPv6 duplicate address
          errors in dmesg — indicates MAC conflict on L2 segment
      when: lookup('env', 'WAN_MAC') | length == 0

    - name: Warn about expected IPv6 DAD with WAN_MAC cloning
      ansible.builtin.debug:
        msg: >-
          {{ ipv6_dup_count.stdout | trim }} IPv6 DAD error(s) detected — expected
          when WAN_MAC is set and old router shares the same OUI on the L2 segment.
          The deferred MAC apply mechanism handles this automatically.
      when:
        - lookup('env', 'WAN_MAC') | length > 0
        - (ipv6_dup_count.stdout | trim | int) > 0

    - name: Report WAN MAC status
      ansible.builtin.debug:
        msg: >-
          WAN MAC: {{ 'applied via UCI: ' + _wan_mac_uci
          if _wan_mac_uci | length > 0
          else ('deferred to /etc/openwrt_wan_mac_deferred: ' + _wan_mac_deferred
          if _wan_mac_deferred | length > 0
          else 'not configured (using auto-generated MAC)') }}

    # ── WiFi ────────────────────────────────────────────────────

    - name: Check WiFi radios and WDS config (batched)
      ansible.builtin.shell:
        cmd: >-
          {{ openwrt_ssh }}
          "echo \"RADIOS=\$(ls -1 /sys/class/ieee80211/ 2>/dev/null | wc -l)\";
          echo \"WDS_AP=\$(uci show wireless 2>/dev/null | grep -c \"mode='ap'\" || echo 0)\";
          echo \"WDS_ON=\$(uci show wireless 2>/dev/null | grep -c \"wds='1'\" || echo 0)\""
      register: _wifi_batch
      changed_when: false

    - name: Parse WiFi results
      ansible.builtin.set_fact:
        radio_count_val: "{{ _wifi_batch.stdout | regex_search('RADIOS=(\\d+)', '\\1') | first | default('0') }}"
        wds_iface_count_val: "{{ _wifi_batch.stdout | regex_search('WDS_AP=(\\d+)', '\\1') | first | default('0') }}"

    - name: Assert WDS AP interfaces match radio count
      ansible.builtin.assert:
        that: >-
          (wds_iface_count_val | int) >=
          (radio_count_val | int)
        fail_msg: >-
          Expected {{ radio_count_val }} WDS AP interfaces,
          found {{ wds_iface_count_val }}
      when: (radio_count_val | int) > 0

    # ── LuCI web interface ─────────────────────────────────────────

    - name: Verify LuCI web interface is reachable
      ansible.builtin.shell:
        cmd: >-
          {{ openwrt_ssh }}
          "wget -q -O /dev/null --timeout=5 http://127.0.0.1/ && echo LUCI_OK || echo LUCI_FAIL"
      register: _luci_check
      changed_when: false

    - name: Assert LuCI responds
      ansible.builtin.assert:
        that: "'LUCI_OK' in _luci_check.stdout"
        fail_msg: >-
          LuCI web interface not reachable on OpenWrt router VM.
          Ensure luci and uhttpd are in ROUTER_PACKAGES in build-images.sh.

    # ── Host address state file ───────────────────────────────────

    - name: Check state file exists on controller
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../.state/addresses.json"
      register: state_file
      delegate_to: localhost

    - name: Assert state file was written
      ansible.builtin.assert:
        that: state_file.stat.exists
        fail_msg: ".state/addresses.json not found on controller"

    - name: Read state file
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/../../.state/addresses.json"
      register: state_raw
      delegate_to: localhost

    - name: Parse state file
      ansible.builtin.set_fact:
        state_data: "{{ state_raw.content | b64decode | from_json }}"

    - name: Assert state file contains host and IPs
      ansible.builtin.assert:
        that:
          - state_data.host is defined
          - state_data.ips is defined
          - state_data.ips | length >= 2
          - proxmox_lan_ip in state_data.ips
        fail_msg: >-
          State file malformed or missing LAN IP.
          Contents: {{ state_data }}

    - name: Report state file contents
      ansible.builtin.debug:
        msg: >-
          State file: host={{ state_data.host }},
          IPs={{ state_data.ips | join(', ') }}

    # ── Generated env file: LAN subnet output ──────────────────────

    - name: Check test.env.generated contains LAN subnet
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          grep -c '^LAN_GATEWAY=' "{{ playbook_dir }}/../../test.env.generated"
        executable: /bin/bash
      register: _lan_gw_check
      delegate_to: localhost
      changed_when: false

    - name: Assert LAN_GATEWAY was written to generated env
      ansible.builtin.assert:
        that: (_lan_gw_check.stdout | trim | int) > 0
        fail_msg: "test.env.generated missing LAN_GATEWAY entry"

    - name: Read LAN_GATEWAY value from generated env  # noqa command-instead-of-shell
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          grep '^LAN_GATEWAY=' "{{ playbook_dir }}/../../test.env.generated" | cut -d= -f2
        executable: /bin/bash
      register: _generated_lan_gw
      delegate_to: localhost
      changed_when: false

    - name: Assert generated LAN_GATEWAY matches OpenWrt LAN IP
      ansible.builtin.assert:
        that: (_generated_lan_gw.stdout | trim) == (lan_ip_line | trim)
        fail_msg: >-
          Generated LAN_GATEWAY={{ _generated_lan_gw.stdout | trim }}
          does not match OpenWrt LAN IP={{ lan_ip_line | trim }}

    # ── Final report ──────────────────────────────────────────────

    - name: Report router verification results
      ansible.builtin.debug:
        msg: >-
          Router verification passed:
          WAN bridge={{ wan_bridge }}, LAN bridge={{ lan_bridge }},
          VM net0={{ vm_net0_bridge_value }},
          Proxmox LAN IP={{ proxmox_lan_ip }},
          WAN={{ wan_info_line | trim }},
          LAN={{ lan_ip_line | trim }},
          WiFi radios={{ radio_count_val }},
          WDS_AP={{ wds_iface_count_val | default('0') }},
          LAN_GATEWAY(generated)={{ _generated_lan_gw.stdout | trim }}

# ── Play 2.5: Fleet readiness gate (API-only, hard-fail) ──────────
# The management API MUST be running. If it's not, that IS the failure.
# No SSH fallback. The heartbeat system is the sole verification path.

- name: Fleet readiness gate (event-driven)
  hosts: localhost
  gather_facts: false
  connection: local
  tasks:
    - name: Verify management API is running (REQUIRED for 4-tier system)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ lookup('env', 'WEBUI_PORT') | default('52500', true) }}/api/nodes"
        method: GET
        return_content: true
        status_code: [200, 403]
      register: _api_probe
      failed_when: _api_probe.status not in [200, 403]

    - name: Query fleet readiness from API
      ansible.builtin.uri:
        url: >-
          http://127.0.0.1:{{ lookup('env', 'WEBUI_PORT') | default('52500', true) }}/api/fleet/ready?services={{
            fleet_ready_services | join(',')
          }}
        method: GET
        return_content: true
      register: _fleet_ready
      retries: 5
      delay: 10
      until: (_fleet_ready.json.all_ready | default(false)) | bool

    - name: Set fleet readiness facts
      ansible.builtin.set_fact:
        _fleet_api_ready: "{{ (_fleet_ready.json.all_ready | default(false)) | bool }}"

    - name: Hard-fail if fleet is not ready
      ansible.builtin.assert:
        that: _fleet_api_ready | bool
        fail_msg: >-
          HARD FAILURE — FLEET NOT READY. The 4-tier heartbeat system reports these services
          are NOT heartbeating: {{
            _fleet_ready.json.services | dict2items
            | selectattr('value.ready', 'equalto', false)
            | map(attribute='key') | list | join(', ')
          }}.
          INVESTIGATE:
          1. Check SM fleet health: curl http://localhost:{{ lookup('env', 'WEBUI_PORT') | default('52500', true) }}/api/fleet/health
          2. Check individual service: curl http://localhost:{{ lookup('env', 'WEBUI_PORT') | default('52500', true) }}/api/container/<service>/ready
          3. Verify VPN is up: sudo wg show wg0
          4. Verify relay chain: Container → NM (port 9001) → CM → SM (port {{ lookup('env', 'WEBUI_PORT') | default('52500', true) }})
          5. Check each NM: curl http://10.0.0.<N>:9001/api/heartbeat (use VPN IPs)
          Do NOT add SSH fallbacks. Fix the heartbeat chain.

# ── Play 2.6: Heartbeat circuit breaker ──────────────────────────
# Hard-fail if any container that was healthy at the readiness gate
# has since stopped heartbeating. Catches host crashes, container
# deaths, and network partitions before running per-service checks
# that would produce confusing errors.

- name: Heartbeat circuit breaker (pre-verify)
  hosts: localhost
  gather_facts: false
  connection: local
  tasks:
    - name: Wait for heartbeat relay chain to settle after configure
      ansible.builtin.pause:
        seconds: 45

    - name: Run heartbeat staleness check
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../tasks/fleet_heartbeat_gate.yml"
      vars:
        gate_services: "{{ fleet_monitored_services }}"
        gate_max_age_seconds: 300

# ── Play 3: Pi-hole health + integration (dns_nodes) ─────────────
# Deep Pi-hole checks (FTL diagnostics, ad-block, DNS retry loops)
# live in molecule/pihole-lxc/verify.yml.

- name: Verify Pi-hole LXC on DNS nodes
  hosts: dns_nodes
  gather_facts: false
  vars:
    _api_base: "http://127.0.0.1:{{ lookup('env', 'WEBUI_PORT') | default('52500', true) }}"
  tasks:
    - name: Read Pi-hole container state and config
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          pct status {{ pihole_ct_id }}
          pct config {{ pihole_ct_id }}
        executable: /bin/bash
      register: pihole_ct_cfg
      changed_when: false

    - name: Assert Pi-hole container is running with correct config
      ansible.builtin.assert:
        that:
          - "'running' in pihole_ct_cfg.stdout"
          - "'onboot: 1' in pihole_ct_cfg.stdout"
          - pihole_ct_cfg.stdout is regex('startup:.*order=3')
          - "'nesting=1' in pihole_ct_cfg.stdout"
        fail_msg: "Pi-hole container {{ pihole_ct_id }} config incorrect on {{ inventory_hostname }}"

    - name: Query Pi-hole readiness from API
      ansible.builtin.uri:
        url: "{{ _api_base }}/api/container/pihole/ready"
        return_content: true
      register: _pihole_api
      delegate_to: localhost

    - name: Assert Pi-hole via API (heartbeat + service state)
      ansible.builtin.assert:
        that:
          - _pihole_api.json.ready | default(false) | bool
        fail_msg: >-
          HARD FAILURE: Pi-hole not ready via heartbeat API on {{ inventory_hostname }}.
          API response: {{ _pihole_api.json | default({}) }}.
          INVESTIGATE: Query VPN: curl http://{{ vpn_ip }}:9001/api/heartbeat
          Check container: pct exec {{ pihole_ct_id }} -- systemctl status callhome
          Check NM relay: The heartbeat chain is Container → NM → CM → SM.

    - name: Assert Pi-hole config tracked via heartbeat config_files extension
      ansible.builtin.assert:
        that:
          - (_pihole_api.json.extensions.config_files | default(none)) is not none
          - "'/etc/pihole/pihole.toml' in (_pihole_api.json.extensions.config_files | default({}))"
        fail_msg: >-
          HARD FAILURE: Pi-hole on {{ inventory_hostname }} not reporting config_files via heartbeat.
          INVESTIGATE: Rebuild pihole image with CALLHOME_CONFIG_FILES=/etc/pihole/pihole.toml
          baked into /etc/default/callhome. Then run molecule converge to recreate containers.

    - name: Assert stamp contains pihole_lxc
      ansible.builtin.assert:
        that: "'pihole_lxc' in stamp.plays"
        fail_msg: "deploy_stamp missing pihole_lxc entry"

# ── Play 4: Monitoring health + integration (monitoring_nodes) ────
# Deep rsyslog checks (config validation, separation, leak tests,
# logrotate) live in molecule/rsyslog-lxc/verify.yml.
# Deep Netdata checks (systemd override, memory) live in
# molecule/netdata-lxc/verify.yml.

- name: Verify monitoring services on monitoring nodes
  hosts: monitoring_nodes
  gather_facts: false
  vars:
    _api_base: "http://127.0.0.1:{{ lookup('env', 'WEBUI_PORT') | default('52500', true) }}"
  tasks:
    - name: Check if br_netfilter is loaded
      ansible.builtin.stat:
        path: /proc/sys/net/bridge/bridge-nf-call-iptables
      register: _br_nf

    - name: Disable iptables on bridge traffic
      ansible.posix.sysctl:
        name: net.bridge.bridge-nf-call-iptables
        value: "0"
        sysctl_set: true
        reload: true
      when: _br_nf.stat.exists

    # ── rsyslog container health ─────────────────────────────────

    - name: Read rsyslog container state and config
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          pct status {{ rsyslog_ct_id }}
          pct config {{ rsyslog_ct_id }}
        executable: /bin/bash
      register: rsyslog_ct_cfg
      changed_when: false

    - name: Assert rsyslog container is running with correct config
      ansible.builtin.assert:
        that:
          - "'running' in rsyslog_ct_cfg.stdout"
          - "'onboot: 1' in rsyslog_ct_cfg.stdout"
          - rsyslog_ct_cfg.stdout is regex('startup:.*order=3')
        fail_msg: "rsyslog container {{ rsyslog_ct_id }} config incorrect on {{ inventory_hostname }}"

    - name: Query rsyslog readiness from API
      ansible.builtin.uri:
        url: "{{ _api_base }}/api/container/rsyslog/ready"
        return_content: true
      register: _rsyslog_api_health
      delegate_to: localhost

    - name: Assert rsyslog via API (heartbeat + service state)
      ansible.builtin.assert:
        that:
          - _rsyslog_api_health.json.ready | default(false) | bool
          - _rsyslog_api_health.json.systemd_services['rsyslog.service'] | default('') in ['active', 'running']
            or _rsyslog_api_health.json.systemd_services['rsyslog'] | default('') in ['active', 'running']
        fail_msg: "rsyslog not ready via API: {{ _rsyslog_api_health.json | default({}) }}"

    # ── Cross-service: log reception from host ─────────────────
    # Use pct config for per-host rsyslog IP (API returns one container's
    # IP for all hosts since multiple rsyslog containers share container_id)

    - name: Extract rsyslog container IP from pct config
      ansible.builtin.set_fact:
        _rsyslog_verify_ip: "{{ rsyslog_ct_cfg.stdout | regex_search('ip=([^/,]+)', '\\1') | first }}"

    - name: Send test log to rsyslog container
      ansible.builtin.shell:
        cmd: >-
          logger --tcp -n {{ _rsyslog_verify_ip }} -P 514
          "e2e-integration-rsyslog-$(date +%s)"
      changed_when: true
      retries: 3
      delay: 3
      register: _rsyslog_send
      until: _rsyslog_send.rc == 0
      failed_when: false

    - name: Fallback send via pct exec localhost
      ansible.builtin.shell:
        cmd: >-
          pct exec {{ rsyslog_ct_id }} --
          logger --tcp -n 127.0.0.1 -P 514 "e2e-integration-rsyslog-$(date +%s)"
      changed_when: true
      when: _rsyslog_send.rc != 0

    - name: Check test log arrived
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          pct exec {{ rsyslog_ct_id }} -- \
            grep -rl 'e2e-integration-rsyslog' \
            /var/log/remote/ 2>/dev/null | head -1
        executable: /bin/bash
      register: rsyslog_log_test
      changed_when: false
      failed_when: false
      retries: 3
      delay: 3
      until: rsyslog_log_test.stdout | trim | length > 0

    - name: Assert log reception works (cross-service integration)
      ansible.builtin.assert:
        that: rsyslog_log_test.stdout | trim | length > 0
        fail_msg: >-
          Cross-service log reception failed on {{ inventory_hostname }}.
          rsyslog_ip={{ _rsyslog_verify_ip }}, send_rc={{ _rsyslog_send.rc }}

    - name: Assert stamp contains rsyslog_lxc
      ansible.builtin.assert:
        that: "'rsyslog_lxc' in stamp.plays"
        fail_msg: "deploy_stamp missing rsyslog_lxc entry"

    # ── Netdata container health ─────────────────────────────────

    - name: Read Netdata container state and config
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          pct status {{ netdata_ct_id }}
          pct config {{ netdata_ct_id }}
        executable: /bin/bash
      register: netdata_ct_cfg
      changed_when: false

    - name: Assert Netdata container is running with correct config
      ansible.builtin.assert:
        that:
          - "'running' in netdata_ct_cfg.stdout"
          - "'onboot: 1' in netdata_ct_cfg.stdout"
          - netdata_ct_cfg.stdout is regex('startup:.*order=3')
          - "'nesting=1' in netdata_ct_cfg.stdout"
          - "'/host/proc' in netdata_ct_cfg.stdout"
          - "'/host/sys' in netdata_ct_cfg.stdout"
        fail_msg: "Netdata container {{ netdata_ct_id }} config incorrect on {{ inventory_hostname }}"

    - name: Query Netdata readiness from API
      ansible.builtin.uri:
        url: "{{ _api_base }}/api/container/netdata/ready"
        return_content: true
      register: _netdata_api
      delegate_to: localhost

    - name: Assert Netdata via API (heartbeat + service state)
      ansible.builtin.assert:
        that:
          - _netdata_api.json.ready | default(false) | bool
          - _netdata_api.json.systemd_services.get('netdata.service', '') in ['active', 'running']
            or _netdata_api.json.systemd_services.get('netdata', '') in ['active', 'running']
            or (_netdata_api.json.extensions.http_probes | default({})).get('http://127.0.0.1:19999', 0) == 200
        fail_msg: "Netdata not ready via API: {{ _netdata_api.json | default({}) }}"

    - name: Assert stamp contains netdata_lxc
      ansible.builtin.assert:
        that: "'netdata_lxc' in stamp.plays"
        fail_msg: "deploy_stamp missing netdata_lxc entry"

# ── Play 5: WireGuard health (vpn_nodes) ────────────────────────
# Deep WireGuard checks (permissions, peers, sysctl, NAT, env.generated)
# live in molecule/wireguard-lxc/verify.yml.

- name: Verify WireGuard LXC on VPN nodes
  hosts: vpn_nodes
  gather_facts: false
  vars:
    _api_base: "http://127.0.0.1:{{ lookup('env', 'WEBUI_PORT') | default('52500', true) }}"
  tasks:
    - name: Read WireGuard container state and config
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          pct status {{ wireguard_ct_id }}
          pct config {{ wireguard_ct_id }}
        executable: /bin/bash
      register: wg_ct_cfg
      changed_when: false

    - name: Assert WireGuard container is running with correct config
      ansible.builtin.assert:
        that:
          - "'running' in wg_ct_cfg.stdout"
          - "'onboot: 1' in wg_ct_cfg.stdout"
          - wg_ct_cfg.stdout is regex('startup:.*order=2')
          - "'nesting=1' in wg_ct_cfg.stdout"
        fail_msg: "WireGuard container {{ wireguard_ct_id }} config incorrect on {{ inventory_hostname }}"

    - name: Assert WireGuard on WAN hosts uses NAT bridge (not household subnet)
      ansible.builtin.assert:
        that:
          - wg_ct_cfg.stdout is search('vmbr_ct')
          - wg_ct_cfg.stdout is search('10\\.99\\.')
        fail_msg: >-
          WireGuard container on WAN host {{ inventory_hostname }} should use
          vmbr_ct (NAT bridge) with 10.99.x.x IP, not the household subnet.
          Got: {{ wg_ct_cfg.stdout | regex_search('net0:.*') }}
      when: "'router_nodes' not in group_names and 'lan_hosts' not in group_names"

    - name: Assert WireGuard DNAT rule exists (WAN hosts)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          iptables -t nat -S PREROUTING | grep -c 'dport 51820.*DNAT'
        executable: /bin/bash
      register: _wg_dnat_check
      changed_when: false
      failed_when: false
      when: "'router_nodes' not in group_names and 'lan_hosts' not in group_names"

    - name: Assert WireGuard DNAT rule present
      ansible.builtin.assert:
        that: (_wg_dnat_check.stdout | int) > 0
        fail_msg: >-
          Missing WireGuard DNAT rule on WAN host {{ inventory_hostname }}.
          UDP 51820 should be forwarded to the WireGuard container.
      when: "'router_nodes' not in group_names and 'lan_hosts' not in group_names"

    - name: Query WireGuard extensions from API
      ansible.builtin.uri:
        url: "{{ _api_base }}/api/container/wireguard/ready"
        return_content: true
      register: _wg_api
      delegate_to: localhost

    - name: Assert WireGuard ready via API
      ansible.builtin.assert:
        that:
          - _wg_api.json.ready | default(false) | bool
        fail_msg: "WireGuard not ready via API: {{ _wg_api.json | default({}) }}"

    - name: Set WireGuard peer count from API
      ansible.builtin.set_fact:
        _wg_peer_count: "{{ _wg_api.json.extensions.wireguard.interfaces.wg0.peer_count | default(0) }}"
      when: (_wg_api.json.extensions.wireguard | default(none)) is not none

    - name: Assert at least one WireGuard peer exists
      ansible.builtin.assert:
        that: _wg_peer_count | default(0) | int >= 1
        fail_msg: >-
          WireGuard on {{ inventory_hostname }} has
          {{ _wg_peer_count | default('0') }}
          peers — expected at least 1 for cross-node connectivity

    - name: Check VPN DNAT rules for each required service port
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          pct exec {{ wireguard_ct_id }} -- iptables -t nat -S PREROUTING 2>/dev/null | grep -c 'dport {{ item }}.*DNAT' || echo 0
        executable: /bin/bash
      register: _wg_port_dnat
      changed_when: false
      loop:
        - 6080
        - 6081
        - 6082
        - 6083
        - 9001

    - name: Assert WireGuard container has DNAT for each service port
      ansible.builtin.assert:
        that: (item.stdout | trim | int) > 0
        fail_msg: >-
          WireGuard container on {{ inventory_hostname }} missing DNAT for
          port {{ item.item }} — expected PREROUTING DNAT rule
      loop: "{{ _wg_port_dnat.results }}"
      loop_control:
        label: "port {{ item.item }}"

    # ── VPN tunnel health ─────────────────────────────────────────
    - name: Get WireGuard container VPN IP
      ansible.builtin.command:
        cmd: pct exec {{ wireguard_ct_id }} -- ip -4 addr show wg0
      register: _wg_vpn_addr
      changed_when: false
      failed_when: false

    - name: Assert VPN IP matches host_vars vpn_ip
      ansible.builtin.assert:
        that: _wg_vpn_addr.stdout is search(vpn_ip)
        fail_msg: >-
          WireGuard container on {{ inventory_hostname }} has wrong VPN IP.
          Expected {{ vpn_ip }}, got: {{ _wg_vpn_addr.stdout }}
      when: _wg_vpn_addr.rc == 0

    - name: Check WireGuard tunnel transfer stats
      ansible.builtin.command:
        cmd: pct exec {{ wireguard_ct_id }} -- wg show wg0 transfer
      register: _wg_transfer
      changed_when: false
      failed_when: false

    - name: Assert hub has received data from peers
      ansible.builtin.assert:
        that: _wg_transfer.stdout | length > 0
        fail_msg: >-
          WireGuard hub on {{ inventory_hostname }} shows no transfer data.
          Tunnel may not be connected.
      when:
        - vpn_ip == '10.0.0.1'
        - _wg_transfer.rc == 0

    - name: Ping VPN hub from client containers
      ansible.builtin.command:
        cmd: pct exec {{ wireguard_ct_id }} -- ping -c 1 -W 3 10.0.0.1
      register: _wg_ping_hub
      changed_when: false
      failed_when: false
      when: vpn_ip != '10.0.0.1'

    - name: Assert client can reach hub via VPN
      ansible.builtin.assert:
        that: _wg_ping_hub.rc == 0
        fail_msg: >-
          WireGuard client on {{ inventory_hostname }} ({{ vpn_ip }}) cannot
          ping hub (10.0.0.1). Tunnel not connected.
      when:
        - vpn_ip != '10.0.0.1'
        - _wg_ping_hub is defined

    - name: Assert stamp contains wireguard_lxc
      ansible.builtin.assert:
        that: "'wireguard_lxc' in stamp.plays"
        fail_msg: "deploy_stamp missing wireguard_lxc entry"

# ── Play 5b: Controller VPN (localhost) ──────────────────────────
# The controller (build machine) needs a wg0 tunnel to reach display
# streams on VPN IPs. Verifies the tunnel is baked by site.yml.

- name: Verify controller VPN tunnel
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Check wg0 interface exists on controller
      ansible.builtin.command:
        cmd: sudo wg show wg0
      register: _ctrl_wg0
      changed_when: false
      failed_when: false

    - name: Assert controller wg0 is up
      ansible.builtin.assert:
        that: _ctrl_wg0.rc == 0
        fail_msg: >-
          HARD FAILURE — CONTROLLER VPN NOT UP. This breaks ALL API-driven
          verification. The entire 4-tier system depends on VPN for NM communication.
          INVESTIGATE:
          1. sudo wg-quick up wg0
          2. Check /etc/wireguard/wg0.conf exists with correct keys
          3. Verify wireguard_configure ran successfully in site.yml
          4. Check sudo wg show for handshake status
          Do NOT proceed without VPN — all NM API queries will fail.

    - name: Ping VPN hub from controller
      ansible.builtin.command:
        cmd: ping -c 1 -W 3 10.0.0.1
      register: _ctrl_ping_hub
      changed_when: false
      failed_when: false

    - name: Assert controller can reach VPN hub
      ansible.builtin.assert:
        that: _ctrl_ping_hub.rc == 0
        fail_msg: >-
          HARD FAILURE — VPN HUB UNREACHABLE from controller. Cannot ping 10.0.0.1.
          This means the WireGuard tunnel is broken and ALL API verification will fail.
          INVESTIGATE:
          1. sudo wg show wg0 — check for recent handshake
          2. Check VPN hub container: pct exec {{ wireguard_ct_id }} -- wg show wg0
          3. Verify endpoint is correct in /etc/wireguard/wg0.conf
          4. Check if ISP/firewall blocks UDP 51820
          FULL STOP until VPN is working.

# ── Play 6: LAN host assertions (mesh1-specific) ─────────────────

- name: Verify LAN satellite hosts
  hosts: lan_hosts
  gather_facts: false
  tasks:
    - name: Check Proxmox API is responsive
      ansible.builtin.command:
        cmd: pvesh get /version --output-format json
      register: pve_version
      changed_when: false

    - name: Assert PVE API returned valid response
      ansible.builtin.assert:
        that: (pve_version.stdout | from_json).version is defined
        fail_msg: "Proxmox API not responsive on {{ inventory_hostname }}: {{ pve_version.stdout }}"

    - name: Check IOMMU status on LAN host
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          dmesg | grep -i -c 'IOMMU enabled\|DMAR.*IOMMU\|Adding to iommu group'
        executable: /bin/bash
      register: lan_iommu
      changed_when: false
      failed_when: false

    - name: Report LAN host IOMMU
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} IOMMU: {{ 'active' if (lan_iommu.stdout | int) > 0 else 'not active' }}

    - name: Check WiFi PCI devices
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          lspci -nn | grep -ic 'Network controller.*Intel'
        executable: /bin/bash
      register: lan_wifi_count
      changed_when: false
      failed_when: false

    - name: Report LAN host WiFi
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} WiFi devices: {{ lan_wifi_count.stdout | trim }}

    - name: Report LAN host verification
      ansible.builtin.debug:
        msg: >-
          LAN host {{ inventory_hostname }} verification passed:
          PVE API=responsive,
          IOMMU={{ 'active' if (lan_iommu.stdout | int) > 0 else 'inactive' }},
          WiFi={{ lan_wifi_count.stdout | trim }} devices

# ── Play 7: Mesh WiFi LXC assertions (wifi_nodes except router_nodes) ──

- name: Verify OpenWrt Mesh LXC on satellite nodes
  hosts: wifi_nodes:!router_nodes
  gather_facts: false
  tasks:
    - name: Read mesh WiFi container state and config
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          pct status {{ meshwifi_ct_id }}
          pct config {{ meshwifi_ct_id }}
        executable: /bin/bash
      register: mesh_ct_cfg
      changed_when: false

    - name: Assert mesh WiFi container is running
      ansible.builtin.assert:
        that: "'running' in mesh_ct_cfg.stdout"
        fail_msg: "Container {{ meshwifi_ct_id }} is not running on {{ inventory_hostname }}"

    - name: Assert mesh container starts on boot
      ansible.builtin.assert:
        that: "'onboot: 1' in mesh_ct_cfg.stdout"
        fail_msg: "Container {{ meshwifi_ct_id }} on {{ inventory_hostname }} missing onboot: 1"

    - name: Assert mesh container is privileged (unprivileged=0)
      ansible.builtin.assert:
        that: mesh_ct_cfg.stdout is not regex('unprivileged:\\s*1')
        fail_msg: >-
          Container {{ meshwifi_ct_id }} on {{ inventory_hostname }}
          is unprivileged (required: privileged for WiFi PHY namespace move)

    - name: Check WiFi PHY hookscript exists
      ansible.builtin.stat:
        path: "/var/lib/vz/snippets/mesh-wifi-phy-{{ meshwifi_ct_id }}.sh"
      register: mesh_hookscript

    - name: Assert WiFi PHY hookscript is deployed
      ansible.builtin.assert:
        that: mesh_hookscript.stat.exists
        fail_msg: "Hookscript mesh-wifi-phy-{{ meshwifi_ct_id }}.sh not found"

    - name: Assert hookscript is attached
      ansible.builtin.assert:
        that: "'hookscript' in mesh_ct_cfg.stdout"
        fail_msg: "No hookscript attached to container {{ meshwifi_ct_id }}"

    - name: Run mesh container health checks (single pct exec)
      ansible.builtin.shell:
        cmd: >-
          pct exec {{ meshwifi_ct_id }} -- /bin/sh -c '
          echo "RADIOS=$(iw phy 2>/dev/null | sed -n "s/^Wiphy //p" | tr "\n" ",")";
          echo "WDS_IFACES=$(uci show wireless 2>/dev/null | grep -c "wds=.1." || true)";
          echo "WDS_MODE=$(uci show wireless 2>/dev/null | grep "mode=" | head -1)";
          echo "WPAD=$(opkg list-installed wpad-mesh-openssl 2>/dev/null)"
          '
      register: mesh_health
      changed_when: false
      failed_when: false

    - name: Assert WiFi radios are visible inside container
      ansible.builtin.assert:
        that:
          - mesh_health.rc == 0
          - mesh_health.stdout | regex_search('RADIOS=phy') is not none
        fail_msg: >-
          No WiFi radios visible inside mesh container {{ meshwifi_ct_id }}
          on {{ inventory_hostname }}. PHY namespace move may have failed.
          Output: {{ mesh_health.stdout | default('empty') }}

    - name: Assert WDS interface is configured
      ansible.builtin.assert:
        that: >-
          mesh_health.stdout | regex_search('WDS_IFACES=(\d+)', '\\1')
          | first | int > 0
        fail_msg: >-
          No WDS interfaces configured inside container {{ meshwifi_ct_id }}
          on {{ inventory_hostname }}
      when: mesh_health.rc == 0

    - name: Assert wpad-mesh-openssl is installed
      ansible.builtin.assert:
        that: "'wpad-mesh-openssl' in mesh_health.stdout"
        fail_msg: >-
          wpad-mesh-openssl not installed in mesh container
          on {{ inventory_hostname }}

    - name: Assert mesh container identity via heartbeat API (no SSH)
      ansible.builtin.assert:
        that:
          - _fleet_api_ready | default(false) | bool
        fail_msg: >-
          HARD FAILURE: Mesh container on {{ inventory_hostname }} not heartbeating
          with correct identity. INVESTIGATE: Fleet readiness gate should have caught
          openwrt-mesh. Check CALLHOME_HOSTNAME in /etc/default/callhome inside CT
          {{ meshwifi_ct_id }} — kiosk_configure may have overwritten it.
      when: _fleet_api_ready is defined

    - name: Assert mesh container has deploy_stamp
      ansible.builtin.assert:
        that: "'openwrt_mesh_lxc' in stamp.plays"
        fail_msg: "deploy_stamp missing openwrt_mesh_lxc entry: {{ stamp.plays.keys() | list }}"

    - name: Report mesh LXC verification
      ansible.builtin.debug:
        msg: >-
          Mesh LXC verification passed on {{ inventory_hostname }}:
          container={{ meshwifi_ct_id }}, running=yes,
          privileged=yes, hookscript=deployed

# ── Play 7b: WiFi Bridge LXC assertions (bridge_nodes) ──────────────

- name: Verify WiFi Bridge LXC on bridge nodes
  hosts: bridge_nodes
  gather_facts: false
  tasks:
    - name: Check if bridge container exists
      ansible.builtin.command:
        cmd: pct status {{ bridge_ct_id }}
      register: _bridge_status
      changed_when: false
      failed_when: false

    - name: Skip bridge verify if container not deployed
      ansible.builtin.meta: end_play
      when: _bridge_status.rc != 0

    - name: Read bridge container config
      ansible.builtin.command:
        cmd: pct config {{ bridge_ct_id }}
      register: _bridge_cfg
      changed_when: false

    - name: Assert bridge container is running with correct config
      ansible.builtin.assert:
        that:
          - "'running' in _bridge_status.stdout"
          - "'onboot: 1' in _bridge_cfg.stdout"
        fail_msg: "Bridge container {{ bridge_ct_id }} not running or missing onboot on {{ inventory_hostname }}"

    - name: Assert bridge container hookscript is deployed
      ansible.builtin.shell:
        cmd: >-
          ls /var/lib/vz/snippets/bridge-wifi-phy-*.sh 2>/dev/null | head -1
      register: _bridge_hookscript
      changed_when: false
      failed_when: false

    - name: Assert hookscript exists
      ansible.builtin.assert:
        that: _bridge_hookscript.stdout | length > 0
        fail_msg: "Bridge WiFi PHY hookscript not found on {{ inventory_hostname }}"

    - name: Check bridge container WiFi, scripts, and batman readiness
      ansible.builtin.shell:
        cmd: >-
          pct exec {{ bridge_ct_id }} -- /bin/sh -c '
          echo "RADIOS=$(ls /sys/class/ieee80211/ 2>/dev/null | tr "\n" ",")";
          echo "BATCTL=$(command -v batctl >/dev/null 2>&1 && echo yes || echo no)";
          echo "TRIGGER=$(test -x /usr/sbin/batman_trigger.sh && echo yes || echo no)";
          echo "WIFI_SETUP=$(test -x /usr/sbin/wifi_setup.sh && echo yes || echo no)";
          echo "KEY=$(test -f /etc/batman_key && echo yes || echo no)";
          echo "BAT_STATUS=$(/usr/sbin/batman_trigger.sh status 2>/dev/null | head -1)";
          /usr/sbin/wifi_setup.sh status 2>/dev/null
          '
      register: _bridge_health
      changed_when: false
      failed_when: false

    - name: Assert WiFi PHY is visible inside bridge container
      ansible.builtin.assert:
        that:
          - _bridge_health.rc == 0
          - _bridge_health.stdout | regex_search('RADIOS=phy') is not none
        fail_msg: >-
          No WiFi radios inside bridge container {{ bridge_ct_id }}
          on {{ inventory_hostname }}. Output: {{ _bridge_health.stdout | default('empty') }}
      when: _bridge_health.rc == 0

    - name: Assert wifi_setup.sh is available
      ansible.builtin.assert:
        that: "'WIFI_SETUP=yes' in _bridge_health.stdout"
        fail_msg: >-
          wifi_setup.sh not found in bridge container on {{ inventory_hostname }}.
          Script must be baked into the mesh LXC image.
      when: _bridge_health.rc == 0

    - name: Assert WiFi mode matches host wifi_role
      ansible.builtin.assert:
        that:
          - _bridge_health.stdout | regex_search('MODE=' + wifi_role) is not none
        fail_msg: >-
          WiFi mode mismatch on {{ inventory_hostname }}: expected {{ wifi_role }},
          got {{ _bridge_health.stdout | regex_search('MODE=(.+)', '\1') | default(['unknown']) | first }}.
      when: _bridge_health.rc == 0

    - name: Assert batman-adv tooling is available
      ansible.builtin.assert:
        that:
          - "'BATCTL=yes' in _bridge_health.stdout"
          - "'TRIGGER=yes' in _bridge_health.stdout"
        fail_msg: >-
          Batman tooling missing in bridge container on {{ inventory_hostname }}.
          batctl and batman_trigger.sh must be baked into the image.
      when: _bridge_health.rc == 0

    - name: Assert batman key is deployed
      ansible.builtin.assert:
        that: "'KEY=yes' in _bridge_health.stdout"
        fail_msg: "Batman HMAC key not deployed to bridge container on {{ inventory_hostname }}"
      when: _bridge_health.rc == 0

    - name: Assert batman is in expected state (inactive by default)
      ansible.builtin.assert:
        that: "'BAT_STATUS=BATMAN=' in _bridge_health.stdout"
        fail_msg: "batman_trigger.sh status failed in bridge container on {{ inventory_hostname }}"
      when: _bridge_health.rc == 0

    - name: Assert bridge container identity via heartbeat API (no SSH)
      ansible.builtin.assert:
        that:
          - _fleet_api_ready | default(false) | bool
        fail_msg: >-
          HARD FAILURE: Bridge container on {{ inventory_hostname }} not heartbeating
          with correct identity. INVESTIGATE: Fleet readiness gate should have caught
          openwrt-bridge. Check CALLHOME_HOSTNAME in /etc/default/callhome inside CT
          {{ bridge_ct_id }} — kiosk_configure may have overwritten it.
      when: _fleet_api_ready is defined

    - name: Report bridge LXC verification
      ansible.builtin.debug:
        msg: >-
          Bridge LXC verification passed on {{ inventory_hostname }}:
          container={{ bridge_ct_id }}, running=yes,
          hookscript=deployed, batman_tooling=yes

# ── Play 8: Home Assistant health (service_nodes) ────────────────
# Deep HA checks (Docker install, Compose, cgroupfs, HA image, IP offset)
# live in molecule/homeassistant-lxc/verify.yml.

- name: Verify Home Assistant LXC on service nodes
  hosts: service_nodes
  gather_facts: false
  vars:
    _api_base: "http://127.0.0.1:{{ lookup('env', 'WEBUI_PORT') | default('52500', true) }}"
  tasks:
    - name: Read Home Assistant container state and config
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          pct status {{ homeassistant_ct_id }}
          pct config {{ homeassistant_ct_id }}
        executable: /bin/bash
      register: ha_ct_cfg
      changed_when: false

    - name: Assert Home Assistant container is running with correct config
      ansible.builtin.assert:
        that:
          - "'running' in ha_ct_cfg.stdout"
          - "'onboot: 1' in ha_ct_cfg.stdout"
          - ha_ct_cfg.stdout is regex('startup:.*order=5')
          - "'nesting=1' in ha_ct_cfg.stdout"
        fail_msg: "Home Assistant container {{ homeassistant_ct_id }} config incorrect on {{ inventory_hostname }}"

    - name: Query Home Assistant extensions from API
      ansible.builtin.uri:
        url: "{{ _api_base }}/api/container/homeassistant/ready"
        return_content: true
      register: _ha_api
      delegate_to: localhost

    - name: Assert Docker active from API extensions
      ansible.builtin.assert:
        that:
          - _ha_api.json.ready | default(false) | bool
          - _ha_api.json.extensions.docker.active | default(false) | bool
          - _ha_api.json.extensions.docker.running | default(0) | int >= 1
        fail_msg: "HA Docker not active via API on {{ inventory_hostname }}: {{ _ha_api.json | default({}) }}"

    - name: Assert HA service present via heartbeat (no SSH)
      ansible.builtin.assert:
        that:
          - _ha_api.json.systemd_services['homeassistant-compose'] | default('') != ''
        fail_msg: >-
          HARD FAILURE: Home Assistant compose service not detected via heartbeat on {{ inventory_hostname }}.
          Services: {{ _ha_api.json.systemd_services | default({}) }}.
          INVESTIGATE: Rebuild HA image with homeassistant-compose.service baked in.

    - name: Assert stamp contains homeassistant_lxc
      ansible.builtin.assert:
        that: "'homeassistant_lxc' in stamp.plays"
        fail_msg: "deploy_stamp missing homeassistant_lxc entry"

# ── Play 9: Media services health (media_nodes + streaming_nodes) ──
# Deep Jellyfin checks (VA-API, media path, port, web UI, IP offset)
# live in molecule/jellyfin-lxc/verify.yml.
# Deep Kodi checks (packages, device mounts, config files, ALSA)
# live in molecule/kodi-lxc/verify.yml.
# Deep Moonlight checks (VA-API, config, DRI, vainfo)
# live in molecule/moonlight-lxc/verify.yml.

- name: Verify media services on media nodes
  hosts: media_nodes
  gather_facts: false
  vars:
    _api_base: "http://127.0.0.1:{{ lookup('env', 'WEBUI_PORT') | default('52500', true) }}"
  tasks:
    - name: Read Jellyfin container state and config
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          pct status {{ jellyfin_ct_id }}
          pct config {{ jellyfin_ct_id }}
        executable: /bin/bash
      register: _jellyfin_cfg
      changed_when: false

    - name: Assert Jellyfin container is running with correct config
      ansible.builtin.assert:
        that:
          - "'running' in _jellyfin_cfg.stdout"
          - "'onboot: 1' in _jellyfin_cfg.stdout"
          - _jellyfin_cfg.stdout is regex('startup:.*order=5')
          - _jellyfin_cfg.stdout is regex('lxc\\.mount\\.entry.*dev/dri')
        fail_msg: "Jellyfin container {{ jellyfin_ct_id }} config incorrect on {{ inventory_hostname }}"

    - name: Query Jellyfin readiness from API
      ansible.builtin.uri:
        url: "{{ _api_base }}/api/container/jellyfin/ready"
        return_content: true
      register: _jellyfin_api
      delegate_to: localhost

    - name: Assert Jellyfin via API (heartbeat + HTTP probe)
      ansible.builtin.assert:
        that:
          - _jellyfin_api.json.ready | default(false) | bool
          - _jellyfin_api.json.systemd_services['jellyfin.service'] | default('') in ['active', 'running']
            or _jellyfin_api.json.systemd_services['jellyfin'] | default('') in ['active', 'running']
        fail_msg: "Jellyfin not ready via API: {{ _jellyfin_api.json | default({}) }}"

    - name: Verify Jellyfin baked content
      ansible.builtin.shell:
        cmd: >-
          pct exec {{ jellyfin_ct_id }} -- /bin/sh -c '
          echo "RENDER=$(getent group render >/dev/null 2>&1 && echo yes || echo no)";
          echo "CONFDIR=$(test -d /etc/jellyfin && echo yes || echo no)";
          echo "NETWORK=$(test -f /etc/jellyfin/network.xml && echo yes || echo no)";
          echo "LIBRARY=$(test -f /etc/jellyfin/library.xml && echo yes || echo no)";
          echo "ENABLED=$(systemctl is-enabled jellyfin 2>/dev/null || echo missing)"
          '
      register: _jellyfin_baked
      changed_when: false

    - name: Assert Jellyfin baked content present
      ansible.builtin.assert:
        that:
          - "'RENDER=yes' in _jellyfin_baked.stdout"
          - "'CONFDIR=yes' in _jellyfin_baked.stdout"
          - "'NETWORK=yes' in _jellyfin_baked.stdout"
          - "'LIBRARY=yes' in _jellyfin_baked.stdout"
          - "'ENABLED=enabled' in _jellyfin_baked.stdout"
        fail_msg: "Jellyfin baked content missing: {{ _jellyfin_baked.stdout }}"

    - name: Assert stamp contains jellyfin_lxc
      ansible.builtin.assert:
        that: "'jellyfin_lxc' in stamp.plays"
        fail_msg: "deploy_stamp missing jellyfin_lxc entry"

    # ── Kodi ───────────────────────────────────────────────────────

    - name: Read Kodi container state and config
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          pct status {{ kodi_ct_id }}
          pct config {{ kodi_ct_id }}
        executable: /bin/bash
      register: _kodi_cfg
      changed_when: false

    - name: Assert Kodi container exists with correct config
      ansible.builtin.assert:
        that:
          - "'status: ' in _kodi_cfg.stdout"
          - "'onboot: 0' in _kodi_cfg.stdout"
        fail_msg: "Kodi container {{ kodi_ct_id }} config incorrect on {{ inventory_hostname }}"

    - name: Query Kodi readiness from API
      ansible.builtin.uri:
        url: "{{ _api_base }}/api/container/kodi/ready"
        return_content: true
      register: _kodi_api
      delegate_to: localhost
      failed_when: false

    - name: Assert Kodi ready via API (or stopped by display-exclusive hookscript)
      ansible.builtin.assert:
        that:
          - _kodi_api.json.ready | default(false) | bool
        fail_msg: "Kodi not ready via API: {{ _kodi_api.json | default({}) }}"
      when: "'running' in _kodi_cfg.stdout"

    - name: Check if Desktop container is running (display-exclusive stops Kodi)
      ansible.builtin.command:
        cmd: pct status {{ desktop_ct_id }}
      register: _desktop_status
      changed_when: false
      failed_when: false

    - name: Assert Kodi is running OR stopped by display-exclusive hookscript
      ansible.builtin.assert:
        that: >-
          'running' in _kodi_cfg.stdout or
          ('stopped' in _kodi_cfg.stdout and 'running' in (_desktop_status.stdout | default('')))
        fail_msg: >-
          Kodi container {{ kodi_ct_id }} is stopped but Desktop container is not running —
          expected either Kodi running or Kodi stopped due to display-exclusive hookscript

    - name: Verify Kodi baked content (when container is running)
      ansible.builtin.shell:
        cmd: >-
          pct exec {{ kodi_ct_id }} -- /bin/sh -c '
          echo "GUISETTINGS=$(test -f /home/kodi/.kodi/userdata/guisettings.xml && echo yes || echo no)";
          echo "DISPLAY_SVC=$(systemctl is-enabled kodi-display 2>/dev/null || echo missing)";
          echo "KASMVNC=$(dpkg -l kasmvncserver >/dev/null 2>&1 && echo yes || echo no)"
          '
      register: _kodi_baked
      changed_when: false
      when: "'running' in _kodi_cfg.stdout"

    - name: Assert Kodi baked content present
      ansible.builtin.assert:
        that:
          - "'GUISETTINGS=yes' in _kodi_baked.stdout"
          - "'DISPLAY_SVC=enabled' in _kodi_baked.stdout"
          - "'KASMVNC=yes' in _kodi_baked.stdout"
        fail_msg: "Kodi KasmVNC display baked content missing: {{ _kodi_baked.stdout }}"
      when: "'running' in _kodi_cfg.stdout"

    - name: Check kodi-display-proxy service on host
      ansible.builtin.command:
        cmd: systemctl is-active kodi-display-proxy
      register: _kodi_display_proxy
      changed_when: false
      failed_when: false

    - name: Assert kodi-display-proxy is running
      ansible.builtin.assert:
        that: "'active' in _kodi_display_proxy.stdout"
        fail_msg: "kodi-display-proxy not active on {{ inventory_hostname }}"
      when: "'running' in _kodi_cfg.stdout"

    - name: Assert stamp contains kodi_lxc
      ansible.builtin.assert:
        that: "'kodi_lxc' in stamp.plays"
        fail_msg: "deploy_stamp missing kodi_lxc entry"

