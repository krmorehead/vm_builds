# ── Play 12: Kiosk health (kiosk_nodes) ──────────────────────────
# Deep Kiosk checks (Cage, Chromium, dashboard file, systemd service)
# live in molecule/kiosk-lxc/verify.yml.

- name: Verify Kiosk on kiosk nodes
  hosts: kiosk_nodes
  gather_facts: false
  vars:
    _api_base: "http://127.0.0.1:{{ lookup('env', 'WEBUI_PORT') | default('52500', true) }}"
  tasks:
    - name: Read Kiosk container state and config
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          pct status {{ kiosk_ct_id }}
          pct config {{ kiosk_ct_id }}
        executable: /bin/bash
      register: _kiosk_cfg
      changed_when: false

    - name: Assert Kiosk container config is correct
      ansible.builtin.assert:
        that:
          - "'status: ' in _kiosk_cfg.stdout"
          - "'onboot: 1' in _kiosk_cfg.stdout"
          - _kiosk_cfg.stdout is regex('startup:.*order=6')
        fail_msg: "Kiosk container {{ kiosk_ct_id }} config incorrect on {{ inventory_hostname }}"

    - name: Verify DRI passthrough in Kiosk config
      ansible.builtin.assert:
        that:
          - _kiosk_cfg.stdout is regex('lxc\\.mount\\.entry.*dev/dri')
        fail_msg: >-
          HARD FAILURE: Kiosk container {{ kiosk_ct_id }} missing DRI passthrough on {{ inventory_hostname }}.
          INVESTIGATE: Run 'pct config {{ kiosk_ct_id }}' on {{ inventory_hostname }} and check for
          lxc.mount.entry lines with /dev/dri. If missing, the display-exclusive hookscript did not
          attach DRI devices. Check hookscript logs: journalctl -u pvedaemon on {{ inventory_hostname }}.
          Config: {{ _kiosk_cfg.stdout_lines | select('match', '.*lxc\\.mount') | list }}

    - name: Check if Desktop container is running (display-exclusive stops Kiosk)
      ansible.builtin.command:
        cmd: pct status {{ desktop_ct_id }}
      register: _desktop_status_for_kiosk
      changed_when: false
      failed_when: false

    - name: Assert Kiosk is running OR stopped by display-exclusive hookscript
      ansible.builtin.assert:
        that: >-
          'running' in _kiosk_cfg.stdout or
          ('stopped' in _kiosk_cfg.stdout and 'running' in (_desktop_status_for_kiosk.stdout | default('')))
        fail_msg: >-
          Kiosk container {{ kiosk_ct_id }} is stopped but Desktop container is not running —
          expected either Kiosk running or Kiosk stopped due to display-exclusive hookscript

    - name: Query kiosk extensions from API
      ansible.builtin.uri:
        url: "{{ _api_base }}/api/container/kiosk/ready"
        return_content: true
      register: _kiosk_api
      delegate_to: localhost

    - name: Assert Kiosk ready via API
      ansible.builtin.assert:
        that:
          - _kiosk_api.json.ready | default(false) | bool
        fail_msg: "Kiosk not ready via API: {{ _kiosk_api.json | default({}) }}"
      when: "'running' in _kiosk_cfg.stdout"

    - name: Assert kiosk heartbeat reports config_files extension
      ansible.builtin.assert:
        that:
          - (_kiosk_api.json.extensions.config_files | default(none)) is not none
        fail_msg: >-
          HARD FAILURE: Kiosk on {{ inventory_hostname }} is NOT reporting config_files
          via heartbeat. INVESTIGATE: Check that CALLHOME_CONFIG_FILES=/opt/kiosk/config.json
          is set in /etc/default/callhome inside the kiosk container (CT {{ kiosk_ct_id }}).
          Then restart callhome: pct exec {{ kiosk_ct_id }} -- systemctl restart callhome.
          If missing, rebuild kiosk image with updated inject_callhome_agent.
      when: "'running' in _kiosk_cfg.stdout"

    - name: Set kiosk config keys from heartbeat API
      ansible.builtin.set_fact:
        _kiosk_config_keys: "{{ _kiosk_api.json.extensions.config_files['/opt/kiosk/config.json']['keys'] }}"
      when:
        - "'running' in _kiosk_cfg.stdout"
        - (_kiosk_api.json.extensions.config_files | default(none)) is not none

    - name: Assert kiosk config has all service URL and 4-tier keys
      ansible.builtin.assert:
        that:
          - "'MANAGEMENT_SERVER' in _kiosk_config_keys"
          - "'CALLHOME_PUBLIC_KEY' in _kiosk_config_keys"
          - "'HOST_NAME' in _kiosk_config_keys"
          - "'HOST_IP' in _kiosk_config_keys"
        fail_msg: >-
          HARD FAILURE: Kiosk config missing required keys on {{ inventory_hostname }}.
          Got keys: {{ _kiosk_config_keys }}. INVESTIGATE: Check config.json was pushed
          by kiosk_configure. Run: pct exec {{ kiosk_ct_id }} -- cat /opt/kiosk/config.json
      when: _kiosk_config_keys is defined

    - name: Query kiosk config via NM API over VPN (no SSH — 4-tier architecture)
      ansible.builtin.uri:
        url: "http://{{ vpn_ip }}:{{ kiosk_manager_port | default(9001) }}/api/config/self"
        return_content: true
        timeout: 15
      register: _kiosk_config_api
      delegate_to: localhost

    - name: Set 4-tier config facts from API
      ansible.builtin.set_fact:
        _kiosk_is_cm: "{{ _kiosk_config_api.json.IS_CLUSTER_MANAGER | default('') }}"
        _kiosk_mgmt_server: "{{ _kiosk_config_api.json.MANAGEMENT_SERVER | default('') }}"

    - name: Assert ClusterManager (router_nodes) points to SuperManager
      ansible.builtin.assert:
        that:
          - _kiosk_is_cm | string | lower in ['true', '1', 'yes']
          - _kiosk_mgmt_server is search(lookup('env', 'WEBUI_PORT') | default('52500', true))
        fail_msg: >-
          HARD FAILURE: ClusterManager on {{ inventory_hostname }} has wrong 4-tier config.
          IS_CLUSTER_MANAGER={{ _kiosk_is_cm }},
          MANAGEMENT_SERVER={{ _kiosk_mgmt_server }}.
          INVESTIGATE: Check kiosk_configure pushed correct config.json.
          Expected IS_CLUSTER_MANAGER=true and MANAGEMENT_SERVER pointing to SM port.
      when: "'router_nodes' in group_names"

    - name: Assert NodeManagers (non-router) point to ClusterManager (kiosk port)
      ansible.builtin.assert:
        that:
          - _kiosk_is_cm | string | lower in ['false', '0', 'no', '']
          - _kiosk_mgmt_server is search(':9001')
        fail_msg: >-
          HARD FAILURE: NodeManager on {{ inventory_hostname }} has wrong 4-tier config.
          IS_CLUSTER_MANAGER={{ _kiosk_is_cm }},
          MANAGEMENT_SERVER={{ _kiosk_mgmt_server }}.
          INVESTIGATE: Check kiosk_configure pushed correct config.json.
          Expected IS_CLUSTER_MANAGER=false and MANAGEMENT_SERVER pointing to CM port 9001.
      when: "'router_nodes' not in group_names"

    - name: Check display-exclusive hookscript exists
      ansible.builtin.stat:
        path: /var/lib/vz/snippets/display-exclusive.sh
      register: _hookscript_verify

    - name: Assert display-exclusive hookscript deployed
      ansible.builtin.assert:
        that: _hookscript_verify.stat.exists
        fail_msg: "Display-exclusive hookscript missing on {{ inventory_hostname }}"

    - name: Assert stamp contains kiosk_lxc
      ansible.builtin.assert:
        that: "'kiosk_lxc' in stamp.plays"
        fail_msg: "deploy_stamp missing kiosk_lxc entry"

    - name: Assert kiosk heartbeat reports display service running
      ansible.builtin.assert:
        that:
          - _kiosk_api.json.systemd_services['kiosk-display'] | default('') in ['running', 'active']
        fail_msg: >-
          HARD FAILURE: KasmVNC display service not running on {{ inventory_hostname }}.
          Heartbeat reports: {{ _kiosk_api.json.systemd_services | default({}) }}.
          INVESTIGATE: SSH to host, run: pct exec {{ kiosk_ct_id }} -- systemctl status kiosk-display.
          If missing, rebuild kiosk image with kiosk-display unit baked in.

    - name: Verify kiosk-manager-proxy is active
      ansible.builtin.command:
        cmd: systemctl is-active kiosk-manager-proxy
      register: _mgr_proxy
      changed_when: false
      failed_when: _mgr_proxy.stdout | default('') | trim != 'active'

    - name: Verify kiosk-display-proxy is active
      ansible.builtin.command:
        cmd: systemctl is-active kiosk-display-proxy
      register: _display_proxy
      changed_when: false
      failed_when: _display_proxy.stdout | default('') | trim != 'active'

    - name: Verify VPN subnet route exists on host
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ip route show {{ vpn_subnet }} | grep -c via || echo 0
        executable: /bin/bash
      register: _vpn_route
      changed_when: false

    - name: Assert VPN route is configured
      ansible.builtin.assert:
        that: (_vpn_route.stdout | trim | int) > 0
        fail_msg: "Missing VPN subnet route on {{ inventory_hostname }}. WireGuard routing not configured."

