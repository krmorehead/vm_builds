---
- name: Build Jellyfin image
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Build Jellyfin image if not cached
      ansible.builtin.command:
        cmd: >-
          {{ playbook_dir }}/../../scripts/build-images.sh
          --host {{ lookup('env', 'PRIMARY_HOST') }}
          --only jellyfin
      register: _build
      changed_when: "'already exists' not in _build.stdout"
