---
- name: Reconstruct moonlight dynamic group
  hosts: streaming_nodes
  gather_facts: false
  tasks:
    - name: Include group reconstruction
      ansible.builtin.include_tasks: ../../tasks/reconstruct_moonlight_group.yml

- name: Container readiness gate
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Query moonlight readiness from API
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ lookup('env', 'WEBUI_PORT') | default('40500', true) }}/api/container/moonlight/ready"
        return_content: true
      register: _container_api
      failed_when: false

    - name: Set API readiness fact
      ansible.builtin.set_fact:
        _container_api_ready: "{{ (_container_api.json.ready | default(false)) | bool }}"

    - name: Report readiness path
      ansible.builtin.debug:
        msg: "{{ 'API ready — skipping SSH health checks' if (_container_api_ready | bool) else 'SSH fallback mode' }}"

- name: Verify Moonlight LXC container
  hosts: streaming_nodes
  gather_facts: false
  vars:
    moonlight_ct_id: 302
    _api_ready: "{{ hostvars['localhost']._container_api_ready | default(false) | bool }}"
  tasks:
    # ── Container state ──────────────────────────────────────────

    - name: Read container state and config
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          pct status {{ moonlight_ct_id }}
          pct config {{ moonlight_ct_id }}
        executable: /bin/bash
      register: _moonlight_cfg
      changed_when: false

    - name: Assert container is running
      ansible.builtin.assert:
        that: "'running' in _moonlight_cfg.stdout"
        fail_msg: "Container {{ moonlight_ct_id }} is not running"

    - name: Assert onboot is disabled (on-demand container)
      ansible.builtin.assert:
        that: "'onboot: 0' in _moonlight_cfg.stdout"
        fail_msg: "Container {{ moonlight_ct_id }} should have onboot: 0"

    # ── KasmVNC display stack ────────────────────────────────────

    - name: Check KasmVNC display stack inside container
      ansible.builtin.shell:
        cmd: >-
          pct exec {{ moonlight_ct_id }} -- /bin/sh -c '
          echo "SWAY=$(command -v sway >/dev/null 2>&1 && echo yes || echo no)";
          echo "VNCSERVER=$(command -v vncserver >/dev/null 2>&1 && echo yes || echo no)";
          echo "KASMVNC_PKG=$(dpkg-query -s kasmvncserver >/dev/null 2>&1 && echo yes || echo no)";
          echo "DISPLAY_SVC=$(systemctl is-enabled moonlight-display 2>/dev/null || echo missing)"
          '
      register: _moonlight_display_health
      changed_when: false

    - name: Assert KasmVNC display stack is present and enabled
      ansible.builtin.assert:
        that:
          - "'SWAY=no' in _moonlight_display_health.stdout"
          - "'VNCSERVER=yes' in _moonlight_display_health.stdout"
          - "'KASMVNC_PKG=yes' in _moonlight_display_health.stdout"
          - "'DISPLAY_SVC=enabled' in _moonlight_display_health.stdout"
        fail_msg: "KasmVNC display stack missing or not enabled: {{ _moonlight_display_health.stdout }}"

    # ── Moonlight binary and config ──────────────────────────────

    - name: Run Moonlight container health checks (single pct exec)
      ansible.builtin.shell:
        cmd: >-
          pct exec {{ moonlight_ct_id }} -- /bin/sh -c '
          echo "MOONLIGHT=$(test -x /usr/local/bin/moonlight && echo installed || echo missing)";
          echo "VAINFO=$(test -x /usr/bin/vainfo && echo installed || echo missing)";
          echo "CONFIG=$(test -f /etc/moonlight.conf && echo exists || echo missing)"
          '
      register: _moonlight_health
      changed_when: false
      when: not (_api_ready | bool)

    - name: Assert moonlight-embedded is installed
      ansible.builtin.assert:
        that: "'MOONLIGHT=installed' in _moonlight_health.stdout"
        fail_msg: "moonlight-embedded not installed"
      when: not (_api_ready | bool)

    - name: Assert vainfo is available
      ansible.builtin.assert:
        that: "'VAINFO=installed' in _moonlight_health.stdout"
        fail_msg: "vainfo not installed"
      when: not (_api_ready | bool)

    - name: Assert config file deployed
      ansible.builtin.assert:
        that: "'CONFIG=exists' in _moonlight_health.stdout"
        fail_msg: "Moonlight config file /etc/moonlight.conf not found"
      when: not (_api_ready | bool)

    # ── Container IP ─────────────────────────────────────────────

    - name: Get container IP
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          pct exec {{ moonlight_ct_id }} -- hostname -I | awk '{print $1}'
        executable: /bin/bash
      register: _moonlight_verify_ip
      changed_when: false

    - name: Validate container IP is non-empty
      ansible.builtin.assert:
        that: _moonlight_verify_ip.stdout | trim | length > 0
        fail_msg: "Moonlight container has no IP address"

    # ── Host-side display proxy ──────────────────────────────────

    - name: Check moonlight-display-proxy service on host
      ansible.builtin.command:
        cmd: systemctl is-active moonlight-display-proxy
      register: _moonlight_display_proxy
      changed_when: false
      failed_when: false

    - name: Assert moonlight-display-proxy is running
      ansible.builtin.assert:
        that: "'active' in _moonlight_display_proxy.stdout"
        fail_msg: "moonlight-display-proxy not active on {{ inventory_hostname }}"

    # ── Report ───────────────────────────────────────────────────

    - name: Report Moonlight verification
      ansible.builtin.debug:
        msg: >-
          Moonlight per-feature verify passed on {{ inventory_hostname }}:
          ct={{ moonlight_ct_id }}, running=yes,
          moonlight={{ 'api' if (_api_ready | bool) else ('installed' if 'MOONLIGHT=installed' in (_moonlight_health.stdout | default('')) else 'missing') }},
          config={{ 'api' if (_api_ready | bool) else ('deployed' if 'CONFIG=exists' in (_moonlight_health.stdout | default('')) else 'missing') }},
          display_stack={{ 'complete' if 'KASMVNC_PKG=yes' in _moonlight_display_health.stdout else 'incomplete' }},
          proxy={{ 'active' if 'active' in (_moonlight_display_proxy.stdout | default('')) else 'inactive' }},
          ip={{ _moonlight_verify_ip.stdout | trim }}
