---
- name: Reconstruct moonlight dynamic group
  hosts: streaming_nodes
  gather_facts: false
  tasks:
    - name: Include group reconstruction
      ansible.builtin.include_tasks: ../../tasks/reconstruct_moonlight_group.yml

- name: Verify Moonlight LXC container
  hosts: streaming_nodes
  gather_facts: false
  vars:
    moonlight_ct_id: 302
  tasks:
    # ── Container state ──────────────────────────────────────────

    - name: Check container is running
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          pct status {{ moonlight_ct_id }} | grep -c running
        executable: /bin/bash
      register: _moonlight_running
      changed_when: false

    - name: Assert container is running
      ansible.builtin.assert:
        that: (_moonlight_running.stdout | trim | int) > 0
        fail_msg: "Container {{ moonlight_ct_id }} is not running"

    # ── Container config (single read) ───────────────────────────

    - name: Read container config (single call)
      ansible.builtin.command:
        cmd: pct config {{ moonlight_ct_id }}
      register: _moonlight_cfg
      changed_when: false

    - name: Assert onboot is disabled (on-demand container)
      ansible.builtin.assert:
        that: "'onboot: 0' in _moonlight_cfg.stdout"
        fail_msg: "Container {{ moonlight_ct_id }} should have onboot: 0"

    # ── Device mounts ────────────────────────────────────────────

    - name: Check DRI devices are mounted
      ansible.builtin.command:
        cmd: pct exec {{ moonlight_ct_id }} -- ls /dev/dri/
      register: _dri_devices
      changed_when: false

    - name: Assert DRI devices exist
      ansible.builtin.assert:
        that: _dri_devices.rc == 0
        fail_msg: "DRI devices not mounted at /dev/dri/"

    - name: Check input devices are mounted
      ansible.builtin.command:
        cmd: pct exec {{ moonlight_ct_id }} -- ls /dev/input/
      register: _input_devices
      changed_when: false
      failed_when: false

    # ── lxc.mount.entry device bind mounts ────────────────────────

    - name: Check lxc.mount.entry device bind mounts
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          pct config {{ moonlight_ct_id }} | grep -c 'lxc.mount.entry.*dev/'
        executable: /bin/bash
      register: _mount_entries
      changed_when: false

    - name: Assert device bind mounts are configured
      ansible.builtin.assert:
        that: (_mount_entries.stdout | trim | int) >= 2
        fail_msg: "Expected at least 2 lxc.mount.entry device rules, got {{ _mount_entries.stdout | trim }}"

    # ── cgroup device allowlist ──────────────────────────────────

    - name: Check cgroup device allowlist
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          pct config {{ moonlight_ct_id }} | grep -c 'lxc.cgroup2.devices.allow'
        executable: /bin/bash
      register: _cgroup_rules
      changed_when: false

    - name: Assert cgroup allowlist has device rules
      ansible.builtin.assert:
        that: (_cgroup_rules.stdout | trim | int) >= 3
        fail_msg: "Expected at least 3 cgroup device rules, got {{ _cgroup_rules.stdout | trim }}"

    # ── Moonlight binary and config ──────────────────────────────

    - name: Run Moonlight container health checks (single pct exec)
      ansible.builtin.shell:
        cmd: >-
          pct exec {{ moonlight_ct_id }} -- /bin/sh -c '
          echo "MOONLIGHT=$(test -x /usr/local/bin/moonlight && echo installed || echo missing)";
          echo "VAINFO=$(test -x /usr/bin/vainfo && echo installed || echo missing)";
          echo "CONFIG=$(test -f /etc/moonlight.conf && echo exists || echo missing)"
          '
      register: _moonlight_health
      changed_when: false

    - name: Assert moonlight-embedded is installed
      ansible.builtin.assert:
        that: "'MOONLIGHT=installed' in _moonlight_health.stdout"
        fail_msg: "moonlight-embedded not installed"

    - name: Assert vainfo is available
      ansible.builtin.assert:
        that: "'VAINFO=installed' in _moonlight_health.stdout"
        fail_msg: "vainfo not installed"

    - name: Assert config file deployed
      ansible.builtin.assert:
        that: "'CONFIG=exists' in _moonlight_health.stdout"
        fail_msg: "Moonlight config file /etc/moonlight.conf not found"

    # ── VA-API decode ────────────────────────────────────────────

    - name: Check VA-API decode availability
      ansible.builtin.command:
        cmd: pct exec {{ moonlight_ct_id }} -- vainfo --display drm
      register: _vaapi_verify
      changed_when: false
      failed_when: false

    # ── Container IP ─────────────────────────────────────────────

    - name: Get container IP
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          pct exec {{ moonlight_ct_id }} -- hostname -I | awk '{print $1}'
        executable: /bin/bash
      register: _moonlight_verify_ip
      changed_when: false

    - name: Validate container IP is non-empty
      ansible.builtin.assert:
        that: _moonlight_verify_ip.stdout | trim | length > 0
        fail_msg: "Moonlight container has no IP address"

    # ── Report ───────────────────────────────────────────────────

    - name: Report Moonlight verification
      ansible.builtin.debug:
        msg: >-
          Moonlight per-feature verify passed on {{ inventory_hostname }}:
          ct={{ moonlight_ct_id }}, running=yes,
          moonlight={{ 'installed' if 'MOONLIGHT=installed' in _moonlight_health.stdout else 'missing' }},
          config={{ 'deployed' if 'CONFIG=exists' in _moonlight_health.stdout else 'missing' }},
          vaapi={{ 'hardware' if 'VAProfile' in (_vaapi_verify.stdout | default('')) else 'software' }},
          dri={{ 'mounted' if _dri_devices.rc == 0 else 'missing' }},
          ip={{ _moonlight_verify_ip.stdout | trim }}
