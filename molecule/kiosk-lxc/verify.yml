---
- name: Reconstruct kiosk dynamic group
  hosts: kiosk_nodes
  gather_facts: false
  tasks:
    - name: Include group reconstruction
      ansible.builtin.include_tasks: ../../tasks/reconstruct_kiosk_group.yml

- name: Container readiness gate
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Query kiosk readiness from API
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ lookup('env', 'WEBUI_PORT') | default('52500', true) }}/api/container/kiosk/ready"
        return_content: true
      register: _container_api
      failed_when: false

    - name: Set API readiness fact
      ansible.builtin.set_fact:
        _container_api_ready: "{{ (_container_api.json.ready | default(false)) | bool }}"

    - name: Report readiness path
      ansible.builtin.debug:
        msg: "{{ 'API ready — skipping SSH health checks' if (_container_api_ready | bool) else 'SSH fallback mode' }}"

- name: Verify Kiosk LXC container
  hosts: kiosk_nodes
  gather_facts: false
  vars:
    kiosk_ct_id: 401
    _api_ready: "{{ hostvars['localhost']._container_api_ready | default(false) | bool }}"
  tasks:
    # ── Container state ──────────────────────────────────────────

    - name: Read container state and config
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          pct status {{ kiosk_ct_id }}
          pct config {{ kiosk_ct_id }}
        executable: /bin/bash
      register: _kiosk_cfg
      changed_when: false

    - name: Assert container is running
      ansible.builtin.assert:
        that: "'running' in _kiosk_cfg.stdout"
        fail_msg: "Container {{ kiosk_ct_id }} is not running"

    - name: Assert onboot is enabled (default display state)
      ansible.builtin.assert:
        that: "'onboot: 1' in _kiosk_cfg.stdout"
        fail_msg: "Container {{ kiosk_ct_id }} should have onboot: 1"

    - name: Assert startup order is 6
      ansible.builtin.assert:
        that: _kiosk_cfg.stdout is regex('startup:.*order=6')
        fail_msg: "Container {{ kiosk_ct_id }} should have startup order=6"

    # ── Device mounts ────────────────────────────────────────────

    - name: Check DRI devices are mounted
      ansible.builtin.command:
        cmd: pct exec {{ kiosk_ct_id }} -- ls /dev/dri/
      register: _dri_devices
      changed_when: false

    - name: Assert DRI devices exist
      ansible.builtin.assert:
        that: _dri_devices.rc == 0
        fail_msg: "DRI devices not mounted at /dev/dri/"

    - name: Assert device bind mount is configured
      ansible.builtin.assert:
        that: _kiosk_cfg.stdout is regex('lxc\\.mount\\.entry.*dev/dri')
        fail_msg: "Expected lxc.mount.entry device rule for /dev/dri"

    # ── Kiosk packages, service, and dashboard ───────────────────

    - name: Run Kiosk container health checks (packages, files, user)
      ansible.builtin.shell:
        cmd: >-
          pct exec {{ kiosk_ct_id }} -- /bin/sh -c '
          echo "CHROMIUM_PKG=$(dpkg -l chromium 2>/dev/null | grep -c ^ii)";
          echo "CONFIG=$(test -f /opt/kiosk/config.json && echo yes || echo no)";
          echo "SERVER=$(test -f /opt/kiosk/webui/kiosk_server.py && echo yes || echo no)";
          echo "HUB=$(test -f /opt/kiosk/webui/pages/hub.py && echo yes || echo no)";
          echo "KIOSK_USER=$(id kiosk 2>/dev/null && echo exists || echo missing)"
          '
      register: _kiosk_health
      changed_when: false

    - name: Run Kiosk systemd service enablement checks
      ansible.builtin.shell:
        cmd: >-
          pct exec {{ kiosk_ct_id }} -- /bin/sh -c '
          echo "DISPLAY_SVC=$(systemctl is-enabled kiosk-display 2>/dev/null || echo disabled)";
          echo "WEB_SVC=$(systemctl is-enabled kiosk-web 2>/dev/null || echo disabled)";
          '
      register: _kiosk_services
      changed_when: false
      when: not (_api_ready | bool)

    - name: Assert Chromium is installed
      ansible.builtin.assert:
        that: "'CHROMIUM_PKG=1' in _kiosk_health.stdout"
        fail_msg: "chromium package not installed"

    - name: Assert kiosk-display service is enabled
      ansible.builtin.assert:
        that: "'DISPLAY_SVC=enabled' in _kiosk_services.stdout"
        fail_msg: "kiosk-display service not enabled"
      when: not (_api_ready | bool)

    - name: Assert kiosk-web service is enabled
      ansible.builtin.assert:
        that: "'WEB_SVC=enabled' in _kiosk_services.stdout"
        fail_msg: "kiosk-web service not enabled"
      when: not (_api_ready | bool)

    - name: Assert NiceGUI kiosk files present
      ansible.builtin.assert:
        that:
          - "'CONFIG=yes' in _kiosk_health.stdout"
          - "'SERVER=yes' in _kiosk_health.stdout"
          - "'HUB=yes' in _kiosk_health.stdout"
        fail_msg: "NiceGUI kiosk files missing"

    - name: Assert kiosk user exists
      ansible.builtin.assert:
        that: "'KIOSK_USER=exists' in _kiosk_health.stdout or 'uid=' in _kiosk_health.stdout"
        fail_msg: "kiosk user not found"

    # ── Kiosk config verification ──────────────────────────────

    - name: Read kiosk config.json from container
      ansible.builtin.command:
        cmd: pct exec {{ kiosk_ct_id }} -- cat /opt/kiosk/config.json
      register: _kiosk_config
      changed_when: false

    - name: Assert kiosk config has all service URL keys
      ansible.builtin.assert:
        that:
          - "'DESKTOP_URL' in _kiosk_config.stdout"
          - "'JELLYFIN_URL' in _kiosk_config.stdout"
          - "'KODI_URL' in _kiosk_config.stdout"
          - "'HOMEASSISTANT_URL' in _kiosk_config.stdout"
          - "'MOONLIGHT_URL' in _kiosk_config.stdout"
          - "'GAMING_URL' in _kiosk_config.stdout"
          - "'OPENWRT_URL' in _kiosk_config.stdout"
          - "'PIHOLE_URL' in _kiosk_config.stdout"
          - "'WIREGUARD_URL' in _kiosk_config.stdout"
          - "'NETDATA_URL' in _kiosk_config.stdout"
          - "'RSYSLOG_URL' in _kiosk_config.stdout"
          - "'HOST_IP' in _kiosk_config.stdout"
          - "'NODE_IPS' in _kiosk_config.stdout"
        fail_msg: "Kiosk config missing service URLs or HOST_IP"

    # ── SSH key for host management ─────────────────────────────

    - name: Verify SSH key exists in container
      ansible.builtin.shell:
        cmd: >-
          pct exec {{ kiosk_ct_id }} -- /bin/sh -c '
          echo "KEY=$(test -f /home/kiosk/.ssh/id_ed25519 && echo yes || echo no)";
          echo "PUB=$(test -f /home/kiosk/.ssh/id_ed25519.pub && echo yes || echo no)"
          '
      register: _kiosk_ssh
      changed_when: false

    - name: Assert SSH key pair exists
      ansible.builtin.assert:
        that:
          - "'KEY=yes' in _kiosk_ssh.stdout"
          - "'PUB=yes' in _kiosk_ssh.stdout"
        fail_msg: "Kiosk SSH key pair not generated"

    - name: Verify kiosk pubkey authorized on host
      ansible.builtin.command:
        cmd: pct exec {{ kiosk_ct_id }} -- cat /home/kiosk/.ssh/id_ed25519.pub
      register: _kiosk_pubkey
      changed_when: false

    - name: Check host authorized_keys contains kiosk key
      ansible.builtin.shell:
        cmd: grep -c "kiosk-manager" /root/.ssh/authorized_keys
        executable: /bin/bash
      register: _auth_check
      changed_when: false
      failed_when: _auth_check.rc > 1

    - name: Assert kiosk key is authorized
      ansible.builtin.assert:
        that: _auth_check.stdout | int > 0
        fail_msg: "Kiosk public key not in host authorized_keys"

    # ── Additional webui files ──────────────────────────────────

    - name: Verify webui pages deployed
      ansible.builtin.shell:
        cmd: >-
          pct exec {{ kiosk_ct_id }} -- /bin/sh -c '
          echo "VIEWER=$(test -f /opt/kiosk/webui/pages/viewer.py && echo yes || echo no)";
          echo "LAUNCH=$(test -f /opt/kiosk/webui/pages/launch.py && echo yes || echo no)";
          echo "CONTAINERS=$(test -f /opt/kiosk/webui/pages/containers.py && echo yes || echo no)"
          '
      register: _extra_pages
      changed_when: false

    - name: Assert new pages deployed
      ansible.builtin.assert:
        that:
          - "'VIEWER=yes' in _extra_pages.stdout"
          - "'LAUNCH=yes' in _extra_pages.stdout"
          - "'CONTAINERS=yes' in _extra_pages.stdout"
        fail_msg: "viewer.py, launch.py, or containers.py not deployed to kiosk"

    # ── Hookscript ──────────────────────────────────────────────

    - name: Check display-exclusive hookscript exists
      ansible.builtin.stat:
        path: /var/lib/vz/snippets/display-exclusive.sh
      register: _hookscript

    - name: Assert hookscript deployed
      ansible.builtin.assert:
        that: _hookscript.stat.exists
        fail_msg: "Display-exclusive hookscript not deployed"

    - name: Assert hookscript attached to container
      ansible.builtin.assert:
        that: "'hookscript' in _kiosk_cfg.stdout"
        fail_msg: "Hookscript not attached to container {{ kiosk_ct_id }}"

    - name: Read hookscript content
      ansible.builtin.slurp:
        path: /var/lib/vz/snippets/display-exclusive.sh
      register: _hookscript_content

    - name: Assert hookscript uses correct VMIDs from group_vars
      vars:
        _hookscript_text: "{{ _hookscript_content.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'{{ kodi_ct_id | string }}' in _hookscript_text"
          - "'{{ moonlight_ct_id | string }}' in _hookscript_text"
          - "'{{ desktop_ct_id | string }}' in _hookscript_text"
        fail_msg: "Hookscript must contain kodi, moonlight, and desktop VMIDs"

    - name: Assert kiosk is NOT in hookscript stop list
      vars:
        _hookscript_text: "{{ _hookscript_content.content | b64decode }}"
        _ct_ids_line: "{{ _hookscript_text | regex_search('CT_IDS=\\(([^)]+)\\)', '\\1') | first | default('') }}"
      ansible.builtin.assert:
        that:
          - "kiosk_ct_id | string not in _ct_ids_line"
        fail_msg: "Kiosk CT ID {{ kiosk_ct_id }} must NOT be in hookscript CT_IDS array"

    # ── KasmVNC display stack ───────────────────────────────────

    - name: Check KasmVNC display stack inside container
      ansible.builtin.shell:
        cmd: >-
          pct exec {{ kiosk_ct_id }} -- /bin/sh -c '
          echo "VNCSERVER=$(command -v vncserver >/dev/null 2>&1 && echo yes || echo no)";
          echo "KASM_PKG=$(dpkg -l kasmvncserver 2>/dev/null | grep -c ^ii)";
          echo "DISPLAY_SVC=$(systemctl is-enabled kiosk-display 2>/dev/null || echo disabled)"
          '
      register: _display_health
      changed_when: false

    - name: Assert KasmVNC display stack is present and enabled
      ansible.builtin.assert:
        that:
          - "'VNCSERVER=yes' in _display_health.stdout"
          - "'KASM_PKG=1' in _display_health.stdout"
          - "'DISPLAY_SVC=enabled' in _display_health.stdout"
        fail_msg: "KasmVNC display stack not properly baked: {{ _display_health.stdout }}"

    - name: Verify display WebSocket port forwarding exists (WAN hosts)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          iptables -t nat -S PREROUTING 2>/dev/null | grep -c '{{ kiosk_ws_port }}' || echo 0
        executable: /bin/bash
      register: _display_dnat_check
      changed_when: false
      when:
        - inventory_hostname not in groups.get('router_nodes', [])
        - inventory_hostname not in groups.get('lan_hosts', [])

    - name: Assert display DNAT rule exists on WAN hosts
      ansible.builtin.assert:
        that: (_display_dnat_check.stdout | trim | int) > 0
        fail_msg: "Missing display DNAT rule for port {{ kiosk_ws_port }} on {{ inventory_hostname }}"
      when:
        - inventory_hostname not in groups.get('router_nodes', [])
        - inventory_hostname not in groups.get('lan_hosts', [])

    - name: Verify display socat proxy on LAN hosts
      ansible.builtin.command:
        cmd: systemctl is-active kiosk-display-proxy
      register: _display_proxy_check
      changed_when: false
      failed_when: false
      when: inventory_hostname in groups.get('router_nodes', []) or inventory_hostname in groups.get('lan_hosts', [])

    - name: Assert display socat proxy active on LAN hosts
      ansible.builtin.assert:
        that: "'active' in _display_proxy_check.stdout"
        fail_msg: "display socat proxy (kiosk-display-proxy) not active on LAN host {{ inventory_hostname }}"
      when: inventory_hostname in groups.get('router_nodes', []) or inventory_hostname in groups.get('lan_hosts', [])

    # ── Report ──────────────────────────────────────────────────

    - name: Report Kiosk verification
      ansible.builtin.debug:
        msg: >-
          Kiosk per-feature verify passed:
          ct={{ kiosk_ct_id }}, running=yes,
          chromium={{ 'installed' if 'CHROMIUM_PKG=1' in _kiosk_health.stdout else 'missing' }},
          display_svc={{ 'api' if (_api_ready | bool) else ('enabled' if 'DISPLAY_SVC=enabled' in (_kiosk_services.stdout | default('')) else 'disabled') }},
          web_svc={{ 'api' if (_api_ready | bool) else ('enabled' if 'WEB_SVC=enabled' in (_kiosk_services.stdout | default('')) else 'disabled') }},
          dri={{ 'mounted' if _dri_devices.rc == 0 else 'missing' }},
          hookscript={{ 'deployed' if _hookscript.stat.exists else 'missing' }},
          kasm_display={{ 'baked'
            if ('VNCSERVER=yes' in _display_health.stdout
                and 'KASM_PKG=1' in _display_health.stdout
                and 'DISPLAY_SVC=enabled' in _display_health.stdout)
            else 'missing' }},
          config=present, nicegui=deployed
