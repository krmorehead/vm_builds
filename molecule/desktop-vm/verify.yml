---
- name: Verify Desktop LXC
  hosts: desktop_nodes
  gather_facts: false
  vars:
    _desktop_user: "{{ lookup('env', 'DESKTOP_USER') | default('desktop', true) }}"
  tasks:
    # ── Container existence and Proxmox-level config ───────────────
    - name: Check Desktop container is running
      ansible.builtin.command:
        cmd: pct status {{ desktop_ct_id }}
      register: _desktop_status
      changed_when: false

    - name: Assert Desktop container is running
      ansible.builtin.assert:
        that: "'running' in _desktop_status.stdout"
        fail_msg: "Desktop CT {{ desktop_ct_id }} is not running"

    - name: Read Desktop container config
      ansible.builtin.command:
        cmd: pct config {{ desktop_ct_id }}
      register: _desktop_config
      changed_when: false

    - name: Assert Proxmox container has DRI mount and nesting
      ansible.builtin.assert:
        that:
          - "'/dev/dri' in _desktop_config.stdout"
          - "'nesting' in _desktop_config.stdout"
        fail_msg: "Desktop CT config mismatch: expected DRI mount and nesting feature"

    # ── Batch system state check (single pct exec call) ────────────
    - name: Collect system state from container
      ansible.builtin.shell:
        cmd: |
          pct exec {{ desktop_ct_id }} -- bash -c '
          echo "DISPLAY_SVC=$(systemctl is-active desktop-display 2>/dev/null || echo inactive)"
          echo "DISPLAY_ENABLED=$(systemctl is-enabled desktop-display 2>/dev/null || echo disabled)"
          echo "CALLHOME_SVC=$(systemctl is-active callhome 2>/dev/null || echo inactive)"
          echo "DBUS_STATUS=$(systemctl is-active dbus 2>/dev/null || echo inactive)"
          echo "DRM_EXISTS=$(ls /dev/dri/renderD* >/dev/null 2>&1 && echo yes || echo no)"
          id {{ _desktop_user }}
          '
      register: _ct_system_state
      changed_when: false

    - name: Assert desktop-display service is active and enabled
      ansible.builtin.assert:
        that:
          - "'DISPLAY_SVC=active' in _ct_system_state.stdout"
          - "'DISPLAY_ENABLED=enabled' in _ct_system_state.stdout"
        fail_msg: "desktop-display service not active/enabled in container"

    - name: Assert callhome service is active
      ansible.builtin.assert:
        that: "'CALLHOME_SVC=active' in _ct_system_state.stdout"
        fail_msg: "callhome service not active in Desktop container"

    - name: Assert DRI render device exists in container
      ansible.builtin.assert:
        that: "'DRM_EXISTS=yes' in _ct_system_state.stdout"
        fail_msg: "No DRI render device found in Desktop container"

    - name: Assert desktop user has correct groups
      ansible.builtin.assert:
        that:
          - "'video' in _ct_system_state.stdout"
          - "'render' in _ct_system_state.stdout"
          - "'audio' in _ct_system_state.stdout"
          - "'sudo' in _ct_system_state.stdout"
        fail_msg: "Desktop user missing required groups"

    # ── Binary check (single pct exec call) ────────────────────────
    - name: Check required binaries in container
      ansible.builtin.shell:
        cmd: |
          pct exec {{ desktop_ct_id }} -- bash -c '
          for bin in firefox-esr vlc flameshot xfce4-session xfce4-terminal; do
            if which "$bin" >/dev/null 2>&1; then
              echo "BIN_OK=$bin"
            else
              echo "BIN_MISSING=$bin"
            fi
          done
          test -d /home/{{ _desktop_user }}/Downloads && \
          test -d /home/{{ _desktop_user }}/Pictures && \
          test -d /home/{{ _desktop_user }}/Documents && \
            echo "XDG_DIRS=ok" || echo "XDG_DIRS=missing"
          '
      register: _ct_binaries
      changed_when: false

    - name: Assert required binaries are installed
      ansible.builtin.assert:
        that:
          - "'BIN_OK=firefox-esr' in _ct_binaries.stdout"
          - "'BIN_OK=vlc' in _ct_binaries.stdout"
          - "'BIN_OK=flameshot' in _ct_binaries.stdout"
          - "'BIN_OK=xfce4-session' in _ct_binaries.stdout"
          - "'BIN_OK=xfce4-terminal' in _ct_binaries.stdout"
        fail_msg: "Missing binaries: {{ _ct_binaries.stdout_lines | select('match', 'BIN_MISSING=') | list }}"

    - name: Assert XDG directories exist
      ansible.builtin.assert:
        that: "'XDG_DIRS=ok' in _ct_binaries.stdout"
        fail_msg: "XDG user directories missing"

    # ── KasmVNC display service ────────────────────────────────────
    - name: Collect KasmVNC state from container
      ansible.builtin.shell:
        cmd: |
          pct exec {{ desktop_ct_id }} -- bash -c '
          echo "KASMVNC_PKG=$(dpkg -l kasmvncserver >/dev/null 2>&1 && echo yes || echo no)"
          test -f /home/{{ _desktop_user }}/.vnc/kasmvnc.yaml && echo "KASMVNC_CFG=yes" || echo "KASMVNC_CFG=no"
          test -x /home/{{ _desktop_user }}/.vnc/xstartup && echo "XSTARTUP=yes" || echo "XSTARTUP=no"
          '
      register: _ct_kasmvnc_state
      changed_when: false

    - name: Assert KasmVNC installed and configured
      ansible.builtin.assert:
        that:
          - "'KASMVNC_PKG=yes' in _ct_kasmvnc_state.stdout"
          - "'KASMVNC_CFG=yes' in _ct_kasmvnc_state.stdout"
          - "'XSTARTUP=yes' in _ct_kasmvnc_state.stdout"
        fail_msg: "KasmVNC not properly configured in Desktop container"

    # ── Host-side display proxy ────────────────────────────────────
    - name: Check desktop-display-proxy service on host
      ansible.builtin.command:
        cmd: systemctl is-active desktop-display-proxy
      register: _desktop_display_proxy
      changed_when: false
      failed_when: false

    - name: Assert desktop-display-proxy is running
      ansible.builtin.assert:
        that: "'active' in _desktop_display_proxy.stdout"
        fail_msg: "desktop-display-proxy not active on {{ inventory_hostname }}"

    # ── Deploy stamp ───────────────────────────────────────────────
    - name: Read deploy_stamp
      ansible.builtin.slurp:
        src: /etc/ansible/facts.d/vm_builds.fact
      register: _desktop_stamp_raw
      failed_when: false

    - name: Parse deploy_stamp
      ansible.builtin.set_fact:
        _desktop_stamp: "{{ (_desktop_stamp_raw.content | b64decode | from_json) if _desktop_stamp_raw is not failed else {} }}"

    - name: Assert stamp contains desktop_lxc
      ansible.builtin.assert:
        that: "'desktop_lxc' in (_desktop_stamp.plays | default({}))"
        fail_msg: "deploy_stamp missing desktop_lxc entry on {{ inventory_hostname }}"

    # ── Summary ────────────────────────────────────────────────────
    - name: Report Desktop LXC verification
      ansible.builtin.debug:
        msg: >-
          Desktop LXC verification passed on {{ inventory_hostname }}:
          ct={{ desktop_ct_id }}, running=yes,
          dri={{ 'ok' if 'DRM_EXISTS=yes' in _ct_system_state.stdout else 'missing' }},
          display={{ 'active' if 'DISPLAY_SVC=active' in _ct_system_state.stdout else 'inactive' }},
          kasmvnc={{ 'ok' if 'KASMVNC_PKG=yes' in _ct_kasmvnc_state.stdout else 'missing' }}
