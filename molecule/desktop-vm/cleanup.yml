---
- name: Destroy Desktop LXC
  hosts: desktop_nodes
  gather_facts: false
  tasks:
    - name: Check Desktop container exists
      ansible.builtin.command:
        cmd: pct status {{ desktop_ct_id }}
      register: _desktop_cleanup_status
      failed_when: false
      changed_when: false

    - name: Stop Desktop container
      ansible.builtin.command:
        cmd: pct stop {{ desktop_ct_id }}
      when: _desktop_cleanup_status.rc == 0 and 'running' in _desktop_cleanup_status.stdout
      failed_when: false
      changed_when: true

    - name: Wait for container to stop
      ansible.builtin.pause:
        seconds: 3
      when: _desktop_cleanup_status.rc == 0 and 'running' in _desktop_cleanup_status.stdout

    - name: Destroy Desktop container
      ansible.builtin.command:
        cmd: pct destroy {{ desktop_ct_id }} --purge
      when: _desktop_cleanup_status.rc == 0
      failed_when: false
      changed_when: true

    - name: Remove desktop-display-proxy service
      ansible.builtin.shell:
        cmd: |
          systemctl stop desktop-display-proxy 2>/dev/null || true
          systemctl disable desktop-display-proxy 2>/dev/null || true
          rm -f /etc/systemd/system/desktop-display-proxy.service
          systemctl daemon-reload
        executable: /bin/bash
      changed_when: true
      failed_when: false
