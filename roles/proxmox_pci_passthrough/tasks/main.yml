---
# ── Determine if host uses WiFi (MUST be first) ──────────────
# CRITICAL: On AMD APUs (Raven Ridge), ANY WiFi module load/unload
# triggers a PCIe device reset that destabilizes the NBIO, killing
# USB ethernet adapters hours later. Gate ALL WiFi operations on
# group membership — not hardware detection.

- name: Check if host uses WiFi
  ansible.builtin.set_fact:
    _host_uses_wifi: >-
      {{ ('router_nodes' in group_names) or
         ('wifi_nodes' in group_names) or
         ('bridge_nodes' in group_names) }}

# ── Load WiFi kernel modules (WiFi hosts only) ───────────────
# Ensure WiFi drivers are loaded BEFORE scanning for interfaces.
# Fresh hosts without prior vfio-pci bindings may have no WiFi
# driver loaded, causing interface detection to find nothing.

- name: Load common WiFi kernel modules
  ansible.builtin.shell:
    cmd: |
      for mod in iwlwifi ath9k ath10k_pci mt76 mt7921e rtw88_pci rtw89_pci; do
        modprobe "$mod" 2>/dev/null || true
      done
      sleep 2
    executable: /bin/bash
  changed_when: false
  when: _host_uses_wifi | bool

# ── Detect WiFi PCI controllers ──────────────────────────────
# Check for WiFi hardware via lspci before interface scan.
# Used for firmware verification if interfaces don't appear.

- name: Detect WiFi PCI controllers via lspci
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      lspci -nn 2>/dev/null | grep -i 'Network controller' || true
    executable: /bin/bash
  register: _wifi_pci_controllers
  changed_when: false

# ── Detect WiFi PCIe devices ──────────────────────────────────

- name: Find network interfaces with wireless capability
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      for iface in /sys/class/net/*/wireless; do
        [ -e "$iface" ] && basename "$(dirname "$iface")"
      done
    executable: /bin/bash
  register: wifi_ifaces_raw
  changed_when: false
  failed_when: false

# ── Early PHY check ──────────────────────────────────────────

- name: Count WiFi PHYs
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      find /sys/class/ieee80211 -mindepth 1 -maxdepth 1 -name 'phy*' -print 2>/dev/null | wc -l
    executable: /bin/bash
  register: _early_phy_count
  changed_when: false

- name: Install iw tool for WiFi PHY management
  ansible.builtin.apt:
    name: iw
    state: present
    cache_valid_time: 86400
  when:
    - _host_uses_wifi | bool
    - (_wifi_pci_controllers.stdout_lines | default([])) | length > 0

- name: Re-detect WiFi interfaces
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      for iface in /sys/class/net/*/wireless; do
        [ -e "$iface" ] && basename "$(dirname "$iface")"
      done
    executable: /bin/bash
  register: wifi_ifaces_raw
  changed_when: false
  failed_when: false
  when:
    - (wifi_ifaces_raw.stdout_lines | default([])) | length == 0
    - _wifi_pci_controllers.stdout is search('Intel')

- name: Set WiFi interface list
  ansible.builtin.set_fact:
    wifi_ifaces: "{{ wifi_ifaces_raw.stdout_lines | default([]) }}"

- name: Resolve PCI address for each WiFi interface
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      readlink -f /sys/class/net/{{ item }}/device | grep -oP '[0-9a-f]{2}:[0-9a-f]{2}\.[0-9a-f]' | tail -1
    executable: /bin/bash
  loop: "{{ wifi_ifaces }}"
  register: wifi_pci_raw
  changed_when: false
  when: wifi_ifaces | length > 0

- name: Build WiFi PCI device list
  ansible.builtin.set_fact:
    wifi_pci_devices: >-
      {{ wifi_pci_raw.results | default([])
         | selectattr('stdout', 'defined')
         | map(attribute='stdout')
         | map('trim')
         | select('match', '.+')
         | list }}

# ── Fallback: resolve PCI addresses from lspci when wireless
#    interfaces are absent (e.g., card on vfio-pci or driver re-probe
#    hasn't created an interface yet) ─────────────────────────────
- name: Resolve WiFi PCI addresses from lspci (fallback)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      lspci -D 2>/dev/null \
        | grep -i 'Network controller' \
        | awk '{print $1}' \
        | sed 's/^0000://'
    executable: /bin/bash
  register: _wifi_pci_lspci
  changed_when: false
  when:
    - wifi_pci_devices | length == 0
    - (_wifi_pci_controllers.stdout_lines | default([])) | length > 0

- name: Use lspci-derived PCI addresses when interface detection missed them
  ansible.builtin.set_fact:
    wifi_pci_devices: >-
      {{ _wifi_pci_lspci.stdout_lines | default([])
         | map('trim')
         | select('match', '.+')
         | list }}
  when:
    - wifi_pci_devices | length == 0
    - (_wifi_pci_lspci.stdout_lines | default([])) | length > 0

- name: Detect WiFi kernel driver for each device (via interface)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      basename "$(readlink -f /sys/class/net/{{ item }}/device/driver)"
    executable: /bin/bash
  loop: "{{ wifi_ifaces }}"
  register: wifi_driver_raw
  changed_when: false
  when: wifi_ifaces | length > 0

- name: Detect WiFi kernel driver for each device (via PCI address fallback)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      DRIVER=$(readlink -f /sys/bus/pci/devices/0000:{{ item }}/driver 2>/dev/null)
      if [ -n "$DRIVER" ]; then
        basename "$DRIVER"
      else
        echo ""
      fi
    executable: /bin/bash
  loop: "{{ wifi_pci_devices }}"
  register: _wifi_driver_pci_raw
  changed_when: false
  when:
    - wifi_ifaces | length == 0
    - wifi_pci_devices | length > 0

- name: Build auto-detected driver blacklist
  ansible.builtin.set_fact:
    _auto_driver_blacklist: >-
      {{ (wifi_driver_raw.results | default([]) + _wifi_driver_pci_raw.results | default([]))
         | selectattr('stdout', 'defined')
         | map(attribute='stdout')
         | map('trim')
         | select('match', '.+')
         | unique | list }}
  when: wifi_driver_blacklist | length == 0

- name: Set effective driver blacklist
  ansible.builtin.set_fact:
    _effective_blacklist: >-
      {{ wifi_driver_blacklist if wifi_driver_blacklist | length > 0
         else _auto_driver_blacklist | default([]) }}

# ── Rebind WiFi for consistent firmware regulatory state ─────
# iwlwifi's self-managed regulatory starts in country 00 with
# PASSIVE-SCAN on many bands. A sysfs rebind reinitializes the
# firmware regulatory state, enabling AP-capable channels on 6 GHz.

- name: Check if iwlwifi PHY has self-managed regulatory
  ansible.builtin.shell:
    cmd: iw reg get 2>/dev/null | grep -c 'self-managed' || echo 0
    executable: /bin/bash
  register: _iwlwifi_self_managed
  changed_when: false
  when:
    - _host_uses_wifi | bool

- name: Rebind WiFi devices for regulatory reinit (sysfs-only, no modprobe -r)
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/sysfs_wifi_rebind.yml"
  when:
    - _host_uses_wifi | bool
    - (_iwlwifi_self_managed.stdout | default('0') | trim | int) > 0

- name: Skip remaining tasks when no WiFi devices found
  ansible.builtin.debug:
    msg: "No WiFi PCIe devices detected on this host. Skipping PCI passthrough."
  when: wifi_pci_devices | length == 0

- name: Skip vfio binding on non-router hosts (WiFi used via PHY namespace move)
  ansible.builtin.debug:
    msg: >-
      WiFi detected ({{ wifi_pci_devices | join(', ') }}) but host is not in
      router_nodes. Skipping PCIe passthrough — WiFi will be available for
      LXC PHY namespace move.
  when:
    - wifi_pci_devices | length > 0
    - "'router_nodes' not in group_names"

# ── Clean stale vfio bindings on non-router hosts ─────────────
# A previous run may have bound WiFi to vfio-pci when this host was
# in router_nodes (or before the role skipped non-router hosts).
# Unbind and restore the original driver so WiFi PHY is available.

- name: Check for stale vfio-pci config on non-router host
  ansible.builtin.stat:
    path: /etc/modprobe.d/vfio-pci.conf
  register: _stale_vfio_conf
  when: "'router_nodes' not in group_names"

- name: Clean stale vfio-pci bindings on non-router host
  when:
    - "'router_nodes' not in group_names"
    - _stale_vfio_conf.stat.exists | default(false)
  block:
    - name: Remove stale WiFi driver blacklist
      ansible.builtin.file:
        path: /etc/modprobe.d/blacklist-wifi.conf
        state: absent

    - name: Remove stale vfio-pci config
      ansible.builtin.file:
        path: /etc/modprobe.d/vfio-pci.conf
        state: absent

    - name: Unbind WiFi devices from vfio-pci
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          for dev in /sys/bus/pci/drivers/vfio-pci/0000:*; do
            [ -e "$dev" ] && echo "$(basename $dev)" > /sys/bus/pci/drivers/vfio-pci/unbind 2>/dev/null || true
          done
        executable: /bin/bash
      changed_when: true

    - name: Rescan PCI bus after vfio cleanup
      ansible.builtin.shell:
        cmd: echo 1 > /sys/bus/pci/rescan
      changed_when: true

    - name: Update initramfs after removing stale vfio config
      ansible.builtin.command:
        cmd: update-initramfs -u -k all
      changed_when: true

# ── IOMMU setup (router_nodes only) ──────────────────────────
# Non-router hosts with WiFi skip IOMMU/vfio entirely. Their WiFi
# stays on the host driver for PHY namespace move into LXC containers.

- name: Check if IOMMU is active
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      # Primary check: IOMMU groups exist in sysfs (works regardless of
      # dmesg ring buffer state or kernel message format)
      GROUPS=$(find /sys/kernel/iommu_groups -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l)
      if [ "$GROUPS" -gt 0 ]; then
        echo "$GROUPS"
        exit 0
      fi
      # Fallback: dmesg patterns for older kernels
      dmesg | grep -i -c 'IOMMU enabled\|DMAR.*IOMMU\|Adding to iommu group' || echo "0"
    executable: /bin/bash
  register: iommu_check
  changed_when: false
  failed_when: false
  when:
    - wifi_pci_devices | length > 0
    - "'router_nodes' in group_names"

- name: Set IOMMU status fact
  ansible.builtin.set_fact:
    iommu_active: "{{ (iommu_check.stdout | default('0') | int) > 0 }}"
  when:
    - wifi_pci_devices | length > 0
    - "'router_nodes' in group_names"

- name: Detect CPU vendor for IOMMU parameter
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      grep -m1 'vendor_id' /proc/cpuinfo | awk '{print $3}'
    executable: /bin/bash
  register: cpu_vendor
  changed_when: false
  when:
    - wifi_pci_devices | length > 0
    - "'router_nodes' in group_names"
    - not iommu_active | bool

- name: Set IOMMU kernel parameter
  ansible.builtin.set_fact:
    _iommu_param: "{{ 'intel_iommu=on' if 'Intel' in cpu_vendor.stdout | default('') else 'amd_iommu=on' }}"
  when:
    - wifi_pci_devices | length > 0
    - "'router_nodes' in group_names"
    - not iommu_active | bool

- name: Add IOMMU to GRUB cmdline (preserving existing params)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      current=$(grep '^GRUB_CMDLINE_LINUX_DEFAULT=' /etc/default/grub | sed 's/^GRUB_CMDLINE_LINUX_DEFAULT="//;s/"$//')
      new="$current"
      for param in "{{ _iommu_param }}" "iommu=pt"; do
        echo "$new" | grep -q "$param" || new="$new $param"
      done
      cp /etc/default/grub /etc/default/grub.bak
      sed -i "s|^GRUB_CMDLINE_LINUX_DEFAULT=.*|GRUB_CMDLINE_LINUX_DEFAULT=\"${new}\"|" /etc/default/grub
    executable: /bin/bash
  when:
    - wifi_pci_devices | length > 0
    - "'router_nodes' in group_names"
    - not iommu_active | bool
  changed_when: true
  notify: Update grub

- name: Ensure VFIO modules are loaded at boot
  ansible.builtin.lineinfile:
    path: /etc/modules
    line: "{{ item }}"
    state: present
  loop:
    - vfio
    - vfio_iommu_type1
    - vfio_pci
  when:
    - wifi_pci_devices | length > 0
    - "'router_nodes' in group_names"
    - not iommu_active | bool
  notify: Update initramfs

- name: Flush handlers before potential reboot
  ansible.builtin.meta: flush_handlers
  when:
    - wifi_pci_devices | length > 0
    - "'router_nodes' in group_names"
    - not iommu_active | bool

- name: Fail if reboot is needed but not allowed
  ansible.builtin.fail:
    msg: >-
      IOMMU is not active and a reboot is required to enable it.
      Re-run with -e pci_passthrough_allow_reboot=true or reboot
      the Proxmox node manually and re-run.
  when:
    - wifi_pci_devices | length > 0
    - "'router_nodes' in group_names"
    - not iommu_active | bool
    - not pci_passthrough_allow_reboot | bool

- name: Reboot Proxmox to activate IOMMU
  ansible.builtin.reboot:
    reboot_timeout: 300
  when:
    - wifi_pci_devices | length > 0
    - "'router_nodes' in group_names"
    - not iommu_active | bool
    - pci_passthrough_allow_reboot | bool

- name: Re-check IOMMU status after reboot
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      find /sys/kernel/iommu_groups/ -maxdepth 1 -mindepth 1 -type d 2>/dev/null | wc -l
    executable: /bin/bash
  register: iommu_recheck
  changed_when: false
  when:
    - wifi_pci_devices | length > 0
    - "'router_nodes' in group_names"
    - not iommu_active | bool
    - pci_passthrough_allow_reboot | bool

- name: Update IOMMU status after reboot
  ansible.builtin.set_fact:
    iommu_active: "{{ (iommu_recheck.stdout | default('0') | int) > 0 }}"
  when:
    - wifi_pci_devices | length > 0
    - "'router_nodes' in group_names"
    - iommu_recheck is not skipped

- name: Fail if IOMMU is still not active after reboot
  ansible.builtin.fail:
    msg: >-
      IOMMU is not active after reboot on {{ inventory_hostname }}. WiFi PCI
      passthrough requires VT-d (Intel) or AMD-Vi enabled in BIOS/UEFI.
  when:
    - wifi_pci_devices | length > 0
    - "'router_nodes' in group_names"
    - not iommu_active | bool

# ── IOMMU group isolation check (router_nodes only) ──────────

- name: Read IOMMU group for each WiFi device
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      basename "$(readlink -f /sys/bus/pci/devices/0000:{{ item }}/iommu_group)"
    executable: /bin/bash
  loop: "{{ wifi_pci_devices }}"
  register: wifi_iommu_groups
  changed_when: false
  when:
    - wifi_pci_devices | length > 0
    - "'router_nodes' in group_names"

- name: Validate IOMMU group assignments are numeric
  ansible.builtin.set_fact:
    _iommu_groups_valid: >-
      {{ wifi_iommu_groups.results | default([])
         | map(attribute='stdout')
         | map('trim')
         | reject('match', '^\d+$')
         | list | length == 0 }}
  when:
    - wifi_pci_devices | length > 0
    - "'router_nodes' in group_names"

- name: Fail if IOMMU groups are not properly assigned
  ansible.builtin.fail:
    msg: >-
      WiFi device IOMMU groups resolved to non-numeric values
      ({{ wifi_iommu_groups.results | map(attribute='stdout') | map('trim') | join(', ') }})
      on {{ inventory_hostname }}. IOMMU is enabled but devices are not properly
      grouped. Check BIOS ACS settings or try adding
      pcie_acs_override=downstream,multifunction to GRUB_CMDLINE_LINUX_DEFAULT.
  when:
    - wifi_pci_devices | length > 0
    - "'router_nodes' in group_names"
    - not (_iommu_groups_valid | default(false) | bool)

- name: Count devices in each IOMMU group
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      ls -1 /sys/kernel/iommu_groups/{{ item.stdout | trim }}/devices/ | wc -l
    executable: /bin/bash
  loop: "{{ wifi_iommu_groups.results | default([]) }}"
  register: iommu_group_sizes
  changed_when: false
  when:
    - wifi_pci_devices | length > 0
    - "'router_nodes' in group_names"

- name: Fail if any WiFi device shares an IOMMU group with other devices
  ansible.builtin.fail:
    msg: >-
      WiFi device {{ item.item.item }} is in IOMMU group
      {{ item.item.stdout | trim }} which contains
      {{ item.stdout | trim }} device(s). PCI passthrough requires
      the WiFi card to be in its own IOMMU group. Check BIOS settings
      or try adding pcie_acs_override=downstream,multifunction to
      GRUB_CMDLINE_LINUX_DEFAULT.
  loop: "{{ iommu_group_sizes.results | default([]) }}"
  when:
    - wifi_pci_devices | length > 0
    - "'router_nodes' in group_names"
    - (item.stdout | default('0') | trim | int) > 1

# ── Bind vfio-pci (router_nodes only) ────────────────────────

- name: Blacklist WiFi drivers on the host
  ansible.builtin.template:
    src: blacklist-wifi.conf.j2
    dest: /etc/modprobe.d/blacklist-wifi.conf
    owner: root
    group: root
    mode: "0644"
  when:
    - wifi_pci_devices | length > 0
    - "'router_nodes' in group_names"
  notify: Update initramfs

- name: Get vendor and device IDs for WiFi cards
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      lspci -n -s {{ item }} | awk '{print $3}'
    executable: /bin/bash
  loop: "{{ wifi_pci_devices }}"
  register: wifi_vd_ids
  changed_when: false
  when:
    - wifi_pci_devices | length > 0
    - "'router_nodes' in group_names"

- name: Configure vfio-pci device binding
  ansible.builtin.template:
    src: vfio-pci.conf.j2
    dest: /etc/modprobe.d/vfio-pci.conf
    owner: root
    group: root
    mode: "0644"
  when:
    - wifi_pci_devices | length > 0
    - "'router_nodes' in group_names"
  notify: Update initramfs

- name: Flush handlers after vfio configuration
  ansible.builtin.meta: flush_handlers
  when:
    - wifi_pci_devices | length > 0
    - "'router_nodes' in group_names"

# ── Runtime vfio-pci binding (avoid reboot) ───────────────────
# The modprobe configs take effect on next boot. For immediate
# passthrough, unbind from the current driver and bind to vfio-pci
# at runtime.

- name: Load vfio-pci module
  ansible.builtin.command:
    cmd: modprobe vfio-pci
  changed_when: false
  when:
    - wifi_pci_devices | length > 0
    - "'router_nodes' in group_names"

- name: Unbind WiFi from current driver and bind to vfio-pci
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      PCI="0000:{{ item }}"
      CURRENT=$(readlink -f /sys/bus/pci/devices/$PCI/driver 2>/dev/null | xargs basename 2>/dev/null)
      if [ "$CURRENT" = "vfio-pci" ]; then
        echo "already_bound"
        exit 0
      fi
      VD=$(lspci -n -s {{ item }} | awk '{print $3}')
      VENDOR=$(echo "$VD" | cut -d: -f1)
      DEVICE=$(echo "$VD" | cut -d: -f2)
      if [ -n "$CURRENT" ] && [ "$CURRENT" != "" ]; then
        echo "$PCI" > /sys/bus/pci/drivers/$CURRENT/unbind 2>/dev/null || true
        sleep 1
      fi
      echo "0x$VENDOR 0x$DEVICE" > /sys/bus/pci/drivers/vfio-pci/new_id 2>/dev/null || true
      echo "$PCI" > /sys/bus/pci/drivers/vfio-pci/bind 2>/dev/null || true
      sleep 1
      BOUND=$(readlink -f /sys/bus/pci/devices/$PCI/driver 2>/dev/null | xargs basename 2>/dev/null)
      echo "bound_to=$BOUND"
    executable: /bin/bash
  loop: "{{ wifi_pci_devices }}"
  register: _vfio_bind_results
  changed_when: true
  when:
    - wifi_pci_devices | length > 0
    - "'router_nodes' in group_names"

- name: Verify WiFi is bound to vfio-pci
  ansible.builtin.assert:
    that:
      - "'bound_to=vfio-pci' in item.stdout or 'already_bound' in item.stdout"
    fail_msg: >-
      Failed to bind WiFi PCI device {{ item.item }} to vfio-pci on
      {{ inventory_hostname }}. Output: {{ item.stdout | default('') }}
  loop: "{{ _vfio_bind_results.results | default([]) }}"
  when:
    - wifi_pci_devices | length > 0
    - "'router_nodes' in group_names"
    - _vfio_bind_results is not skipped
  loop_control:
    loop_var: item

# ── WiFi PHY verification ─────────────────────────────────────
# Count PHY devices in /sys/class/ieee80211/ to confirm the
# full WiFi stack is functional (driver + firmware + hardware).

- name: Count WiFi PHY devices
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      ls /sys/class/ieee80211/ 2>/dev/null | grep -c '^phy' || echo 0
    executable: /bin/bash
  register: _wifi_phy_count_raw
  changed_when: false
  when: _host_uses_wifi | bool

- name: Check if WiFi container is running (PHY may be namespace-moved)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      for ct in {{ meshwifi_ct_id }} {{ bridge_ct_id }}; do
        status=$(pct status "$ct" 2>/dev/null) || continue
        echo "$ct $status"
      done
    executable: /bin/bash
  register: _wifi_ct_status
  changed_when: false
  failed_when: false
  when:
    - _host_uses_wifi | bool
    - (_wifi_pci_controllers.stdout_lines | default([])) | length > 0
    - (_wifi_phy_count_raw.stdout | default('0') | trim | int) == 0
    - "'router_nodes' not in group_names"

- name: Stop WiFi containers to release PHY back to host namespace
  ansible.builtin.shell:
    cmd: |
      for ct in {{ meshwifi_ct_id }} {{ bridge_ct_id }}; do
        pct status "$ct" 2>/dev/null | grep -q running || continue
        pct stop "$ct" 2>/dev/null || true
      done
      sleep 3
    executable: /bin/bash
  changed_when: true
  when:
    - _host_uses_wifi | bool
    - (_wifi_pci_controllers.stdout_lines | default([])) | length > 0
    - (_wifi_phy_count_raw.stdout | default('0') | trim | int) == 0
    - "'router_nodes' not in group_names"
    - _wifi_ct_status.stdout | default('') is search('running')

- name: Re-count WiFi PHYs after releasing from container
  ansible.builtin.shell:
    cmd: |
      ls /sys/class/ieee80211/ 2>/dev/null | grep -c '^phy' || echo 0
    executable: /bin/bash
  register: _wifi_phy_count_raw
  changed_when: false
  when:
    - _host_uses_wifi | bool
    - (_wifi_pci_controllers.stdout_lines | default([])) | length > 0
    - "'router_nodes' not in group_names"
    - _wifi_ct_status.stdout | default('') is search('running')

- name: Attempt sysfs WiFi rebind if PHY missing (driver may need re-probe)
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/sysfs_wifi_rebind.yml"
  when:
    - _host_uses_wifi | bool
    - (_wifi_pci_controllers.stdout_lines | default([])) | length > 0
    - (_wifi_phy_count_raw.stdout | default('0') | trim | int) == 0
    - wifi_pci_devices | length > 0
    - "'router_nodes' not in group_names"

- name: Final WiFi PHY count after rebind attempt
  ansible.builtin.shell:
    cmd: |
      ls /sys/class/ieee80211/ 2>/dev/null | grep -c '^phy' || echo 0
    executable: /bin/bash
  register: _wifi_phy_count_raw
  changed_when: false
  when:
    - _host_uses_wifi | bool
    - (_wifi_pci_controllers.stdout_lines | default([])) | length > 0
    - "'router_nodes' not in group_names"

- name: Fail if WiFi PCI device detected but no PHY created (non-router only)
  ansible.builtin.fail:
    msg: >-
      WiFi PCI device found ({{ _wifi_pci_controllers.stdout | trim }})
      but no PHY appeared in /sys/class/ieee80211/ on {{ inventory_hostname }}.
      Check dmesg | grep iwlwifi for firmware load errors.
      On Proxmox VE, pve-firmware provides Intel WiFi firmware.
      On bare Debian: apt install firmware-iwlwifi
  when:
    - _host_uses_wifi | bool
    - (_wifi_pci_controllers.stdout_lines | default([])) | length > 0
    - (_wifi_phy_count_raw.stdout | default('0') | trim | int) == 0
    - wifi_pci_devices | length > 0
    - "'router_nodes' not in group_names"

# ── Export WiFi facts (all hosts) ─────────────────────────────

- name: Export WiFi PCI devices as cacheable fact
  ansible.builtin.set_fact:
    wifi_pci_devices: "{{ wifi_pci_devices }}"
    wifi_phy_count: "{{ _wifi_phy_count_raw.stdout | default('0') | trim | int }}"
    cacheable: true

# ── Register PCI + WiFi PHY state with Manager ───────────────────

- name: Build PCI device list for Manager registration
  ansible.builtin.set_fact:
    _pci_device_list: >-
      {% set result = [] %}
      {% for dev in wifi_pci_devices %}
      {%   set _ = result.append({
             "bdf": dev,
             "device_type": "wifi",
             "vendor_device": "",
             "driver": "vfio-pci" if ('router_nodes' in group_names) else "iwlwifi",
             "assigned_to": none,
             "iommu_group": none
           }) %}
      {% endfor %}
      {{ result | to_json }}

- name: Discover actual WiFi PHY names from sysfs
  ansible.builtin.shell:
    cmd: ls /sys/class/ieee80211/ 2>/dev/null || true
    executable: /bin/bash
  register: _actual_phy_names
  changed_when: false

- name: Build WiFi PHY list for Manager registration
  ansible.builtin.set_fact:
    _wifi_phy_list: >-
      {% set phys = _actual_phy_names.stdout_lines | default([])
         | select('match', '^phy') | list %}
      {% set result = [] %}
      {% for name in phys %}
      {%   set _ = result.append({
             "name": name,
             "pci_device": wifi_pci_devices[loop.index0] | default(""),
             "namespace": "host",
             "driver": "iwlwifi"
           }) %}
      {% endfor %}
      {{ result | to_json }}

- name: Register hardware with Manager
  ansible.builtin.include_tasks: "{{ project_root }}/tasks/manager_register.yml"
  vars:
    register_path: "api/host/{{ inventory_hostname }}/hardware"
    register_body:
      ip: "{{ ansible_host }}"
      pci_devices: "{{ _pci_device_list | from_json }}"
      wifi_phys: "{{ _wifi_phy_list | from_json }}"
