---
# Netdata LXC provisioning via Node Manager API.
# Version check skips provisioning when the deployed version matches.

# ── Version-aware skip check ──────────────────────────────────────
- name: Check Netdata version via NM API
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/check_service_version.yml"
  vars:
    _check_service_name: netdata
    _check_image_version: "{{ netdata_image_version }}"

# ── Verify Netdata template exists (skipped when version matches) ─
- name: Verify netdata template exists
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/verify_lxc_template.yml"
  vars:
    lxc_template_path: "{{ netdata_ct_template_path }}"
    lxc_service_name: Netdata
  when: not (_service_up_to_date | default(false) | bool)

# ── Determine container network ──────────────────────────────────
- name: Compute Netdata container network
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/lxc_wan_or_lan_network.yml"
  vars:
    lxc_net_service_name: Netdata
    lxc_net_ip_offset: "{{ netdata_ct_ip_offset }}"
    lxc_net_flavor_group: monitoring_nodes

# ── Upload template to host if not cached ──────────────────────────
- name: Upload Netdata template to Proxmox host
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/upload_lxc_template.yml"
  vars:
    lxc_upload_template_path: "{{ role_path }}/../../{{ netdata_ct_template_path }}"
    lxc_upload_service_name: Netdata
  when: not (_service_up_to_date | default(false) | bool)

# ── Provision container via NM API (skipped when version matches) ─
- name: Provision Netdata LXC via NM API
  ansible.builtin.uri:
    url: "http://{{ nm_api_host | default(ansible_host) }}:{{ nm_api_port | default(kiosk_manager_port) }}/api/provision/netdata"
    headers: "{{ nm_auth_headers }}"
    method: POST
    body_format: json
    body:
      vmid: "{{ netdata_ct_id }}"
      template_path: "{{ netdata_ct_template_path | basename }}"
      hostname: "{{ netdata_ct_hostname }}"
      memory: "{{ netdata_ct_memory }}"
      cores: "{{ netdata_ct_cores }}"
      disk: "{{ netdata_ct_disk }}"
      onboot: "{{ netdata_ct_onboot }}"
      startup_order: "{{ netdata_ct_startup_order }}"
      features: "{{ netdata_ct_features | join(',') }}"
      unprivileged: "{{ netdata_ct_unprivileged }}"
      mount_entries: "{{ netdata_ct_mount_entries }}"
      ip: "{{ _lxc_net_ip }}/{{ _lxc_net_cidr }}"
      gateway: "{{ _lxc_net_gateway }}"
      nameserver: "{{ _lxc_net_nameserver }}"
      bridge: "{{ _lxc_net_bridge }}"
      image_version: "{{ netdata_image_version }}"
    status_code: 200
    timeout: 660
  delegate_to: localhost
  register: _provision_result
  failed_when: not (_provision_result.json.success | default(false))
  when: not (_service_up_to_date | default(false) | bool)

# ── Apply privileged config on host (features/mounts need root@pam) ─
- name: Apply privileged LXC config on host for Netdata
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/apply_privileged_lxc_config.yml"
  vars:
    _priv_ct_id: "{{ netdata_ct_id }}"
    _priv_features: "{{ netdata_ct_features | join(',') }}"
    _priv_mount_entries: "{{ netdata_ct_mount_entries | default([]) }}"
    _priv_lxc_conf_entries: []
  when:
    - not (_service_up_to_date | default(false) | bool)
    - (_provision_result.json.status | default('')) == 'created_needs_host_config'

# ── Configure callhome via NM API (skipped when version matches) ─
- name: Configure callhome on Netdata
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/configure_callhome_api.yml"
  vars:
    _callhome_vmid: "{{ netdata_ct_id }}"

# ── Register in dynamic inventory (for configure plays) ──────────
- name: Add Netdata containers to dynamic inventory group
  ansible.builtin.add_host:
    name: "{{ netdata_ct_hostname }}-{{ item }}"
    groups: netdata
    ansible_connection: community.proxmox.proxmox_pct_remote
    ansible_host: "{{ hostvars[item].ansible_host }}"
    ansible_user: root
    proxmox_vmid: "{{ netdata_ct_id }}"
    ansible_paramiko_host_key_checking: false
    ansible_paramiko_proxy_command: >-
      {{ 'ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p root@'
         + lookup('env', 'PRIMARY_HOST')
         if 'lan_hosts' in (hostvars[item].group_names | default([]))
         else omit }}
  loop: "{{ ansible_play_hosts }}"

# ── Export static IP for downstream roles ─────────────────────────
- name: Export Netdata static IP for downstream roles
  ansible.builtin.set_fact:
    netdata_static_ip: "{{ _lxc_net_ip }}"
    cacheable: true
