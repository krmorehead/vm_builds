---
# ── Verify netdata template exists ──────────────────────────────
- name: Verify netdata template exists
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/verify_lxc_template.yml"
  vars:
    lxc_template_path: "{{ netdata_ct_template_path }}"
    lxc_service_name: Netdata

# ── Determine container network based on host topology ───────────

- name: Compute Netdata container network
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/lxc_wan_or_lan_network.yml"
  vars:
    lxc_net_service_name: Netdata
    lxc_net_ip_offset: "{{ netdata_ct_ip_offset }}"
    lxc_net_flavor_group: monitoring_nodes

# ── Provision via shared proxmox_lxc role ────────────────────────

- name: Provision Netdata LXC container
  ansible.builtin.include_role:
    name: proxmox_lxc
  vars:
    lxc_ct_id: "{{ netdata_ct_id }}"
    lxc_ct_hostname: "{{ netdata_ct_hostname }}"
    lxc_ct_dynamic_group: netdata
    lxc_ct_memory: "{{ netdata_ct_memory }}"
    lxc_ct_cores: "{{ netdata_ct_cores }}"
    lxc_ct_disk: "{{ netdata_ct_disk }}"
    lxc_ct_onboot: "{{ netdata_ct_onboot }}"
    lxc_ct_startup_order: "{{ netdata_ct_startup_order }}"
    lxc_ct_template: "{{ netdata_ct_template }}"
    lxc_ct_template_path: "{{ netdata_ct_template_path }}"
    lxc_ct_ip: "{{ _lxc_net_ip }}/{{ _lxc_net_cidr }}"
    lxc_ct_gateway: "{{ _lxc_net_gateway }}"
    lxc_ct_nameserver: "{{ _lxc_net_nameserver }}"
    lxc_ct_mount_entries: "{{ netdata_ct_mount_entries }}"
    lxc_ct_unprivileged: "{{ netdata_ct_unprivileged }}"
    lxc_ct_features: "{{ netdata_ct_features }}"
    lxc_ct_bridge: "{{ _lxc_net_bridge }}"

- name: Export Netdata static IP for downstream roles
  ansible.builtin.set_fact:
    netdata_static_ip: "{{ _lxc_net_ip }}"
    cacheable: true
