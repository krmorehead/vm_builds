---
- name: List all network interfaces
  ansible.builtin.command:
    cmd: ls /sys/class/net/
  register: raw_interfaces
  changed_when: false

- name: Filter candidate physical NICs
  ansible.builtin.set_fact:
    candidate_nics: >-
      {{ raw_interfaces.stdout_lines
         | reject('match', bridge_exclude_patterns | join('|'))
         | list }}

- name: Check for physical device backing
  ansible.builtin.stat:
    path: "/sys/class/net/{{ item }}/device"
  loop: "{{ candidate_nics }}"
  register: nic_device_checks

- name: Check for wireless capability
  ansible.builtin.stat:
    path: "/sys/class/net/{{ item }}/wireless"
  loop: "{{ nic_device_checks.results | selectattr('stat.exists') | map(attribute='item') | list }}"
  register: wireless_checks

- name: Set confirmed physical NIC list (excluding WiFi)
  ansible.builtin.set_fact:
    physical_nics: >-
      {{ wireless_checks.results
         | rejectattr('stat.exists')
         | map(attribute='item')
         | sort | list }}

- name: Discover which bridge each physical NIC belongs to
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      for nic in {{ physical_nics | join(' ') }}; do
        for br in /sys/class/net/vmbr*/brif/"$nic"; do
          if [ -e "$br" ]; then
            brdir=$(dirname "$(dirname "$br")")
            echo "$(basename "$brdir")=$nic"
          fi
        done
      done
    executable: /bin/bash
  register: bridge_nic_map_raw
  changed_when: false
  failed_when: false

- name: Parse existing bridge-NIC pairs
  ansible.builtin.set_fact:
    _bridge_nic_pairs: >-
      {{ bridge_nic_map_raw.stdout_lines | default([])
         | map('split', '=') | list }}

- name: Set lists of already-bridged NICs and their bridges
  ansible.builtin.set_fact:
    bridged_nics: "{{ _bridge_nic_pairs | map('last') | list }}"
    existing_physical_bridges: "{{ _bridge_nic_pairs | map('first') | unique | sort | list }}"

- name: Compute unbridged NICs
  ansible.builtin.set_fact:
    unbridged_nics: "{{ physical_nics | difference(bridged_nics) | sort | list }}"

# ── Filter out disconnected NICs (no cable) ────────────────────
# Only create bridges for unbridged NICs that have an active link.
# Creating bridges for disconnected NICs leaves broken config in
# ansible-bridges.conf that can prevent PVE services from starting
# on reboot (NIC name may change or NIC may not initialize).
# Previous bug: ai had PCIe NIC (r8169) with no cable. Bridge was
# created for it. On reboot, PVE services failed because the
# bridge config referenced a NIC that never came up.

- name: Check carrier (link) state for unbridged NICs
  ansible.builtin.shell:
    cmd: cat /sys/class/net/{{ item }}/carrier 2>/dev/null || echo 0
  loop: "{{ unbridged_nics }}"
  register: _carrier_checks
  changed_when: false
  when: unbridged_nics | length > 0

- name: Filter unbridged NICs to those with active link
  ansible.builtin.set_fact:
    unbridged_nics: >-
      {{ _carrier_checks.results | default([])
         | selectattr('stdout', 'defined')
         | selectattr('stdout', 'equalto', '1')
         | map(attribute='item')
         | sort | list }}
  when: unbridged_nics | length > 0

- name: Report skipped disconnected NICs
  ansible.builtin.debug:
    msg: >-
      Skipping bridge creation for disconnected NIC(s):
      {{ (physical_nics | difference(bridged_nics) | sort)
         | difference(unbridged_nics)
         | join(', ') }}
      (no carrier/cable detected)
  when:
    - (physical_nics | difference(bridged_nics) | length) > (unbridged_nics | length)

- name: Discover highest existing bridge index
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      ls -1d /sys/class/net/vmbr*/ 2>/dev/null \
        | xargs -I{} basename {} \
        | grep -oP '\d+' \
        | sort -n | tail -1
    executable: /bin/bash
  register: max_bridge_raw
  changed_when: false
  failed_when: false

- name: Set max bridge index
  ansible.builtin.set_fact:
    max_vmbr_index: "{{ max_bridge_raw.stdout | default('-1') | int }}"

- name: Ensure interfaces.d is sourced from main config
  ansible.builtin.lineinfile:
    path: /etc/network/interfaces
    line: "source /etc/network/interfaces.d/*"
    state: present

- name: Deploy bridge configuration for unbridged NICs
  ansible.builtin.template:
    src: bridges.conf.j2
    dest: /etc/network/interfaces.d/ansible-bridges.conf
    owner: root
    group: root
    mode: "0644"
  when: unbridged_nics | length > 0
  notify: Reload networking

- name: Apply pending bridge changes before VM creation
  ansible.builtin.meta: flush_handlers

- name: Build list of new bridge names
  ansible.builtin.set_fact:
    new_bridge_names: >-
      {{ range(max_vmbr_index | int + 1,
               max_vmbr_index | int + 1 + (unbridged_nics | length))
         | map('string')
         | map('regex_replace', '^', 'vmbr')
         | list }}

- name: Export complete bridge list (physical-NIC-backed only)
  ansible.builtin.set_fact:
    proxmox_all_bridges: >-
      {{ (existing_physical_bridges + new_bridge_names) | sort }}
    cacheable: true

- name: Fail if fewer than two bridges are available (router nodes only)
  ansible.builtin.fail:
    msg: >-
      Only {{ proxmox_all_bridges | length }} bridge(s) found.
      An OpenWrt router needs at least 2 physical NICs (WAN + LAN).
  when:
    - "'router_nodes' in group_names"
    - proxmox_all_bridges | length < 2

# ── WAN bridge detection ────────────────────────────────────────
# The bridge carrying the default route connects to the upstream
# network.  This detection runs before any VM exists, so the host's
# default gateway reliably identifies the WAN-side NIC/bridge.

- name: Detect bridge with default route (WAN candidate)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      ip -o route show default | awk '{print $5}' | head -1
    executable: /bin/bash
  register: _default_route_dev
  changed_when: false

- name: Export WAN bridge fact
  ansible.builtin.set_fact:
    proxmox_wan_bridge: "{{ _default_route_dev.stdout | trim }}"
    cacheable: true
  when: (_default_route_dev.stdout | default('') | trim) in proxmox_all_bridges

- name: Fallback WAN bridge to first bridge when detection fails
  ansible.builtin.set_fact:
    proxmox_wan_bridge: "{{ proxmox_all_bridges | first }}"
    cacheable: true
  when: proxmox_wan_bridge is not defined

- name: Report detected WAN bridge
  ansible.builtin.debug:
    msg: >-
      WAN bridge={{ proxmox_wan_bridge }},
      all bridges={{ proxmox_all_bridges | join(', ') }}

# ── Container NAT bridge (WAN hosts only) ───────────────────────
# WAN hosts get a private internal bridge for LXC containers.
# Containers use 10.99.{container_subnet_id}.0/24 with host-side
# NAT (MASQUERADE) for outbound traffic. This eliminates IP
# collisions on the household subnet.
#
# LAN hosts (behind OpenWrt) don't need this — their containers
# are already on the isolated OpenWrt LAN (10.10.10.x).

- name: Determine if host needs container NAT bridge
  ansible.builtin.set_fact:
    _needs_container_bridge: >-
      {{ 'router_nodes' not in group_names and 'lan_hosts' not in group_names }}

- name: Deploy container bridge configuration
  ansible.builtin.template:
    src: container-bridge.conf.j2
    dest: /etc/network/interfaces.d/ansible-container-bridge.conf
    owner: root
    group: root
    mode: "0644"
  when: _needs_container_bridge | bool
  register: _container_bridge_deployed

- name: Bring up container bridge
  ansible.builtin.command:
    cmd: ifup {{ container_bridge_name }}
  when:
    - _needs_container_bridge | bool
    - _container_bridge_deployed.changed
  changed_when: true
  failed_when: false

- name: Enable IP forwarding for container NAT
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true
  when: _needs_container_bridge | bool

- name: Add iptables MASQUERADE rule for container subnet
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      SUBNET="{{ container_subnet_prefix }}.{{ container_subnet_id }}.0/24"
      WAN_IF="{{ proxmox_wan_bridge }}"
      if ! iptables -t nat -C POSTROUTING -s "$SUBNET" -o "$WAN_IF" -j MASQUERADE 2>/dev/null; then
        iptables -t nat -A POSTROUTING -s "$SUBNET" -o "$WAN_IF" -j MASQUERADE
      fi
    executable: /bin/bash
  when: _needs_container_bridge | bool
  changed_when: true

- name: Add iptables FORWARD rules for container traffic
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      SUBNET="{{ container_subnet_prefix }}.{{ container_subnet_id }}.0/24"
      CT_BR="{{ container_bridge_name }}"
      WAN_IF="{{ proxmox_wan_bridge }}"
      if ! iptables -C FORWARD -i "$CT_BR" -o "$WAN_IF" -j ACCEPT 2>/dev/null; then
        iptables -A FORWARD -i "$CT_BR" -o "$WAN_IF" -j ACCEPT
      fi
      if ! iptables -C FORWARD -i "$WAN_IF" -o "$CT_BR" -m state --state RELATED,ESTABLISHED -j ACCEPT 2>/dev/null; then
        iptables -A FORWARD -i "$WAN_IF" -o "$CT_BR" -m state --state RELATED,ESTABLISHED -j ACCEPT
      fi
    executable: /bin/bash
  when: _needs_container_bridge | bool
  changed_when: true

- name: Export container bridge fact
  ansible.builtin.set_fact:
    proxmox_container_bridge: >-
      {{ container_bridge_name if (_needs_container_bridge | bool)
         else (proxmox_all_bridges[1] | default(proxmox_wan_bridge)) }}
    cacheable: true

- name: Report container bridge setup
  ansible.builtin.debug:
    msg: >-
      container_bridge={{ proxmox_container_bridge }}
      {{ '(NAT via ' + proxmox_wan_bridge + ', subnet '
         + container_subnet_prefix + '.' + (container_subnet_id | string) + '.0/24)'
         if (_needs_container_bridge | bool)
         else '(OpenWrt LAN bridge, no NAT)' }}

# ── Register bridge topology with Manager ─────────────────────────

- name: Enrich bridge info with roles and NICs
  ansible.builtin.set_fact:
    _enriched_bridges: |
      {% set result = [] %}
      {% for br in proxmox_all_bridges %}
      {%   if br == proxmox_wan_bridge %}
      {%     set role = 'wan' %}
      {%   elif br == proxmox_container_bridge and (_needs_container_bridge | bool) %}
      {%     set role = 'container_nat' %}
      {%   else %}
      {%     set role = 'lan' %}
      {%   endif %}
      {%   set nics = [] %}
      {%   for pair in _bridge_nic_pairs | default([]) %}
      {%     if pair[0] == br %}
      {%       set _ = nics.append(pair[1]) %}
      {%     endif %}
      {%   endfor %}
      {%   set _ = result.append({"name": br, "role": role, "physical_nics": nics, "has_carrier": true}) %}
      {% endfor %}
      {{ result | to_json }}

- name: Register bridge topology with Manager
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/manager_register.yml"
  vars:
    register_path: "api/host/{{ inventory_hostname }}/bridges"
    register_body:
      ip: "{{ ansible_host }}"
      bridges: "{{ _enriched_bridges | from_json }}"
      wan_bridge: "{{ proxmox_wan_bridge }}"
      container_bridge: "{{ proxmox_container_bridge }}"
