---
# ── Release WiFi PHY from stale containers ────────────────────────
# If a bridge container from a previous run still holds the WiFi PHY
# in its network namespace, stop it first so the PHY returns to
# the host.

- name: Check if bridge container exists from a previous run
  ansible.builtin.command:
    cmd: pct status {{ bridge_ct_id }}
  register: _stale_bridge_ct
  changed_when: false
  failed_when: false

- name: Set container existence flag
  ansible.builtin.set_fact:
    _lxc_exists: "{{ _stale_bridge_ct.rc == 0 }}"

- name: Stop stale bridge container to release WiFi PHY
  ansible.builtin.command:
    cmd: pct stop {{ bridge_ct_id }}
  when:
    - _stale_bridge_ct.rc == 0
    - "'running' in (_stale_bridge_ct.stdout | default(''))"
  changed_when: true

- name: Destroy stale bridge container
  ansible.builtin.command:
    cmd: pct destroy {{ bridge_ct_id }} --purge
  when: _stale_bridge_ct.rc == 0
  changed_when: true
  failed_when: false

- name: Wait for WiFi PHY to return to host namespace
  ansible.builtin.pause:
    seconds: 3
  when: _stale_bridge_ct.rc == 0

# ── Verify WiFi hardware ─────────────────────────────────────────
# proxmox_pci_passthrough already loads modules and exports
# wifi_phy_count. Assert it here rather than re-loading.

- name: Assert WiFi PHY is available (from proxmox_pci_passthrough)
  ansible.builtin.assert:
    that: (wifi_phy_count | default(0) | int) > 0
    fail_msg: >-
      No WiFi PHY on {{ inventory_hostname }}. proxmox_pci_passthrough
      should have loaded drivers and exported wifi_phy_count > 0.
      Check dmesg | grep iwlwifi for errors.

# ── Detect WiFi PHY devices on host ──────────────────────────────

- name: Detect WiFi PHY devices on host
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      ls /sys/class/ieee80211/ 2>/dev/null
    executable: /bin/bash
  register: _host_wifi_phys
  changed_when: false
  failed_when: false

- name: Set WiFi PHY list
  ansible.builtin.set_fact:
    _wifi_phys: "{{ _host_wifi_phys.stdout_lines | default([]) | select('match', '^phy') | list }}"

- name: Fail if no WiFi PHY found on bridge node
  ansible.builtin.fail:
    msg: >-
      No WiFi PHY found on {{ inventory_hostname }} after loading drivers.
      Bridge nodes require WiFi hardware for 802.11s dedicated link.
      Run: lspci -k | grep -A2 'Network controller'
  when: _wifi_phys | length == 0

# ── Determine container network based on wifi_role ────────────────
# AP mode (bridge-1): container eth0 on proxmox_wan_bridge (vmbr0).
#   Extends the household network over WiFi.
# STA mode (bridge-2): container eth0 on the backhaul bridge (vmbr1).
#   Receives WiFi traffic and outputs to the physical cable.
#
# CRITICAL: Both ends of the WiFi bridge MUST NOT be on the same L2
# broadcast domain. If AP and STA containers are both on vmbr0 (same
# switch), the WiFi link creates a broadcast storm loop that takes
# down the entire household network.

- name: Resolve wifi_role for this host
  ansible.builtin.set_fact:
    _bridge_wifi_role: "{{ wifi_role | default('ap') }}"

- name: Detect USB NICs via sysfs
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      for iface in /sys/class/net/*/device; do
        subsys=$(readlink -f "$iface/subsystem" 2>/dev/null)
        if echo "$subsys" | grep -q 'bus/usb'; then
          basename "$(dirname "$iface")"
        fi
      done
    executable: /bin/bash
  register: _usb_nics_raw
  changed_when: false
  failed_when: false

- name: Set USB NIC list
  ansible.builtin.set_fact:
    _usb_nics: "{{ _usb_nics_raw.stdout_lines | default([]) }}"

- name: Find management interface name
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      ip -o addr show | grep '{{ ansible_default_ipv4.address }}' | awk '{print $2}' | head -1
    executable: /bin/bash
  register: _mgmt_iface_raw
  changed_when: false

- name: Filter out management NIC from USB NIC list
  ansible.builtin.set_fact:
    _backhaul_usb_nics: >-
      {{ _usb_nics | reject('equalto', _mgmt_iface_raw.stdout | trim) | list }}

- name: Find Proxmox bridge for USB backhaul NIC
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      bridge_name=""
      for br in $(ip -o link show type bridge | awk -F': ' '{print $2}'); do
        output=$(bridge link show dev {{ item }} master "$br" 2>/dev/null)
        if [ -n "$output" ]; then
          bridge_name="$br"
          break
        fi
      done
      if [ -z "$bridge_name" ]; then
        conf=$(grep -l "{{ item }}" /etc/network/interfaces.d/*.conf 2>/dev/null \
          | xargs grep -l 'bridge' 2>/dev/null | head -1)
        if [ -n "$conf" ]; then
          bridge_name=$(grep 'auto ' "$conf" | awk '{print $2}')
        fi
      fi
      echo "$bridge_name"
    executable: /bin/bash
  loop: "{{ _backhaul_usb_nics }}"
  register: _usb_bridge_raw
  changed_when: false
  when: _backhaul_usb_nics | length > 0

- name: Set backhaul bridge
  ansible.builtin.set_fact:
    _backhaul_bridge: >-
      {{ _usb_bridge_raw.results[0].stdout | default('') | trim
         if _backhaul_usb_nics | length > 0 and _usb_bridge_raw.results | default([]) | length > 0
         else '' }}

- name: Fail if STA mode has no backhaul bridge
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }}: wifi_role=sta requires a backhaul bridge
      (second NIC with a Proxmox bridge). No non-management USB NIC found.
      STA containers MUST output to a backhaul cable, not the WAN bridge.
      Putting STA on the WAN bridge creates an L2 broadcast storm loop.
  when:
    - _bridge_wifi_role == 'sta'
    - _backhaul_bridge | length == 0

# SAFETY GATE: STA backhaul bridge MUST NOT be the WAN bridge.
# If it is, we have a single L2 domain on both ends of the WiFi link,
# which creates a broadcast storm that takes down the household network.
- name: "SAFETY GATE: STA backhaul bridge must differ from WAN bridge"
  ansible.builtin.fail:
    msg: >-
      CRITICAL SAFETY VIOLATION on {{ inventory_hostname }}:
      Backhaul bridge '{{ _backhaul_bridge }}' is the SAME as the WAN bridge
      '{{ proxmox_wan_bridge }}'. This would create an L2 broadcast storm loop.
      The STA container MUST be on a different bridge (typically vmbr1 with a
      dedicated backhaul cable). Check hardware: the USB backhaul NIC must be
      on a separate bridge from the management NIC.
  when:
    - _bridge_wifi_role == 'sta'
    - _backhaul_bridge == proxmox_wan_bridge

- name: Select container bridge based on wifi_role
  ansible.builtin.set_fact:
    _bridge_ct_bridge: >-
      {{ _backhaul_bridge if _bridge_wifi_role == 'sta' and _backhaul_bridge | length > 0
         else proxmox_wan_bridge }}

- name: Build bridge node host list
  ansible.builtin.set_fact:
    _bridge_hosts: "{{ groups['bridge_nodes'] | default([]) | sort }}"

- name: Set container IP
  ansible.builtin.set_fact:
    _bridge_ct_ip: >-
      {{ ansible_default_ipv4.network.split('.')[0:3] | join('.') }}.{{
         bridge_ct_ip_offset + 200 + _bridge_hosts.index(inventory_hostname) }}
    _bridge_ct_cidr: "{{ ansible_default_ipv4.prefix }}"
    _bridge_ct_gateway: "{{ ansible_default_ipv4.gateway }}"

- name: Report bridge container assignment
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: bridge LXC role={{ _bridge_wifi_role }}
      IP={{ _bridge_ct_ip }}/{{ _bridge_ct_cidr }}
      gw={{ _bridge_ct_gateway }} bridge={{ _bridge_ct_bridge }}
      ({{ 'backhaul' if _bridge_wifi_role == 'sta' else 'WAN' }})

# ── Verify custom LXC image exists ────────────────────────────────

- name: Check bridge LXC image exists
  ansible.builtin.stat:
    path: "{{ project_root }}/{{ openwrt_lxc_template_path }}"
  register: _bridge_lxc_stat
  delegate_to: localhost

- name: Fail if bridge LXC image is missing
  ansible.builtin.fail:
    msg: >-
      Custom mesh LXC image not found: {{ openwrt_lxc_template_path }}.
      Bridge reuses the mesh image. Run ./build-images.sh --only mesh
  when: not (_bridge_lxc_stat.stat.exists | default(false))

# ── Resolve deployed version ────────────────────────────────────

- name: Resolve deployed WiFi bridge version
  ansible.builtin.include_tasks: "{{ project_root }}/tasks/resolve_deployed_version.yml"
  vars:
    _resolve_service_name: openwrt_bridge

# ── Provision LXC container ──────────────────────────────────────

- name: Provision WiFi bridge LXC container
  ansible.builtin.include_role:
    name: proxmox_lxc
  vars:
    lxc_ct_id: "{{ bridge_ct_id }}"
    lxc_ct_hostname: "{{ openwrt_bridge_ct_hostname }}"
    lxc_ct_dynamic_group: openwrt_bridge
    lxc_ct_memory: "{{ openwrt_bridge_ct_memory }}"
    lxc_ct_cores: "{{ openwrt_bridge_ct_cores }}"
    lxc_ct_disk: "{{ openwrt_bridge_ct_disk }}"
    lxc_ct_onboot: "{{ openwrt_bridge_ct_onboot }}"
    lxc_ct_startup_order: "{{ openwrt_bridge_ct_startup_order }}"
    lxc_ct_features: "{{ openwrt_bridge_ct_features }}"
    lxc_ct_unprivileged: false
    lxc_ct_template_path: "{{ openwrt_lxc_template_path }}"
    lxc_ct_skip_debian_cleanup: true
    lxc_ct_ostype: unmanaged
    lxc_ct_bridge: "{{ _bridge_ct_bridge }}"
    lxc_ct_ip: "{{ _bridge_ct_ip }}/{{ _bridge_ct_cidr }}"
    lxc_ct_gateway: "{{ _bridge_ct_gateway }}"
    lxc_ct_nameserver: "8.8.8.8"
    lxc_ct_image_version: "{{ openwrt_lxc_image_version }}"

# ── POST-PROVISION SAFETY GATE ──────────────────────────────────
# Verify the ACTUAL container config matches what we intended.
# If the container ended up on the wrong bridge, stop it and fail
# before WiFi ever comes up.

- name: "SAFETY GATE: Verify actual container bridge assignment"
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      actual=$(pct config {{ bridge_ct_id }} | grep '^net0' | sed -n 's/.*bridge=\([^,]*\).*/\1/p')
      echo "$actual"
    executable: /bin/bash
  register: _actual_ct_bridge
  changed_when: false

- name: "SAFETY GATE: Stop container if bridge mismatch (STA on WAN = storm)"
  ansible.builtin.command:
    cmd: pct stop {{ bridge_ct_id }}
  when:
    - _bridge_wifi_role == 'sta'
    - _actual_ct_bridge.stdout | trim == proxmox_wan_bridge

- name: "SAFETY GATE: Fail on STA bridge mismatch"
  ansible.builtin.fail:
    msg: >-
      CRITICAL: {{ inventory_hostname }} CT {{ bridge_ct_id }} was created on
      bridge '{{ _actual_ct_bridge.stdout | trim }}' but wifi_role=sta requires
      bridge '{{ _backhaul_bridge }}'. Container has been stopped.
      Expected: {{ _backhaul_bridge }}, Got: {{ _actual_ct_bridge.stdout | trim }}.
      This would cause an L2 broadcast storm. Investigate proxmox_lxc role.
  when:
    - _bridge_wifi_role == 'sta'
    - _actual_ct_bridge.stdout | trim != (_backhaul_bridge | trim)

# ── Override default OpenWrt LAN IP ─────────────────────────────
# OpenWrt images boot with 192.168.1.1 on br-lan, which collides
# with the router VM's bootstrap address on the same L2 segment.
# Set the LAN IP to match the Proxmox-assigned container IP.

- name: Set OpenWrt LAN IP to match container assignment
  ansible.builtin.shell:
    cmd: |
      pct exec {{ bridge_ct_id }} -- sh -c '
        uci set network.lan.ipaddr="{{ _bridge_ct_ip }}"
        uci set network.lan.netmask="255.255.255.0"
        uci set network.lan.gateway="{{ _bridge_ct_gateway }}"
        uci set network.lan.proto="static"
        uci delete network.lan.ip6assign 2>/dev/null
        uci commit network
        /etc/init.d/network restart
      '
  changed_when: true

# ── Configure callhome agent (OpenWrt / cron-based) ─────────
# callhome.sh and crontab are baked into the image.
# Target the local kiosk NodeManager so heartbeats follow the
# 4-tier chain (container → NodeManager → ClusterManager → Super).
#
# Bridge containers are on the WAN bridge, NOT on the NAT bridge
# where the kiosk lives. Use the host's manager-api-proxy
# (ansible_host:9001) which forwards to the kiosk container.

- name: Configure callhome on bridge container
  ansible.builtin.include_tasks:
    file: "{{ project_root }}/tasks/lxc_openwrt_callhome.yml"
  vars:
    _callhome_ct_id: "{{ bridge_ct_id }}"
    _callhome_hostname: "{{ openwrt_bridge_ct_hostname }}"

# ── Move WiFi PHY into container namespace ───────────────────────

- name: Move WiFi PHY devices into container namespace
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      pid=$(lxc-info -n {{ bridge_ct_id }} 2>/dev/null | awk '/^PID:/{print $2}')
      if [ -z "$pid" ] || [ "$pid" = "-1" ]; then
        echo "ERROR: cannot determine PID for container {{ bridge_ct_id }}" >&2
        exit 1
      fi
      for phy in {{ _wifi_phys | join(' ') }}; do
        iw phy "$phy" set netns "$pid"
      done
    executable: /bin/bash
  changed_when: true

# ── Register PHY namespace move with Manager ─────────────────────

- name: Update PHY namespaces in Manager after move
  ansible.builtin.include_tasks: "{{ project_root }}/tasks/manager_register.yml"
  vars:
    register_path: "api/host/{{ inventory_hostname }}/hardware/phy/{{ item }}"
    register_body:
      namespace: "container:{{ bridge_ct_id }}"
    register_method: PATCH
  loop: "{{ _wifi_phys }}"

# ── Deploy hookscript for PHY persistence across reboots ─────────

- name: Ensure snippets directory exists
  ansible.builtin.file:
    path: /var/lib/vz/snippets
    state: directory
    mode: "0755"

- name: Deploy bridge PHY hookscript
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      # Proxmox hookscript: move WiFi PHYs into WiFi bridge container
      # after it starts. Deployed by openwrt_bridge_lxc role.
      CT_ID="$1"
      PHASE="$2"

      if [ "$PHASE" != "post-start" ]; then
        exit 0
      fi

      sleep 2
      pid=$(lxc-info -n "$CT_ID" 2>/dev/null | awk '/^PID:/{print $2}')
      [ -z "$pid" ] || [ "$pid" = "-1" ] && exit 0
      for phy in $(ls /sys/class/ieee80211/ 2>/dev/null); do
        iw phy "$phy" set netns "$pid" 2>/dev/null || true
      done
    dest: "/var/lib/vz/snippets/bridge-wifi-phy-{{ bridge_ct_id }}.sh"
    mode: "0755"

- name: Attach hookscript to container
  ansible.builtin.command:
    cmd: "pct set {{ bridge_ct_id }} --hookscript local:snippets/bridge-wifi-phy-{{ bridge_ct_id }}.sh"
  changed_when: true

# ── Host-side wrapper scripts for manager API ──────────────────
# The manager SSHes to the Proxmox host and calls these scripts.
# They forward to the container-side scripts via pct exec.

- name: Deploy host-side wifi_setup.sh wrapper
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      exec pct exec {{ bridge_ct_id }} -- /usr/sbin/wifi_setup.sh "$@"
    dest: /usr/local/bin/wifi_setup.sh
    mode: "0755"

- name: Deploy host-side batman_trigger.sh wrapper
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      exec pct exec {{ bridge_ct_id }} -- /usr/sbin/batman_trigger.sh "$@"
    dest: /usr/local/bin/batman_trigger.sh
    mode: "0755"

# ── Broadcast storm guard ──────────────────────────────────────
# Lightweight watchdog that monitors broadcast packet rates on the
# WAN bridge. If the rate exceeds a threshold (storm), it immediately
# stops the bridge container to break the L2 loop.
# Runs as a systemd service so it auto-starts with the host.

- name: Deploy broadcast storm guard script
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      # Broadcast storm guard for WiFi bridge containers.
      # Monitors WAN bridge broadcast packet rate. If >500 bcast
      # packets/sec sustained for 3 checks, stop the bridge container.
      BRIDGE="{{ proxmox_wan_bridge }}"
      CT_ID="{{ bridge_ct_id }}"
      THRESHOLD=500
      STRIKES=0
      MAX_STRIKES=3
      INTERVAL=2

      get_bcast_rx() {
        cat "/sys/class/net/${BRIDGE}/statistics/multicast" 2>/dev/null || echo 0
      }

      prev=$(get_bcast_rx)
      while true; do
        sleep "$INTERVAL"
        curr=$(get_bcast_rx)
        rate=$(( (curr - prev) / INTERVAL ))
        prev=$curr
        if [ "$rate" -gt "$THRESHOLD" ]; then
          STRIKES=$((STRIKES + 1))
          logger -t storm-guard "WARNING: $BRIDGE bcast rate=${rate}/s (strike ${STRIKES}/${MAX_STRIKES})"
          if [ "$STRIKES" -ge "$MAX_STRIKES" ]; then
            logger -t storm-guard "CRITICAL: Broadcast storm detected on $BRIDGE (rate=${rate}/s). Stopping CT $CT_ID."
            pct stop "$CT_ID" 2>/dev/null
            logger -t storm-guard "CT $CT_ID stopped. Storm guard exiting."
            exit 1
          fi
        else
          STRIKES=0
        fi
      done
    dest: /usr/local/bin/bridge-storm-guard.sh
    mode: "0755"

- name: Deploy storm guard systemd service
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Broadcast storm guard for WiFi bridge CT {{ bridge_ct_id }}
      After=network.target

      [Service]
      Type=simple
      ExecStart=/usr/local/bin/bridge-storm-guard.sh
      Restart=on-failure
      RestartSec=10

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/bridge-storm-guard.service
    mode: "0644"

- name: Enable and start storm guard
  ansible.builtin.systemd:
    name: bridge-storm-guard
    daemon_reload: true
    enabled: true
    state: started
