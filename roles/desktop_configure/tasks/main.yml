---
# Desktop LXC configure role — host-specific runtime config only.
# KDE Plasma, GNOME, KasmVNC, GPU drivers, and desktop-display.service
# are all baked into the image by build-images.sh. This role configures
# callhome to point to the local NodeManager and starts services.
# All in-container operations go through the Node Manager API over VPN.

# ── Detect local kiosk Manager IP ──────────────────────────────────

- name: Detect local kiosk Manager IP for callhome target
  ansible.builtin.uri:
    url: "{{ nm_api_url }}/api/provision/{{ kiosk_ct_id }}/exec"
    headers: "{{ nm_auth_headers }}"
    method: POST
    body_format: json
    body:
      cmd: "hostname -I"
      timeout: 10
    status_code: 200
  delegate_to: localhost
  register: _desktop_kiosk_ip_result
  failed_when: _desktop_kiosk_ip_result.status != 200 and _desktop_kiosk_ip_result.status != -1

- name: Extract kiosk IP
  ansible.builtin.set_fact:
    _desktop_kiosk_ip: "{{ (_desktop_kiosk_ip_result.json.output | default('') | trim).split()[0] | default('') }}"

- name: Compute callhome target (local NodeManager or fallback to SuperManager)
  ansible.builtin.set_fact:
    _desktop_callhome_target: >-
      {{ 'http://' + _desktop_kiosk_ip + ':'
         + (kiosk_manager_port | string)
         if _desktop_kiosk_ip | length > 0
         else callhome_server }}

# ── Set desktop user password from env var ────────────────────────

- name: Set desktop user password
  ansible.builtin.uri:
    url: "{{ nm_api_url }}/api/provision/{{ desktop_ct_id }}/exec"
    headers: "{{ nm_auth_headers }}"
    method: POST
    body_format: json
    body:
      cmd: >-
        bash -c 'echo "desktop:{{ desktop_password }}" | chpasswd'
      timeout: 10
    status_code: 200
  delegate_to: localhost
  no_log: true
  when: desktop_password | length > 0

- name: Remove desktop user password if none provided
  ansible.builtin.uri:
    url: "{{ nm_api_url }}/api/provision/{{ desktop_ct_id }}/exec"
    headers: "{{ nm_auth_headers }}"
    method: POST
    body_format: json
    body:
      cmd: "passwd -d desktop"
      timeout: 10
    status_code: 200
  delegate_to: localhost
  when: desktop_password | length == 0

# ── Write callhome config + start services ─────────────────────────

- name: Configure callhome and start Desktop services
  ansible.builtin.uri:
    url: "{{ nm_api_url }}/api/provision/{{ desktop_ct_id }}/exec"
    headers: "{{ nm_auth_headers }}"
    method: POST
    body_format: json
    body:
      cmd: >-
        bash -c '
        sed -i "s|^CALLHOME_SERVER=.*|CALLHOME_SERVER={{ _desktop_callhome_target }}|" /etc/default/callhome;
        sed -i "s|^CALLHOME_PUBLIC_KEY=.*|CALLHOME_PUBLIC_KEY={{ callhome_public_key }}|" /etc/default/callhome;
        grep -q "^CALLHOME_HOSTNAME=" /etc/default/callhome 2>/dev/null
          || echo "CALLHOME_HOSTNAME=desktop-{{ inventory_hostname }}" >> /etc/default/callhome;
        systemctl restart callhome;
        systemctl restart desktop-display'
      timeout: 30
    status_code: 200
  delegate_to: localhost
  when: callhome_server | default('') | length > 0

# ── Report completion ────────────────────────────────────────────

- name: Report Desktop configuration
  ansible.builtin.debug:
    msg: >-
      Desktop configured: ct={{ desktop_ct_id }},
      callhome={{ _desktop_callhome_target | default('N/A') }},
      user={{ desktop_user }}
