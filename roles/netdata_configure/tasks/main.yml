---
# Netdata base config (dbengine, retention, proc/sys paths, dashboard,
# systemd LXC override) is baked into the image. This role only applies
# host-specific streaming config when NETDATA_PARENT_IP is set.
# All in-container operations go through the Node Manager API over VPN.

# ── Deploy or remove streaming config ────────────────────────────

- name: Fail if streaming parent set without API key
  ansible.builtin.fail:
    msg: >-
      NETDATA_PARENT_IP is set ({{ netdata_parent_ip }}) but
      NETDATA_STREAM_API_KEY is empty. Both are required for streaming.
  when:
    - netdata_parent_ip | length > 0
    - netdata_stream_api_key | length == 0

- name: Build Netdata streaming config content
  ansible.builtin.set_fact:
    _netdata_stream_content: |
      [stream]
          enabled = yes
          destination = {{ netdata_parent_ip }}:19999
          api key = {{ netdata_stream_api_key }}
          buffer size bytes = 1048576
          reconnect delay seconds = 5
          initial clock resync iterations = 60
  when: netdata_parent_ip | length > 0

- name: Deploy streaming config via NM API
  ansible.builtin.uri:
    url: "http://{{ nm_api_host | default(ansible_host) }}:{{ nm_api_port | default(kiosk_manager_port) }}/api/config/{{ netdata_ct_id }}/file"
    method: POST
    body_format: json
    body:
      path: /etc/netdata/stream.conf
      content: "{{ _netdata_stream_content }}"
      mode: "0640"
    status_code: 200
  delegate_to: localhost
  when: netdata_parent_ip | length > 0

- name: Remove streaming config when parent IP is not set
  ansible.builtin.uri:
    url: "http://{{ nm_api_host | default(ansible_host) }}:{{ nm_api_port | default(kiosk_manager_port) }}/api/provision/{{ netdata_ct_id }}/exec"
    method: POST
    body_format: json
    body:
      cmd: "rm -f /etc/netdata/stream.conf"
      timeout: 10
    status_code: 200
  delegate_to: localhost
  when: netdata_parent_ip | length == 0

# ── Restart Netdata ──────────────────────────────────────────────

- name: Restart netdata service via NM API
  ansible.builtin.uri:
    url: >-
      http://{{ nm_api_host | default(ansible_host) }}:{{ nm_api_port | default(kiosk_manager_port) }}/api/config/{{ netdata_ct_id }}/service/netdata/restart
    method: POST
    body_format: json
    body: {}
    status_code: 200
    timeout: 30
  delegate_to: localhost
  retries: 2
  delay: 3
  register: _netdata_restart
  until: (_netdata_restart.status | default(0)) == 200

# ── Post-restart health check ────────────────────────────────────

- name: Wait for netdata readiness via API
  ansible.builtin.uri:
    url: "{{ callhome_server_local }}/api/container/netdata/ready"
    return_content: true
  register: _netdata_api_check
  delegate_to: localhost
  retries: 10
  delay: 3
  until: (_netdata_api_check.json.ready | default(false)) | bool
  failed_when: false
  when: callhome_server | default('') | length > 0

- name: Report netdata status
  ansible.builtin.debug:
    msg: >-
      Netdata service: {{ 'ready (via API)' if (_netdata_api_check.json.ready | default(false)) | bool
        else 'unknown' }},
      streaming={{ 'enabled to ' + netdata_parent_ip if netdata_parent_ip | length > 0 else 'disabled (local dashboard only)' }}
