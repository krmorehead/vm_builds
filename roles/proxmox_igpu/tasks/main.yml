---
# Detect iGPU (Intel or AMD), ensure the driver is loaded, verify
# VA-API, and export facts for LXC containers (bind mount) and VMs
# (hostpci passthrough).
#
# Fails if no iGPU is detected — every host in this project is
# expected to have one.
# Deliberately separate from proxmox_pci_passthrough: the iGPU stays
# on the host driver (i915/amdgpu, shared) rather than being bound
# to vfio-pci (exclusive).

# ── Detection ─────────────────────────────────────────────────────

- name: Detect iGPU vendor via lspci (single call)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      intel=$(lspci -nn | grep -i 'VGA compatible controller.*Intel' | head -1)
      amd=$(lspci -nn | grep -iE 'VGA compatible controller.*(AMD|ATI)|Display controller.*(AMD|ATI)' | head -1)
      echo "INTEL=${intel}"
      echo "AMD=${amd}"
    executable: /bin/bash
  register: _igpu_detect
  changed_when: false
  failed_when: false

- name: Set iGPU vendor and availability
  ansible.builtin.set_fact:
    _intel_igpu_line: "{{ _igpu_detect.stdout | regex_search('INTEL=(.+)', '\\1') | default([''], true) | first }}"
    _amd_igpu_line: "{{ _igpu_detect.stdout | regex_search('AMD=(.+)', '\\1') | default([''], true) | first }}"

- name: Set iGPU vendor fact
  ansible.builtin.set_fact:
    igpu_available: >-
      {{ _intel_igpu_line | length > 0 or _amd_igpu_line | length > 0 }}
    igpu_vendor: >-
      {{ 'intel' if _intel_igpu_line | length > 0
         else ('amd' if _amd_igpu_line | length > 0 else 'none') }}

- name: Fail if no iGPU detected
  ansible.builtin.fail:
    msg: >-
      No iGPU found on {{ inventory_hostname }}. Every Proxmox host
      in this project is expected to have an Intel or AMD iGPU for
      VA-API transcoding and LXC GPU access.
  when: not (igpu_available | bool)

- name: Set iGPU lspci output reference
  ansible.builtin.set_fact:
    _igpu_lspci_stdout: >-
      {{ _intel_igpu_line if igpu_vendor == 'intel' else _amd_igpu_line }}

- name: Extract iGPU PCI address
  ansible.builtin.set_fact:
    igpu_pci_address: >-
      {{ _igpu_lspci_stdout.split(' ')[0] | default('') }}
  when: igpu_available | bool

# ── Vendor-specific driver names ──────────────────────────────────

- name: Set vendor-specific driver and package facts
  ansible.builtin.set_fact:
    _igpu_driver: "{{ 'i915' if igpu_vendor == 'intel' else 'amdgpu' }}"
    _igpu_vaapi_packages: >-
      {{ ['vainfo', 'intel-media-va-driver'] if igpu_vendor == 'intel'
         else ['vainfo', 'mesa-va-drivers'] }}
    _igpu_libva_driver: "{{ 'iHD' if igpu_vendor == 'intel' else 'radeonsi' }}"

# ── Ensure GPU driver is loaded ───────────────────────────────────

- name: Check GPU driver is loaded
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      lsmod | grep -c '^{{ _igpu_driver }}'
    executable: /bin/bash
  register: _gpu_driver_check
  changed_when: false
  failed_when: false
  when: igpu_available | bool

- name: Remove any driver blacklist entries
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      FILES=$(grep -rl 'blacklist {{ _igpu_driver }}' /etc/modprobe.d/ 2>/dev/null || true)
      if [ -n "$FILES" ]; then
        echo "$FILES" | xargs sed -i '/blacklist {{ _igpu_driver }}/d'
        echo CHANGED
      fi
    executable: /bin/bash
  register: _blacklist_removal
  changed_when: "'CHANGED' in _blacklist_removal.stdout"
  failed_when: false
  when:
    - igpu_available | bool
    - _gpu_driver_check.rc != 0

- name: Load GPU kernel module
  community.general.modprobe:
    name: "{{ _igpu_driver }}"
    state: present
  when:
    - igpu_available | bool
    - _gpu_driver_check.rc != 0

- name: Wait for DRI devices to appear after driver load
  ansible.builtin.wait_for:
    path: /dev/dri/renderD128
    timeout: 10
  when:
    - igpu_available | bool
    - _gpu_driver_check.rc != 0

# ── Recover missing DRI devices ──────────────────────────────────
# Prior passthrough (vfio-pci binding) or hookscript operations can
# leave the iGPU without /dev/dri nodes even though the native driver
# module is loaded. Recovery: unbind from any stale driver, clear
# driver_override, PCI rescan, explicitly bind the native driver.
# Safe: sysfs-only, no modprobe -r.

- name: Check if DRI devices exist
  ansible.builtin.stat:
    path: /dev/dri/renderD128
  register: _dri_pre_check
  when: igpu_available | bool

- name: Recover iGPU DRI devices
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      PCI_ADDR="0000:{{ igpu_pci_address }}"
      CURRENT=$(readlink -f /sys/bus/pci/devices/$PCI_ADDR/driver 2>/dev/null | xargs basename 2>/dev/null)
      # Unbind from whatever currently holds the device
      if [ -n "$CURRENT" ] && [ -e "/sys/bus/pci/drivers/$CURRENT/unbind" ]; then
        echo "$PCI_ADDR" > /sys/bus/pci/drivers/$CURRENT/unbind 2>/dev/null || true
      fi
      echo "" > /sys/bus/pci/devices/$PCI_ADDR/driver_override 2>/dev/null || true
      echo 1 > /sys/bus/pci/rescan
      sleep 1
      # PCI rescan alone won't auto-bind when the module is already loaded
      echo "$PCI_ADDR" > /sys/bus/pci/drivers/{{ _igpu_driver }}/bind 2>/dev/null || true
      sleep 2
      DRIVER=$(readlink -f /sys/bus/pci/devices/$PCI_ADDR/driver 2>/dev/null | xargs basename 2>/dev/null)
      echo "DRIVER=$DRIVER"
    executable: /bin/bash
  register: _igpu_dri_recovery
  changed_when: true
  when:
    - igpu_available | bool
    - not (_dri_pre_check.stat.exists | default(false))

- name: Wait for DRI devices after recovery
  ansible.builtin.wait_for:
    path: /dev/dri/renderD128
    timeout: 15
  when:
    - igpu_available | bool
    - not (_dri_pre_check.stat.exists | default(false))

# ── Device node detection (dynamic, not hardcoded) ────────────────

- name: Find render device
  ansible.builtin.stat:
    path: /dev/dri/renderD128
  register: _render_stat
  when: igpu_available | bool

- name: Find card device by matching GPU driver
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      for card in /dev/dri/card*; do
        [ -e "$card" ] || continue
        num=$(basename "$card" | sed 's/card//')
        driver=$(readlink -f "/sys/class/drm/card${num}/device/driver" \
                 2>/dev/null | xargs basename 2>/dev/null)
        if [ "$driver" = "{{ _igpu_driver }}" ]; then
          echo "$card"
          exit 0
        fi
      done
      exit 1
    executable: /bin/bash
  register: _card_detect
  changed_when: false
  failed_when: false
  when: igpu_available | bool

- name: Set device path facts
  ansible.builtin.set_fact:
    igpu_render_device: >-
      {{ '/dev/dri/renderD128'
      if (_render_stat.stat.exists | default(false)) else '' }}
    igpu_card_device: >-
      {{ _card_detect.stdout | default('') | trim }}
  when: igpu_available | bool

- name: Assert iGPU devices are present
  ansible.builtin.assert:
    that:
      - igpu_render_device | length > 0
      - igpu_card_device | length > 0
    fail_msg: >-
      iGPU detected at {{ igpu_pci_address }} and {{ _igpu_driver }} loaded,
      but DRI devices are missing.
      render={{ igpu_render_device }},
      card={{ igpu_card_device }}.
      Check dmesg for {{ _igpu_driver }} errors.
  when: igpu_available | bool

# ── Render and video group GIDs ───────────────────────────────────

- name: Read render and video group GIDs
  ansible.builtin.shell:
    cmd: |
      render_gid=$(getent group render 2>/dev/null | cut -d: -f3)
      video_gid=$(getent group video 2>/dev/null | cut -d: -f3)
      echo "RENDER_GID=${render_gid}"
      echo "VIDEO_GID=${video_gid}"
  register: _group_gids
  changed_when: false
  when: igpu_available | bool

- name: Set group GID facts
  ansible.builtin.set_fact:
    igpu_render_gid: >-
      {{ _group_gids.stdout_lines
         | select('match', '^RENDER_GID=\d+$')
         | map('regex_replace', '^RENDER_GID=', '')
         | first | default('') }}
    igpu_video_gid: >-
      {{ _group_gids.stdout_lines
         | select('match', '^VIDEO_GID=\d+$')
         | map('regex_replace', '^VIDEO_GID=', '')
         | first | default('') }}
  when: igpu_available | bool

# ── VA-API verification ──────────────────────────────────────────
# DNS and NTP sync are handled by infra_pre_tasks.yml (runs before
# this role). VA-API packages are baked by prepare_host() in
# build-images.sh. This section only verifies they are present.

- name: Assert VA-API packages are pre-installed (baked by prepare_host)
  ansible.builtin.command:
    cmd: "dpkg -l {{ item }}"
  loop: "{{ _igpu_vaapi_packages }}"
  changed_when: false
  failed_when: false
  register: _vaapi_pkg_check
  when: igpu_available | bool

- name: Hard-fail if VA-API packages are missing
  ansible.builtin.fail:
    msg: >-
      HARD FAILURE: VA-API package '{{ item.item }}' not installed on {{ inventory_hostname }}.
      Run: ./scripts/build-images.sh --host {{ ansible_host }} --only <any>
      (prepare_host installs VA-API packages automatically)
  loop: "{{ _vaapi_pkg_check.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('N/A') }}"
  when:
    - igpu_available | bool
    - item.rc is defined
    - item.rc != 0

- name: Run vainfo to verify VA-API
  ansible.builtin.command:
    cmd: vainfo
  register: _vainfo
  changed_when: false
  failed_when: false
  when: igpu_available | bool
  environment:
    DISPLAY: ""
    LIBVA_DRIVER_NAME: "{{ _igpu_libva_driver }}"

- name: Display vainfo output
  ansible.builtin.debug:
    var: _vainfo.stdout_lines
  when:
    - igpu_available | bool
    - _vainfo.rc == 0

- name: Warn if vainfo failed
  ansible.builtin.debug:
    msg: >-
      WARNING: vainfo failed (rc={{ _vainfo.rc }}).
      VA-API transcoding may not be available.
      stderr: {{ _vainfo.stderr | default('') }}
  when:
    - igpu_available | bool
    - _vainfo.rc != 0

# ── Summary ───────────────────────────────────────────────────────

- name: Display iGPU detection summary
  ansible.builtin.debug:
    msg: |
      iGPU Detection Summary:
        available:     {{ igpu_available }}
        vendor:        {{ igpu_vendor }}
        pci_address:   {{ igpu_pci_address }}
        render_device: {{ igpu_render_device }}
        card_device:   {{ igpu_card_device }}
        render_gid:    {{ igpu_render_gid }}
        video_gid:     {{ igpu_video_gid }}
        driver:        {{ _igpu_driver | default('n/a') }}
        vainfo_ok:     {{ (_vainfo.rc | default(1)) == 0 }}

# ── Register iGPU state with Manager ─────────────────────────────

- name: Register iGPU with Manager
  ansible.builtin.include_tasks: "{{ project_root }}/tasks/manager_register.yml"
  vars:
    register_path: "api/host/{{ inventory_hostname }}/hardware"
    register_body:
      ip: "{{ ansible_host }}"
      igpu:
        vendor: "{{ igpu_vendor }}"
        driver: "{{ _igpu_driver }}"
        pci_address: "{{ igpu_pci_address }}"
        render_device: "{{ igpu_render_device }}"
        render_gid: "{{ igpu_render_gid | int }}"
        video_gid: "{{ igpu_video_gid | int }}"
  when: igpu_available | bool
