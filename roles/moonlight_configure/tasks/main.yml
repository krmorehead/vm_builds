---
# moonlight-embedded, sway, wayvnc, and websockify are baked into the image
# by build-images.sh. This role handles ONLY host-specific config: server
# address, resolution, codec settings, and optional pairing.

# ── Verify moonlight-embedded is available ───────────────────────

- name: Verify moonlight-embedded installed in container
  ansible.builtin.command:
    cmd: pct exec {{ moonlight_ct_id }} -- test -x /usr/local/bin/moonlight
  register: _moonlight_bin
  changed_when: false
  failed_when: _moonlight_bin.rc != 0

# ── Deploy Moonlight configuration ──────────────────────────────

- name: Write Moonlight config to host temp
  ansible.builtin.template:
    src: moonlight.conf.j2
    dest: /tmp/moonlight.conf
    mode: "0644"

- name: Push config into container
  ansible.builtin.command:
    cmd: pct push {{ moonlight_ct_id }} /tmp/moonlight.conf /etc/moonlight.conf
  changed_when: true

- name: Clean up host temp file
  ansible.builtin.file:
    path: /tmp/moonlight.conf
    state: absent

# ── Server pairing (optional) ───────────────────────────────────

- name: Pair with Sunshine server
  ansible.builtin.shell:
    cmd: >-
      pct exec {{ moonlight_ct_id }} -- bash -c
      'echo {{ moonlight_pair_pin }} | /usr/local/bin/moonlight pair {{ moonlight_server_ip }} --pin {{ moonlight_pair_pin }}'
    executable: /bin/bash
  no_log: true
  when:
    - moonlight_server_ip | default('', true) | length > 0
    - moonlight_pair_pin | default('', true) | length > 0
  register: _moonlight_pair
  changed_when: "'Successfully' in _moonlight_pair.stdout or 'Already paired' in _moonlight_pair.stdout"
  failed_when: false

# ── Report completion ────────────────────────────────────────────

- name: Report Moonlight configuration
  ansible.builtin.debug:
    msg: >-
      Moonlight configured successfully!
      Server: {{ moonlight_server_ip | default('not set', true) }}
      Resolution: {{ moonlight_resolution }}@{{ moonlight_fps }}fps
      Codec: {{ moonlight_codec }}, Bitrate: {{ moonlight_bitrate }}kbps
      Display: headless Wayland (sway + wayvnc) via VNC
      VNC port: {{ moonlight_vnc_ws_port | default('6083') }}
      Pairing: {{ 'attempted'
        if (moonlight_server_ip | default('', true) | length > 0
            and moonlight_pair_pin | default('', true) | length > 0)
        else 'skipped (set MOONLIGHT_SERVER_IP + MOONLIGHT_PAIR_PIN)' }}
