---
# moonlight-embedded and KasmVNC display service are baked into the image
# by build-images.sh. This role handles ONLY host-specific config: server
# address, resolution, codec settings, and optional pairing.
# Binary verification lives in molecule verify, not here.
# All operations go through the Node Manager API over VPN.

# ── Deploy Moonlight configuration via NM API ───────────────────

- name: Build Moonlight config content
  ansible.builtin.set_fact:
    _moonlight_conf: |
      # Moonlight Embedded configuration
      # Managed by Ansible — do not edit manually
      {% if moonlight_server_ip | default('', true) | length > 0 %}
      address = {{ moonlight_server_ip }}
      {% endif %}
      width = {{ moonlight_resolution.split('x')[0] }}
      height = {{ moonlight_resolution.split('x')[1] }}
      fps = {{ moonlight_fps }}
      codec = {{ moonlight_codec }}
      bitrate = {{ moonlight_bitrate }}
      platform = sdl
      nosops = true
      localaudio = false
      remote = yes

- name: Push Moonlight config via NM API
  ansible.builtin.uri:
    url: "{{ nm_api_url }}/api/config/{{ moonlight_ct_id }}/file"
    headers: "{{ nm_auth_headers }}"
    method: POST
    body_format: json
    body:
      path: /etc/moonlight.conf
      content: "{{ _moonlight_conf }}"
      mode: "0644"
    status_code: 200
  delegate_to: localhost
  register: _push_result
  failed_when: not (_push_result.json.success | default(false))

# ── Server pairing via NM API (optional) ─────────────────────────

- name: Restart moonlight-display to pick up config changes
  ansible.builtin.uri:
    url: "{{ nm_api_url }}/api/config/{{ moonlight_ct_id }}/service/moonlight-display/restart"
    headers: "{{ nm_auth_headers }}"
    method: POST
    body_format: json
    body: {}
    status_code: 200
    timeout: 120
  delegate_to: localhost
  register: _restart_result
  retries: 5
  delay: 10
  when: moonlight_server_ip | default('', true) | length > 0
  until: >-
    (_restart_result.status | default(0)) == 200
    or ('not found' in (_restart_result.json.output | default('')))
  failed_when: >-
    _restart_result.json is defined
    and not (_restart_result.json.success | default(false))
    and 'not found' not in (_restart_result.json.output | default(''))

# ── Report completion ────────────────────────────────────────────

- name: Fail if Moonlight server IP is not configured
  ansible.builtin.assert:
    that:
      - moonlight_server_ip | default('', true) | length > 0
    fail_msg: "moonlight_server_ip is empty. Set MOONLIGHT_SERVER_IP in .env"
  when: moonlight_require_server | default(false) | bool

- name: Report Moonlight configuration
  ansible.builtin.debug:
    msg: >-
      Moonlight configured successfully via NM API!
      Server: {{ moonlight_server_ip | default('not set', true) }}
      Resolution: {{ moonlight_resolution }}@{{ moonlight_fps }}fps
      Codec: {{ moonlight_codec }}, Bitrate: {{ moonlight_bitrate }}kbps
      Display: KasmVNC (X11)
      Display port: {{ moonlight_ws_port | default('6083') }}
