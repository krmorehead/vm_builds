---
- name: Check if Desktop VM already exists
  ansible.builtin.command:
    cmd: qm status {{ desktop_vm_id }}
  register: _desktop_vm_status
  failed_when: false
  changed_when: false

- name: Set VM existence flag
  ansible.builtin.set_fact:
    _desktop_vm_exists: "{{ _desktop_vm_status.rc == 0 }}"
    _lxc_exists: "{{ _desktop_vm_status.rc == 0 }}"

- name: Resolve deployed Desktop version
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/resolve_deployed_version.yml"
  vars:
    _resolve_service_name: desktop

- name: Reset VM version rebuild flag
  ansible.builtin.set_fact:
    _vm_version_rebuild: false

# ── Image version check (auto-rebuild on version mismatch) ──────

- name: Check image version on existing Desktop VM
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/../../tasks/check_vm_image_version.yml"
  vars:
    image_version_vm_id: "{{ desktop_vm_id }}"
    image_version_expected: "{{ desktop_image_version }}"
    image_version_service: "Desktop VM"
  when:
    - _desktop_vm_exists | bool
    - desktop_image_version | default('') | length > 0

- name: Clear existence flag after version-triggered rebuild
  ansible.builtin.set_fact:
    _desktop_vm_exists: "false"
  when:
    - _vm_version_rebuild is defined
    - _vm_version_rebuild | bool

# ── Verify custom image exists ─────────────────────────────────────

- name: Resolve Desktop image source path
  ansible.builtin.set_fact:
    _desktop_image_src: >-
      {{ desktop_vm_image_path
         if desktop_vm_image_path.startswith('/')
         else (project_root + '/' + desktop_vm_image_path) }}
  when: not _desktop_vm_exists | bool

- name: Check Desktop image exists
  ansible.builtin.stat:
    path: "{{ _desktop_image_src }}"
  register: _desktop_image_stat
  delegate_to: localhost
  when: not _desktop_vm_exists | bool

- name: Fail if Desktop image is missing
  ansible.builtin.fail:
    msg: >-
      Desktop VM image not found: {{ desktop_vm_image_path }}.
      Build it with: ./build-images.sh --host <proxmox-ip> --only desktop
  when:
    - not _desktop_vm_exists | bool
    - not (_desktop_image_stat.stat.exists | default(false))

# ── Verify iGPU facts available ────────────────────────────────────

- name: Fail if iGPU PCI address not available
  ansible.builtin.fail:
    msg: >-
      igpu_pci_address not set. Run proxmox_igpu role first.
      Desktop VM requires exclusive iGPU passthrough.
  when:
    - not _desktop_vm_exists | bool
    - igpu_pci_address is not defined or igpu_pci_address | length == 0

# ── SSH key preparation ────────────────────────────────────────────

- name: Set SSH key availability flag
  ansible.builtin.set_fact:
    _desktop_has_ssh_key: "{{ desktop_ssh_public_key | default('') | trim | length > 0 }}"

- name: Remove stale SSH key files before generation
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/desktop_tmp_key
    - /tmp/desktop_tmp_key.pub
  when:
    - not _desktop_vm_exists | bool
    - not (_desktop_has_ssh_key | bool)

- name: Generate temporary SSH keypair on Proxmox host
  ansible.builtin.command:
    cmd: ssh-keygen -t ed25519 -f /tmp/desktop_tmp_key -N "" -C desktop-ansible-tmp
  when:
    - not _desktop_vm_exists | bool
    - not (_desktop_has_ssh_key | bool)

- name: Fetch temporary private key to controller
  ansible.builtin.fetch:
    src: /tmp/desktop_tmp_key
    dest: /tmp/desktop_tmp_key
    flat: true
  when:
    - not _desktop_vm_exists | bool
    - not (_desktop_has_ssh_key | bool)

- name: Set private key permissions on controller
  ansible.builtin.file:
    path: /tmp/desktop_tmp_key
    mode: "0600"
  delegate_to: localhost
  when:
    - not _desktop_vm_exists | bool
    - not (_desktop_has_ssh_key | bool)

- name: Write operator SSH public key to temp file
  ansible.builtin.copy:
    content: "{{ desktop_ssh_public_key }}"
    dest: /tmp/desktop_ssh_key.pub
    mode: "0644"
  when:
    - not _desktop_vm_exists | bool
    - _desktop_has_ssh_key | bool

- name: Set SSH key path fact
  ansible.builtin.set_fact:
    _desktop_ssh_pubkey_path: >-
      {{ '/tmp/desktop_ssh_key.pub' if (_desktop_has_ssh_key | bool)
         else '/tmp/desktop_tmp_key.pub' }}
    _desktop_ssh_key_file: "{{ '' if (_desktop_has_ssh_key | bool) else '/tmp/desktop_tmp_key' }}"

# ── Image upload ───────────────────────────────────────────────────

- name: Set upload destination path
  ansible.builtin.set_fact:
    _desktop_tmp_upload: "{{ desktop_tmp_image_dir }}/{{ _desktop_image_src | basename }}"
  when: not _desktop_vm_exists | bool

- name: Upload Desktop image to Proxmox node
  ansible.builtin.copy:
    src: "{{ _desktop_image_src }}"
    dest: "{{ _desktop_tmp_upload }}"
    mode: "0644"
  when: not _desktop_vm_exists | bool

# ── Create VM with all static settings in one call ─────────────────

- name: Create Desktop VM (UEFI + q35 + iGPU + NIC)
  ansible.builtin.command:
    cmd: >-
      qm create {{ desktop_vm_id }}
      --name desktop
      --memory {{ desktop_vm_memory }}
      --cores {{ desktop_vm_cores }}
      --ostype l26
      --machine q35
      --bios ovmf
      --efidisk0 {{ proxmox_storage }}:1,format=raw,efitype=4m,pre-enrolled-keys=0
      --scsihw virtio-scsi-pci
      --serial0 socket
      --vga std
      --agent enabled=1
      --net0 virtio,bridge={{ proxmox_wan_bridge }}
      --hostpci0 host={{ igpu_pci_address }},pcie=1
      --ide2 {{ proxmox_storage }}:cloudinit
      --onboot {{ '1' if desktop_vm_onboot else '0' }}
  changed_when: true
  when: not _desktop_vm_exists | bool

# ── Disk import and boot config ────────────────────────────────────

- name: Import disk image into VM storage
  ansible.builtin.command:
    cmd: >-
      qm importdisk {{ desktop_vm_id }}
      {{ _desktop_tmp_upload }}
      {{ proxmox_storage }}
  register: _desktop_disk_import
  changed_when: true
  when: not _desktop_vm_exists | bool

- name: Parse imported disk path
  ansible.builtin.set_fact:
    _desktop_imported_disk: >-
      {{ _desktop_disk_import.stdout
         | regex_search("imported disk '([^']+)'", '\1')
         | first }}
  when: not _desktop_vm_exists | bool

- name: Attach disk, boot order, cloud-init user, and SSH keys
  ansible.builtin.command:
    cmd: >-
      qm set {{ desktop_vm_id }}
      --scsi0 {{ _desktop_imported_disk }}
      --boot order=scsi0
      --ciuser {{ desktop_user }}
      --cipassword {{ desktop_password }}
      --sshkeys {{ _desktop_ssh_pubkey_path }}
      --ipconfig0 ip=dhcp
  no_log: true
  changed_when: true
  when: not _desktop_vm_exists | bool

- name: Resize boot disk
  ansible.builtin.command:
    cmd: >-
      qm resize {{ desktop_vm_id }}
      scsi0 {{ desktop_vm_disk_size }}
  changed_when: true
  when: not _desktop_vm_exists | bool

# ── Clean up temp files ────────────────────────────────────────────

- name: Clean up SSH public key temp files on Proxmox host
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/desktop_ssh_key.pub
    - /tmp/desktop_tmp_key.pub

- name: Clean up uploaded image
  ansible.builtin.file:
    path: "{{ _desktop_tmp_upload | default('') }}"
    state: absent
  when: _desktop_tmp_upload is defined and _desktop_tmp_upload | length > 0

- name: Stamp image version on VM description
  ansible.builtin.command:
    cmd: >-
      qm set {{ desktop_vm_id }}
      --description "image_version={{ desktop_image_version }}"
  changed_when: true
  when: desktop_image_version | default('') | length > 0

# ── Hookscript attachment ──────────────────────────────────────────

# ── Start VM and discover IP ──────────────────────────────────────

- name: Start Desktop VM
  community.proxmox.proxmox_kvm:
    node: "{{ proxmox_node }}"
    api_host: "{{ proxmox_api_host }}"
    api_user: "{{ proxmox_api_user }}"
    api_token_id: "{{ proxmox_api_token_id }}"
    api_token_secret: "{{ proxmox_api_token_secret }}"
    vmid: "{{ desktop_vm_id }}"
    state: started
  delegate_to: localhost

- name: Wait for QEMU Guest Agent to respond
  ansible.builtin.command:
    cmd: qm agent {{ desktop_vm_id }} ping
  register: _desktop_agent_ping
  retries: 60
  delay: 10
  until: _desktop_agent_ping.rc == 0
  changed_when: false
  failed_when: false

- name: Desktop VM boot diagnostics (agent not responding)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      echo "VM_STATUS=$(qm status {{ desktop_vm_id }} 2>&1)"
      echo "HOSTPCI=$(qm config {{ desktop_vm_id }} | grep hostpci || echo 'none')"
      echo "DRI_USERS=$(lsof /dev/dri/renderD* 2>/dev/null | wc -l || echo 0)"
      echo "VFIO_BOUND=$(ls /sys/bus/pci/drivers/vfio-pci/ 2>/dev/null | grep -c ':' || echo 0)"
      echo "I915_BOUND=$(ls /sys/bus/pci/drivers/i915/ 2>/dev/null | grep -c ':' || echo 0)"
    executable: /bin/bash
  register: _desktop_boot_diag
  changed_when: false
  when: _desktop_agent_ping.rc != 0

- name: Display Desktop VM boot diagnostics
  ansible.builtin.debug:
    var: _desktop_boot_diag.stdout_lines
  when: _desktop_agent_ping.rc != 0

- name: Fail if QEMU Guest Agent never responded
  ansible.builtin.fail:
    msg: >-
      Desktop VM guest agent did not respond after 10 minutes.
      VM may have failed to boot (check iGPU passthrough and DRI conflicts).
      Diagnostics: {{ _desktop_boot_diag.stdout_lines | default([]) | join(', ') }}
  when: _desktop_agent_ping.rc != 0

- name: Get Desktop VM IP via QEMU Guest Agent
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      qm agent {{ desktop_vm_id }} network-get-interfaces 2>/dev/null |
      python3 -c 'import sys,json; data=json.load(sys.stdin);
      [print(a["ip-address"]) or sys.exit(0)
      for i in (data.get("result",data) if isinstance(data,dict) else data)
      if i.get("name")!="lo"
      for a in i.get("ip-addresses",[])
      if a.get("ip-address-type")=="ipv4"]'
    executable: /bin/bash
  register: _desktop_ip_agent
  changed_when: false
  retries: 10
  delay: 5
  until: (_desktop_ip_agent.stdout | default('') | trim) | length > 0

- name: Set Desktop VM IP fact
  ansible.builtin.set_fact:
    _desktop_vm_ip: "{{ _desktop_ip_agent.stdout | trim }}"

- name: Wait for SSH on Desktop VM
  ansible.builtin.wait_for:
    host: "{{ _desktop_vm_ip }}"
    port: 22
    delay: 5
    timeout: 300

# ── Register in dynamic inventory ──────────────────────────────────

- name: Add Desktop VM to dynamic inventory
  ansible.builtin.add_host:
    name: "desktop-{{ inventory_hostname }}"
    groups: desktop
    ansible_host: "{{ _desktop_vm_ip }}"
    ansible_user: "{{ desktop_user }}"
    ansible_connection: ansible.builtin.ssh
    ansible_ssh_private_key_file: "{{ _desktop_ssh_key_file | default('') }}"
    ansible_ssh_common_args: >-
      -o ProxyJump=root@{{ ansible_host }}
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
      -o ServerAliveInterval=15
      -o ServerAliveCountMax=4
      -o ConnectTimeout=30
    ansible_ssh_timeout: 30
    desktop_proxmox_host: "{{ inventory_hostname }}"
    desktop_vm_id_ref: "{{ desktop_vm_id }}"
    igpu_vendor: "{{ igpu_vendor | default('intel') }}"

# ── Register VM with Manager ─────────────────────────────────────

- name: Register Desktop VM with Manager
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/manager_register.yml"
  vars:
    register_path: "api/host/{{ inventory_hostname }}/containers/{{ desktop_vm_id }}"
    register_body:
      service_type: desktop_vm
      hostname: "desktop-{{ inventory_hostname }}"
      state: running
      ip: "{{ _desktop_vm_ip }}"
      bridge: "{{ proxmox_all_bridges[0] | default('') }}"
      hardware: []
      last_deployed: "{{ ansible_date_time.iso8601 }}"

# ── Desktop VNC WebSocket bridge ─────────────────────────────────
# Proxmox QEMU creates /var/run/qemu-server/{vmid}.vnc when the VM runs.
# websockify bridges this Unix socket to a WebSocket port for noVNC.

- name: Ensure python3-websockify is installed
  ansible.builtin.apt:
    name: python3-websockify
    state: present
    cache_valid_time: 86400

- name: Deploy desktop-vnc-ws systemd unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Desktop VM VNC WebSocket bridge
      ConditionPathExists=/var/run/qemu-server/{{ desktop_vm_id }}.vnc

      [Service]
      ExecStart=/usr/bin/websockify 0.0.0.0:{{ desktop_vnc_ws_port }} --unix-target=/var/run/qemu-server/{{ desktop_vm_id }}.vnc
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/desktop-vnc-ws.service
    mode: "0644"

- name: Enable and start desktop-vnc-ws
  ansible.builtin.systemd:
    name: desktop-vnc-ws
    daemon_reload: true
    enabled: true
    state: restarted

# ── Port forwarding for Desktop VNC WebSocket ────────────────────

- name: Add DNAT rule for Desktop VNC WebSocket (WAN hosts)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      WAN_IF="{{ proxmox_wan_bridge }}"
      if ! iptables -t nat -C PREROUTING -i "$WAN_IF" -p tcp --dport {{ desktop_vnc_ws_port }} \
           -j DNAT --to-destination 127.0.0.1:{{ desktop_vnc_ws_port }} 2>/dev/null; then
        iptables -t nat -A PREROUTING -i "$WAN_IF" -p tcp --dport {{ desktop_vnc_ws_port }} \
          -j DNAT --to-destination 127.0.0.1:{{ desktop_vnc_ws_port }}
      fi
    executable: /bin/bash
  when:
    - inventory_hostname not in groups.get('router_nodes', [])
    - inventory_hostname not in groups.get('lan_hosts', [])
  changed_when: true
