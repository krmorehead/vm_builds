---
# ── Ensure container is running ──────────────────────────────────

- name: Check Kiosk container status
  ansible.builtin.command:
    cmd: pct status {{ kiosk_ct_id }}
  register: _kiosk_status
  changed_when: false
  failed_when: false

- name: Start Kiosk container if stopped
  ansible.builtin.command:
    cmd: pct start {{ kiosk_ct_id }}
  when: "'stopped' in (_kiosk_status.stdout | default(''))"
  changed_when: true

- name: Wait for Kiosk container to be ready
  ansible.builtin.command:
    cmd: pct exec {{ kiosk_ct_id }} -- ls /
  register: _kiosk_ready
  retries: 10
  delay: 3
  until: _kiosk_ready.rc == 0
  changed_when: false
  when: "'stopped' in (_kiosk_status.stdout | default(''))"

# ── Verify Kiosk packages are available ──────────────────────────

- name: Verify Cage compositor installed in container
  ansible.builtin.command:
    cmd: pct exec {{ kiosk_ct_id }} -- dpkg -l cage
  register: _cage_pkg_check
  changed_when: false
  failed_when: _cage_pkg_check.rc != 0

# ── Configure iGPU access ───────────────────────────────────────

- name: Detect render group GID from host
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      stat -c '%g' /dev/dri/renderD* 2>/dev/null | head -1
    executable: /bin/bash
  register: _host_render_gid
  changed_when: false
  failed_when: false

- name: Set render GID (live device or cached fact)
  ansible.builtin.set_fact:
    _render_gid: >-
      {{ _host_render_gid.stdout | trim
         if (_host_render_gid.rc == 0 and _host_render_gid.stdout | trim | length > 0)
         else (igpu_render_gid | default('993')) }}

- name: Create render group and add kiosk user to groups
  ansible.builtin.shell:
    cmd: |
      pct exec {{ kiosk_ct_id }} -- bash -c '
        groupadd -g {{ _render_gid }} render 2>/dev/null || true
        usermod -a -G render,video kiosk 2>/dev/null || true
      '
    executable: /bin/bash
  changed_when: true

# ── Resolve LAN gateway for OpenWrt URL ─────────────────────────

- name: Read LAN gateway from generated env
  ansible.builtin.set_fact:
    _lan_gateway: >-
      {{ lookup('pipe', 'grep "^LAN_GATEWAY=" ' + env_generated_path + ' 2>/dev/null | cut -d= -f2')
         | default('10.10.10.1', true) | trim }}

# ── Build node IP map for the per-host manager ──────────────────
# Maps node_id -> IP so the kiosk manager can SSH to sibling
# containers for metric collection. Uses static_ip facts exported
# by provision roles plus the OpenWrt router gateway.

- name: Build child Manager IP map (LAN hosts use container IP, WAN hosts use host IP with DNAT)
  ansible.builtin.set_fact:
    _child_manager_ips: >-
      {{ _child_manager_ips | default({})
         | combine({item:
             hostvars[item]['kiosk_static_ip']
             if ('router_nodes' in hostvars[item].get('group_names', [])
                 or 'lan_hosts' in hostvars[item].get('group_names', []))
             else hostvars[item]['ansible_host']
         })
      }}
  loop: "{{ groups.get('kiosk_nodes', []) | difference([inventory_hostname]) }}"
  when: >-
    item in hostvars
    and (hostvars[item]['kiosk_static_ip'] | default('')) | length > 0

- name: Build node IP map from topology facts
  ansible.builtin.set_fact:
    _kiosk_node_ips: >-
      {{ _kiosk_node_ips | default({})
         | combine({item.key: item.value})
      }}
  loop: "{{ _node_ip_entries | dict2items }}"
  vars:
    _node_ip_entries:
      home: "{{ ansible_host | default('') }}"
      openwrt: "{{ _lan_gateway | default('10.10.10.1') }}"
      pihole: "{{ pihole_static_ip | default('') }}"
      wireguard: "{{ wireguard_static_ip | default('') }}"
      netdata: "{{ netdata_static_ip | default('') }}"
      homeassistant: "{{ homeassistant_static_ip | default('') }}"
      jellyfin: "{{ jellyfin_static_ip | default('') }}"
      kodi: "{{ kodi_static_ip | default('') }}"
      moonlight: "{{ moonlight_static_ip | default('') }}"
      rsyslog: "{{ rsyslog_static_ip | default('') }}"
      bridge-1: "{{ hostvars['bridge-1']['ansible_host'] | default('') if 'bridge-1' in hostvars else '' }}"
      bridge-2: "{{ hostvars['bridge-2']['ansible_host'] | default('') if 'bridge-2' in hostvars else '' }}"
      mesh1: "{{ hostvars['mesh1']['ansible_host'] | default('') if 'mesh1' in hostvars else '' }}"
      mesh2: "{{ hostvars['mesh2']['ansible_host'] | default('') if 'mesh2' in hostvars else '' }}"
      ai: "{{ hostvars['ai']['ansible_host'] | default('') if 'ai' in hostvars else '' }}"
  when: item.value | length > 0

# ── Build service URLs from topology facts ─────────────────────
# Each URL resolves in priority order:
#   1. Explicit override from role defaults (operator-provided)
#   2. Auto-computed from the service's exported static_ip fact
#   3. Empty string (card renders as "Not available" on dashboard)

- name: Build service URLs from LAN topology
  ansible.builtin.set_fact:
    _kiosk_urls:
      DESKTOP_URL: >-
        {{ kiosk_desktop_url if kiosk_desktop_url | length > 0
           else '' }}
      JELLYFIN_URL: >-
        {{ kiosk_jellyfin_url if kiosk_jellyfin_url | length > 0
           else ('http://' + jellyfin_static_ip + ':8096')
                if (jellyfin_static_ip | default('')) | length > 0
           else '' }}
      KODI_URL: >-
        {{ kiosk_kodi_url if kiosk_kodi_url | length > 0
           else ('http://' + kodi_static_ip + ':8080')
                if (kodi_static_ip | default('')) | length > 0
           else '' }}
      HOMEASSISTANT_URL: >-
        {{ kiosk_homeassistant_url if kiosk_homeassistant_url | length > 0
           else ('http://' + homeassistant_static_ip + ':8123')
                if (homeassistant_static_ip | default('')) | length > 0
           else '' }}
      MOONLIGHT_URL: >-
        {{ kiosk_moonlight_url if kiosk_moonlight_url | length > 0
           else '' }}
      GAMING_URL: >-
        {{ kiosk_gaming_url if kiosk_gaming_url | length > 0
           else ('https://' + gaming_static_ip + ':47990')
                if (gaming_static_ip | default('')) | length > 0
           else '' }}
      OPENWRT_URL: >-
        {{ kiosk_openwrt_url if kiosk_openwrt_url | length > 0
           else ('http://' + _lan_gateway)
                if (_lan_gateway | default('')) | length > 0
           else '' }}
      PIHOLE_URL: >-
        {{ kiosk_pihole_url if kiosk_pihole_url | length > 0
           else ('http://' + pihole_static_ip + '/admin')
                if (pihole_static_ip | default('')) | length > 0
           else '' }}
      WIREGUARD_URL: >-
        {{ kiosk_wireguard_url if kiosk_wireguard_url | length > 0
           else '' }}
      NETDATA_URL: >-
        {{ kiosk_netdata_url if kiosk_netdata_url | length > 0
           else ('http://' + netdata_static_ip + ':19999')
                if (netdata_static_ip | default('')) | length > 0
           else '' }}
      RSYSLOG_URL: >-
        {{ kiosk_rsyslog_url if kiosk_rsyslog_url | length > 0
           else '' }}
      MANAGEMENT_SERVER: >-
        {{ kiosk_management_server if (kiosk_management_server | default('')) | length > 0
           else callhome_server }}
      CALLHOME_SERVER: "{{ callhome_server }}"
      CALLHOME_PUBLIC_KEY: "{{ callhome_public_key }}"
      MESH_KEY: "{{ lookup('env', 'MESH_KEY') | default('', true) }}"
      HOST_IP: "{{ ansible_host }}"
      HOST_NAME: "{{ inventory_hostname }}"
      IS_CLUSTER_MANAGER: "{{ 'true' if inventory_hostname in groups.get('router_nodes', []) else 'false' }}"
      CHILD_MANAGER_IPS: >-
        {{ _child_manager_ips | default({}) }}
      NODE_IPS: >-
        {{ _kiosk_node_ips | default({}) }}

# ── Deploy NiceGUI webui files and service URL config ─────────────

- name: Create host temp directory for webui files
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /tmp/kiosk_webui
    - /tmp/kiosk_webui/pages

- name: Copy build.py to host temp directory
  ansible.builtin.copy:
    src: "{{ project_root }}/build.py"
    dest: /tmp/kiosk_build.py
    mode: "0644"

- name: Copy webui source files to host temp directory
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/tmp/kiosk_webui/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: "{{ project_root }}/scripts/webui/__init__.py", dest: "__init__.py" }
    - { src: "{{ project_root }}/scripts/webui/theme.py", dest: "theme.py" }
    - { src: "{{ project_root }}/scripts/webui/data.py", dest: "data.py" }
    - { src: "{{ project_root }}/scripts/webui/heartbeat.py", dest: "heartbeat.py" }
    - { src: "{{ project_root }}/scripts/webui/manager.py", dest: "manager.py" }
    - { src: "{{ project_root }}/scripts/webui/kiosk_server.py", dest: "kiosk_server.py" }
    - { src: "{{ project_root }}/scripts/webui/pages/__init__.py", dest: "pages/__init__.py" }
    - { src: "{{ project_root }}/scripts/webui/pages/hub.py", dest: "pages/hub.py" }
    - { src: "{{ project_root }}/scripts/webui/pages/bridge.py", dest: "pages/bridge.py" }
    - { src: "{{ project_root }}/scripts/webui/pages/mesh.py", dest: "pages/mesh.py" }
    - { src: "{{ project_root }}/scripts/webui/pages/router.py", dest: "pages/router.py" }
    - { src: "{{ project_root }}/scripts/webui/pages/viewer.py", dest: "pages/viewer.py" }
    - { src: "{{ project_root }}/scripts/webui/pages/launch.py", dest: "pages/launch.py" }
    - { src: "{{ project_root }}/scripts/webui/pages/containers.py", dest: "pages/containers.py" }
    - { src: "{{ project_root }}/scripts/webui/pages/cluster_dashboard.py", dest: "pages/cluster_dashboard.py" }

- name: Build service URL config JSON
  ansible.builtin.set_fact:
    _kiosk_config_json: "{{ _kiosk_urls | to_json }}"

- name: Write config JSON to host temp
  ansible.builtin.copy:
    content: "{{ _kiosk_config_json }}"
    dest: /tmp/kiosk_config.json
    mode: "0644"

- name: Create tarball of webui files, build.py, and config on host
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      tar czf /tmp/kiosk_payload.tar.gz \
        -C /tmp/kiosk_webui . \
        -C /tmp kiosk_build.py kiosk_config.json
    executable: /bin/bash
  changed_when: true

- name: Push tarball into container and extract
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      pct push {{ kiosk_ct_id }} /tmp/kiosk_payload.tar.gz /tmp/kiosk_payload.tar.gz
      pct exec {{ kiosk_ct_id }} -- bash -c '
        rm -rf /opt/kiosk/webui /opt/kiosk/scripts
        mkdir -p /opt/kiosk/scripts/webui/pages
        touch /opt/kiosk/scripts/__init__.py
        tar xzf /tmp/kiosk_payload.tar.gz -C /opt/kiosk/scripts/webui/ \
          ./__init__.py ./theme.py ./data.py ./heartbeat.py ./manager.py \
          ./kiosk_server.py ./pages
        tar xzf /tmp/kiosk_payload.tar.gz -C /opt/kiosk/ \
          kiosk_build.py kiosk_config.json
        mv /opt/kiosk/kiosk_build.py /opt/kiosk/build.py
        mv /opt/kiosk/kiosk_config.json /opt/kiosk/config.json
        rm -f /tmp/kiosk_payload.tar.gz
      '
    executable: /bin/bash
  changed_when: true

- name: Set ownership on kiosk files
  ansible.builtin.command:
    cmd: pct exec {{ kiosk_ct_id }} -- chown -R kiosk:kiosk /opt/kiosk
  changed_when: true

- name: Clean up host temp files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/kiosk_webui
    - /tmp/kiosk_config.json
    - /tmp/kiosk_build.py
    - /tmp/kiosk_payload.tar.gz

# ── SSH key for host management ──────────────────────────────────
# The kiosk manager needs SSH access to the Proxmox host to run
# pct/qm commands for container/VM lifecycle management.

- name: Generate SSH key inside kiosk container if absent
  ansible.builtin.shell:
    cmd: |
      pct exec {{ kiosk_ct_id }} -- bash -c '
        if [ ! -f /home/kiosk/.ssh/id_ed25519 ]; then
          mkdir -p /home/kiosk/.ssh
          ssh-keygen -t ed25519 -f /home/kiosk/.ssh/id_ed25519 -N "" -q
          chown -R kiosk:kiosk /home/kiosk/.ssh
          chmod 700 /home/kiosk/.ssh
          chmod 600 /home/kiosk/.ssh/id_ed25519
        fi
      '
    executable: /bin/bash
  changed_when: true

- name: Read kiosk public key from container
  ansible.builtin.command:
    cmd: pct exec {{ kiosk_ct_id }} -- cat /home/kiosk/.ssh/id_ed25519.pub
  register: _kiosk_pubkey
  changed_when: false

- name: Authorize kiosk key on Proxmox host
  ansible.posix.authorized_key:
    user: root
    key: "{{ _kiosk_pubkey.stdout }}"
    comment: "kiosk-manager-{{ inventory_hostname }}"
    state: present

# ── Patch systemd service to match deployed file layout ─────────
- name: Update kiosk-web ExecStart to correct path and port
  ansible.builtin.shell:
    cmd: |
      pct exec {{ kiosk_ct_id }} -- bash -c '
        sed -i "s|^ExecStart=.*kiosk_server.py.*|ExecStart=/usr/bin/python3 /opt/kiosk/scripts/webui/kiosk_server.py --port {{ kiosk_manager_port }}|" \
          /etc/systemd/system/kiosk-web.service
        systemctl daemon-reload
      '
    executable: /bin/bash
  changed_when: true

# ── Enable and restart kiosk services ───────────────────────────

- name: Enable and restart kiosk-web (Manager API)
  ansible.builtin.shell:
    cmd: |
      pct exec {{ kiosk_ct_id }} -- bash -c '
        systemctl enable kiosk-web
        systemctl restart kiosk-web
      '
    executable: /bin/bash
  changed_when: true

- name: Enable kiosk-display (headless-safe)
  ansible.builtin.shell:
    cmd: |
      pct exec {{ kiosk_ct_id }} -- bash -c '
        systemctl enable kiosk-display
        systemctl start kiosk-display 2>/dev/null || true
      '
    executable: /bin/bash
  changed_when: true
  failed_when: false

# ── Report completion ────────────────────────────────────────────

- name: Report Kiosk configuration
  ansible.builtin.debug:
    msg: >-
      Kiosk configured on {{ inventory_hostname }}:
      Desktop={{ _kiosk_urls.DESKTOP_URL | trim | default('n/a', true) }},
      Jellyfin={{ _kiosk_urls.JELLYFIN_URL | trim | default('n/a', true) }},
      Kodi={{ _kiosk_urls.KODI_URL | trim | default('n/a', true) }},
      HomeAssistant={{ _kiosk_urls.HOMEASSISTANT_URL | trim | default('n/a', true) }},
      Moonlight={{ _kiosk_urls.MOONLIGHT_URL | trim | default('n/a', true) }},
      Gaming={{ _kiosk_urls.GAMING_URL | trim | default('n/a', true) }},
      Router={{ _kiosk_urls.OPENWRT_URL | trim | default('n/a', true) }},
      Pi-hole={{ _kiosk_urls.PIHOLE_URL | trim | default('n/a', true) }},
      WireGuard={{ _kiosk_urls.WIREGUARD_URL | trim | default('n/a', true) }},
      Netdata={{ _kiosk_urls.NETDATA_URL | trim | default('n/a', true) }},
      rsyslog={{ _kiosk_urls.RSYSLOG_URL | trim | default('n/a', true) }}
