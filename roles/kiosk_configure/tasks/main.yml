---
# Webui Python files, build.py, systemd units, and service enablement are
# baked into the image by build-images.sh. This role handles ONLY
# host-specific runtime config: render GID, config.json, SSH keys.

# ── Ensure container is running ──────────────────────────────────

- name: Check Kiosk container status
  ansible.builtin.command:
    cmd: pct status {{ kiosk_ct_id }}
  register: _kiosk_status
  changed_when: false
  failed_when: false

- name: Start Kiosk container if stopped
  ansible.builtin.command:
    cmd: pct start {{ kiosk_ct_id }}
  when: "'stopped' in (_kiosk_status.stdout | default(''))"
  changed_when: true

- name: Wait for Kiosk container to be ready
  ansible.builtin.command:
    cmd: pct exec {{ kiosk_ct_id }} -- ls /
  register: _kiosk_ready
  retries: 10
  delay: 3
  until: _kiosk_ready.rc == 0
  changed_when: false
  when: "'stopped' in (_kiosk_status.stdout | default(''))"

# ── Configure iGPU access ───────────────────────────────────────

- name: Detect render group GID from host
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      stat -c '%g' /dev/dri/renderD* 2>/dev/null | head -1
    executable: /bin/bash
  register: _host_render_gid
  changed_when: false
  failed_when: false

- name: Set render GID (live device or cached fact)
  ansible.builtin.set_fact:
    _render_gid: >-
      {{ _host_render_gid.stdout | trim
         if (_host_render_gid.rc == 0 and _host_render_gid.stdout | trim | length > 0)
         else (igpu_render_gid | default('993')) }}

- name: Create render group and add kiosk user to groups
  ansible.builtin.shell:
    cmd: |
      pct exec {{ kiosk_ct_id }} -- bash -c '
        groupadd -g {{ _render_gid }} render 2>/dev/null || groupmod -g {{ _render_gid }} render 2>/dev/null || true
        usermod -a -G render,video kiosk 2>/dev/null || true
      '
    executable: /bin/bash
  changed_when: true

# ── Resolve LAN gateway for OpenWrt URL ─────────────────────────

- name: Read LAN gateway from generated env
  ansible.builtin.set_fact:
    _lan_gateway: >-
      {{ lookup('pipe', 'grep "^LAN_GATEWAY=" ' + env_generated_path + ' 2>/dev/null | cut -d= -f2')
         | default('10.10.10.1', true) | trim }}

# ── Build node IP map for the per-host manager ──────────────────

- name: Build child Manager IP map (LAN hosts use container IP, WAN hosts use host IP with DNAT)
  ansible.builtin.set_fact:
    _child_manager_ips: >-
      {{ _child_manager_ips | default({})
         | combine({item:
             hostvars[item]['kiosk_static_ip']
             if ('router_nodes' in hostvars[item].get('group_names', [])
                 or 'lan_hosts' in hostvars[item].get('group_names', []))
             else hostvars[item]['ansible_host']
         })
      }}
  loop: "{{ groups.get('kiosk_nodes', []) | difference([inventory_hostname]) }}"
  when: >-
    item in hostvars
    and (hostvars[item]['kiosk_static_ip'] | default('')) | length > 0

- name: Build node IP map — service container IPs (always LAN-reachable)
  ansible.builtin.set_fact:
    _kiosk_node_ips: >-
      {{ _kiosk_node_ips | default({})
         | combine({item.key: item.value})
      }}
  loop: "{{ _service_ip_entries | dict2items }}"
  vars:
    _service_ip_entries:
      openwrt: "{{ _lan_gateway | default('10.10.10.1') }}"
      pihole: "{{ pihole_static_ip | default('') }}"
      wireguard: "{{ wireguard_static_ip | default('') }}"
      netdata: "{{ netdata_static_ip | default('') }}"
      homeassistant: "{{ homeassistant_static_ip | default('') }}"
      jellyfin: "{{ jellyfin_static_ip | default('') }}"
      kodi: "{{ kodi_static_ip | default('') }}"
      moonlight: "{{ moonlight_static_ip | default('') }}"
      rsyslog: "{{ rsyslog_static_ip | default('') }}"
  when: item.value | length > 0

- name: Build node IP map — Proxmox host IPs (match kiosk-reachable routing)
  ansible.builtin.set_fact:
    _kiosk_node_ips: >-
      {{ _kiosk_node_ips | default({})
         | combine({item: _host_ip})
      }}
  loop: "{{ groups.get('kiosk_nodes', []) }}"
  vars:
    _host_ip: >-
      {{ (_lan_gateway.split('.')[0:3] | join('.') + '.' +
          (proxmox_lan_mgmt_ip_offset | default(2) | string))
         if ('router_nodes' in hostvars[item].get('group_names', []))
            and (_lan_gateway | default('')) | length > 0
         else hostvars[item]['ansible_host']
              if ('lan_hosts' in hostvars[item].get('group_names', []))
         else (container_subnet_prefix + '.' + (hostvars[item]['container_subnet_id'] | string) + '.1')
      }}
  when: item in hostvars

# ── Compute host IP reachable from the kiosk container ─────────
# Router nodes reach their host via the LAN management IP (10.10.10.2).
# LAN hosts (mesh1) use ansible_host directly — it's already the LAN IP.
# WAN containers reach their host via the NAT bridge gateway
# (10.99.{subnet_id}.1). Using ansible_host (the WAN IP) fails because
# LAN containers can't route to it, but for lan_hosts ansible_host IS
# the LAN IP.

- name: Compute kiosk-reachable host IP
  ansible.builtin.set_fact:
    _kiosk_host_ip: >-
      {{ _lan_gateway.split('.')[0:3] | join('.') + '.' +
         (proxmox_lan_mgmt_ip_offset | default(2) | string)
         if ('router_nodes' in group_names)
            and (_lan_gateway | default('')) | length > 0
         else ansible_host
              if ('lan_hosts' in group_names)
         else container_subnet_prefix + '.' + (container_subnet_id | string) + '.1'
              if (container_subnet_id | default('')) | string | length > 0
         else ansible_host }}

# ── Build service URLs from topology facts ─────────────────────

- name: Build service URLs from LAN topology
  ansible.builtin.set_fact:
    _kiosk_urls:
      DESKTOP_URL: >-
        {{ kiosk_desktop_url if kiosk_desktop_url | length > 0
           else '' }}
      JELLYFIN_URL: >-
        {{ kiosk_jellyfin_url if kiosk_jellyfin_url | length > 0
           else ('http://' + jellyfin_static_ip + ':8096')
                if (jellyfin_static_ip | default('')) | length > 0
           else '' }}
      KODI_URL: >-
        {{ kiosk_kodi_url if kiosk_kodi_url | length > 0
           else ('http://' + kodi_static_ip + ':8080')
                if (kodi_static_ip | default('')) | length > 0
           else '' }}
      HOMEASSISTANT_URL: >-
        {{ kiosk_homeassistant_url if kiosk_homeassistant_url | length > 0
           else ('http://' + homeassistant_static_ip + ':8123')
                if (homeassistant_static_ip | default('')) | length > 0
           else '' }}
      MOONLIGHT_URL: >-
        {{ kiosk_moonlight_url if kiosk_moonlight_url | length > 0
           else '' }}
      GAMING_URL: >-
        {{ kiosk_gaming_url if kiosk_gaming_url | length > 0
           else ('https://' + gaming_static_ip + ':47990')
                if (gaming_static_ip | default('')) | length > 0
           else '' }}
      OPENWRT_URL: >-
        {{ kiosk_openwrt_url if kiosk_openwrt_url | length > 0
           else ('http://' + _lan_gateway)
                if (_lan_gateway | default('')) | length > 0
           else '' }}
      PIHOLE_URL: >-
        {{ kiosk_pihole_url if kiosk_pihole_url | length > 0
           else ('http://' + pihole_static_ip + '/admin')
                if (pihole_static_ip | default('')) | length > 0
           else '' }}
      WIREGUARD_URL: >-
        {{ kiosk_wireguard_url if kiosk_wireguard_url | length > 0
           else '' }}
      NETDATA_URL: >-
        {{ kiosk_netdata_url if kiosk_netdata_url | length > 0
           else ('http://' + netdata_static_ip + ':19999')
                if (netdata_static_ip | default('')) | length > 0
           else '' }}
      RSYSLOG_URL: >-
        {{ kiosk_rsyslog_url if kiosk_rsyslog_url | length > 0
           else '' }}
      MANAGEMENT_SERVER: >-
        {{ kiosk_management_server if (kiosk_management_server | default('')) | length > 0
           else ('http://' + _kiosk_host_ip | trim + ':' + callhome_port)
                if inventory_hostname in groups.get('router_nodes', [])
           else (
             'http://' + hostvars[groups['router_nodes'][0]]['kiosk_static_ip'] + ':' + kiosk_manager_port
           ) if (
             groups.get('router_nodes', []) | length > 0
             and hostvars[groups['router_nodes'][0]].get('kiosk_static_ip', '') | length > 0
             and (inventory_hostname in groups.get('lan_hosts', [])
                  or inventory_hostname in groups.get('router_nodes', []))
           )
           else (
             'http://' + hostvars[groups['router_nodes'][0]]['ansible_host'] + ':' + kiosk_manager_port
           ) if (
             groups.get('router_nodes', []) | length > 0
           )
           else callhome_server }}
      CALLHOME_SERVER: "{{ callhome_server }}"
      CALLHOME_PUBLIC_KEY: "{{ callhome_public_key }}"
      MESH_KEY: "{{ lookup('env', 'MESH_KEY') | default('', true) }}"
      HOST_IP: "{{ _kiosk_host_ip | trim }}"
      HOST_NAME: "{{ inventory_hostname }}"
      IS_CLUSTER_MANAGER: "{{ 'true' if inventory_hostname in groups.get('router_nodes', []) else 'false' }}"
      CHILD_MANAGER_IPS: >-
        {{ _child_manager_ips | default({}) }}
      NODE_IPS: >-
        {{ _kiosk_node_ips | default({}) }}
      STATE_DIR: /opt/kiosk/state

# ── Deploy host-specific config.json ─────────────────────────────

- name: Build service URL config JSON
  ansible.builtin.set_fact:
    _kiosk_config_json: "{{ _kiosk_urls | to_json }}"

- name: Write config JSON to host temp
  ansible.builtin.copy:
    content: "{{ _kiosk_config_json }}"
    dest: /tmp/kiosk_config.json
    mode: "0644"

- name: Push config.json into container
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      pct push {{ kiosk_ct_id }} /tmp/kiosk_config.json /opt/kiosk/config.json
      pct exec {{ kiosk_ct_id }} -- chown kiosk:kiosk /opt/kiosk/config.json
    executable: /bin/bash
  changed_when: true

- name: Clean up host temp files
  ansible.builtin.file:
    path: /tmp/kiosk_config.json
    state: absent

# ── SSH key for host management ──────────────────────────────────

- name: Generate SSH key inside kiosk container if absent
  ansible.builtin.shell:
    cmd: |
      pct exec {{ kiosk_ct_id }} -- bash -c '
        if [ ! -f /home/kiosk/.ssh/id_ed25519 ]; then
          mkdir -p /home/kiosk/.ssh
          ssh-keygen -t ed25519 -f /home/kiosk/.ssh/id_ed25519 -N "" -q
          chown -R kiosk:kiosk /home/kiosk/.ssh
          chmod 700 /home/kiosk/.ssh
          chmod 600 /home/kiosk/.ssh/id_ed25519
        fi
      '
    executable: /bin/bash
  changed_when: true

- name: Read kiosk public key from container
  ansible.builtin.command:
    cmd: pct exec {{ kiosk_ct_id }} -- cat /home/kiosk/.ssh/id_ed25519.pub
  register: _kiosk_pubkey
  changed_when: false

- name: Authorize kiosk key on Proxmox host
  ansible.posix.authorized_key:
    user: root
    key: "{{ _kiosk_pubkey.stdout }}"
    comment: "kiosk-manager-{{ inventory_hostname }}"
    state: present

# ── Restart kiosk services with new config ───────────────────────

- name: Restart kiosk-web (Manager API) with new config
  ansible.builtin.shell:
    cmd: |
      pct exec {{ kiosk_ct_id }} -- bash -c '
        systemctl restart kiosk-web
      '
    executable: /bin/bash
  changed_when: true

- name: Start kiosk-display (headless-safe)
  ansible.builtin.shell:
    cmd: |
      pct exec {{ kiosk_ct_id }} -- bash -c '
        systemctl start kiosk-display 2>/dev/null || true
      '
    executable: /bin/bash
  changed_when: true
  failed_when: false

# ── Report completion ────────────────────────────────────────────

- name: Report Kiosk configuration
  ansible.builtin.debug:
    msg: >-
      Kiosk configured on {{ inventory_hostname }}:
      Desktop={{ _kiosk_urls.DESKTOP_URL | trim | default('n/a', true) }},
      Jellyfin={{ _kiosk_urls.JELLYFIN_URL | trim | default('n/a', true) }},
      Kodi={{ _kiosk_urls.KODI_URL | trim | default('n/a', true) }},
      HomeAssistant={{ _kiosk_urls.HOMEASSISTANT_URL | trim | default('n/a', true) }},
      Moonlight={{ _kiosk_urls.MOONLIGHT_URL | trim | default('n/a', true) }},
      Gaming={{ _kiosk_urls.GAMING_URL | trim | default('n/a', true) }},
      Router={{ _kiosk_urls.OPENWRT_URL | trim | default('n/a', true) }},
      Pi-hole={{ _kiosk_urls.PIHOLE_URL | trim | default('n/a', true) }},
      WireGuard={{ _kiosk_urls.WIREGUARD_URL | trim | default('n/a', true) }},
      Netdata={{ _kiosk_urls.NETDATA_URL | trim | default('n/a', true) }},
      rsyslog={{ _kiosk_urls.RSYSLOG_URL | trim | default('n/a', true) }}
