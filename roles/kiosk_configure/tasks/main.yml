---
# Webui Python files, build.py, systemd units, and service enablement are
# baked into the image by build-images.sh. This role handles ONLY
# host-specific runtime config: render GID, config.json, callhome rewrite.
#
# BOOTSTRAP EXCEPTION: kiosk_configure uses pct push/exec ONLY for the
# kiosk container itself (5 operations: render group, config push, chown,
# set callhome env, service restarts). The kiosk IS the NodeManager — it
# cannot configure itself via its own API. After restarting kiosk-web, the
# sibling callhome rewrite uses the NM exec API (HTTP, zero direct pct exec).
#
# Every other configure role uses ansible.builtin.uri → NM API exclusively.
# If you are adding a new configure role, use the NM API pattern — NOT pct exec.

# ── Ensure container is running ────────────────────────────────────

- name: Ensure Kiosk container is running
  ansible.builtin.command:
    cmd: pct status {{ kiosk_ct_id }}
  register: _kiosk_alive
  changed_when: false
  retries: 5
  delay: 2
  until: "'running' in _kiosk_alive.stdout"

# ── Configure iGPU access ───────────────────────────────────────

- name: Detect render group GID from host
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      stat -c '%g' /dev/dri/renderD* 2>/dev/null | head -1
    executable: /bin/bash
  register: _host_render_gid
  changed_when: false
  failed_when: false

- name: Set render GID (live device or cached fact)
  ansible.builtin.set_fact:
    _render_gid: >-
      {{ _host_render_gid.stdout | trim
         if (_host_render_gid.rc == 0 and _host_render_gid.stdout | trim | length > 0)
         else (igpu_render_gid | default('993')) }}

- name: Create render group and add kiosk user to groups
  ansible.builtin.command:
    cmd: >-
      pct exec {{ kiosk_ct_id }} -- bash -c '
      groupadd -g {{ _render_gid }} render 2>/dev/null || groupmod -g {{ _render_gid }} render 2>/dev/null || true;
      usermod -a -G render,video kiosk 2>/dev/null || true'
  changed_when: true

# ── Resolve LAN gateway for OpenWrt URL ─────────────────────────

- name: Read LAN gateway from generated env
  ansible.builtin.set_fact:
    _lan_gateway: >-
      {{ lookup('pipe', 'grep "^LAN_GATEWAY=" ' + env_generated_path + ' 2>/dev/null | cut -d= -f2')
         | default('10.10.10.1', true) | trim }}

# ── Build node IP map for the per-host manager ──────────────────

- name: Build child Manager IP map (host IPs reachable from kiosk container)
  ansible.builtin.set_fact:
    _child_manager_ips: >-
      {{ _child_manager_ips | default({})
         | combine({item: hostvars[item]['ansible_host']})
      }}
  loop: "{{ groups.get('kiosk_nodes', []) | difference([inventory_hostname]) }}"
  when: >-
    item in hostvars
    and hostvars[item].get('ansible_host', '') | length > 0

# ── Detect local OpenWrt container IPs for metric collection ────

- name: Detect bridge container IP from host config (bridge_nodes only)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      pct config {{ bridge_ct_id }} 2>/dev/null | grep -oP 'ip=\K[^/]+' | head -1
    executable: /bin/bash
  register: _bridge_ct_ip
  changed_when: false
  failed_when: false
  when: inventory_hostname in groups.get('bridge_nodes', [])

- name: Detect mesh container IP from host config (wifi_nodes except router_nodes)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      pct config {{ meshwifi_ct_id }} 2>/dev/null | grep -oP 'ip=\K[^/]+' | head -1
    executable: /bin/bash
  register: _mesh_ct_ip
  changed_when: false
  failed_when: false
  when:
    - inventory_hostname in groups.get('wifi_nodes', [])
    - inventory_hostname not in groups.get('router_nodes', [])

- name: Build node IP map — service container IPs (always LAN-reachable)
  ansible.builtin.set_fact:
    _kiosk_node_ips: >-
      {{ _kiosk_node_ips | default({})
         | combine({item.key: item.value})
      }}
  loop: "{{ _service_ip_entries | dict2items }}"
  vars:
    _service_ip_entries:
      openwrt: "{{ _lan_gateway | default('10.10.10.1') }}"
      openwrt-bridge: "{{ _bridge_ct_ip.stdout | default('') }}"
      openwrt-mesh: "{{ _mesh_ct_ip.stdout | default('') }}"
      pihole: "{{ pihole_static_ip | default('') }}"
      wireguard: "{{ wireguard_static_ip | default('') }}"
      netdata: "{{ netdata_static_ip | default('') }}"
      homeassistant: "{{ homeassistant_static_ip | default('') }}"
      jellyfin: "{{ jellyfin_static_ip | default('') }}"
      kodi: "{{ kodi_static_ip | default('') }}"
      moonlight: "{{ moonlight_static_ip | default('') }}"
      rsyslog: "{{ rsyslog_static_ip | default('') }}"
  when: item.value | length > 0

- name: Build node IP map — Proxmox host IPs
  ansible.builtin.set_fact:
    _kiosk_node_ips: >-
      {{ _kiosk_node_ips | default({})
         | combine({item: hostvars[item]['ansible_host']})
      }}
  loop: "{{ groups.get('kiosk_nodes', []) }}"
  when:
    - item in hostvars
    - hostvars[item].get('ansible_host', '') | length > 0

# ── Compute host IP reachable from the kiosk container ─────────

- name: Compute kiosk-reachable host IP
  ansible.builtin.set_fact:
    _kiosk_host_ip: >-
      {{ _lan_gateway.split('.')[0:3] | join('.') + '.' +
         (proxmox_lan_mgmt_ip_offset | default(2) | string)
         if ('router_nodes' in group_names)
            and (_lan_gateway | default('')) | length > 0
         else ansible_host
              if ('lan_hosts' in group_names)
         else container_subnet_prefix + '.' + (container_subnet_id | string) + '.1'
              if (container_subnet_id | default('')) | string | length > 0
         else ansible_host }}

# ── Build service URLs from topology facts ─────────────────────

- name: Build service URLs from LAN topology
  ansible.builtin.set_fact:
    _kiosk_urls:
      DESKTOP_URL: >-
        {{ kiosk_desktop_url if kiosk_desktop_url | length > 0
           else '' }}
      JELLYFIN_URL: >-
        {{ kiosk_jellyfin_url if kiosk_jellyfin_url | length > 0
           else ('http://' + jellyfin_static_ip + ':8096')
                if (jellyfin_static_ip | default('')) | length > 0
           else '' }}
      KODI_URL: >-
        {{ kiosk_kodi_url if kiosk_kodi_url | length > 0
           else ('http://' + kodi_static_ip + ':8080')
                if (kodi_static_ip | default('')) | length > 0
           else '' }}
      HOMEASSISTANT_URL: >-
        {{ kiosk_homeassistant_url if kiosk_homeassistant_url | length > 0
           else ('http://' + homeassistant_static_ip + ':8123')
                if (homeassistant_static_ip | default('')) | length > 0
           else '' }}
      MOONLIGHT_URL: >-
        {{ kiosk_moonlight_url if kiosk_moonlight_url | length > 0
           else '' }}
      GAMING_URL: >-
        {{ kiosk_gaming_url if kiosk_gaming_url | length > 0
           else ('https://' + gaming_static_ip + ':47990')
                if (gaming_static_ip | default('')) | length > 0
           else '' }}
      OPENWRT_URL: >-
        {{ kiosk_openwrt_url if kiosk_openwrt_url | length > 0
           else ('http://' + _lan_gateway)
                if (_lan_gateway | default('')) | length > 0
           else '' }}
      PIHOLE_URL: >-
        {{ kiosk_pihole_url if kiosk_pihole_url | length > 0
           else ('http://' + pihole_static_ip + '/admin')
                if (pihole_static_ip | default('')) | length > 0
           else '' }}
      WIREGUARD_URL: >-
        {{ kiosk_wireguard_url if kiosk_wireguard_url | length > 0
           else '' }}
      NETDATA_URL: >-
        {{ kiosk_netdata_url if kiosk_netdata_url | length > 0
           else ('http://' + netdata_static_ip + ':19999')
                if (netdata_static_ip | default('')) | length > 0
           else '' }}
      RSYSLOG_URL: >-
        {{ kiosk_rsyslog_url if kiosk_rsyslog_url | length > 0
           else '' }}
      MANAGEMENT_SERVER: >-
        {{ kiosk_management_server if (kiosk_management_server | default('')) | length > 0
           else ('http://' + _kiosk_host_ip | trim + ':' + callhome_port)
                if inventory_hostname in groups.get('router_nodes', [])
           else (
             'http://' + hostvars[groups['router_nodes'][0]]['ansible_host'] + ':' + kiosk_manager_port
           ) if (groups.get('router_nodes', []) | length > 0)
           else callhome_server }}
      CALLHOME_SERVER: "{{ callhome_server }}"
      CALLHOME_PUBLIC_KEY: "{{ callhome_public_key }}"
      MESH_KEY: "{{ lookup('env', 'MESH_KEY') | default('', true) }}"
      HOST_IP: "{{ _kiosk_host_ip | trim }}"
      HOST_NAME: "{{ inventory_hostname }}"
      PVE_API_TOKEN: "{{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
      PVE_NODE: "{{ proxmox_node }}"
      IS_CLUSTER_MANAGER: "{{ 'true' if inventory_hostname in groups.get('router_nodes', []) else 'false' }}"
      CHILD_MANAGER_IPS: >-
        {{ _child_manager_ips | default({}) }}
      NODE_IPS: >-
        {{ _kiosk_node_ips | default({}) }}
      STATE_DIR: /opt/kiosk/state

# ── Deploy host-specific config.json via pct push ─────────────────

- name: Build service URL config JSON
  ansible.builtin.set_fact:
    _kiosk_config_json: "{{ _kiosk_urls | to_json }}"

- name: Write config.json to host temp file
  ansible.builtin.copy:
    content: "{{ _kiosk_config_json }}"
    dest: "/tmp/kiosk-config-{{ kiosk_ct_id }}.json"
    mode: "0644"

- name: Push config.json into container
  ansible.builtin.command:
    cmd: "pct push {{ kiosk_ct_id }} /tmp/kiosk-config-{{ kiosk_ct_id }}.json /opt/kiosk/config.json"
  changed_when: true

- name: Set config.json ownership
  ansible.builtin.command:
    cmd: "pct exec {{ kiosk_ct_id }} -- chown kiosk:kiosk /opt/kiosk/config.json"
  changed_when: true

- name: Clean up host temp file
  ansible.builtin.file:
    path: "/tmp/kiosk-config-{{ kiosk_ct_id }}.json"
    state: absent

# ── Ensure callhome reports config.json keys via heartbeat ───────
# CALLHOME_CONFIG_FILES enables the config_files extension so verify.yml
# can check kiosk config keys via the heartbeat API instead of SSH.

- name: Set CALLHOME_CONFIG_FILES for kiosk container
  ansible.builtin.command:
    cmd: >-
      pct exec {{ kiosk_ct_id }} -- bash -c
      "grep -q '^CALLHOME_CONFIG_FILES=' /etc/default/callhome 2>/dev/null
      && sed -i 's|^CALLHOME_CONFIG_FILES=.*|CALLHOME_CONFIG_FILES=/opt/kiosk/config.json|' /etc/default/callhome
      || echo 'CALLHOME_CONFIG_FILES=/opt/kiosk/config.json' >> /etc/default/callhome"
  changed_when: true

# ── Restart kiosk services with new config ───────────────────────

- name: Restart kiosk-web (Manager API) with new config
  ansible.builtin.command:
    cmd: "pct exec {{ kiosk_ct_id }} -- systemctl restart kiosk-web"
  changed_when: true

- name: Restart kiosk-display so Chromium reconnects to new kiosk-web
  ansible.builtin.command:
    cmd: "pct exec {{ kiosk_ct_id }} -- systemctl restart kiosk-display"
  changed_when: true
  failed_when: false

- name: Restart callhome so it reports config_files extension
  ansible.builtin.command:
    cmd: "pct exec {{ kiosk_ct_id }} -- systemctl restart callhome"
  changed_when: true
  failed_when: false

# ── Rewrite callhome on sibling containers → local Manager ───────
# After kiosk-web restarts, point all sibling containers to the local
# NM via the /api/container/{vmid}/exec endpoint (HTTP, not pct exec).
# Two callhome targets:
#   - Debian containers: kiosk container IP (same NAT bridge)
#   - OpenWrt containers: host IP:9001 (via kiosk-manager-proxy socat)

- name: Get kiosk container IP from config (no exec)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      pct config {{ kiosk_ct_id }} 2>/dev/null | grep -oP 'ip=\K[^/]+' | head -1
    executable: /bin/bash
  register: _kiosk_ip_result
  changed_when: false

- name: Set NM API base URL (via host socat proxy)
  ansible.builtin.set_fact:
    _nm_api_url: "http://{{ nm_api_host | default(ansible_host) }}:{{ nm_api_port | default(kiosk_manager_port) }}"

- name: Allow kiosk-web to initialize before health check
  ansible.builtin.pause:
    seconds: 5

- name: Wait for NM API to be ready after restart
  ansible.builtin.uri:
    url: "{{ _nm_api_url }}/api/health"
    method: GET
    status_code: 200
    timeout: 10
  register: _nm_health
  retries: 12
  delay: 5
  until: _nm_health.status | default(0) == 200
  delegate_to: localhost

- name: Set callhome targets for sibling rewrite
  ansible.builtin.set_fact:
    _nat_target: >-
      http://{{ (_kiosk_ip_result.stdout | trim) }}:{{ kiosk_manager_port
      | default('9001') }}
    _host_target: >-
      http://{{ nm_api_host | default(ansible_host) }}:{{ nm_api_port
      | default(kiosk_manager_port) }}
    _ch_key: "{{ callhome_public_key }}"

- name: Rewrite callhome on Debian siblings via NM sed API
  ansible.builtin.uri:
    url: "{{ _nm_api_url }}/api/config/{{ item }}/sed"
    method: POST
    body_format: json
    body:
      path: /etc/default/callhome
      pattern: "^CALLHOME_SERVER=.*"
      replacement: "CALLHOME_SERVER={{ _nat_target | trim }}"
    status_code: [200, 404]
    timeout: 10
  delegate_to: localhost
  loop: >-
    {{ [pihole_ct_id, rsyslog_ct_id, netdata_ct_id, wireguard_ct_id,
        homeassistant_ct_id, jellyfin_ct_id, kodi_ct_id, moonlight_ct_id,
        desktop_ct_id, gaming_ct_id]
       | select('defined') | list }}
  loop_control:
    label: "CT {{ item }}"
  register: _ch_server_result
  changed_when: _ch_server_result.status | default(0) == 200
  failed_when: false

- name: Rewrite callhome key on Debian siblings via NM sed API
  ansible.builtin.uri:
    url: "{{ _nm_api_url }}/api/config/{{ item }}/sed"
    method: POST
    body_format: json
    body:
      path: /etc/default/callhome
      pattern: "^CALLHOME_PUBLIC_KEY=.*"
      replacement: "CALLHOME_PUBLIC_KEY={{ _ch_key }}"
    status_code: [200, 404]
    timeout: 10
  delegate_to: localhost
  loop: >-
    {{ [pihole_ct_id, rsyslog_ct_id, netdata_ct_id, wireguard_ct_id,
        homeassistant_ct_id, jellyfin_ct_id, kodi_ct_id, moonlight_ct_id,
        desktop_ct_id, gaming_ct_id]
       | select('defined') | list }}
  loop_control:
    label: "CT {{ item }}"
  changed_when: false
  failed_when: false

- name: Restart callhome on Debian siblings via NM service API
  ansible.builtin.uri:
    url: "{{ _nm_api_url }}/api/config/{{ item }}/service/callhome/restart"
    method: POST
    body_format: json
    body: {}
    status_code: [200, 404]
    timeout: 10
  delegate_to: localhost
  loop: >-
    {{ [pihole_ct_id, rsyslog_ct_id, netdata_ct_id, wireguard_ct_id,
        homeassistant_ct_id, jellyfin_ct_id, kodi_ct_id, moonlight_ct_id,
        desktop_ct_id, gaming_ct_id]
       | select('defined') | list }}
  loop_control:
    label: "CT {{ item }}"
  changed_when: false
  failed_when: false

- name: Rewrite callhome server on OpenWrt siblings via NM sed API
  ansible.builtin.uri:
    url: "{{ _nm_api_url }}/api/config/{{ item }}/sed"
    method: POST
    body_format: json
    body:
      path: /etc/default/callhome
      pattern: "^CALLHOME_SERVER=.*"
      replacement: "CALLHOME_SERVER={{ _host_target | trim }}"
    status_code: [200, 404, 500]
    timeout: 15
  delegate_to: localhost
  loop: >-
    {{ [meshwifi_ct_id, bridge_ct_id]
       | select('defined') | list }}
  loop_control:
    label: "CT {{ item }}"
  failed_when: false
  changed_when: false

- name: Rewrite callhome key on OpenWrt siblings via NM sed API
  ansible.builtin.uri:
    url: "{{ _nm_api_url }}/api/config/{{ item }}/sed"
    method: POST
    body_format: json
    body:
      path: /etc/default/callhome
      pattern: "^CALLHOME_PUBLIC_KEY=.*"
      replacement: "CALLHOME_PUBLIC_KEY={{ _ch_key }}"
    status_code: [200, 404, 500]
    timeout: 15
  delegate_to: localhost
  loop: >-
    {{ [meshwifi_ct_id, bridge_ct_id]
       | select('defined') | list }}
  loop_control:
    label: "CT {{ item }}"
  failed_when: false
  changed_when: false

- name: Restart cron on OpenWrt siblings via NM service API
  ansible.builtin.uri:
    url: "{{ _nm_api_url }}/api/config/{{ item }}/service/cron/restart"
    method: POST
    body_format: json
    body: {}
    status_code: [200, 404, 500]
    timeout: 15
  delegate_to: localhost
  loop: >-
    {{ [meshwifi_ct_id, bridge_ct_id]
       | select('defined') | list }}
  loop_control:
    label: "CT {{ item }}"
  failed_when: false
  changed_when: false

# ── Report completion ────────────────────────────────────────────

- name: Report Kiosk configuration
  ansible.builtin.debug:
    msg: >-
      Kiosk configured on {{ inventory_hostname }}:
      Desktop={{ _kiosk_urls.DESKTOP_URL | trim | default('n/a', true) }},
      Jellyfin={{ _kiosk_urls.JELLYFIN_URL | trim | default('n/a', true) }},
      Kodi={{ _kiosk_urls.KODI_URL | trim | default('n/a', true) }},
      HomeAssistant={{ _kiosk_urls.HOMEASSISTANT_URL | trim | default('n/a', true) }},
      Moonlight={{ _kiosk_urls.MOONLIGHT_URL | trim | default('n/a', true) }},
      Gaming={{ _kiosk_urls.GAMING_URL | trim | default('n/a', true) }},
      Router={{ _kiosk_urls.OPENWRT_URL | trim | default('n/a', true) }},
      Pi-hole={{ _kiosk_urls.PIHOLE_URL | trim | default('n/a', true) }},
      WireGuard={{ _kiosk_urls.WIREGUARD_URL | trim | default('n/a', true) }},
      Netdata={{ _kiosk_urls.NETDATA_URL | trim | default('n/a', true) }},
      rsyslog={{ _kiosk_urls.RSYSLOG_URL | trim | default('n/a', true) }}
