---
openwrt_bridge_ssid: "bridge-dedicated"
openwrt_bridge_key: "{{ lookup('env', 'MESH_KEY') | default('changeme', true) }}"
openwrt_bridge_encryption: sae
# Dynamic band/channel/htmode selection via cross-endpoint negotiation.
# When set to "auto", wifi_setup.sh probes the PHY for optimal parameters.
# The negotiation play in site.yml overrides these with negotiated values
# stored as hostvars on bridge_nodes hosts.
openwrt_bridge_band: "auto"
openwrt_bridge_channel: "auto"
openwrt_bridge_htmode: "auto"
openwrt_bridge_country: "US"
