---
# Render group, /etc/jellyfin, network.xml, library.xml, VA-API drivers,
# and service enablement are baked into the image by build-images.sh. This
# role handles ONLY host-specific config: render GID override, transcoding
# device path, password, and service start.
# All in-container operations go through the Node Manager API over VPN.

# ── Configure iGPU access ──────────────────────────────────────────

- name: Sync render GID for Jellyfin
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/lxc_render_gid.yml"
  vars:
    _render_ct_id: "{{ jellyfin_ct_id }}"
    _render_user: jellyfin

- name: Start Jellyfin service
  ansible.builtin.uri:
    url: "{{ nm_api_url }}/api/config/{{ jellyfin_ct_id }}/service/jellyfin/restart"
    headers: "{{ nm_auth_headers }}"
    method: POST
    status_code: 200
  delegate_to: localhost

# ── Generate admin password if not provided ───────────────────────

- name: Set admin password
  ansible.builtin.set_fact:
    _jellyfin_admin_password: >-
      {{ jellyfin_admin_password
         if jellyfin_admin_password | length > 0
         else lookup('password', '/dev/null chars=ascii_letters,digits length=24') }}

# ── Deploy host-specific transcoding config ─────────────────────

- name: Build transcoding config content
  ansible.builtin.set_fact:
    _jellyfin_transcoding_xml: |
      <?xml version="1.0" encoding="UTF-8"?>
      <Transcoding>
        <TempPath>/var/lib/jellyfin/transcodes</TempPath>
        <EnableHardwareEncoding>true</EnableHardwareEncoding>
        <EnableVpp>true</EnableVpp>
        <HardwareAccelerationType>vaapi</HardwareAccelerationType>
        <VaApiDevice>{{ igpu_render_device }}</VaApiDevice>
      </Transcoding>

- name: Push transcoding config via NM API
  ansible.builtin.uri:
    url: "{{ nm_api_url }}/api/config/{{ jellyfin_ct_id }}/file"
    headers: "{{ nm_auth_headers }}"
    method: POST
    body_format: json
    body:
      path: /etc/jellyfin/transcoding.xml
      content: "{{ _jellyfin_transcoding_xml }}"
      mode: "0644"
    status_code: 200
  delegate_to: localhost

# ── Wait for web interface ───────────────────────────────────────

- name: Wait for Jellyfin web interface to be ready
  ansible.builtin.uri:
    url: "{{ nm_api_url }}/api/provision/{{ jellyfin_ct_id }}/exec"
    headers: "{{ nm_auth_headers }}"
    method: POST
    body_format: json
    body:
      cmd: "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8096"
      timeout: 10
    status_code: 200
  delegate_to: localhost
  register: _jellyfin_ready
  retries: 10
  delay: 2
  until: >-
    (_jellyfin_ready.json.success | default(false)) | bool
    and (_jellyfin_ready.json.output | default('') | trim) in ['200', '302']

# ── Report completion ──────────────────────────────────────────────

- name: Report Jellyfin configuration
  ansible.builtin.debug:
    msg: >-
      Jellyfin configured successfully!
      Web interface: http://{{ jellyfin_static_ip }}:8096
      iGPU device: {{ igpu_render_device }}

- name: Write admin password to generated env file
  ansible.builtin.blockinfile:
    path: "{{ env_generated_path }}"
    create: true
    mode: "0600"
    marker: "# {mark} Jellyfin Admin Password (auto-generated)"
    block: |
      JELLYFIN_ADMIN_PASSWORD={{ _jellyfin_admin_password }}
      JELLYFIN_WEB_URL=http://{{ jellyfin_static_ip }}:8096
  delegate_to: localhost
  no_log: true
  when: jellyfin_admin_password | length == 0
