---
# Moonlight LXC provisioning via Node Manager API.
# Version check skips provisioning when the deployed version matches.

# ── Version-aware skip check ──────────────────────────────────────
- name: Check Moonlight version via NM API
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/check_service_version.yml"
  vars:
    _check_service_name: moonlight
    _check_image_version: "{{ moonlight_image_version }}"

# ── Verify Moonlight template exists (skipped when version matches)
- name: Verify Moonlight template exists
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/verify_lxc_template.yml"
  vars:
    lxc_template_path: "{{ moonlight_ct_template_path }}"
    lxc_service_name: Moonlight
  when: not (_service_up_to_date | default(false) | bool)

# ── Determine container network ──────────────────────────────────
- name: Compute Moonlight LAN network
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/lxc_lan_network.yml"
  vars:
    lxc_net_service_name: moonlight
    lxc_net_ip_offset: "{{ moonlight_ct_ip_offset }}"

# ── Upload template to host if not cached ──────────────────────────
- name: Upload Moonlight template to Proxmox host
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/upload_lxc_template.yml"
  vars:
    lxc_upload_template_path: "{{ role_path }}/../../{{ moonlight_ct_template_path }}"
    lxc_upload_service_name: Moonlight
  when: not (_service_up_to_date | default(false) | bool)

# ── Provision container via NM API (skipped when version matches) ─
- name: Provision Moonlight LXC via NM API
  ansible.builtin.uri:
    url: "http://{{ nm_api_host | default(ansible_host) }}:{{ nm_api_port | default(kiosk_manager_port) }}/api/provision/moonlight"
    method: POST
    body_format: json
    body:
      vmid: "{{ moonlight_ct_id }}"
      template_path: "{{ moonlight_ct_template_path | basename }}"
      hostname: "{{ moonlight_ct_hostname }}"
      memory: "{{ moonlight_ct_memory }}"
      cores: "{{ moonlight_ct_cores }}"
      disk: "{{ moonlight_ct_disk }}"
      onboot: "{{ moonlight_ct_onboot }}"
      startup_order: 0
      unprivileged: "{{ moonlight_ct_unprivileged }}"
      features: "{{ moonlight_ct_features | join(',') }}"
      ip: "{{ _lxc_ct_ip }}/{{ _lan_cidr }}"
      gateway: "{{ _lan_gateway }}"
      nameserver: "{{ _lan_gateway }}"
      bridge: "{{ proxmox_all_bridges[1] | default('vmbr0') }}"
      image_version: "{{ moonlight_image_version }}"
    status_code: 200
    timeout: 660
  delegate_to: localhost
  register: _provision_result
  failed_when: not (_provision_result.json.success | default(false))
  when: not (_service_up_to_date | default(false) | bool)

# ── Apply privileged config on host (features need root@pam) ─
- name: Apply privileged LXC config on host for Moonlight
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/apply_privileged_lxc_config.yml"
  vars:
    _priv_ct_id: "{{ moonlight_ct_id }}"
    _priv_features: "{{ moonlight_ct_features | join(',') }}"
    _priv_mount_entries: []
    _priv_lxc_conf_entries: []
  when:
    - not (_service_up_to_date | default(false) | bool)
    - (_provision_result.json.status | default('')) == 'created_needs_host_config'

- name: Report provision result
  ansible.builtin.debug:
    msg: >-
      Moonlight on {{ inventory_hostname }}:
      {{ _provision_result.json.status }}
      ({{ _provision_result.json.elapsed_seconds | default('?') }}s) —
      {{ _provision_result.json.log | default([]) | join(', ') }}
  when: not (_service_up_to_date | default(false) | bool)

# ── Configure callhome via NM API (skipped when version matches) ─
- name: Configure callhome on Moonlight
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/configure_callhome_api.yml"
  vars:
    _callhome_vmid: "{{ moonlight_ct_id }}"

# ── Register in dynamic inventory (for configure plays) ──────────
- name: Add Moonlight containers to dynamic inventory group
  ansible.builtin.add_host:
    name: "{{ moonlight_ct_hostname }}-{{ item }}"
    groups: moonlight
    ansible_connection: community.proxmox.proxmox_pct_remote
    ansible_host: "{{ hostvars[item].ansible_host }}"
    ansible_user: root
    proxmox_vmid: "{{ moonlight_ct_id }}"
    ansible_paramiko_host_key_checking: false
    ansible_paramiko_proxy_command: >-
      {{ 'ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p root@'
         + lookup('env', 'PRIMARY_HOST')
         if 'lan_hosts' in (hostvars[item].group_names | default([]))
         else omit }}
  loop: "{{ ansible_play_hosts }}"

# ── Export static IP for downstream roles ─────────────────────────
- name: Export Moonlight static IP for downstream roles
  ansible.builtin.set_fact:
    moonlight_static_ip: "{{ _lxc_ct_ip }}"
    cacheable: true

# ── Port forwarding for Moonlight display ──────────────────
# TODO: Convert lxc_display_proxy to NM API in a future pass.
# Kept as SSH for now — deploys systemd units and socat proxies on the host.

- name: Set up Moonlight display proxy
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/lxc_display_proxy.yml"
  vars:
    _display_proxy_name: moonlight-display-proxy
    _display_proxy_port: "{{ moonlight_ws_port }}"
    _display_proxy_target: "{{ _lxc_ct_ip }}"
    _display_proxy_legacy: moonlight-vnc-proxy
