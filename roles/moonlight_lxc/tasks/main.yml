---
# ── Verify Moonlight template exists ────────────────────────────
- name: Verify Moonlight template exists
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/verify_lxc_template.yml"
  vars:
    lxc_template_path: "{{ moonlight_ct_template_path }}"
    lxc_service_name: Moonlight

# ── Determine container network ──────────────────────────────────
- name: Compute Moonlight LAN network
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/lxc_lan_network.yml"
  vars:
    lxc_net_service_name: moonlight
    lxc_net_ip_offset: "{{ moonlight_ct_ip_offset }}"

# ── Provision via shared proxmox_lxc role ────────────────────────

- name: Provision Moonlight LXC container
  ansible.builtin.include_role:
    name: proxmox_lxc
  vars:
    lxc_ct_id: "{{ moonlight_ct_id }}"
    lxc_ct_hostname: "{{ moonlight_ct_hostname }}"
    lxc_ct_dynamic_group: moonlight
    lxc_ct_memory: "{{ moonlight_ct_memory }}"
    lxc_ct_cores: "{{ moonlight_ct_cores }}"
    lxc_ct_disk: "{{ moonlight_ct_disk }}"
    lxc_ct_onboot: "{{ moonlight_ct_onboot }}"
    lxc_ct_startup_order: 0
    lxc_ct_template: "{{ moonlight_ct_template }}"
    lxc_ct_template_path: "{{ moonlight_ct_template_path }}"
    lxc_ct_ip: "{{ _lxc_ct_ip }}/{{ _lan_cidr }}"
    lxc_ct_gateway: "{{ _lan_gateway }}"
    lxc_ct_nameserver: "{{ _lan_gateway }}"
    lxc_ct_bridge: "{{ proxmox_all_bridges[1] | default('vmbr0') }}"
    lxc_ct_unprivileged: "{{ moonlight_ct_unprivileged }}"
    lxc_ct_features: "{{ moonlight_ct_features }}"
    lxc_ct_image_version: "{{ moonlight_image_version }}"

# ── Device passthrough via lxc.mount.entry + cgroup allowlists ───

- name: Apply device passthrough (DRI + input + uinput)
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/lxc_device_passthrough.yml"
  vars:
    lxc_dev_ct_id: "{{ moonlight_ct_id }}"
    lxc_dev_conf_entries:
      - "lxc.mount.entry: /dev/dri dev/dri none bind,optional,create=dir"
      - "lxc.mount.entry: /dev/input dev/input none bind,optional,create=dir"
      - "lxc.cgroup2.devices.allow: c 226:* rwm"
      - "lxc.cgroup2.devices.allow: c 13:* rwm"
      - "lxc.cgroup2.devices.allow: c 10:223 rwm"

- name: Export Moonlight static IP for downstream roles
  ansible.builtin.set_fact:
    moonlight_static_ip: "{{ _lxc_ct_ip }}"
    cacheable: true
