---
# WireGuard LXC provisioning via Node Manager API.
# Host-level kernel ops (modprobe, modules-load.d) stay as SSH.
# Version check skips provisioning when the deployed version matches.

# ── Version-aware skip check ──────────────────────────────────────
- name: Check WireGuard version via NM API
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/check_service_version.yml"
  vars:
    _check_service_name: wireguard
    _check_image_version: "{{ wireguard_image_version }}"

# ── Host-level kernel module setup (SSH) ─────────────────────────
- name: Load wireguard kernel module on Proxmox host
  ansible.builtin.command:
    cmd: modprobe wireguard
  changed_when: true

- name: Persist wireguard module across reboots
  ansible.builtin.copy:
    content: "wireguard\n"
    dest: /etc/modules-load.d/wireguard.conf
    mode: "0644"

# ── Determine container network based on host topology ───────────
- name: Compute WireGuard container network
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/lxc_wan_or_lan_network.yml"
  vars:
    lxc_net_service_name: WireGuard
    lxc_net_ip_offset: "{{ wireguard_ct_ip_offset }}"
    lxc_net_flavor_group: vpn_nodes

# ── Provision container via NM API (skipped when version matches) ─
- name: Provision WireGuard LXC via NM API
  ansible.builtin.uri:
    url: "http://{{ nm_api_host | default(ansible_host) }}:{{ nm_api_port | default(kiosk_manager_port) }}/api/provision/wireguard"
    method: POST
    body_format: json
    body:
      vmid: "{{ wireguard_ct_id }}"
      template_path: "{{ wireguard_ct_template_path | basename }}"
      hostname: "{{ wireguard_ct_hostname }}"
      memory: "{{ wireguard_ct_memory }}"
      cores: "{{ wireguard_ct_cores }}"
      disk: "{{ wireguard_ct_disk }}"
      onboot: "{{ wireguard_ct_onboot }}"
      startup_order: "{{ wireguard_ct_startup_order }}"
      features: "{{ wireguard_ct_features | join(',') }}"
      ip: "{{ _lxc_net_ip }}/{{ _lxc_net_cidr }}"
      gateway: "{{ _lxc_net_gateway }}"
      nameserver: "{{ _lxc_net_nameserver }}"
      bridge: "{{ _lxc_net_bridge }}"
      image_version: "{{ wireguard_image_version }}"
    status_code: 200
    timeout: 180
  delegate_to: localhost
  register: _provision_result
  failed_when: not (_provision_result.json.success | default(false))
  when: not (_service_up_to_date | default(false) | bool)

- name: Report provision result
  ansible.builtin.debug:
    msg: "WireGuard on {{ inventory_hostname }}: {{ _provision_result.json.status }} — {{ _provision_result.json.log | default([]) | join(', ') }}"
  when: not (_service_up_to_date | default(false) | bool)

# ── Configure callhome via NM API (skipped when version matches) ─
- name: Configure callhome on WireGuard
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/configure_callhome_api.yml"
  vars:
    _callhome_vmid: "{{ wireguard_ct_id }}"

# ── Register in dynamic inventory + propagate vpn_ip ─────────────
- name: Add WireGuard containers to dynamic inventory group
  ansible.builtin.add_host:
    name: "{{ wireguard_ct_hostname }}-{{ item }}"
    groups: wireguard
    ansible_connection: community.proxmox.proxmox_pct_remote
    ansible_host: "{{ hostvars[item].ansible_host }}"
    ansible_user: root
    proxmox_vmid: "{{ wireguard_ct_id }}"
    ansible_paramiko_host_key_checking: false
    ansible_paramiko_proxy_command: >-
      {{ 'ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p root@'
         + lookup('env', 'PRIMARY_HOST')
         if 'lan_hosts' in (hostvars[item].group_names | default([]))
         else omit }}
    vpn_ip: "{{ hostvars[item].vpn_ip }}"
    _wg_parent_host: "{{ item }}"
    _wg_parent_ansible_host: "{{ hostvars[item].ansible_host }}"
  loop: "{{ ansible_play_hosts }}"

# ── Port forwarding for WireGuard on NAT bridge (WAN hosts only) ──
- name: Add WireGuard DNAT + FORWARD rules via NM API (WAN hosts)
  ansible.builtin.uri:
    url: "http://{{ nm_api_host | default(ansible_host) }}:{{ nm_api_port | default(kiosk_manager_port) }}/api/host/iptables"
    method: POST
    body_format: json
    body:
      rules:
        - chain: PREROUTING
          table: nat
          protocol: udp
          dport: "51820"
          destination: "{{ _lxc_net_ip }}:51820"
          interface: "{{ proxmox_wan_bridge }}"
      forward_rules:
        - in_interface: "{{ proxmox_wan_bridge }}"
          out_interface: "{{ proxmox_container_bridge }}"
          protocol: udp
          dport: "51820"
    status_code: 200
  delegate_to: localhost
  when:
    - not (_service_up_to_date | default(false) | bool)
    - not (_lxc_net_on_lan | bool)
  changed_when: true
