---
- name: Load wireguard kernel module on Proxmox host
  ansible.builtin.command:
    cmd: modprobe wireguard
  changed_when: true

- name: Persist wireguard module across reboots
  ansible.builtin.copy:
    content: "wireguard\n"
    dest: /etc/modules-load.d/wireguard.conf
    mode: "0644"

# ── Determine container network based on host topology ───────────

- name: Compute WireGuard container network
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/lxc_wan_or_lan_network.yml"
  vars:
    lxc_net_service_name: WireGuard
    lxc_net_ip_offset: "{{ wireguard_ct_ip_offset }}"
    lxc_net_flavor_group: vpn_nodes

# ── Check container existence ──────────────────────────────────

- name: Check if WireGuard container exists
  ansible.builtin.command:
    cmd: pct status {{ wireguard_ct_id }}
  register: _ct_status
  failed_when: false
  changed_when: false

- name: Set container existence flag
  ansible.builtin.set_fact:
    _lxc_exists: "{{ _ct_status.rc == 0 }}"

# ── Resolve deployed version ────────────────────────────────────

- name: Resolve deployed WireGuard version
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/resolve_deployed_version.yml"
  vars:
    _resolve_service_name: wireguard

- name: Provision WireGuard LXC container
  ansible.builtin.include_role:
    name: proxmox_lxc
  vars:
    lxc_ct_id: "{{ wireguard_ct_id }}"
    lxc_ct_hostname: "{{ wireguard_ct_hostname }}"
    lxc_ct_dynamic_group: wireguard
    lxc_ct_memory: "{{ wireguard_ct_memory }}"
    lxc_ct_cores: "{{ wireguard_ct_cores }}"
    lxc_ct_disk: "{{ wireguard_ct_disk }}"
    lxc_ct_onboot: "{{ wireguard_ct_onboot }}"
    lxc_ct_startup_order: "{{ wireguard_ct_startup_order }}"
    lxc_ct_features: "{{ wireguard_ct_features }}"
    lxc_ct_ip: "{{ _lxc_net_ip }}/{{ _lxc_net_cidr }}"
    lxc_ct_gateway: "{{ _lxc_net_gateway }}"
    lxc_ct_nameserver: "{{ _lxc_net_nameserver }}"
    lxc_ct_template_path: "{{ wireguard_ct_template_path }}"
    lxc_ct_bridge: "{{ _lxc_net_bridge }}"
    lxc_ct_image_version: "{{ wireguard_image_version }}"

# ── Port forwarding for WireGuard on NAT bridge (WAN hosts only) ──
# WireGuard needs inbound UDP 51820 from the internet. With NAT,
# the container is on a private subnet — DNAT forwards traffic.

- name: Add DNAT rule for WireGuard VPN (WAN hosts)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      WAN_IF="{{ proxmox_wan_bridge }}"
      CT_IP="{{ _lxc_net_ip }}"
      if ! iptables -t nat -C PREROUTING -i "$WAN_IF" -p udp --dport 51820 -j DNAT --to-destination "$CT_IP:51820" 2>/dev/null; then
        iptables -t nat -A PREROUTING -i "$WAN_IF" -p udp --dport 51820 -j DNAT --to-destination "$CT_IP:51820"
      fi
    executable: /bin/bash
  when: not (_lxc_net_on_lan | bool)
  changed_when: true

- name: Add FORWARD rule for WireGuard DNAT traffic (WAN hosts)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      WAN_IF="{{ proxmox_wan_bridge }}"
      CT_BR="{{ proxmox_container_bridge }}"
      if ! iptables -C FORWARD -i "$WAN_IF" -o "$CT_BR" -p udp --dport 51820 -j ACCEPT 2>/dev/null; then
        iptables -A FORWARD -i "$WAN_IF" -o "$CT_BR" -p udp --dport 51820 -j ACCEPT
      fi
    executable: /bin/bash
  when: not (_lxc_net_on_lan | bool)
  changed_when: true
