---
# WireGuard LXC provisioning via Node Manager API.
# Host-level kernel ops (modprobe, modules-load.d) stay as SSH.
# Version check skips provisioning when the deployed version matches.

# ── Version-aware skip check ──────────────────────────────────────
- name: Check WireGuard version via NM API
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/check_service_version.yml"
  vars:
    _check_service_name: wireguard
    _check_image_version: "{{ wireguard_image_version }}"

# ── Host-level kernel module setup (SSH) ─────────────────────────
- name: Load wireguard kernel module on Proxmox host
  community.general.modprobe:
    name: wireguard
    state: present

- name: Persist wireguard module across reboots
  ansible.builtin.copy:
    content: "wireguard\n"
    dest: /etc/modules-load.d/wireguard.conf
    mode: "0644"

# ── Verify template exists (skipped when version matches) ──────────
- name: Verify WireGuard template exists
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/verify_lxc_template.yml"
  vars:
    lxc_template_path: "{{ wireguard_ct_template_path }}"
    lxc_service_name: WireGuard
  when: not (_service_up_to_date | default(false) | bool)

# ── Container network: LAN on router/LAN hosts, NAT on WAN hosts ───
# Same topology as all other services. WireGuard is externally reachable
# via DNAT regardless of which bridge the container is on.
- name: Compute WireGuard container network
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/lxc_wan_or_lan_network.yml"
  vars:
    lxc_net_service_name: WireGuard
    lxc_net_ip_offset: "{{ wireguard_ct_ip_offset }}"
    lxc_net_flavor_group: vpn_nodes

# ── Upload template to host if not cached ──────────────────────────
- name: Upload WireGuard template to Proxmox host
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/upload_lxc_template.yml"
  vars:
    lxc_upload_template_path: "{{ role_path }}/../../{{ wireguard_ct_template_path }}"
    lxc_upload_service_name: WireGuard
  when: not (_service_up_to_date | default(false) | bool)

# ── Provision container via NM API (skipped when version matches) ─
- name: Provision WireGuard LXC via NM API
  ansible.builtin.uri:
    url: "{{ nm_api_url }}/api/provision/wireguard"
    headers: "{{ nm_auth_headers }}"
    method: POST
    body_format: json
    body:
      vmid: "{{ wireguard_ct_id }}"
      template_path: "{{ wireguard_ct_template_path | basename }}"
      hostname: "{{ wireguard_ct_hostname }}"
      memory: "{{ wireguard_ct_memory }}"
      cores: "{{ wireguard_ct_cores }}"
      disk: "{{ wireguard_ct_disk }}"
      onboot: "{{ wireguard_ct_onboot }}"
      startup_order: "{{ wireguard_ct_startup_order }}"
      features: "{{ wireguard_ct_features | join(',') }}"
      ip: "{{ _lxc_net_ip }}/{{ _lxc_net_cidr }}"
      gateway: "{{ _lxc_net_gateway }}"
      nameserver: "{{ _lxc_net_nameserver }}"
      bridge: "{{ _lxc_net_bridge }}"
      image_version: "{{ wireguard_image_version }}"
    status_code: 200
    timeout: 660
  delegate_to: localhost
  register: _provision_result
  until: _provision_result.json.success | default(false)
  retries: 2
  delay: 10
  when: not (_service_up_to_date | default(false) | bool)

- name: Report provision result
  ansible.builtin.debug:
    msg: "WireGuard on {{ inventory_hostname }}: {{ _provision_result.json.status }} — {{ _provision_result.json.log | default([]) | join(', ') }}"
  when: not (_service_up_to_date | default(false) | bool)

# ── Apply privileged config on host (features need root@pam) ─────
- name: Apply privileged LXC config on host for WireGuard
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/apply_privileged_lxc_config.yml"
  vars:
    _priv_ct_id: "{{ wireguard_ct_id }}"
    _priv_features: "{{ wireguard_ct_features | join(',') }}"
    _priv_mount_entries: []
    _priv_lxc_conf_entries: []
  when:
    - not (_service_up_to_date | default(false) | bool)
    - (_provision_result.json.status | default('')) == 'created_needs_host_config'

# ── Configure callhome via NM API (skipped when version matches) ─
- name: Configure callhome on WireGuard
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/configure_callhome_api.yml"
  vars:
    _callhome_vmid: "{{ wireguard_ct_id }}"

# ── Register in dynamic inventory + propagate vpn_ip ─────────────
- name: Add WireGuard containers to dynamic inventory group
  ansible.builtin.add_host:
    name: "{{ wireguard_ct_hostname }}-{{ item }}"
    groups: wireguard
    ansible_connection: community.proxmox.proxmox_pct_remote
    ansible_host: "{{ hostvars[item].ansible_host }}"
    ansible_user: root
    proxmox_vmid: "{{ wireguard_ct_id }}"
    ansible_paramiko_host_key_checking: false
    ansible_paramiko_proxy_command: >-
      {{ 'ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p root@'
         + lookup('env', 'PRIMARY_HOST')
         if 'lan_hosts' in (hostvars[item].group_names | default([]))
         else omit }}
    vpn_ip: "{{ hostvars[item].vpn_ip }}"
    _wg_parent_host: "{{ item }}"
    _wg_parent_ansible_host: "{{ hostvars[item].ansible_host }}"
  loop: "{{ ansible_play_hosts }}"

# ── Export static IP for downstream roles ─────────────────────────
- name: Export WireGuard static IP for downstream roles
  ansible.builtin.set_fact:
    wireguard_static_ip: "{{ _lxc_net_ip }}"
    cacheable: true

# ── Port forwarding: DNAT from WAN bridge to container (ALL hosts) ──
- name: Add WireGuard DNAT rule
  vars:
    _wan: "{{ proxmox_wan_bridge }}"
    _port: "{{ wireguard_listen_port }}"
    _dest: "{{ _lxc_net_ip }}:{{ wireguard_listen_port }}"
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      if iptables -t nat -C PREROUTING -i {{ _wan }} -p udp --dport {{ _port }} \
         -j DNAT --to-destination {{ _dest }} 2>/dev/null; then
        echo EXISTS
      else
        iptables -t nat -A PREROUTING -i {{ _wan }} -p udp --dport {{ _port }} \
           -j DNAT --to-destination {{ _dest }}
        echo ADDED
      fi
    executable: /bin/bash
  register: _wg_dnat
  changed_when: "'ADDED' in _wg_dnat.stdout"

- name: Add WireGuard FORWARD rules (inbound + return)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      WAN="{{ proxmox_wan_bridge }}"
      CT="{{ _lxc_net_bridge }}"
      CHANGED=0
      if ! iptables -C FORWARD -i "$WAN" -o "$CT" -p udp --dport {{ wireguard_listen_port }} -j ACCEPT 2>/dev/null; then
        iptables -A FORWARD -i "$WAN" -o "$CT" -p udp --dport {{ wireguard_listen_port }} -j ACCEPT
        CHANGED=1
      fi
      if ! iptables -C FORWARD -i "$CT" -o "$WAN" -m state --state RELATED,ESTABLISHED -j ACCEPT 2>/dev/null; then
        iptables -A FORWARD -i "$CT" -o "$WAN" -m state --state RELATED,ESTABLISHED -j ACCEPT
        CHANGED=1
      fi
      [ "$CHANGED" -eq 1 ] && echo ADDED || echo EXISTS
    executable: /bin/bash
  register: _wg_fwd
  changed_when: "'ADDED' in _wg_fwd.stdout"

# When the WireGuard container is on the LAN bridge (router/LAN hosts),
# its gateway is OpenWrt (10.10.10.1), not the Proxmox host. Without
# MASQUERADE, DNAT'd reply packets route through OpenWrt and bypass
# the host's conntrack — the source IP is never un-DNAT'd and the
# remote peer drops the reply. MASQUERADE makes the container see the
# Proxmox host's bridge IP as the source, so replies go back through
# the host's conntrack for proper un-DNAT.
- name: Add MASQUERADE for DNAT'd WireGuard traffic (LAN bridge only)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      CT_BR="{{ _lxc_net_bridge }}"
      CT_IP="{{ _lxc_net_ip }}"
      if ! iptables -t nat -C POSTROUTING -o "$CT_BR" -d "$CT_IP" -p udp --dport {{ wireguard_listen_port }} -j MASQUERADE 2>/dev/null; then
        iptables -t nat -A POSTROUTING -o "$CT_BR" -d "$CT_IP" -p udp --dport {{ wireguard_listen_port }} -j MASQUERADE
        echo ADDED
      else
        echo EXISTS
      fi
    executable: /bin/bash
  register: _wg_masq
  changed_when: "'ADDED' in _wg_masq.stdout"
  when: _lxc_net_on_lan | default(false) | bool

- name: Flush stale conntrack entries for WireGuard port
  ansible.builtin.command:
    cmd: conntrack -D -p udp --dport {{ wireguard_listen_port }}
  changed_when: true
  failed_when: false
  when: _wg_dnat.stdout | default('') == 'ADDED'

# ── Clean up legacy socat proxy (removed — all hosts use DNAT now) ──
- name: Stop and remove legacy wireguard-udp-proxy
  ansible.builtin.shell:
    cmd: |
      if systemctl is-active wireguard-udp-proxy 2>/dev/null; then
        systemctl stop wireguard-udp-proxy
        systemctl disable wireguard-udp-proxy
        rm -f /etc/systemd/system/wireguard-udp-proxy.service
        systemctl daemon-reload
        echo REMOVED
      else
        echo ABSENT
      fi
    executable: /bin/bash
  register: _wg_proxy_cleanup
  changed_when: "'REMOVED' in _wg_proxy_cleanup.stdout"
