---
# Pi-hole v6 configuration via Node Manager API.
# All in-container operations go through POST /api/provision/{vmid}/exec.

# ── Set web password ────────────────────────────────────────────

- name: Set Pi-hole web admin password
  ansible.builtin.uri:
    url: "http://{{ nm_api_host | default(ansible_host) }}:{{ nm_api_port | default(kiosk_manager_port) }}/api/provision/{{ pihole_ct_id }}/exec"
    method: POST
    body_format: json
    body:
      cmd: "{{ pihole_bin }} -a -p {{ pihole_web_password }}"
      timeout: 30
    status_code: 200
  delegate_to: localhost
  when: pihole_web_password | length > 0
  no_log: true

- name: Set empty password if none provided
  ansible.builtin.uri:
    url: "http://{{ nm_api_host | default(ansible_host) }}:{{ nm_api_port | default(kiosk_manager_port) }}/api/provision/{{ pihole_ct_id }}/exec"
    method: POST
    body_format: json
    body:
      cmd: "{{ pihole_bin }} -a -p"
      timeout: 30
    status_code: 200
  delegate_to: localhost
  when: pihole_web_password | length == 0

# ── Resolve upstream DNS servers ───────────────────────────────

- name: Detect container default gateway
  ansible.builtin.uri:
    url: "http://{{ nm_api_host | default(ansible_host) }}:{{ nm_api_port | default(kiosk_manager_port) }}/api/provision/{{ pihole_ct_id }}/exec"
    method: POST
    body_format: json
    body:
      cmd: "ip -4 route show default"
      timeout: 10
    status_code: 200
  delegate_to: localhost
  register: _pihole_route_result

- name: Compute effective upstream DNS servers
  ansible.builtin.set_fact:
    _pihole_dns_servers: >-
      {{
        ([pihole_upstream_dns_1, pihole_upstream_dns_2]
         if pihole_upstream_dns_1 | length > 0
         else [_pihole_route_result.json.output.split()[2]])
        | select('string') | reject('equalto', '') | list
      }}

- name: Report upstream DNS selection
  ansible.builtin.debug:
    msg: "Pi-hole upstreams: {{ _pihole_dns_servers }}"

- name: Read current upstream DNS
  ansible.builtin.uri:
    url: "http://{{ nm_api_host | default(ansible_host) }}:{{ nm_api_port | default(kiosk_manager_port) }}/api/provision/{{ pihole_ct_id }}/exec"
    method: POST
    body_format: json
    body:
      cmd: "{{ pihole_ftl_bin }} --config dns.upstreams"
      timeout: 10
    status_code: 200
  delegate_to: localhost
  register: _current_upstreams_result

- name: Set upstream DNS servers
  ansible.builtin.uri:
    url: "http://{{ nm_api_host | default(ansible_host) }}:{{ nm_api_port | default(kiosk_manager_port) }}/api/provision/{{ pihole_ct_id }}/exec"
    method: POST
    body_format: json
    body:
      cmd: >-
        {{ pihole_ftl_bin }} --config
        dns.upstreams '{{ _pihole_dns_servers | to_json }}'
      timeout: 30
    status_code: 200
  delegate_to: localhost
  when: >-
    _pihole_dns_servers | difference(
      _current_upstreams_result.json.output | regex_findall('[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+')
    ) | length > 0
    or
    _current_upstreams_result.json.output | regex_findall('[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+')
    | difference(_pihole_dns_servers) | length > 0

# ── Restart FTL and wait for readiness ─────────────────────────

- name: Restart pihole-FTL service
  ansible.builtin.uri:
    url: >-
      http://{{ nm_api_host | default(ansible_host) }}:{{ nm_api_port | default(kiosk_manager_port) }}/api/config/{{ pihole_ct_id }}/service/pihole-FTL/restart
    method: POST
    body_format: json
    body: {}
    status_code: 200
    timeout: 60
  delegate_to: localhost

- name: Allow pihole-FTL to complete graceful stop (DB cleanup ~55s)
  ansible.builtin.pause:
    seconds: 60

- name: Wait for pihole-FTL to be ready
  ansible.builtin.uri:
    url: >-
      http://{{ nm_api_host | default(ansible_host) }}:{{
      nm_api_port | default(kiosk_manager_port) }}/api/config/{{
      pihole_ct_id }}/service/pihole-FTL/status
    method: GET
    status_code: 200
    timeout: 10
  delegate_to: localhost
  register: _ftl_ready
  retries: 6
  delay: 5
  until: (_ftl_ready.json.success | default(false)) | bool

# ── Update gravity database ───────────────────────────────────

- name: Update Pi-hole gravity database
  ansible.builtin.uri:
    url: "http://{{ nm_api_host | default(ansible_host) }}:{{ nm_api_port | default(kiosk_manager_port) }}/api/provision/{{ pihole_ct_id }}/exec"
    method: POST
    body_format: json
    body:
      cmd: "{{ pihole_bin }} -g"
      timeout: 120
    status_code: 200
    timeout: 150
  delegate_to: localhost
  register: _gravity_result
  retries: 3
  delay: 5
  until: (_gravity_result.json.success | default(false)) | bool

# ── Switch container DNS to localhost ──────────────────────────

- name: Point container DNS to itself
  ansible.builtin.uri:
    url: "http://{{ nm_api_host | default(ansible_host) }}:{{ nm_api_port | default(kiosk_manager_port) }}/api/config/{{ pihole_ct_id }}/file"
    method: POST
    body_format: json
    body:
      path: /etc/resolv.conf
      content: "nameserver 127.0.0.1\n"
      mode: "0644"
    status_code: 200
  delegate_to: localhost
