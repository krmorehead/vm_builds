---
# OpenWrt mesh satellite WDS configuration.
# Runs inside the container via pct_remote.
#
# Replaces the former 802.11s mesh approach — the fleet's WiFi hardware
# (AX210, AX200, Centrino N 105) does not support kernel-level mesh
# point mode. WDS AP/STA with 4-address mode provides equivalent L2
# transparency and works on all adapters.
#
# Delegates all WiFi setup to the shared configure_wifi_wds.yml
# task file. This role only maps mesh-specific variables to the
# shared interface.

- name: Configure WDS WiFi link
  ansible.builtin.include_tasks: "{{ project_root }}/tasks/configure_wifi_wds.yml"
  vars:
    _wds_ssid: "{{ openwrt_mesh_ssid }}"
    _wds_key: "{{ openwrt_mesh_key }}"
    _wds_encryption: "{{ openwrt_mesh_encryption }}"
    _wds_wifi_role: "{{ wifi_role | default('sta') }}"
    _wds_country: "{{ openwrt_mesh_country }}"
    _wds_channel: "{{ openwrt_mesh_channel }}"
    _wds_mesh_key: "{{ lookup('env', 'MESH_KEY') | default('', true) }}"
