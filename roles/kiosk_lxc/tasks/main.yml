---
# ── Verify Kiosk template exists ─────────────────────────────────
- name: Verify Kiosk template exists
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/verify_lxc_template.yml"
  vars:
    lxc_template_path: "{{ kiosk_ct_template_path }}"
    lxc_service_name: Kiosk

# ── Determine container network based on host topology ──────────
- name: Compute Kiosk container network
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/lxc_wan_or_lan_network.yml"
  vars:
    lxc_net_service_name: Kiosk
    lxc_net_ip_offset: "{{ kiosk_ct_ip_offset }}"
    lxc_net_flavor_group: kiosk_nodes

# ── Provision via shared proxmox_lxc role ────────────────────────

- name: Provision Kiosk LXC container
  ansible.builtin.include_role:
    name: proxmox_lxc
  vars:
    lxc_ct_id: "{{ kiosk_ct_id }}"
    lxc_ct_hostname: "{{ kiosk_ct_hostname }}"
    lxc_ct_dynamic_group: kiosk
    lxc_ct_memory: "{{ kiosk_ct_memory }}"
    lxc_ct_cores: "{{ kiosk_ct_cores }}"
    lxc_ct_disk: "{{ kiosk_ct_disk }}"
    lxc_ct_onboot: "{{ kiosk_ct_onboot }}"
    lxc_ct_startup_order: 6
    lxc_ct_template: "{{ kiosk_ct_template }}"
    lxc_ct_template_path: "{{ kiosk_ct_template_path }}"
    lxc_ct_ip: "{{ _lxc_net_ip }}/{{ _lxc_net_cidr }}"
    lxc_ct_gateway: "{{ _lxc_net_gateway }}"
    lxc_ct_nameserver: "{{ _lxc_net_nameserver }}"
    lxc_ct_bridge: "{{ _lxc_net_bridge }}"
    lxc_ct_unprivileged: "{{ kiosk_ct_unprivileged }}"
    lxc_ct_features: "{{ kiosk_ct_features }}"
    lxc_ct_image_version: "{{ kiosk_image_version }}"

# ── Device passthrough via lxc.mount.entry + cgroup allowlists ───

- name: Apply device passthrough (DRI for display output)
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/lxc_device_passthrough.yml"
  vars:
    lxc_dev_ct_id: "{{ kiosk_ct_id }}"
    lxc_dev_conf_entries:
      - "lxc.mount.entry: /dev/dri dev/dri none bind,optional,create=dir"
      - "lxc.cgroup2.devices.allow: c 226:* rwm"

# ── Deploy display-exclusive hookscript ──────────────────────────

- name: Ensure snippets directory exists
  ansible.builtin.file:
    path: /var/lib/vz/snippets
    state: directory
    mode: "0755"

- name: Deploy display-exclusive hookscript
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      set -o pipefail
      VMID="$1"
      PHASE="$2"
      KIOSK_ID={{ kiosk_ct_id }}
      CT_IDS=({{ kodi_ct_id }} {{ moonlight_ct_id }} {{ kiosk_ct_id }})
      VM_IDS=({{ desktop_vm_id }})

      is_display() {
          local id="$1"
          for cid in "${CT_IDS[@]}" "${VM_IDS[@]}"; do
              [[ "$id" == "$cid" ]] && return 0
          done
          return 1
      }

      is_display "$VMID" || exit 0

      case "$PHASE" in
          pre-start)
              [[ "$VMID" == "$KIOSK_ID" ]] && exit 0
              for cid in "${CT_IDS[@]}"; do
                  [[ "$cid" == "$VMID" ]] && continue
                  cnt=$(pct status "$cid" 2>/dev/null | grep -c running || true)
                  [ "${cnt:-0}" -gt 0 ] && pct stop "$cid" 2>/dev/null || true
              done
              for vid in "${VM_IDS[@]}"; do
                  [[ "$vid" == "$VMID" ]] && continue
                  cnt=$(qm status "$vid" 2>/dev/null | grep -c running || true)
                  [ "${cnt:-0}" -gt 0 ] && qm stop "$vid" 2>/dev/null || true
              done
              ;;
          post-stop)
              [[ "$VMID" == "$KIOSK_ID" ]] && exit 0
              cnt=$(pct status "$KIOSK_ID" 2>/dev/null | grep -c stopped || true)
              [ "${cnt:-0}" -gt 0 ] && pct start "$KIOSK_ID" 2>/dev/null || true
              ;;
      esac
      exit 0
    dest: /var/lib/vz/snippets/display-exclusive.sh
    mode: "0755"

- name: Export Kiosk static IP for downstream roles
  ansible.builtin.set_fact:
    kiosk_static_ip: "{{ _lxc_net_ip }}"
    cacheable: true

# ── Port forwarding for Manager API ──────────────────────────────
# Every host forwards port 9001 to the kiosk container so the
# 4-tier heartbeat chain works bi-directionally:
#   - WAN hosts: iptables DNAT on the NAT bridge (container and host
#     share the same 10.99.x.x subnet — no hairpin issue)
#   - Router node: socat TCP proxy because the kiosk is on the LAN
#     bridge (vmbr1) while WAN traffic arrives on vmbr0, creating a
#     hairpin NAT scenario that iptables conntrack cannot handle
# LAN hosts (behind the router) don't need forwarding — they share
# the LAN and reach the kiosk directly.

- name: Add DNAT rule for Manager API port (WAN hosts only)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      WAN_IF="{{ proxmox_wan_bridge }}"
      CT_IP="{{ _lxc_net_ip }}"
      if ! iptables -t nat -C PREROUTING -i "$WAN_IF" -p tcp --dport 9001 -j DNAT --to-destination "$CT_IP:9001" 2>/dev/null; then
        iptables -t nat -A PREROUTING -i "$WAN_IF" -p tcp --dport 9001 -j DNAT --to-destination "$CT_IP:9001"
      fi
    executable: /bin/bash
  when:
    - not (_lxc_net_on_lan | bool)
    - inventory_hostname not in groups.get('router_nodes', [])
  changed_when: true

- name: Add FORWARD rule for Manager DNAT traffic (WAN hosts only)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      CT_IP="{{ _lxc_net_ip }}"
      if ! iptables -C FORWARD -d "$CT_IP" -p tcp --dport 9001 -j ACCEPT 2>/dev/null; then
        iptables -A FORWARD -d "$CT_IP" -p tcp --dport 9001 -j ACCEPT
      fi
    executable: /bin/bash
  when:
    - not (_lxc_net_on_lan | bool)
    - inventory_hostname not in groups.get('router_nodes', [])
  changed_when: true

# Router node: socat proxy instead of DNAT. The kiosk container is on
# vmbr1 (LAN) while child Managers connect via vmbr0 (WAN). DNAT +
# MASQUERADE between two bridges on the same host creates a hairpin NAT
# where conntrack cannot reverse the NAT on reply packets (the bridge
# delivers the reply to the host's local stack, bypassing conntrack's
# re-routing logic). socat operates in userspace, avoiding this entirely.
# Deployed as a systemd unit so it survives SSH session teardown and
# auto-restarts on failure/reboot.
- name: Deploy Manager API socat proxy unit (router node only)
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Manager API socat proxy (WAN:9001 -> kiosk:9001)
      After=network.target pve-guests.service
      Wants=pve-guests.service

      [Service]
      Type=simple
      ExecStart=/usr/bin/socat TCP-LISTEN:9001,reuseaddr,fork TCP:{{ _lxc_net_ip }}:9001
      Restart=always
      RestartSec=3

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/manager-api-proxy.service
    mode: "0644"
  when: inventory_hostname in groups.get('router_nodes', [])

- name: Enable and start Manager API socat proxy (router node only)
  ansible.builtin.systemd:
    name: manager-api-proxy
    daemon_reload: true
    enabled: true
    state: restarted
  when: inventory_hostname in groups.get('router_nodes', [])
