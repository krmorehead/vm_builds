---
# Kiosk LXC provisioning via shared proxmox_lxc role.
# Version check skips provisioning when the deployed version matches.

# ── Version-aware skip check ──────────────────────────────────────
- name: Check Kiosk version via NM API
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/check_service_version.yml"
  vars:
    _check_service_name: kiosk
    _check_image_version: "{{ kiosk_image_version }}"

# ── Verify Kiosk template exists (skipped when version matches) ──
- name: Verify Kiosk template exists
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/verify_lxc_template.yml"
  vars:
    lxc_template_path: "{{ kiosk_ct_template_path }}"
    lxc_service_name: Kiosk
  when: not (_service_up_to_date | default(false) | bool)

# ── Determine container network based on host topology ──────────
- name: Compute Kiosk container network
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/lxc_wan_or_lan_network.yml"
  vars:
    lxc_net_service_name: Kiosk
    lxc_net_ip_offset: "{{ kiosk_ct_ip_offset }}"
    lxc_net_flavor_group: kiosk_nodes

# ── Check container existence (skipped when version matches) ─────

- name: Check if Kiosk container exists
  ansible.builtin.command:
    cmd: pct status {{ kiosk_ct_id }}
  register: _ct_status
  failed_when: false
  changed_when: false
  when: not (_service_up_to_date | default(false) | bool)

- name: Set container existence flag
  ansible.builtin.set_fact:
    _lxc_exists: "{{ _ct_status.rc | default(1) == 0 }}"
  when: not (_service_up_to_date | default(false) | bool)

# ── Resolve deployed version (skipped when version matches) ──────

- name: Resolve deployed Kiosk version
  ansible.builtin.include_tasks: "{{ project_root }}/tasks/resolve_kiosk_version.yml"
  when: not (_service_up_to_date | default(false) | bool)

# ── Provision via shared proxmox_lxc role (skipped when version matches)

- name: Provision Kiosk LXC container
  ansible.builtin.include_role:
    name: proxmox_lxc
  vars:
    lxc_ct_id: "{{ kiosk_ct_id }}"
    lxc_ct_hostname: "{{ kiosk_ct_hostname }}"
    lxc_ct_dynamic_group: kiosk
    lxc_ct_memory: "{{ kiosk_ct_memory }}"
    lxc_ct_cores: "{{ kiosk_ct_cores }}"
    lxc_ct_disk: "{{ kiosk_ct_disk }}"
    lxc_ct_onboot: "{{ kiosk_ct_onboot }}"
    lxc_ct_startup_order: 6
    lxc_ct_template_path: "{{ kiosk_ct_template_path }}"
    lxc_ct_ip: "{{ _lxc_net_ip }}/{{ _lxc_net_cidr }}"
    lxc_ct_gateway: "{{ _lxc_net_gateway }}"
    lxc_ct_nameserver: "{{ _lxc_net_nameserver }}"
    lxc_ct_bridge: "{{ _lxc_net_bridge }}"
    lxc_ct_unprivileged: "{{ kiosk_ct_unprivileged }}"
    lxc_ct_features: "{{ kiosk_ct_features }}"
    lxc_ct_image_version: "{{ kiosk_image_version }}"
  when: not (_service_up_to_date | default(false) | bool)

# ── Register in dynamic inventory (always — configure plays need it)
- name: Add Kiosk containers to dynamic inventory group
  ansible.builtin.add_host:
    name: "{{ kiosk_ct_hostname }}-{{ item }}"
    groups: kiosk
    ansible_connection: community.proxmox.proxmox_pct_remote
    ansible_host: "{{ hostvars[item].ansible_host }}"
    ansible_user: root
    proxmox_vmid: "{{ kiosk_ct_id }}"
    ansible_paramiko_host_key_checking: false
    ansible_paramiko_proxy_command: >-
      {{ 'ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p root@'
         + lookup('env', 'PRIMARY_HOST')
         if 'lan_hosts' in (hostvars[item].group_names | default([]))
         else omit }}
  loop: "{{ ansible_play_hosts }}"

# ── Deploy display-exclusive hookscript ──────────────────────────
# The kiosk uses headless rendering (WLR_BACKENDS=headless, pixman)
# and does NOT need DRI access. It stays alive during display app
# launches so the remote VNC session is never interrupted.

- name: Ensure snippets directory exists
  ansible.builtin.file:
    path: /var/lib/vz/snippets
    state: directory
    mode: "0755"

- name: Deploy display-exclusive hookscript
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      # Display-exclusive hookscript: ensures only one display app runs at
      # a time. The kiosk (CT {{ kiosk_ct_id }}) is NOT in the conflict list —
      # it uses headless rendering and stays alive during display launches.
      set -o pipefail
      VMID="$1"
      PHASE="$2"
      CT_IDS=({{ kodi_ct_id }} {{ moonlight_ct_id }} {{ desktop_ct_id }})

      is_display() {
          local id="$1"
          for cid in "${CT_IDS[@]}"; do
              [[ "$id" == "$cid" ]] && return 0
          done
          return 1
      }

      is_display "$VMID" || exit 0

      case "$PHASE" in
          pre-start)
              for cid in "${CT_IDS[@]}"; do
                  [[ "$cid" == "$VMID" ]] && continue
                  cnt=$(pct status "$cid" 2>/dev/null | grep -c running || true)
                  [ "${cnt:-0}" -gt 0 ] && pct stop "$cid" 2>/dev/null || true
              done
              ;;
      esac
      exit 0
    dest: /var/lib/vz/snippets/display-exclusive.sh
    mode: "0755"

- name: Export Kiosk static IP for downstream roles
  ansible.builtin.set_fact:
    kiosk_static_ip: "{{ _lxc_net_ip }}"
    cacheable: true

# ── Local service proxies ─────────────────────────────────────
# Every host gets a socat proxy for each service port. These
# forward from the host's network interfaces (including VPN) to
# the kiosk container's IP. Cross-host traffic arrives via VPN
# (WireGuard DNAT routes VPN port traffic to the host), hits
# these proxies, and reaches the container. One path for all
# topologies — no DNAT rules, no LAN/WAN conditionals.

- name: Clean up legacy proxy services
  ansible.builtin.shell:
    cmd: |
      for svc in kiosk-vnc-proxy kiosk-display-proxy manager-api-proxy; do
        systemctl stop "$svc" 2>/dev/null || true
        systemctl disable "$svc" 2>/dev/null || true
        rm -f "/etc/systemd/system/${svc}.service"
      done
      for f in /etc/systemd/system/*-display-proxy.service; do
        [ -f "$f" ] || continue
        svc="$(basename "$f" .service)"
        systemctl stop "$svc" 2>/dev/null || true
        systemctl disable "$svc" 2>/dev/null || true
        rm -f "$f"
      done
      systemctl daemon-reload
    executable: /bin/bash
  changed_when: true
  failed_when: false

- name: Deploy kiosk-manager-proxy (host:9001 → container:9001)
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Manager API proxy (host:9001 -> kiosk:9001)
      After=network.target pve-guests.service
      Wants=pve-guests.service

      [Service]
      Type=simple
      ExecStart=/usr/bin/socat TCP-LISTEN:9001,reuseaddr,fork,keepalive,keepidle=15,keepcnt=3,keepintvl=5 TCP:{{ _lxc_net_ip }}:9001,keepalive,keepidle=15,keepcnt=3,keepintvl=5
      Restart=always
      RestartSec=3

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/kiosk-manager-proxy.service
    mode: "0644"

- name: Deploy kiosk display proxy on port {{ kiosk_ws_port }}
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Kiosk display proxy (host:{{ kiosk_ws_port }} -> kiosk:{{ kiosk_ws_port }})
      After=network.target pve-guests.service
      Wants=pve-guests.service

      [Service]
      Type=simple
      ExecStart=/usr/bin/socat \
        TCP-LISTEN:{{ kiosk_ws_port }},reuseaddr,fork,keepalive,keepidle=15,keepcnt=3,keepintvl=5 \
        TCP:{{ _lxc_net_ip }}:{{ kiosk_ws_port }},keepalive,keepidle=15,keepcnt=3,keepintvl=5
      Restart=always
      RestartSec=3

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/kiosk-display-proxy.service
    mode: "0644"

- name: Enable kiosk proxy services
  ansible.builtin.systemd:
    name: "{{ item }}"
    daemon_reload: true
    enabled: true
    state: restarted
  loop:
    - kiosk-manager-proxy
    - kiosk-display-proxy
