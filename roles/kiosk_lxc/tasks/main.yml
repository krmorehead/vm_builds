---
# ── Verify Kiosk template exists ─────────────────────────────────
- name: Verify Kiosk template exists
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/verify_lxc_template.yml"
  vars:
    lxc_template_path: "{{ kiosk_ct_template_path }}"
    lxc_service_name: Kiosk

# ── Determine container network ──────────────────────────────────
- name: Compute Kiosk LAN network
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/lxc_lan_network.yml"
  vars:
    lxc_net_service_name: kiosk
    lxc_net_ip_offset: "{{ kiosk_ct_ip_offset }}"

# ── Provision via shared proxmox_lxc role ────────────────────────

- name: Provision Kiosk LXC container
  ansible.builtin.include_role:
    name: proxmox_lxc
  vars:
    lxc_ct_id: "{{ kiosk_ct_id }}"
    lxc_ct_hostname: "{{ kiosk_ct_hostname }}"
    lxc_ct_dynamic_group: kiosk
    lxc_ct_memory: "{{ kiosk_ct_memory }}"
    lxc_ct_cores: "{{ kiosk_ct_cores }}"
    lxc_ct_disk: "{{ kiosk_ct_disk }}"
    lxc_ct_onboot: "{{ kiosk_ct_onboot }}"
    lxc_ct_startup_order: 6
    lxc_ct_template: "{{ kiosk_ct_template }}"
    lxc_ct_template_path: "{{ kiosk_ct_template_path }}"
    lxc_ct_ip: "{{ _lxc_ct_ip }}/{{ _lan_cidr }}"
    lxc_ct_gateway: "{{ _lan_gateway }}"
    lxc_ct_nameserver: "{{ _lan_gateway }}"
    lxc_ct_bridge: "{{ proxmox_all_bridges[1] | default('vmbr0') }}"
    lxc_ct_unprivileged: "{{ kiosk_ct_unprivileged }}"
    lxc_ct_features: "{{ kiosk_ct_features }}"

# ── Device passthrough via lxc.mount.entry + cgroup allowlists ───

- name: Apply device passthrough (DRI for display output)
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/lxc_device_passthrough.yml"
  vars:
    lxc_dev_ct_id: "{{ kiosk_ct_id }}"
    lxc_dev_conf_entries:
      - "lxc.mount.entry: /dev/dri dev/dri none bind,optional,create=dir"
      - "lxc.cgroup2.devices.allow: c 226:* rwm"

# ── Deploy display-exclusive hookscript ──────────────────────────

- name: Ensure snippets directory exists
  ansible.builtin.file:
    path: /var/lib/vz/snippets
    state: directory
    mode: "0755"

- name: Deploy display-exclusive hookscript
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      # Display-exclusive hookscript: ensures only one display service
      # uses the iGPU at a time. Kiosk (401) is the default idle state.
      VMID="$1"
      PHASE="$2"
      KIOSK_ID=401
      DISPLAY_IDS=(301 302 400 401)

      is_display_service() {
          local id="$1"
          for did in "${DISPLAY_IDS[@]}"; do
              [[ "$id" == "$did" ]] && return 0
          done
          return 1
      }

      is_display_service "$VMID" || exit 0

      case "$PHASE" in
          pre-start)
              if [[ "$VMID" != "$KIOSK_ID" ]]; then
                  for did in "${DISPLAY_IDS[@]}"; do
                      [[ "$did" == "$VMID" ]] && continue
                      if [[ "$did" -ge 100 && "$did" -le 199 ]] || [[ "$did" -ge 200 ]]; then
                          pct status "$did" 2>/dev/null | grep -q running && pct stop "$did" 2>/dev/null || true
                          qm status "$did" 2>/dev/null | grep -q running && qm stop "$did" 2>/dev/null || true
                      fi
                  done
              fi
              ;;
          post-stop)
              if [[ "$VMID" != "$KIOSK_ID" ]]; then
                  pct status "$KIOSK_ID" 2>/dev/null | grep -q stopped && pct start "$KIOSK_ID" 2>/dev/null || true
              fi
              ;;
      esac
      exit 0
    dest: /var/lib/vz/snippets/display-exclusive.sh
    mode: "0755"

- name: Attach display-exclusive hookscript to Kiosk
  ansible.builtin.command:
    cmd: pct set {{ kiosk_ct_id }} --hookscript local:snippets/display-exclusive.sh
  changed_when: true

- name: Attach hookscript to existing display containers
  ansible.builtin.command:
    cmd: pct set {{ item }} --hookscript local:snippets/display-exclusive.sh
  loop:
    - "{{ kodi_ct_id }}"
    - "{{ moonlight_ct_id }}"
  loop_control:
    label: "CT {{ item }}"
  register: _attach_ct
  failed_when: false
  changed_when: _attach_ct.rc == 0

- name: Attach hookscript to existing display VMs
  ansible.builtin.command:
    cmd: qm set {{ desktop_vm_id }} --hookscript local:snippets/display-exclusive.sh
  register: _attach_vm
  failed_when: false
  changed_when: _attach_vm.rc == 0

- name: Export Kiosk static IP for downstream roles
  ansible.builtin.set_fact:
    kiosk_static_ip: "{{ _lxc_ct_ip }}"
    cacheable: true
