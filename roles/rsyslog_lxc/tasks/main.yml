---
# ── Verify rsyslog template exists ──────────────────────────────
- name: Verify rsyslog template exists
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/verify_lxc_template.yml"
  vars:
    lxc_template_path: "{{ rsyslog_ct_template_path }}"
    lxc_service_name: rsyslog

# ── Determine container network based on host topology ───────────

- name: Compute rsyslog container network
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/lxc_wan_or_lan_network.yml"
  vars:
    lxc_net_service_name: rsyslog
    lxc_net_ip_offset: "{{ rsyslog_ct_ip_offset }}"
    lxc_net_flavor_group: monitoring_nodes

# ── Provision via shared proxmox_lxc role ────────────────────────

- name: Provision rsyslog LXC container
  ansible.builtin.include_role:
    name: proxmox_lxc
  vars:
    lxc_ct_id: "{{ rsyslog_ct_id }}"
    lxc_ct_hostname: "{{ rsyslog_ct_hostname }}"
    lxc_ct_dynamic_group: rsyslog
    lxc_ct_memory: "{{ rsyslog_ct_memory }}"
    lxc_ct_cores: "{{ rsyslog_ct_cores }}"
    lxc_ct_disk: "{{ rsyslog_ct_disk }}"
    lxc_ct_onboot: "{{ rsyslog_ct_onboot }}"
    lxc_ct_startup_order: "{{ rsyslog_ct_startup_order }}"
    lxc_ct_template: "{{ rsyslog_ct_template }}"
    lxc_ct_template_path: "{{ rsyslog_ct_template_path }}"
    lxc_ct_ip: "{{ _lxc_net_ip }}/{{ _lxc_net_cidr }}"
    lxc_ct_gateway: "{{ _lxc_net_gateway }}"
    lxc_ct_nameserver: "{{ _lxc_net_nameserver }}"
    lxc_ct_features: "{{ rsyslog_ct_features }}"
    lxc_ct_bridge: "{{ _lxc_net_bridge }}"
    lxc_ct_image_version: "{{ rsyslog_image_version }}"

- name: Export rsyslog static IP for downstream roles
  ansible.builtin.set_fact:
    rsyslog_static_ip: "{{ _lxc_net_ip }}"
    cacheable: true
