---
# guisettings.xml (default port), .kodi skeleton, and KasmVNC display service
# are baked into the image by build-images.sh.
# This role handles ONLY host-specific config: optional web port override.
# All in-container operations go through the Node Manager API over VPN.

# ── Ensure container is running ────────────────────────────────────

- name: Check Kodi container status
  ansible.builtin.uri:
    url: "http://{{ nm_api_host | default(ansible_host) }}:{{ nm_api_port | default(kiosk_manager_port) }}/api/provision/{{ kodi_ct_id }}/exec"
    method: POST
    body_format: json
    body:
      cmd: "echo alive"
      timeout: 10
    status_code: 200
  delegate_to: localhost
  register: _kodi_alive
  retries: 10
  delay: 3
  until: (_kodi_alive.json.success | default(false)) | bool

# ── Override web port if non-default ────────────────────────────

- name: Override Kodi web port if non-default
  ansible.builtin.uri:
    url: "http://{{ nm_api_host | default(ansible_host) }}:{{ nm_api_port | default(kiosk_manager_port) }}/api/config/{{ kodi_ct_id }}/sed"
    method: POST
    body_format: json
    body:
      path: /home/kodi/.kodi/userdata/guisettings.xml
      pattern: 'services.webserverport">8080'
      replacement: 'services.webserverport">{{ kodi_web_port }}'
    status_code: 200
  delegate_to: localhost
  when: kodi_web_port | string != '8080'

# ── Report completion ────────────────────────────────────────────

- name: Report Kodi configuration
  ansible.builtin.debug:
    msg: >-
      Kodi configured successfully!
      Web interface: http://{{ kodi_static_ip | default('unknown') }}:{{ kodi_web_port }}
      Display: KasmVNC (X11)
      Display port: {{ kodi_ws_port | default('6082') }}
      Service: kodi-display (baked + enabled)
