---
# Render group, guisettings.xml (default port), .kodi skeleton, and
# kodi-standalone enablement are baked into the image by build-images.sh.
# This role handles ONLY host-specific config: render GID override,
# ALSA device, and optional web port override.

# ── Ensure container is running ──────────────────────────────────

- name: Check Kodi container status
  ansible.builtin.command:
    cmd: pct status {{ kodi_ct_id }}
  register: _kodi_ct_status
  changed_when: false
  failed_when: false

- name: Start Kodi container if stopped
  ansible.builtin.command:
    cmd: pct start {{ kodi_ct_id }}
  when: "'stopped' in (_kodi_ct_status.stdout | default(''))"
  changed_when: true

- name: Wait for Kodi container to be ready
  ansible.builtin.command:
    cmd: pct exec {{ kodi_ct_id }} -- ls /
  register: _kodi_ready
  retries: 10
  delay: 3
  until: _kodi_ready.rc == 0
  changed_when: false
  when: "'stopped' in (_kodi_ct_status.stdout | default(''))"

# ── Configure iGPU access (host-specific GID) ─────────────────

- name: Update render group GID to match host
  ansible.builtin.shell:
    cmd: |
      pct exec {{ kodi_ct_id }} -- bash -c '
        groupmod -g {{ igpu_render_gid }} render 2>/dev/null || true
        usermod -a -G render,video,audio,input kodi 2>/dev/null || true
      '
    executable: /bin/bash
  changed_when: true

# ── Configure ALSA HDMI audio output (host-specific) ────────────

- name: Write ALSA config to host temp
  ansible.builtin.copy:
    content: |
      pcm.!default {
        type hw
        card {{ kodi_alsa_card }}
        device {{ kodi_alsa_device }}
      }
      ctl.!default {
        type hw
        card {{ kodi_alsa_card }}
      }
    dest: /tmp/kodi_asoundrc
    mode: "0644"

- name: Push ALSA config into container
  ansible.builtin.command:
    cmd: pct push {{ kodi_ct_id }} /tmp/kodi_asoundrc /home/kodi/.asoundrc
  changed_when: true

- name: Set Kodi ownership on ALSA config
  ansible.builtin.command:
    cmd: pct exec {{ kodi_ct_id }} -- chown kodi:kodi /home/kodi/.asoundrc
  changed_when: true

- name: Clean up host temp files
  ansible.builtin.file:
    path: /tmp/kodi_asoundrc
    state: absent

# ── Override web port if non-default ────────────────────────────

- name: Override Kodi web port if non-default
  ansible.builtin.shell:
    cmd: |
      pct exec {{ kodi_ct_id }} -- bash -c '
        sed -i "s/services.webserverport\">8080/services.webserverport\">{{ kodi_web_port }}/" \
          /home/kodi/.kodi/userdata/guisettings.xml
      '
    executable: /bin/bash
  changed_when: true
  when: kodi_web_port | string != '8080'

# ── Report completion ────────────────────────────────────────────

- name: Report Kodi configuration
  ansible.builtin.debug:
    msg: >-
      Kodi configured successfully!
      Web interface: http://{{ kodi_static_ip | default('unknown') }}:{{ kodi_web_port }}
      Display: GBM/DRM via /dev/dri
      Audio: ALSA via /dev/snd (HDMI)
      Service: kodi-standalone (baked + enabled)
