---
# Docker, config dir, docker-compose.yml, configuration.yaml, and the
# compose systemd unit are baked into the image by build-images.sh.
# This role handles ONLY host-specific config: password and onboarding.
# All in-container operations go through the Node Manager API over VPN.

# ── Start Home Assistant via baked systemd unit ──────────────────

- name: Start Home Assistant compose service
  ansible.builtin.uri:
    url: "http://{{ nm_api_host | default(ansible_host) }}:{{ nm_api_port | default(kiosk_manager_port) }}/api/provision/{{ homeassistant_ct_id }}/exec"
    method: POST
    body_format: json
    body:
      cmd: "systemctl start homeassistant-compose"
      timeout: 30
    status_code: 200
  delegate_to: localhost

- name: Wait for Home Assistant Docker container to be running
  ansible.builtin.uri:
    url: "http://{{ nm_api_host | default(ansible_host) }}:{{ nm_api_port | default(kiosk_manager_port) }}/api/provision/{{ homeassistant_ct_id }}/exec"
    method: POST
    body_format: json
    body:
      cmd: "docker compose -f {{ homeassistant_config_path }}/docker-compose.yml ps --services --filter status=running"
      timeout: 30
    status_code: 200
  delegate_to: localhost
  register: _ha_services
  retries: 30
  delay: 10
  until: >-
    (_ha_services.json.success | default(false)) | bool
    and 'home-assistant' in (_ha_services.json.output | default(''))

# ── Generate admin password if not provided ──────────────────────

- name: Set admin password
  ansible.builtin.set_fact:
    _ha_admin_password: >-
      {{ ha_admin_password
         if ha_admin_password | length > 0
         else lookup('password', '/dev/null chars=ascii_letters,digits length=32') }}

# ── Wait for web UI and create admin user ────────────────────────

- name: Wait for Home Assistant web interface
  ansible.builtin.uri:
    url: "http://{{ nm_api_host | default(ansible_host) }}:{{ nm_api_port | default(kiosk_manager_port) }}/api/provision/{{ homeassistant_ct_id }}/exec"
    method: POST
    body_format: json
    body:
      cmd: "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8123"
      timeout: 15
    status_code: 200
  delegate_to: localhost
  register: _ha_http_check
  retries: 15
  delay: 10
  until: >-
    (_ha_http_check.json.success | default(false)) | bool
    and (_ha_http_check.json.output | default('') | trim) in ['200', '301', '302']

- name: Create admin user via Home Assistant onboarding API
  ansible.builtin.uri:
    url: "http://{{ nm_api_host | default(ansible_host) }}:{{ nm_api_port | default(kiosk_manager_port) }}/api/provision/{{ homeassistant_ct_id }}/exec"
    method: POST
    body_format: json
    body:
      cmd: >-
        /bin/sh -c 'curl -s -X POST -H "Content-Type: application/json"
        -d "{\"client_id\": \"http://homeassistant.local/\",
             \"name\": \"Administrator\",
             \"username\": \"admin\",
             \"password\": \"{{ _ha_admin_password }}\",
             \"language\": \"en\"}"
        http://127.0.0.1:8123/api/onboarding/users 2>/dev/null || true'
      timeout: 30
    status_code: 200
  delegate_to: localhost
  no_log: true
  failed_when: false

# ── Report completion ────────────────────────────────────────────

- name: Report Home Assistant configuration
  ansible.builtin.debug:
    msg: >-
      Home Assistant configured: ct={{ homeassistant_ct_id }},
      web=http://localhost:8123, admin=admin,
      config={{ homeassistant_config_path }}
