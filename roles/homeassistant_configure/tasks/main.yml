---
# Docker, config dir, docker-compose.yml, configuration.yaml, and the
# compose systemd unit are baked into the image by build-images.sh.
# This role handles ONLY host-specific config: password and onboarding.
# All in-container operations go through the Node Manager API over VPN.

# ── Start Home Assistant via baked systemd unit ──────────────────

- name: Start Home Assistant compose service
  ansible.builtin.uri:
    url: "{{ nm_api_url }}/api/provision/{{ homeassistant_ct_id }}/exec"
    headers: "{{ nm_auth_headers }}"
    method: POST
    body_format: json
    body:
      cmd: "systemctl start homeassistant-compose"
      timeout: 30
    status_code: 200
  delegate_to: localhost

- name: Wait for Home Assistant Docker container to be running
  ansible.builtin.uri:
    url: "{{ nm_api_url }}/api/provision/{{ homeassistant_ct_id }}/exec"
    headers: "{{ nm_auth_headers }}"
    method: POST
    body_format: json
    body:
      cmd: "docker compose -f {{ homeassistant_config_path }}/docker-compose.yml ps --services --filter status=running"
      timeout: 30
    status_code: 200
  delegate_to: localhost
  register: _ha_services
  retries: 10
  delay: 3
  until: >-
    (_ha_services.json.success | default(false)) | bool
    and 'home-assistant' in (_ha_services.json.output | default(''))

# ── Generate admin password if not provided ──────────────────────

- name: Set admin password
  ansible.builtin.set_fact:
    _ha_admin_password: >-
      {{ ha_admin_password
         if ha_admin_password | length > 0
         else lookup('password', '/dev/null chars=ascii_letters,digits length=32') }}

# ── Wait for onboarding API readiness ────────────────────────────

- name: Wait for Home Assistant onboarding API
  ansible.builtin.uri:
    url: "{{ nm_api_url }}/api/provision/{{ homeassistant_ct_id }}/exec"
    headers: "{{ nm_auth_headers }}"
    method: POST
    body_format: json
    body:
      cmd: "curl -s http://127.0.0.1:{{ homeassistant_web_port }}/api/onboarding"
      timeout: 10
    status_code: 200
  delegate_to: localhost
  register: _ha_onboard_check
  retries: 20
  delay: 10
  until: >-
    (_ha_onboard_check.json.success | default(false)) | bool
    and 'user' in (_ha_onboard_check.json.output | default(''))

# ── Create admin user (idempotent) ───────────────────────────────
# POST /api/onboarding/users returns:
#   - 200 + {"auth_code":"..."} on first setup  → NM returns success=true
#   - 403 + "User step already done" on re-runs → NM returns success=false
#     because curl exits non-zero on HTTP 403
# Both outcomes are treated as success by the until condition.

- name: Create admin user via Home Assistant onboarding API
  ansible.builtin.uri:
    url: "{{ nm_api_url }}/api/provision/{{ homeassistant_ct_id }}/exec"
    headers: "{{ nm_auth_headers }}"
    method: POST
    body_format: json
    body:
      cmd: >-
        /bin/sh -c 'curl -s -w "\n%{http_code}" -X POST -H "Content-Type: application/json"
        -d "{\"client_id\": \"http://homeassistant.local/\",
             \"name\": \"Administrator\",
             \"username\": \"admin\",
             \"password\": \"{{ _ha_admin_password }}\",
             \"language\": \"en\"}"
        http://127.0.0.1:{{ homeassistant_web_port }}/api/onboarding/users'
      timeout: 30
    status_code: 200
  delegate_to: localhost
  no_log: true
  register: _ha_onboard
  retries: 6
  delay: 15
  until: >-
    'auth_code' in (_ha_onboard.json.output | default(''))
    or '403' in (_ha_onboard.json.output | default(''))
    or 'already' in (_ha_onboard.json.output | default(''))

# ── Report completion ────────────────────────────────────────────

- name: Report Home Assistant configuration
  ansible.builtin.debug:
    msg: >-
      Home Assistant configured: ct={{ homeassistant_ct_id }},
      web=http://localhost:{{ homeassistant_web_port }}, admin=admin,
      config={{ homeassistant_config_path }}
