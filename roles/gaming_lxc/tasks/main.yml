---
# Gaming LXC provisioning via Node Manager API.
# Version check skips provisioning when the deployed version matches.

# ── Version-aware skip check ──────────────────────────────────────
- name: Check Gaming version via NM API
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/check_service_version.yml"
  vars:
    _check_service_name: gaming
    _check_image_version: "{{ gaming_image_version }}"

# ── Verify Gaming LXC template exists (skipped when version matches)
- name: Verify Gaming LXC template exists
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/verify_lxc_template.yml"
  vars:
    lxc_template_path: "{{ gaming_ct_template_path }}"
    lxc_service_name: Gaming LXC
  when: not (_service_up_to_date | default(false) | bool)

# ── Determine container network based on host topology ───────────
- name: Compute Gaming container network
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/lxc_wan_or_lan_network.yml"
  vars:
    lxc_net_service_name: Gaming LXC
    lxc_net_ip_offset: "{{ gaming_ct_ip_offset }}"
    lxc_net_flavor_group: gaming_nodes

# ── Upload template to host if not cached ──────────────────────────
- name: Upload Gaming template to Proxmox host
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/upload_lxc_template.yml"
  vars:
    lxc_upload_template_path: "{{ role_path }}/../../{{ gaming_ct_template_path }}"
    lxc_upload_service_name: Gaming
  when: not (_service_up_to_date | default(false) | bool)

# ── Provision container via NM API (skipped when version matches) ─
- name: Provision Gaming LXC via NM API
  ansible.builtin.uri:
    url: "http://{{ nm_api_host | default(ansible_host) }}:{{ nm_api_port | default(kiosk_manager_port) }}/api/provision/gaming"
    headers: "{{ nm_auth_headers }}"
    method: POST
    body_format: json
    body:
      vmid: "{{ gaming_ct_id }}"
      template_path: "{{ gaming_ct_template_path | basename }}"
      hostname: "{{ gaming_ct_hostname }}"
      memory: "{{ gaming_ct_memory }}"
      swap: "{{ gaming_ct_swap }}"
      cores: "{{ gaming_ct_cores }}"
      disk: "{{ gaming_ct_disk }}"
      onboot: "{{ gaming_ct_onboot }}"
      startup_order: "{{ gaming_ct_startup_order }}"
      unprivileged: "{{ gaming_ct_unprivileged }}"
      features: "{{ gaming_ct_features | join(',') }}"
      ip: "{{ _lxc_net_ip }}/{{ _lxc_net_cidr }}"
      gateway: "{{ _lxc_net_gateway }}"
      nameserver: "{{ _lxc_net_nameserver }}"
      bridge: "{{ _lxc_net_bridge }}"
      skip_debian_cleanup: true
      lxc_conf_entries:
        - "lxc.mount.entry: /dev/dri dev/dri none bind,optional,create=dir"
        - "lxc.mount.entry: /dev/input dev/input none bind,optional,create=dir"
        - "lxc.cgroup2.devices.allow: c 226:* rwm"
        - "lxc.cgroup2.devices.allow: c 13:* rwm"
        - "lxc.cgroup2.devices.allow: c 10:223 rwm"
      image_version: "{{ gaming_image_version }}"
    status_code: 200
    timeout: 660
  delegate_to: localhost
  register: _provision_result
  failed_when: not (_provision_result.json.success | default(false))
  when: not (_service_up_to_date | default(false) | bool)

# ── Apply privileged config on host (features/DRI/input need root@pam) ─
- name: Apply privileged LXC config on host for Gaming
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/apply_privileged_lxc_config.yml"
  vars:
    _priv_ct_id: "{{ gaming_ct_id }}"
    _priv_features: "{{ gaming_ct_features | join(',') }}"
    _priv_mount_entries: []
    _priv_lxc_conf_entries:
      - "lxc.mount.entry: /dev/dri dev/dri none bind,optional,create=dir"
      - "lxc.mount.entry: /dev/input dev/input none bind,optional,create=dir"
      - "lxc.cgroup2.devices.allow: c 226:* rwm"
      - "lxc.cgroup2.devices.allow: c 13:* rwm"
      - "lxc.cgroup2.devices.allow: c 10:223 rwm"
  when:
    - not (_service_up_to_date | default(false) | bool)
    - (_provision_result.json.status | default('')) == 'created_needs_host_config'

- name: Report provision result
  ansible.builtin.debug:
    msg: "Gaming LXC on {{ inventory_hostname }}: {{ _provision_result.json.status }} — {{ _provision_result.json.log | default([]) | join(', ') }}"
  when: not (_service_up_to_date | default(false) | bool)

# ── Configure callhome via NM API (skipped when version matches) ─
- name: Configure callhome on Gaming LXC
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/configure_callhome_api.yml"
  vars:
    _callhome_vmid: "{{ gaming_ct_id }}"

# ── Register in dynamic inventory (for configure plays) ──────────
- name: Add Gaming containers to dynamic inventory group
  ansible.builtin.add_host:
    name: "{{ gaming_ct_hostname }}-{{ item }}"
    groups: gaming
    ansible_connection: community.proxmox.proxmox_pct_remote
    ansible_host: "{{ hostvars[item].ansible_host }}"
    ansible_user: root
    proxmox_vmid: "{{ gaming_ct_id }}"
    ansible_paramiko_host_key_checking: false
    ansible_paramiko_proxy_command: >-
      {{ 'ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p root@'
         + lookup('env', 'PRIMARY_HOST')
         if 'lan_hosts' in (hostvars[item].group_names | default([]))
         else omit }}
  loop: "{{ ansible_play_hosts }}"

# ── Export static IP for downstream roles ─────────────────────────
- name: Export Gaming container static IP for downstream roles
  ansible.builtin.set_fact:
    gaming_static_ip: "{{ _lxc_net_ip }}"
    cacheable: true

# ── Sunshine port forwarding (WAN hosts only) ────────────────────
- name: Add Sunshine DNAT rules (WAN hosts)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      DEST="{{ _lxc_net_ip }}:{{ item.port }}"
      if iptables -t nat -C PREROUTING -i {{ proxmox_wan_bridge }} \
          -p {{ item.proto }} --dport {{ item.port }} \
          -j DNAT --to-destination "$DEST" 2>/dev/null; then
        echo EXISTS
      else
        iptables -t nat -A PREROUTING -i {{ proxmox_wan_bridge }} \
            -p {{ item.proto }} --dport {{ item.port }} \
            -j DNAT --to-destination "$DEST"
        echo ADDED
      fi
    executable: /bin/bash
  register: _sunshine_dnat
  loop:
    - { proto: tcp, port: 47984 }
    - { proto: tcp, port: 47989 }
    - { proto: tcp, port: 47990 }
    - { proto: tcp, port: 48010 }
    - { proto: udp, port: 47998 }
    - { proto: udp, port: 47999 }
    - { proto: udp, port: 48000 }
    - { proto: udp, port: 48001 }
    - { proto: udp, port: 48002 }
    - { proto: udp, port: 48003 }
    - { proto: udp, port: 48004 }
    - { proto: udp, port: 48005 }
    - { proto: udp, port: 48006 }
    - { proto: udp, port: 48007 }
    - { proto: udp, port: 48008 }
    - { proto: udp, port: 48009 }
    - { proto: udp, port: 48010 }
  changed_when: "'ADDED' in _sunshine_dnat.stdout"
  when:
    - not (_service_up_to_date | default(false) | bool)
    - not (_lxc_net_on_lan | bool)

- name: Add Sunshine FORWARD rules (WAN hosts)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      if iptables -C FORWARD -i {{ proxmox_wan_bridge }} \
          -o {{ proxmox_container_bridge }} \
          -p {{ item.proto }} --dport {{ item.port }} \
          -j ACCEPT 2>/dev/null; then
        echo EXISTS
      else
        iptables -A FORWARD -i {{ proxmox_wan_bridge }} \
            -o {{ proxmox_container_bridge }} \
            -p {{ item.proto }} --dport {{ item.port }} \
            -j ACCEPT
        echo ADDED
      fi
    executable: /bin/bash
  register: _sunshine_fwd
  loop:
    - { proto: tcp, port: 47984 }
    - { proto: tcp, port: 47989 }
    - { proto: tcp, port: 47990 }
    - { proto: tcp, port: 48010 }
    - { proto: udp, port: 47998 }
    - { proto: udp, port: 47999 }
    - { proto: udp, port: 48000 }
    - { proto: udp, port: 48001 }
    - { proto: udp, port: 48002 }
    - { proto: udp, port: 48003 }
    - { proto: udp, port: 48004 }
    - { proto: udp, port: 48005 }
    - { proto: udp, port: 48006 }
    - { proto: udp, port: 48007 }
    - { proto: udp, port: 48008 }
    - { proto: udp, port: 48009 }
    - { proto: udp, port: 48010 }
  changed_when: "'ADDED' in _sunshine_fwd.stdout"
  when:
    - not (_service_up_to_date | default(false) | bool)
    - not (_lxc_net_on_lan | bool)
