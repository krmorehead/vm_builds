---
# ── Verify Gaming LXC template exists ────────────────────────────
- name: Verify Gaming LXC template exists
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/verify_lxc_template.yml"
  vars:
    lxc_template_path: "{{ gaming_ct_template_path }}"
    lxc_service_name: Gaming LXC

# ── Determine container network based on host topology ───────────

- name: Compute Gaming container network
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/lxc_wan_or_lan_network.yml"
  vars:
    lxc_net_service_name: Gaming LXC
    lxc_net_ip_offset: "{{ gaming_ct_ip_offset }}"
    lxc_net_flavor_group: gaming_nodes

# ── Provision via shared proxmox_lxc role ────────────────────────

- name: Provision Gaming LXC container
  ansible.builtin.include_role:
    name: proxmox_lxc
  vars:
    lxc_ct_id: "{{ gaming_ct_id }}"
    lxc_ct_hostname: "{{ gaming_ct_hostname }}"
    lxc_ct_dynamic_group: gaming
    lxc_ct_memory: "{{ gaming_ct_memory }}"
    lxc_ct_swap: "{{ gaming_ct_swap }}"
    lxc_ct_cores: "{{ gaming_ct_cores }}"
    lxc_ct_disk: "{{ gaming_ct_disk }}"
    lxc_ct_onboot: "{{ gaming_ct_onboot }}"
    lxc_ct_startup_order: "{{ gaming_ct_startup_order }}"
    lxc_ct_template: "{{ gaming_ct_template }}"
    lxc_ct_template_path: "{{ gaming_ct_template_path }}"
    lxc_ct_ip: "{{ _lxc_net_ip }}/{{ _lxc_net_cidr }}"
    lxc_ct_gateway: "{{ _lxc_net_gateway }}"
    lxc_ct_nameserver: "{{ _lxc_net_nameserver }}"
    lxc_ct_bridge: "{{ _lxc_net_bridge }}"
    lxc_ct_unprivileged: "{{ gaming_ct_unprivileged }}"
    lxc_ct_features: "{{ gaming_ct_features }}"
    lxc_ct_skip_debian_cleanup: true
    lxc_ct_image_version: "{{ gaming_image_version }}"

# ── Device passthrough via lxc.mount.entry + cgroup allowlists ───

- name: Apply device passthrough (DRI + input + uinput)
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/lxc_device_passthrough.yml"
  vars:
    lxc_dev_ct_id: "{{ gaming_ct_id }}"
    lxc_dev_conf_entries:
      - "lxc.mount.entry: /dev/dri dev/dri none bind,optional,create=dir"
      - "lxc.mount.entry: /dev/input dev/input none bind,optional,create=dir"
      - "lxc.cgroup2.devices.allow: c 226:* rwm"
      - "lxc.cgroup2.devices.allow: c 13:* rwm"
      - "lxc.cgroup2.devices.allow: c 10:223 rwm"

- name: Export Gaming container static IP for downstream roles
  ansible.builtin.set_fact:
    gaming_static_ip: "{{ _lxc_net_ip }}"
    cacheable: true
