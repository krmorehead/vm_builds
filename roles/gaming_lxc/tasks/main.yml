---
# ── Verify Gaming LXC template exists ────────────────────────────
- name: Verify Gaming LXC template exists
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/verify_lxc_template.yml"
  vars:
    lxc_template_path: "{{ gaming_ct_template_path }}"
    lxc_service_name: Gaming LXC

# ── Determine container network based on host topology ───────────

- name: Read LAN gateway from generated env
  ansible.builtin.set_fact:
    _lan_gateway: >-
      {{ lookup('pipe', 'grep "^LAN_GATEWAY=" ' + env_generated_path + ' 2>/dev/null | cut -d= -f2')
         | default('10.10.10.1', true) }}
    _lan_cidr: >-
      {{ lookup('pipe', 'grep "^LAN_CIDR=" ' + env_generated_path + ' 2>/dev/null | cut -d= -f2')
         | default('24', true) }}

- name: Determine if host is on the OpenWrt LAN
  ansible.builtin.set_fact:
    _host_on_openwrt_lan: >-
      {{ 'router_nodes' in group_names or 'lan_hosts' in group_names }}

- name: Set container network for OpenWrt LAN hosts
  ansible.builtin.set_fact:
    _gaming_gateway: "{{ _lan_gateway }}"
    _gaming_cidr: "{{ _lan_cidr }}"
    _gaming_ct_ip: >-
      {{ _lan_gateway.split('.')[0:3] | join('.') }}.{{
         gaming_ct_ip_offset | int + groups['gaming_nodes'].index(inventory_hostname) }}
    _gaming_nameserver: "{{ _lan_gateway }}"
  when: _host_on_openwrt_lan | bool

- name: Set container network for WAN-connected hosts
  ansible.builtin.set_fact:
    _gaming_gateway: "{{ ansible_default_ipv4.gateway }}"
    _gaming_cidr: "{{ ansible_default_ipv4.prefix }}"
    _gaming_ct_ip: >-
      {{ ansible_default_ipv4.network.split('.')[0:3] | join('.') }}.{{
         gaming_ct_ip_offset | int + 200 + groups['gaming_nodes'].index(inventory_hostname) }}
    _gaming_nameserver: "8.8.8.8"
  when: not (_host_on_openwrt_lan | bool)

- name: Report Gaming container IP assignment
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: gaming IP={{ _gaming_ct_ip }}/{{ _gaming_cidr }}
      gw={{ _gaming_gateway }} ({{ 'OpenWrt LAN' if (_host_on_openwrt_lan | bool) else 'WAN subnet' }})

# ── Provision via shared proxmox_lxc role ────────────────────────

- name: Provision Gaming LXC container
  ansible.builtin.include_role:
    name: proxmox_lxc
  vars:
    lxc_ct_id: "{{ gaming_ct_id }}"
    lxc_ct_hostname: "{{ gaming_ct_hostname }}"
    lxc_ct_dynamic_group: gaming
    lxc_ct_memory: "{{ gaming_ct_memory }}"
    lxc_ct_swap: "{{ gaming_ct_swap }}"
    lxc_ct_cores: "{{ gaming_ct_cores }}"
    lxc_ct_disk: "{{ gaming_ct_disk }}"
    lxc_ct_onboot: "{{ gaming_ct_onboot }}"
    lxc_ct_startup_order: "{{ gaming_ct_startup_order }}"
    lxc_ct_template: "{{ gaming_ct_template }}"
    lxc_ct_template_path: "{{ gaming_ct_template_path }}"
    lxc_ct_ip: "{{ _gaming_ct_ip }}/{{ _gaming_cidr }}"
    lxc_ct_gateway: "{{ _gaming_gateway }}"
    lxc_ct_nameserver: "{{ _gaming_nameserver }}"
    lxc_ct_bridge: >-
      {{ proxmox_wan_bridge
         if not (_host_on_openwrt_lan | bool)
         else proxmox_all_bridges[1] | default('vmbr0') }}
    lxc_ct_unprivileged: "{{ gaming_ct_unprivileged }}"
    lxc_ct_features: "{{ gaming_ct_features }}"
    lxc_ct_skip_debian_cleanup: true

# ── Device passthrough via lxc.mount.entry + cgroup allowlists ───

- name: Apply device passthrough (DRI + input + uinput)
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/lxc_device_passthrough.yml"
  vars:
    lxc_dev_ct_id: "{{ gaming_ct_id }}"
    lxc_dev_conf_entries:
      - "lxc.mount.entry: /dev/dri dev/dri none bind,optional,create=dir"
      - "lxc.mount.entry: /dev/input dev/input none bind,optional,create=dir"
      - "lxc.cgroup2.devices.allow: c 226:* rwm"
      - "lxc.cgroup2.devices.allow: c 13:* rwm"
      - "lxc.cgroup2.devices.allow: c 10:223 rwm"

- name: Export Gaming container static IP for downstream roles
  ansible.builtin.set_fact:
    gaming_static_ip: "{{ _gaming_ct_ip }}"
    cacheable: true
