---
# ── Verify Kodi template exists ──────────────────────────────────
- name: Verify Kodi template exists
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/verify_lxc_template.yml"
  vars:
    lxc_template_path: "{{ kodi_ct_template_path }}"
    lxc_service_name: Kodi

# ── Determine container network ──────────────────────────────────
- name: Compute Kodi LAN network
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/lxc_lan_network.yml"
  vars:
    lxc_net_service_name: kodi
    lxc_net_ip_offset: "{{ kodi_ct_ip_offset }}"

# ── Check container existence ──────────────────────────────────

- name: Check if Kodi container exists
  ansible.builtin.command:
    cmd: pct status {{ kodi_ct_id }}
  register: _ct_status
  failed_when: false
  changed_when: false

- name: Set container existence flag
  ansible.builtin.set_fact:
    _lxc_exists: "{{ _ct_status.rc == 0 }}"

# ── Resolve deployed version ──────────────────────────────────

- name: Resolve deployed Kodi version
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/resolve_deployed_version.yml"
  vars:
    _resolve_service_name: kodi

# ── Provision via shared proxmox_lxc role ────────────────────────

- name: Provision Kodi LXC container
  ansible.builtin.include_role:
    name: proxmox_lxc
  vars:
    lxc_ct_id: "{{ kodi_ct_id }}"
    lxc_ct_hostname: "{{ kodi_ct_hostname }}"
    lxc_ct_dynamic_group: kodi
    lxc_ct_memory: "{{ kodi_ct_memory }}"
    lxc_ct_cores: "{{ kodi_ct_cores }}"
    lxc_ct_disk: "{{ kodi_ct_disk }}"
    lxc_ct_onboot: "{{ kodi_ct_onboot }}"
    lxc_ct_startup_order: 0
    lxc_ct_template_path: "{{ kodi_ct_template_path }}"
    lxc_ct_ip: "{{ _lxc_ct_ip }}/{{ _lan_cidr }}"
    lxc_ct_gateway: "{{ _lan_gateway }}"
    lxc_ct_nameserver: "{{ _lan_gateway }}"
    lxc_ct_bridge: "{{ proxmox_all_bridges[1] | default('vmbr0') }}"
    lxc_ct_unprivileged: "{{ kodi_ct_unprivileged }}"
    lxc_ct_features: "{{ kodi_ct_features }}"
    lxc_ct_image_version: "{{ kodi_image_version }}"

# Kodi runs headless via sway+wayvnc (WLR_BACKENDS=headless, pixman).
# No DRI/ALSA/input passthrough needed — VNC provides remote display.

- name: Export Kodi static IP for downstream roles
  ansible.builtin.set_fact:
    kodi_static_ip: "{{ _lxc_ct_ip }}"
    cacheable: true

# ── Port forwarding for Kodi VNC WebSocket ───────────────────────
# The container runs websockify on port 6082. Forward from the host.

- name: Deploy Kodi VNC socat proxy unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Kodi VNC WebSocket proxy (host:{{ kodi_vnc_ws_port }} -> kodi:{{ kodi_vnc_ws_port }})
      After=network.target pve-guests.service
      Wants=pve-guests.service

      [Service]
      Type=simple
      ExecStart=/usr/bin/socat TCP-LISTEN:{{ kodi_vnc_ws_port }},reuseaddr,fork TCP:{{ _lxc_ct_ip }}:{{ kodi_vnc_ws_port }}
      Restart=always
      RestartSec=3

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/kodi-vnc-proxy.service
    mode: "0644"

- name: Enable and start Kodi VNC proxy
  ansible.builtin.systemd:
    name: kodi-vnc-proxy
    daemon_reload: true
    enabled: true
    state: restarted
