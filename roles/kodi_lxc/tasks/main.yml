---
# ── Verify Kodi template exists ──────────────────────────────────
- name: Verify Kodi template exists
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/verify_lxc_template.yml"
  vars:
    lxc_template_path: "{{ kodi_ct_template_path }}"
    lxc_service_name: Kodi

# ── Determine container network ──────────────────────────────────
- name: Compute Kodi LAN network
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/lxc_lan_network.yml"
  vars:
    lxc_net_service_name: kodi
    lxc_net_ip_offset: "{{ kodi_ct_ip_offset }}"

# ── Provision via shared proxmox_lxc role ────────────────────────

- name: Provision Kodi LXC container
  ansible.builtin.include_role:
    name: proxmox_lxc
  vars:
    lxc_ct_id: "{{ kodi_ct_id }}"
    lxc_ct_hostname: "{{ kodi_ct_hostname }}"
    lxc_ct_dynamic_group: kodi
    lxc_ct_memory: "{{ kodi_ct_memory }}"
    lxc_ct_cores: "{{ kodi_ct_cores }}"
    lxc_ct_disk: "{{ kodi_ct_disk }}"
    lxc_ct_onboot: "{{ kodi_ct_onboot }}"
    lxc_ct_startup_order: 0
    lxc_ct_template: "{{ kodi_ct_template }}"
    lxc_ct_template_path: "{{ kodi_ct_template_path }}"
    lxc_ct_ip: "{{ _lxc_ct_ip }}/{{ _lan_cidr }}"
    lxc_ct_gateway: "{{ _lan_gateway }}"
    lxc_ct_nameserver: "{{ _lan_gateway }}"
    lxc_ct_bridge: "{{ proxmox_all_bridges[1] | default('vmbr0') }}"
    lxc_ct_unprivileged: "{{ kodi_ct_unprivileged }}"
    lxc_ct_features: "{{ kodi_ct_features }}"
    lxc_ct_image_version: "{{ kodi_image_version }}"

# ── Device passthrough via lxc.mount.entry + cgroup allowlists ───

- name: Apply device passthrough (DRI + ALSA + input)
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/lxc_device_passthrough.yml"
  vars:
    lxc_dev_ct_id: "{{ kodi_ct_id }}"
    lxc_dev_conf_entries:
      - "lxc.mount.entry: /dev/dri dev/dri none bind,optional,create=dir"
      - "lxc.mount.entry: /dev/snd dev/snd none bind,optional,create=dir"
      - "lxc.mount.entry: /dev/input dev/input none bind,optional,create=dir"
      - "lxc.cgroup2.devices.allow: c 226:* rwm"
      - "lxc.cgroup2.devices.allow: c 116:* rwm"
      - "lxc.cgroup2.devices.allow: c 13:* rwm"

- name: Export Kodi static IP for downstream roles
  ansible.builtin.set_fact:
    kodi_static_ip: "{{ _lxc_ct_ip }}"
    cacheable: true
