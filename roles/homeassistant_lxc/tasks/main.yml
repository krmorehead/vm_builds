---
# ── Verify Home Assistant template exists ─────────────────────────
- name: Verify Home Assistant template exists
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/verify_lxc_template.yml"
  vars:
    lxc_template_path: "{{ homeassistant_ct_template_path }}"
    lxc_service_name: Home Assistant

# ── Determine container network ─────────────────────────────────
- name: Compute Home Assistant LAN network
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/lxc_lan_network.yml"
  vars:
    lxc_net_service_name: homeassistant
    lxc_net_ip_offset: "{{ homeassistant_ct_ip_offset }}"

# ── Build USB device mount entries (optional) ────────────────────
- name: Build USB device mount entries
  ansible.builtin.set_fact:
    _ha_mount_entries: >-
      {% set entries = [] %}
      {% for device in homeassistant_usb_devices %}
      {% set _ = entries.append(device + ',mp=' + device) %}
      {% endfor %}
      {{ entries }}
  when: homeassistant_usb_devices | length > 0

- name: Set empty mount entries when no USB devices
  ansible.builtin.set_fact:
    _ha_mount_entries: []
  when: homeassistant_usb_devices | length == 0

- name: Display USB mount configuration
  ansible.builtin.debug:
    msg: "USB devices: {{ homeassistant_usb_devices }} → Mount entries: {{ _ha_mount_entries }}"
  when: homeassistant_usb_devices | length > 0

# ── Check container existence ──────────────────────────────────

- name: Check if Home Assistant container exists
  ansible.builtin.command:
    cmd: pct status {{ homeassistant_ct_id }}
  register: _ct_status
  failed_when: false
  changed_when: false

- name: Set container existence flag
  ansible.builtin.set_fact:
    _lxc_exists: "{{ _ct_status.rc == 0 }}"

# ── Resolve deployed version ────────────────────────────────────

- name: Resolve deployed Home Assistant version
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/resolve_deployed_version.yml"
  vars:
    _resolve_service_name: homeassistant

# ── Provision via shared proxmox_lxc role ────────────────────────

- name: Provision Home Assistant LXC container
  ansible.builtin.include_role:
    name: proxmox_lxc
  vars:
    lxc_ct_id: "{{ homeassistant_ct_id }}"
    lxc_ct_hostname: "{{ homeassistant_ct_hostname }}"
    lxc_ct_dynamic_group: homeassistant
    lxc_ct_memory: "{{ homeassistant_ct_memory }}"
    lxc_ct_cores: "{{ homeassistant_ct_cores }}"
    lxc_ct_disk: "{{ homeassistant_ct_disk }}"
    lxc_ct_onboot: "{{ homeassistant_ct_onboot }}"
    lxc_ct_startup_order: "{{ homeassistant_ct_startup_order }}"
    lxc_ct_features: "{{ homeassistant_ct_features }}"
    lxc_ct_template_path: "{{ homeassistant_ct_template_path }}"
    lxc_ct_ip: "{{ _lxc_ct_ip }}/{{ _lan_cidr }}"
    lxc_ct_gateway: "{{ _lan_gateway }}"
    lxc_ct_nameserver: "{{ _lan_gateway }}"
    lxc_ct_bridge: "{{ proxmox_all_bridges[1] | default('vmbr0') }}"
    lxc_ct_mount_entries: "{{ _ha_mount_entries }}"
    lxc_ct_image_version: "{{ homeassistant_image_version }}"

- name: Export Home Assistant static IP for downstream roles
  ansible.builtin.set_fact:
    homeassistant_static_ip: "{{ _lxc_ct_ip }}"
    cacheable: true
