---
# Home Assistant LXC provisioning via Node Manager API.
# Version check skips provisioning when the deployed version matches.

# ── Version-aware skip check ──────────────────────────────────────
- name: Check Home Assistant version via NM API
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/check_service_version.yml"
  vars:
    _check_service_name: homeassistant
    _check_image_version: "{{ homeassistant_image_version }}"

# ── Verify Home Assistant template exists (skipped when version matches)
- name: Verify Home Assistant template exists
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/verify_lxc_template.yml"
  vars:
    lxc_template_path: "{{ homeassistant_ct_template_path }}"
    lxc_service_name: Home Assistant
  when: not (_service_up_to_date | default(false) | bool)

# ── Determine container network ─────────────────────────────────
- name: Compute Home Assistant container network
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/lxc_wan_or_lan_network.yml"
  vars:
    lxc_net_service_name: homeassistant
    lxc_net_ip_offset: "{{ homeassistant_ct_ip_offset }}"
    lxc_net_flavor_group: service_nodes

# ── Build USB device mount entries (optional) ────────────────────
- name: Build USB device mount entries
  ansible.builtin.set_fact:
    _ha_mount_entries: >-
      {% set entries = [] %}
      {% for device in homeassistant_usb_devices %}
      {% set _ = entries.append(device + ',mp=' + device) %}
      {% endfor %}
      {{ entries }}
  when: homeassistant_usb_devices | length > 0

- name: Set empty mount entries when no USB devices
  ansible.builtin.set_fact:
    _ha_mount_entries: []
  when: homeassistant_usb_devices | length == 0

- name: Display USB mount configuration
  ansible.builtin.debug:
    msg: "USB devices: {{ homeassistant_usb_devices }} → Mount entries: {{ _ha_mount_entries }}"
  when: homeassistant_usb_devices | length > 0

# ── Upload template to host if not cached ──────────────────────────
- name: Upload Home Assistant template to Proxmox host
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/upload_lxc_template.yml"
  vars:
    lxc_upload_template_path: "{{ role_path }}/../../{{ homeassistant_ct_template_path }}"
    lxc_upload_service_name: Home Assistant
  when: not (_service_up_to_date | default(false) | bool)

# ── Provision container via NM API (skipped when version matches) ─
- name: Provision Home Assistant LXC via NM API
  ansible.builtin.uri:
    url: "{{ nm_api_url }}/api/provision/homeassistant"
    headers: "{{ nm_auth_headers }}"
    method: POST
    body_format: json
    body:
      vmid: "{{ homeassistant_ct_id }}"
      template_path: "{{ homeassistant_ct_template_path | basename }}"
      hostname: "{{ homeassistant_ct_hostname }}"
      memory: "{{ homeassistant_ct_memory }}"
      cores: "{{ homeassistant_ct_cores }}"
      disk: "{{ homeassistant_ct_disk }}"
      onboot: "{{ homeassistant_ct_onboot }}"
      startup_order: "{{ homeassistant_ct_startup_order }}"
      features: "{{ homeassistant_ct_features | join(',') }}"
      ip: "{{ _lxc_net_ip }}/{{ _lxc_net_cidr }}"
      gateway: "{{ _lxc_net_gateway }}"
      nameserver: "{{ _lxc_net_nameserver }}"
      bridge: "{{ _lxc_net_bridge }}"
      mount_entries: "{{ _ha_mount_entries }}"
      image_version: "{{ homeassistant_image_version }}"
    status_code: 200
    timeout: 660
  delegate_to: localhost
  register: _provision_result
  until: _provision_result.json.success | default(false)
  retries: 2
  delay: 10
  when: not (_service_up_to_date | default(false) | bool)

# ── Apply privileged config on host (bind mounts need root@pam) ─
- name: Apply privileged LXC config on host for Home Assistant
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/apply_privileged_lxc_config.yml"
  vars:
    _priv_ct_id: "{{ homeassistant_ct_id }}"
    _priv_features: ""
    _priv_mount_entries: "{{ _ha_mount_entries | default([]) }}"
    _priv_lxc_conf_entries: []
  when:
    - not (_service_up_to_date | default(false) | bool)
    - (_provision_result.json.status | default('')) == 'created_needs_host_config'

- name: Report provision result
  ansible.builtin.debug:
    msg: "Home Assistant on {{ inventory_hostname }}: {{ _provision_result.json.status }} — {{ _provision_result.json.log | default([]) | join(', ') }}"
  when: not (_service_up_to_date | default(false) | bool)

# ── Configure callhome via NM API (skipped when version matches) ─
- name: Configure callhome on Home Assistant
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/configure_callhome_api.yml"
  vars:
    _callhome_vmid: "{{ homeassistant_ct_id }}"

# ── Register in dynamic inventory (for configure plays) ──────────
- name: Add Home Assistant containers to dynamic inventory group
  ansible.builtin.add_host:
    name: "{{ homeassistant_ct_hostname }}-{{ item }}"
    groups: homeassistant
    ansible_connection: community.proxmox.proxmox_pct_remote
    ansible_host: "{{ hostvars[item].ansible_host }}"
    ansible_user: root
    proxmox_vmid: "{{ homeassistant_ct_id }}"
    ansible_paramiko_host_key_checking: false
    ansible_paramiko_proxy_command: >-
      {{ 'ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p root@'
         + lookup('env', 'PRIMARY_HOST')
         if 'lan_hosts' in (hostvars[item].group_names | default([]))
         else omit }}
  loop: "{{ ansible_play_hosts }}"

# ── Export static IP for downstream roles ─────────────────────────
- name: Export Home Assistant static IP for downstream roles
  ansible.builtin.set_fact:
    homeassistant_static_ip: "{{ _lxc_net_ip }}"
    cacheable: true
