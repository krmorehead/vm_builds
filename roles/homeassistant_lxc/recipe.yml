---
service: homeassistant
base_template: build-base-debian-12-amd64.tar.zst
build_vmid: 994
hostname: homeassistant-build
memory: 1024
cores: 2
disk: "8"
unprivileged: true
features: "nesting=1"

setup_commands: []

install_commands:
  - "bash -c 'export DEBIAN_FRONTEND=noninteractive && apt-get update -qq'"
  - "bash -c 'apt-get install -y --no-install-recommends ca-certificates curl gnupg lsb-release'"
  - "bash -c 'install -m 0755 -d /etc/apt/keyrings'"
  - >-
    bash -c 'curl -fsSL https://download.docker.com/linux/debian/gpg |
    gpg --dearmor -o /etc/apt/keyrings/docker.gpg &&
    chmod a+r /etc/apt/keyrings/docker.gpg'
  - >-
    bash -c 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg]
    https://download.docker.com/linux/debian $(lsb_release -cs) stable" |
    tee /etc/apt/sources.list.d/docker.list > /dev/null'
  - "apt-get update -qq"
  - "bash -c 'apt-get install -y --no-install-recommends docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin'"
  - "bash -c 'systemctl start docker && docker pull homeassistant/home-assistant:stable'"
  - "mkdir -p /opt/homeassistant/config"
  - "systemctl enable homeassistant-compose 2>/dev/null || true"
  - "bash -c 'apt-get clean 2>/dev/null || true && rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*'"
  - "systemctl stop docker"

config_files:
  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "exec-opts": ["native.cgroupdriver=cgroupfs"]
      }
    mode: "0644"
    mkdir: true

  - path: /opt/homeassistant/config/docker-compose.yml
    content: |
      services:
        home-assistant:
          image: homeassistant/home-assistant:stable
          container_name: home-assistant
          restart: always
          network_mode: host
          volumes:
            - /opt/homeassistant/config:/config
          environment:
            - TZ=UTC
          privileged: false
          security_opt:
            - no-new-privileges:true
          cap_add:
            - SYS_TIME
    mode: "0644"

  - path: /opt/homeassistant/config/configuration.yaml
    content: |
      default_config:

      http:
        server_port: 8123
        ip_ban_enabled: true
        login_attempts_threshold: 5
        use_x_forwarded_for: true
        use_x_frame_options: false
        trusted_proxies:
          - 127.0.0.1
          - "::1"
          - 10.10.10.0/24
          - 10.99.0.0/16

      recorder:
        db_url: sqlite:///config/home-assistant_v2.db
        purge_keep_days: 10
        exclude:
          entities:
            - sensor.date
            - sensor.time
            - sun.sun
          domains:
            - updater

      logger:
        default: INFO
        logs:
          homeassistant.core: WARNING
          homeassistant.components.recorder: WARNING
          homeassistant.components.http: WARNING

      automation: []
    mode: "0644"

  - path: /etc/systemd/system/homeassistant-compose.service
    content: |
      [Unit]
      Description=Home Assistant Docker Compose
      Requires=docker.service
      After=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory=/opt/homeassistant/config
      ExecStart=/usr/bin/docker compose up -d
      ExecStop=/usr/bin/docker compose down
      TimeoutStartSec=300

      [Install]
      WantedBy=multi-user.target
    mode: "0644"

post_commands:
  - "systemctl daemon-reload"

callhome:
  http_probes: "http://127.0.0.1:8123"
  config_files: ""

kasmvnc: null
