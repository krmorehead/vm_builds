---
# Pi-hole LXC provisioning via Node Manager API.
# Heavy operations (pct create, start, wait) go through the NM API.
# Version check skips everything when the deployed version matches.

# ── Version-aware skip check ──────────────────────────────────────
- name: Check Pi-hole version via NM API
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/check_service_version.yml"
  vars:
    _check_service_name: pihole
    _check_image_version: "{{ pihole_image_version }}"

# ── Verify Pi-hole template exists (controller-side check) ────────
- name: Verify Pi-hole template exists
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/verify_lxc_template.yml"
  vars:
    lxc_template_path: "{{ pihole_ct_template_path }}"
    lxc_service_name: Pi-hole
  when: not (_service_up_to_date | default(false) | bool)

# ── Determine container network (unified WAN/LAN) ─────────────────
- name: Compute Pi-hole container network
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/lxc_wan_or_lan_network.yml"
  vars:
    lxc_net_service_name: Pi-hole
    lxc_net_ip_offset: "{{ pihole_ct_ip_offset }}"
    lxc_net_flavor_group: dns_nodes

# ── Upload template to host if not cached ──────────────────────────
- name: Upload Pi-hole template to Proxmox host
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/upload_lxc_template.yml"
  vars:
    lxc_upload_template_path: "{{ role_path }}/../../{{ pihole_ct_template_path }}"
    lxc_upload_service_name: Pi-hole
  when: not (_service_up_to_date | default(false) | bool)

# ── Provision container via NM API (skipped when version matches) ─
- name: Provision Pi-hole LXC via NM API
  ansible.builtin.uri:
    url: "{{ nm_api_url }}/api/provision/pihole"
    headers: "{{ nm_auth_headers }}"
    method: POST
    body_format: json
    body:
      vmid: "{{ pihole_ct_id }}"
      template_path: "{{ pihole_ct_template_path | basename }}"
      hostname: "{{ pihole_ct_hostname }}"
      memory: "{{ pihole_ct_memory }}"
      cores: "{{ pihole_ct_cores }}"
      disk: "{{ pihole_ct_disk }}"
      onboot: "{{ pihole_ct_onboot }}"
      startup_order: "{{ pihole_ct_startup_order }}"
      features: "{{ pihole_ct_features | join(',') }}"
      ip: "{{ _lxc_net_ip }}/{{ _lxc_net_cidr }}"
      gateway: "{{ _lxc_net_gateway }}"
      nameserver: "{{ _lxc_net_nameserver }}"
      bridge: "{{ _lxc_net_bridge }}"
      image_version: "{{ pihole_image_version }}"
    status_code: 200
    timeout: 660
  delegate_to: localhost
  register: _provision_result
  until: _provision_result.json.success | default(false)
  retries: 2
  delay: 10
  when: not (_service_up_to_date | default(false) | bool)

- name: Report provision result
  ansible.builtin.debug:
    msg: "Pi-hole on {{ inventory_hostname }}: {{ _provision_result.json.status }} — {{ _provision_result.json.log | default([]) | join(', ') }}"
  when: not (_service_up_to_date | default(false) | bool)

# ── Apply privileged config on host (features need root@pam) ─────
- name: Apply privileged LXC config on host for Pi-hole
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/apply_privileged_lxc_config.yml"
  vars:
    _priv_ct_id: "{{ pihole_ct_id }}"
    _priv_features: "{{ pihole_ct_features | join(',') }}"
    _priv_mount_entries: []
    _priv_lxc_conf_entries: []
  when:
    - not (_service_up_to_date | default(false) | bool)
    - (_provision_result.json.status | default('')) == 'created_needs_host_config'

# ── Configure callhome via NM API (skipped when version matches) ─
- name: Configure callhome on Pi-hole
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/configure_callhome_api.yml"
  vars:
    _callhome_vmid: "{{ pihole_ct_id }}"

# ── Register in dynamic inventory (for configure plays) ──────────
- name: Add Pi-hole containers to dynamic inventory group
  ansible.builtin.add_host:
    name: "{{ pihole_ct_hostname }}-{{ item }}"
    groups: pihole
    ansible_connection: community.proxmox.proxmox_pct_remote
    ansible_host: "{{ hostvars[item].ansible_host }}"
    ansible_user: root
    proxmox_vmid: "{{ pihole_ct_id }}"
    ansible_paramiko_host_key_checking: false
    ansible_paramiko_proxy_command: >-
      {{ 'ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p root@'
         + lookup('env', 'PRIMARY_HOST')
         if 'lan_hosts' in (hostvars[item].group_names | default([]))
         else omit }}
  loop: "{{ ansible_play_hosts }}"

# ── Export static IP for downstream roles ─────────────────────────
- name: Export Pi-hole static IP for downstream roles
  ansible.builtin.set_fact:
    pihole_static_ip: "{{ _lxc_net_ip }}"
    cacheable: true
