---
# ── Verify Jellyfin template exists ───────────────────────────────
- name: Check Jellyfin LXC template exists on controller
  ansible.builtin.stat:
    path: "{{ role_path }}/../../{{ jellyfin_ct_template_path }}"
  register: _jellyfin_template_stat
  delegate_to: localhost

- name: Fail if Jellyfin template is missing
  ansible.builtin.fail:
    msg: >-
      Jellyfin template not found: {{ jellyfin_ct_template_path }}.
      Run ./build-images.sh to build it.
  when: not (_jellyfin_template_stat.stat.exists | default(false))

# ── Determine container network ─────────────────────────────────

- name: Read LAN gateway from generated env
  ansible.builtin.set_fact:
    _lan_gateway: >-
      {{ lookup('pipe', 'grep "^LAN_GATEWAY=" ' + env_generated_path + ' 2>/dev/null | cut -d= -f2')
         | default('10.10.10.1', true) }}
    _lan_cidr: >-
      {{ lookup('pipe', 'grep "^LAN_CIDR=" ' + env_generated_path + ' 2>/dev/null | cut -d= -f2')
         | default('24', true) }}

- name: Compute Jellyfin container IP
  ansible.builtin.set_fact:
    _jellyfin_ct_ip: >-
      {{ _lan_gateway.split('.')[0:3] | join('.') }}.{{ jellyfin_ct_ip_offset }}

- name: Report Jellyfin container IP assignment
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: jellyfin IP={{ _jellyfin_ct_ip }}/{{ _lan_cidr }}
      gw={{ _lan_gateway }} (OpenWrt LAN)

# ── Ensure media path exists on host ──────────────────────────────
- name: Ensure media directory exists on host
  ansible.builtin.file:
    path: "{{ jellyfin_media_path }}"
    state: directory
    mode: "0755"

# ── Build media mount entries ──────────────────────────────────────
- name: Build mount entries for media storage
  ansible.builtin.set_fact:
    _jellyfin_mount_entries:
      - "{{ jellyfin_media_path }},mp=/media"

- name: Display mount configuration
  ansible.builtin.debug:
    msg: "iGPU: /dev/dri (via lxc.mount.entry), Media: {{ jellyfin_media_path }} → /media"

# ── Provision via shared proxmox_lxc role ────────────────────────

- name: Provision Jellyfin LXC container
  ansible.builtin.include_role:
    name: proxmox_lxc
  vars:
    lxc_ct_id: "{{ jellyfin_ct_id }}"
    lxc_ct_hostname: "{{ jellyfin_ct_hostname }}"
    lxc_ct_dynamic_group: jellyfin
    lxc_ct_memory: "{{ jellyfin_ct_memory }}"
    lxc_ct_cores: "{{ jellyfin_ct_cores }}"
    lxc_ct_disk: "{{ jellyfin_ct_disk }}"
    lxc_ct_onboot: "{{ jellyfin_ct_onboot }}"
    lxc_ct_startup_order: "{{ jellyfin_ct_startup_order }}"
    lxc_ct_template: "{{ jellyfin_ct_template }}"
    lxc_ct_template_path: "{{ jellyfin_ct_template_path }}"
    lxc_ct_ip: "{{ _jellyfin_ct_ip }}/{{ _lan_cidr }}"
    lxc_ct_gateway: "{{ _lan_gateway }}"
    lxc_ct_nameserver: "{{ _lan_gateway }}"
    lxc_ct_bridge: "{{ proxmox_all_bridges[1] | default('vmbr0') }}"
    lxc_ct_unprivileged: "{{ jellyfin_ct_unprivileged }}"
    lxc_ct_features: "{{ jellyfin_ct_features }}"
    lxc_ct_mount_entries: "{{ _jellyfin_mount_entries }}"

# ── Device passthrough via lxc.mount.entry + cgroup allowlist ────
# Proxmox -mp mount points fail for /dev/* device directories
# (pre-start hook exits 32). Use raw lxc.mount.entry instead.

- name: Check for existing DRI mount entry
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      grep -c 'lxc.mount.entry.*dev/dri' /etc/pve/lxc/{{ jellyfin_ct_id }}.conf 2>/dev/null || echo 0
    executable: /bin/bash
  register: _jellyfin_dev_mounts
  changed_when: false
  failed_when: false

- name: Stop container for device mount config
  ansible.builtin.command:
    cmd: pct stop {{ jellyfin_ct_id }}
  when: (_jellyfin_dev_mounts.stdout | trim | int) == 0
  failed_when: false
  changed_when: true

- name: Apply DRI device bind mount and cgroup allowlist
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      lxc_conf="/etc/pve/lxc/{{ jellyfin_ct_id }}.conf"
      for entry in \
        "lxc.mount.entry: /dev/dri dev/dri none bind,optional,create=dir" \
        "lxc.cgroup2.devices.allow: c 226:* rwm"; do
        grep -qF "$entry" "$lxc_conf" 2>/dev/null || echo "$entry" >> "$lxc_conf"
      done
    executable: /bin/bash
  when: (_jellyfin_dev_mounts.stdout | trim | int) == 0
  changed_when: true

- name: Start container with device mounts
  ansible.builtin.command:
    cmd: pct start {{ jellyfin_ct_id }}
  when: (_jellyfin_dev_mounts.stdout | trim | int) == 0

- name: Wait for container to be ready after restart
  ansible.builtin.command:
    cmd: pct exec {{ jellyfin_ct_id }} -- ls /
  register: _jellyfin_ready
  retries: 10
  delay: 3
  until: _jellyfin_ready.rc == 0
  changed_when: false
  when: (_jellyfin_dev_mounts.stdout | trim | int) == 0

- name: Export Jellyfin static IP for downstream roles
  ansible.builtin.set_fact:
    jellyfin_static_ip: "{{ _jellyfin_ct_ip }}"
    cacheable: true
