---
# Jellyfin LXC provisioning via Node Manager API.
# Version check skips provisioning when the deployed version matches.

# ── Version-aware skip check ──────────────────────────────────────
- name: Check Jellyfin version via NM API
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/check_service_version.yml"
  vars:
    _check_service_name: jellyfin
    _check_image_version: "{{ jellyfin_image_version }}"

# ── Verify Jellyfin template exists (skipped when version matches) ─
- name: Verify Jellyfin template exists
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/verify_lxc_template.yml"
  vars:
    lxc_template_path: "{{ jellyfin_ct_template_path }}"
    lxc_service_name: Jellyfin
  when: not (_service_up_to_date | default(false) | bool)

# ── Determine container network ─────────────────────────────────
- name: Compute Jellyfin LAN network
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/lxc_lan_network.yml"
  vars:
    lxc_net_service_name: jellyfin
    lxc_net_ip_offset: "{{ jellyfin_ct_ip_offset }}"

# ── Ensure media path exists on host ──────────────────────────────
- name: Ensure media directory exists on host
  ansible.builtin.file:
    path: "{{ jellyfin_media_path }}"
    state: directory
    mode: "0755"

# ── Build media mount entries ──────────────────────────────────────
- name: Build mount entries for media storage
  ansible.builtin.set_fact:
    _jellyfin_mount_entries:
      - "{{ jellyfin_media_path }},mp=/media"

- name: Display mount configuration
  ansible.builtin.debug:
    msg: "iGPU: /dev/dri (via lxc.mount.entry), Media: {{ jellyfin_media_path }} → /media"

# ── Provision container via NM API (skipped when version matches) ─
- name: Provision Jellyfin LXC via NM API
  ansible.builtin.uri:
    url: "http://{{ nm_api_host | default(ansible_host) }}:{{ nm_api_port | default(kiosk_manager_port) }}/api/provision/jellyfin"
    method: POST
    body_format: json
    body:
      vmid: "{{ jellyfin_ct_id }}"
      template_path: "{{ jellyfin_ct_template_path | basename }}"
      hostname: "{{ jellyfin_ct_hostname }}"
      memory: "{{ jellyfin_ct_memory }}"
      cores: "{{ jellyfin_ct_cores }}"
      disk: "{{ jellyfin_ct_disk }}"
      onboot: "{{ jellyfin_ct_onboot }}"
      startup_order: "{{ jellyfin_ct_startup_order }}"
      unprivileged: "{{ jellyfin_ct_unprivileged }}"
      features: "{{ jellyfin_ct_features | join(',') }}"
      ip: "{{ _lxc_ct_ip }}/{{ _lan_cidr }}"
      gateway: "{{ _lan_gateway }}"
      nameserver: "{{ _lan_gateway }}"
      bridge: "{{ proxmox_all_bridges[1] | default('vmbr0') }}"
      mount_entries: "{{ _jellyfin_mount_entries }}"
      image_version: "{{ jellyfin_image_version }}"
    status_code: 200
    timeout: 180
  delegate_to: localhost
  register: _provision_result
  failed_when: not (_provision_result.json.success | default(false))
  when: not (_service_up_to_date | default(false) | bool)

- name: Report provision result
  ansible.builtin.debug:
    msg: "Jellyfin on {{ inventory_hostname }}: {{ _provision_result.json.status }} — {{ _provision_result.json.log | default([]) | join(', ') }}"
  when: not (_service_up_to_date | default(false) | bool)

# ── Device passthrough via lxc.mount.entry + cgroup allowlist ────
# TODO: Convert lxc_device_passthrough to NM API in a future pass.
# Kept as SSH for now — modifies pmxcfs config and restarts container.

- name: Apply DRI device passthrough
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/lxc_device_passthrough.yml"
  vars:
    lxc_dev_ct_id: "{{ jellyfin_ct_id }}"
    lxc_dev_conf_entries:
      - "lxc.mount.entry: /dev/dri dev/dri none bind,optional,create=dir"
      - "lxc.cgroup2.devices.allow: c 226:* rwm"

# ── Configure callhome via NM API (skipped when version matches) ─
- name: Configure callhome on Jellyfin
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/configure_callhome_api.yml"
  vars:
    _callhome_vmid: "{{ jellyfin_ct_id }}"

# ── Register in dynamic inventory (for configure plays) ──────────
- name: Add Jellyfin containers to dynamic inventory group
  ansible.builtin.add_host:
    name: "{{ jellyfin_ct_hostname }}-{{ item }}"
    groups: jellyfin
    ansible_connection: community.proxmox.proxmox_pct_remote
    ansible_host: "{{ hostvars[item].ansible_host }}"
    ansible_user: root
    proxmox_vmid: "{{ jellyfin_ct_id }}"
    ansible_paramiko_host_key_checking: false
    ansible_paramiko_proxy_command: >-
      {{ 'ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p root@'
         + lookup('env', 'PRIMARY_HOST')
         if 'lan_hosts' in (hostvars[item].group_names | default([]))
         else omit }}
  loop: "{{ ansible_play_hosts }}"

# ── Export static IP for downstream roles ─────────────────────────
- name: Export Jellyfin static IP for downstream roles
  ansible.builtin.set_fact:
    jellyfin_static_ip: "{{ _lxc_ct_ip }}"
    cacheable: true
