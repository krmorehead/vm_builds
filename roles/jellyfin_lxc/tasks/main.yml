---
# ── Verify Jellyfin template exists ───────────────────────────────
- name: Verify Jellyfin template exists
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/verify_lxc_template.yml"
  vars:
    lxc_template_path: "{{ jellyfin_ct_template_path }}"
    lxc_service_name: Jellyfin

# ── Determine container network ─────────────────────────────────
- name: Compute Jellyfin LAN network
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/lxc_lan_network.yml"
  vars:
    lxc_net_service_name: jellyfin
    lxc_net_ip_offset: "{{ jellyfin_ct_ip_offset }}"

# ── Ensure media path exists on host ──────────────────────────────
- name: Ensure media directory exists on host
  ansible.builtin.file:
    path: "{{ jellyfin_media_path }}"
    state: directory
    mode: "0755"

# ── Build media mount entries ──────────────────────────────────────
- name: Build mount entries for media storage
  ansible.builtin.set_fact:
    _jellyfin_mount_entries:
      - "{{ jellyfin_media_path }},mp=/media"

- name: Display mount configuration
  ansible.builtin.debug:
    msg: "iGPU: /dev/dri (via lxc.mount.entry), Media: {{ jellyfin_media_path }} → /media"

# ── Check container existence ──────────────────────────────────

- name: Check if Jellyfin container exists
  ansible.builtin.command:
    cmd: pct status {{ jellyfin_ct_id }}
  register: _ct_status
  failed_when: false
  changed_when: false

- name: Set container existence flag
  ansible.builtin.set_fact:
    _lxc_exists: "{{ _ct_status.rc == 0 }}"

# ── Resolve deployed version ────────────────────────────────────

- name: Resolve deployed Jellyfin version
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/resolve_deployed_version.yml"
  vars:
    _resolve_service_name: jellyfin

# ── Provision via shared proxmox_lxc role ────────────────────────

- name: Provision Jellyfin LXC container
  ansible.builtin.include_role:
    name: proxmox_lxc
  vars:
    lxc_ct_id: "{{ jellyfin_ct_id }}"
    lxc_ct_hostname: "{{ jellyfin_ct_hostname }}"
    lxc_ct_dynamic_group: jellyfin
    lxc_ct_memory: "{{ jellyfin_ct_memory }}"
    lxc_ct_cores: "{{ jellyfin_ct_cores }}"
    lxc_ct_disk: "{{ jellyfin_ct_disk }}"
    lxc_ct_onboot: "{{ jellyfin_ct_onboot }}"
    lxc_ct_startup_order: "{{ jellyfin_ct_startup_order }}"
    lxc_ct_template_path: "{{ jellyfin_ct_template_path }}"
    lxc_ct_ip: "{{ _lxc_ct_ip }}/{{ _lan_cidr }}"
    lxc_ct_gateway: "{{ _lan_gateway }}"
    lxc_ct_nameserver: "{{ _lan_gateway }}"
    lxc_ct_bridge: "{{ proxmox_all_bridges[1] | default('vmbr0') }}"
    lxc_ct_unprivileged: "{{ jellyfin_ct_unprivileged }}"
    lxc_ct_features: "{{ jellyfin_ct_features }}"
    lxc_ct_mount_entries: "{{ _jellyfin_mount_entries }}"
    lxc_ct_image_version: "{{ jellyfin_image_version }}"

# ── Device passthrough via lxc.mount.entry + cgroup allowlist ────

- name: Apply DRI device passthrough
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/lxc_device_passthrough.yml"
  vars:
    lxc_dev_ct_id: "{{ jellyfin_ct_id }}"
    lxc_dev_conf_entries:
      - "lxc.mount.entry: /dev/dri dev/dri none bind,optional,create=dir"
      - "lxc.cgroup2.devices.allow: c 226:* rwm"

- name: Export Jellyfin static IP for downstream roles
  ansible.builtin.set_fact:
    jellyfin_static_ip: "{{ _lxc_ct_ip }}"
    cacheable: true
