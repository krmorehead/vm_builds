---
# ── Per-host key generation ───────────────────────────────────
# Each WireGuard container gets a unique keypair. Keys are persisted
# to env.generated with per-host markers so they survive across runs.
# Key generation runs on the controller (wg tools installed by setup.sh).

- name: Check if key generation is needed
  ansible.builtin.set_fact:
    _wg_needs_keygen: >-
      {{ wireguard_private_key | length != 44
         or '$' in wireguard_private_key
         or wireguard_private_key in ['None', 'null', 'true', 'false'] }}

- name: Generate container private key
  ansible.builtin.command:
    cmd: wg genkey
  register: _wg_client_privkey
  changed_when: true
  no_log: true
  delegate_to: localhost
  when: _wg_needs_keygen | bool

- name: Derive container public key
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      echo "{{ _wg_client_privkey.stdout }}" | wg pubkey
    executable: /bin/bash
  register: _wg_client_pubkey
  changed_when: false
  no_log: true
  delegate_to: localhost
  when: _wg_needs_keygen | bool

- name: Derive public key from existing private key
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      echo "{{ wireguard_private_key }}" | wg pubkey
    executable: /bin/bash
  register: _wg_existing_pubkey
  changed_when: false
  no_log: true
  delegate_to: localhost
  when: not (_wg_needs_keygen | bool)

- name: Set key facts
  ansible.builtin.set_fact:
    _wg_private_key: "{{ _wg_client_privkey.stdout if (_wg_needs_keygen | bool) else wireguard_private_key }}"
    _wg_public_key: "{{ _wg_client_pubkey.stdout if (_wg_needs_keygen | bool) else _wg_existing_pubkey.stdout }}"

- name: Export public key and VPN IP as cacheable facts
  ansible.builtin.set_fact:
    wg_public_key: "{{ _wg_public_key }}"
    wg_vpn_ip: "{{ vpn_ip }}"
    cacheable: true

- name: Write per-host keys to env.generated on controller
  ansible.builtin.blockinfile:
    path: "{{ env_generated_path }}"
    create: true
    mode: "0600"
    marker: "# {mark} WireGuard {{ _wg_host_suffix }} (auto-generated)"
    block: |
      WIREGUARD_PRIVATE_KEY_{{ _wg_host_suffix }}={{ _wg_private_key }}
      WIREGUARD_PUBLIC_KEY_{{ _wg_host_suffix }}={{ _wg_public_key }}
  delegate_to: localhost
  when: _wg_needs_keygen | bool

# ── Hub: write hub public key for clients to reference ────────
- name: Write hub public key to env.generated
  ansible.builtin.blockinfile:
    path: "{{ env_generated_path }}"
    create: true
    mode: "0600"
    marker: "# {mark} WireGuard Hub (auto-generated)"
    block: |
      WIREGUARD_HUB_PUBLIC_KEY={{ _wg_public_key }}
  delegate_to: localhost
  when:
    - wireguard_is_hub | bool
    - _wg_needs_keygen | bool

# ── Build peer list (hub only) ────────────────────────────────
# The hub needs [Peer] blocks for every client. Clients only need
# the hub's public key (from wireguard_server_public_key).

- name: Initialize hub peer list
  ansible.builtin.set_fact:
    _wg_peers: []
  when: wireguard_is_hub | bool

- name: Collect hub peer entries
  ansible.builtin.set_fact:
    _wg_peers: "{{ _wg_peers | default([]) + [_entry] }}"
  vars:
    _entry:
      public_key: "{{ hostvars[item].wg_public_key }}"
      vpn_ip: "{{ hostvars[item].wg_vpn_ip }}"
  loop: >-
    {{ groups['vpn_nodes']
       | reject('equalto', inventory_hostname)
       | select('in', hostvars | dict2items | selectattr('value.wg_public_key', 'defined') | map(attribute='key') | list)
       | list }}
  when: wireguard_is_hub | bool

- name: Read controller public key from env.generated (fallback)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      grep '^WIREGUARD_PUBLIC_KEY_CONTROLLER=' "{{ env_generated_path }}" 2>/dev/null | cut -d= -f2-
    executable: /bin/bash
  register: _ctrl_pubkey_from_file
  changed_when: false
  failed_when: false
  delegate_to: localhost
  when: wireguard_is_hub | bool

- name: Resolve controller public key
  vars:
    _env_key: "{{ lookup('env', 'WIREGUARD_PUBLIC_KEY_CONTROLLER') }}"
    _file_key: "{{ _ctrl_pubkey_from_file.stdout | default('') | trim }}"
  ansible.builtin.set_fact:
    _ctrl_pubkey_resolved: >-
      {{ _file_key if (_env_key in ['', 'None']) else _env_key }}
  when: wireguard_is_hub | bool

- name: Add controller peer to hub
  vars:
    _raw_vpn_ip: "{{ lookup('env', 'CONTROLLER_VPN_IP') }}"
  ansible.builtin.set_fact:
    _wg_peers: >-
      {{ _wg_peers | default([]) + [{
        'public_key': _ctrl_pubkey_resolved,
        'vpn_ip': controller_vpn_ip if (_raw_vpn_ip in ['', 'None']) else _raw_vpn_ip
      }] }}
  when:
    - wireguard_is_hub | bool
    - _ctrl_pubkey_resolved | default('') | length > 0
    - _ctrl_pubkey_resolved != 'None'

# ── Client: resolve hub's public key ─────────────────────────
- name: Resolve hub public key from hostvars
  ansible.builtin.set_fact:
    _wg_server_pubkey: >-
      {{ wireguard_server_public_key
         if wireguard_server_public_key | length > 0
         else hostvars[_hub_host].wg_public_key | default('') }}
  vars:
    _hub_host: >-
      {{ groups['vpn_nodes']
         | select('in', hostvars | dict2items
             | selectattr('value.wg_vpn_ip', 'defined')
             | selectattr('value.wg_vpn_ip', 'equalto', wireguard_hub_vpn_ip)
             | map(attribute='key') | list)
         | first | default('') }}
  when: not (wireguard_is_hub | bool)

- name: Fallback — read hub public key from env.generated
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      grep '^WIREGUARD_HUB_PUBLIC_KEY=' "{{ env_generated_path }}" 2>/dev/null | cut -d= -f2-
    executable: /bin/bash
  register: _hub_pk_from_file
  changed_when: false
  failed_when: false
  delegate_to: localhost
  when:
    - not (wireguard_is_hub | bool)
    - _wg_server_pubkey | default('') | length != 44
      or '$' in (_wg_server_pubkey | default(''))
      or _wg_server_pubkey | default('') in ['None', 'null', '']

- name: Apply env.generated hub public key
  ansible.builtin.set_fact:
    _wg_server_pubkey: "{{ _hub_pk_from_file.stdout | trim }}"
  when:
    - not (wireguard_is_hub | bool)
    - _hub_pk_from_file is defined
    - _hub_pk_from_file.stdout | default('') | trim | length == 44

- name: Validate hub public key before writing config
  ansible.builtin.assert:
    that:
      - _wg_server_pubkey | length == 44
      - "'$' not in _wg_server_pubkey"
      - _wg_server_pubkey not in ['None', 'null', '']
    fail_msg: >-
      Hub public key is invalid: '{{ _wg_server_pubkey }}'.
      The hub (vpn_ip={{ wireguard_hub_vpn_ip }}) must run configure first.
      Check env.generated for WIREGUARD_HUB_PUBLIC_KEY.
  when: not (wireguard_is_hub | bool)

# ── Build wg0 configuration content ─────────────────────────────

- name: Build hub wg0 configuration content
  ansible.builtin.set_fact:
    _wg0_content: |
      [Interface]
      PrivateKey = {{ _wg_private_key }}
      Address = {{ wireguard_client_address }}
      ListenPort = {{ wireguard_listen_port }}
      {% if wireguard_dns | length > 0 %}
      DNS = {{ wireguard_dns }}
      {% endif %}
      {% for peer in _wg_peers %}

      [Peer]
      PublicKey = {{ peer.public_key }}
      AllowedIPs = {{ peer.vpn_ip }}/32
      {% if peer.preshared_key | default('') | length > 0 %}
      PresharedKey = {{ peer.preshared_key }}
      {% endif %}
      {% endfor %}
  no_log: true
  when: wireguard_is_hub | bool

- name: Build client wg0 configuration content
  ansible.builtin.set_fact:
    _wg0_content: |
      [Interface]
      PrivateKey = {{ _wg_private_key }}
      Address = {{ wireguard_client_address }}
      {% if wireguard_dns | length > 0 %}
      DNS = {{ wireguard_dns }}
      {% endif %}

      [Peer]
      PublicKey = {{ _wg_server_pubkey }}
      Endpoint = {{ wireguard_server_endpoint }}
      AllowedIPs = {{ wireguard_allowed_ips }}
      PersistentKeepalive = {{ wireguard_keepalive }}
      {% if wireguard_preshared_key | length > 0 %}
      PresharedKey = {{ wireguard_preshared_key }}
      {% endif %}
  no_log: true
  when: not (wireguard_is_hub | bool)

# ── Push wg0.conf via NM API (idempotent) ──────────────────────

- name: Read existing wg0.conf from container
  ansible.builtin.uri:
    url: "{{ nm_api_url }}/api/provision/{{ wireguard_ct_id }}/exec"
    headers: "{{ nm_auth_headers }}"
    method: POST
    body_format: json
    body:
      cmd: "cat /etc/wireguard/wg0.conf 2>/dev/null || echo __MISSING__"
      timeout: 10
    status_code: 200
  register: _wg_existing_conf
  delegate_to: localhost
  failed_when: false
  no_log: true

- name: Check if wg0.conf needs update
  ansible.builtin.set_fact:
    _wg_conf_changed: >-
      {{ _wg_existing_conf is failed
         or '__MISSING__' in (_wg_existing_conf.json.stdout | default('__MISSING__'))
         or (_wg_existing_conf.json.stdout | default('') | trim) != (_wg0_content | trim) }}

- name: Push wg0.conf via NM API
  ansible.builtin.uri:
    url: "{{ nm_api_url }}/api/config/{{ wireguard_ct_id }}/file"
    headers: "{{ nm_auth_headers }}"
    method: POST
    body_format: json
    body:
      path: /etc/wireguard/wg0.conf
      content: "{{ _wg0_content }}"
      mode: "0600"
    status_code: 200
  delegate_to: localhost
  no_log: true
  when: _wg_conf_changed | bool

# ── Start tunnel and apply firewall ──────────────────────────

- name: Restart WireGuard tunnel via NM API
  ansible.builtin.uri:
    url: "{{ nm_api_url }}/api/config/{{ wireguard_ct_id }}/service/wg-quick@wg0/restart"
    headers: "{{ nm_auth_headers }}"
    method: POST
    body_format: json
    body: {}
    status_code: 200
    timeout: 120
  delegate_to: localhost
  retries: 5
  delay: 10
  register: _wg_restart
  until: (_wg_restart.status | default(0)) == 200
  when: _wg_conf_changed | bool

# ── Compute DNAT target (host's bridge IP for VPN port forwarding) ──
# This runs on vpn_nodes (Proxmox hosts), so group_names is correct.
# LAN hosts: Proxmox host's LAN bridge IP (where kiosk-manager-proxy listens)
# WAN hosts: NAT bridge gateway (host IS the gateway)
- name: Read LAN topology for DNAT computation
  ansible.builtin.include_tasks: "{{ project_root }}/tasks/read_lan_topology.yml"

- name: Compute VPN DNAT target
  ansible.builtin.set_fact:
    _wg_dnat_target: >-
      {% if 'router_nodes' in group_names -%}
        {{ _lan_prefix }}.{{ proxmox_lan_mgmt_ip_offset | default(2) }}
      {%- elif 'lan_hosts' in group_names -%}
        {{ ansible_host }}
      {%- else -%}
        {{ container_subnet_prefix }}.{{ container_subnet_id }}.1
      {%- endif %}

- name: Read existing firewall.env from container
  ansible.builtin.uri:
    url: "{{ nm_api_url }}/api/provision/{{ wireguard_ct_id }}/exec"
    headers: "{{ nm_auth_headers }}"
    method: POST
    body_format: json
    body:
      cmd: "cat /etc/wireguard/firewall.env 2>/dev/null || echo __MISSING__"
      timeout: 10
    status_code: 200
  register: _wg_existing_fw_env
  delegate_to: localhost
  failed_when: false

- name: Check if firewall config needs update
  ansible.builtin.set_fact:
    _wg_fw_changed: >-
      {{ _wg_existing_fw_env is failed
         or '__MISSING__' in (_wg_existing_fw_env.json.stdout | default('__MISSING__'))
         or ('DNAT_TARGET=' + _wg_dnat_target | trim) not in (_wg_existing_fw_env.json.stdout | default('')) }}

- name: Push firewall.env with DNAT target
  ansible.builtin.uri:
    url: "{{ nm_api_url }}/api/config/{{ wireguard_ct_id }}/file"
    headers: "{{ nm_auth_headers }}"
    method: POST
    body_format: json
    body:
      path: /etc/wireguard/firewall.env
      content: "DNAT_TARGET={{ _wg_dnat_target | trim }}\n"
      mode: "0644"
    status_code: 200
  delegate_to: localhost
  when: _wg_fw_changed | bool

- name: Push updated firewall setup script
  ansible.builtin.uri:
    url: "{{ nm_api_url }}/api/config/{{ wireguard_ct_id }}/file"
    headers: "{{ nm_auth_headers }}"
    method: POST
    body_format: json
    body:
      path: /usr/sbin/wireguard-firewall-setup
      content: "{{ lookup('file', playbook_dir + '/../scripts/image-builder/files-wireguard-lxc/usr/sbin/wireguard-firewall-setup') }}"
      mode: "0755"
    status_code: 200
  delegate_to: localhost
  when: _wg_fw_changed | bool

- name: Apply firewall rules (MASQUERADE + DNAT)
  ansible.builtin.uri:
    url: "{{ nm_api_url }}/api/provision/{{ wireguard_ct_id }}/exec"
    headers: "{{ nm_auth_headers }}"
    method: POST
    body_format: json
    body:
      cmd: "/usr/sbin/wireguard-firewall-setup"
      timeout: 30
    status_code: 200
  delegate_to: localhost
  when: _wg_fw_changed | bool
