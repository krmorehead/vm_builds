---
# GPU device passthrough, Xorg, Sunshine, dsda-doom, and Freedoom WADs
# are baked into the image by build-images.sh. This role handles ONLY
# host-specific config: Sunshine credentials and service start.
# All in-container operations go through the Node Manager API over VPN.

# ── Configure Sunshine credentials ──────────────────────────────
- name: Generate Sunshine password if not set
  ansible.builtin.set_fact:
    _sunshine_password: >-
      {{ sunshine_password
         if sunshine_password | default('', true) | length > 0
         else lookup('password', '/dev/null chars=ascii_letters,digits length=16') }}

- name: Persist generated Sunshine credentials to env file
  ansible.builtin.blockinfile:
    path: "{{ env_generated_path }}"
    create: true
    mode: "0600"
    marker: "# {mark} SUNSHINE CREDENTIALS"
    block: |
      SUNSHINE_USER={{ sunshine_user }}
      SUNSHINE_PASSWORD={{ _sunshine_password }}
  delegate_to: localhost
  no_log: true
  when: sunshine_password | default('', true) | length == 0

# ── Set credentials and start services via NM API ────────────────
- name: Set Sunshine credentials and start display services
  ansible.builtin.uri:
    url: "{{ nm_api_url }}/api/provision/{{ gaming_ct_id }}/exec"
    headers: "{{ nm_auth_headers }}"
    method: POST
    body_format: json
    body:
      cmd: >-
        bash -c '
        /usr/bin/sunshine --creds {{ sunshine_user }} {{ _sunshine_password }};
        systemctl start xorg-virtual.service;
        systemctl start sunshine.service'
      timeout: 30
    status_code: 200
  delegate_to: localhost
  no_log: true
  register: _gaming_setup
  failed_when: >-
    _gaming_setup.status | default(0) != 200
    or not (_gaming_setup.json.success | default(false))

- name: Report Gaming LXC configuration
  ansible.builtin.debug:
    msg: >-
      Gaming LXC configured.
      Credentials: {{ sunshine_user }}/{{ '(auto-generated)' if sunshine_password | default('', true) | length == 0 else '(from env)' }}.
