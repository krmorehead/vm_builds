---
project_version: "1.2.0"

# ── Project paths ─────────────────────────────────────────────────
# Auto-detect project root: Molecule sets MOLECULE_PROJECT_DIRECTORY,
# production runs from playbooks/ (one level below root).
project_root: >-
  {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY')
     | default(playbook_dir + '/..', true) }}

# Generated secrets file: test.env.generated under Molecule,
# .env.generated in production.
env_generated_path: >-
  {{ project_root }}/{{
     'test.env.generated'
     if lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | length > 0
     else '.env.generated' }}

# ── Storage ───────────────────────────────────────────────────────
proxmox_storage: local-lvm

# ── LXC defaults ─────────────────────────────────────────────────
proxmox_lxc_default_template: debian-12-standard_12.12-1_amd64.tar.zst
proxmox_lxc_template_storage: local
proxmox_lxc_template_path: images/debian-12-standard_12.12-1_amd64.tar.zst

# ── OpenWrt LXC (mesh satellite nodes) ────────────────────────────
# Custom image built by build-images.sh: no firewall, WiFi drivers baked in.
# Run ./build-images.sh before first deploy.
openwrt_lxc_template: openwrt-mesh-lxc-24.10.0-x86-64-rootfs.tar.gz
openwrt_lxc_template_path: images/openwrt-mesh-lxc-24.10.0-x86-64-rootfs.tar.gz

# ── Pi-hole LXC ──────────────────────────────────────────────────
# Custom image built by build-images.sh: Debian 12 + Pi-hole pre-installed.
# Run ./build-images.sh before first deploy.
pihole_lxc_template: pihole-debian-12-amd64.tar.zst
pihole_lxc_template_path: images/pihole-debian-12-amd64.tar.zst
pihole_ct_ip_offset: 10

# ── rsyslog LXC ─────────────────────────────────────────────────
# Custom image built by build-images.sh: Debian 12 + rsyslog pre-configured
# for TCP log reception, spool directory, and logrotate.
# Run ./build-images.sh before first deploy.
rsyslog_lxc_template: rsyslog-debian-12-amd64.tar.zst
rsyslog_lxc_template_path: images/rsyslog-debian-12-amd64.tar.zst
rsyslog_ct_ip_offset: 12

# ── Netdata LXC ─────────────────────────────────────────────────
# Custom image built by build-images.sh: Debian 12 + Netdata pre-installed
# with dbengine retention, /host/proc and /host/sys paths pre-configured.
# Run ./build-images.sh before first deploy.
netdata_lxc_template: netdata-debian-12-amd64.tar.zst
netdata_lxc_template_path: images/netdata-debian-12-amd64.tar.zst
netdata_ct_ip_offset: 21

# ── Home Assistant LXC ──────────────────────────────────────────
# Custom image built by build-images.sh: Debian 12 + Docker CE pre-installed
# with HA container pre-pulled. Docker-in-LXC requires nesting=1 feature.
# Run ./build-images.sh before first deploy.
homeassistant_lxc_template: homeassistant-debian-12-amd64.tar.zst
homeassistant_lxc_template_path: images/homeassistant-debian-12-amd64.tar.zst
homeassistant_ct_ip_offset: 14

# ── Jellyfin LXC ────────────────────────────────────────────────
# Custom image built by build-images.sh: Debian 12 + Jellyfin + VA-API drivers
# baked in for hardware transcoding. iGPU device passthrough required.
# Run ./build-images.sh before first deploy.
jellyfin_lxc_template: jellyfin-debian-12-amd64.tar.zst
jellyfin_lxc_template_path: images/jellyfin-debian-12-amd64.tar.zst
jellyfin_ct_ip_offset: 15
jellyfin_media_path: /mnt/media

# ── Kodi LXC ───────────────────────────────────────────────────
# Custom image built by build-images.sh: Debian 12 + kodi-standalone + kodi-gbm
# + Mesa VA-API drivers + libcec baked in. GBM/DRM direct rendering.
# Run ./build-images.sh before first deploy.
kodi_lxc_template: kodi-debian-12-amd64.tar.zst
kodi_lxc_template_path: images/kodi-debian-12-amd64.tar.zst
kodi_ct_ip_offset: 16

# ── Moonlight LXC ────────────────────────────────────────────
# Custom image built by build-images.sh: Debian 12 + moonlight-embedded
# + VA-API drivers (Intel + AMD) baked in. DRM/KMS display output.
# Run ./build-images.sh before first deploy.
moonlight_lxc_template: moonlight-debian-12-amd64.tar.zst
moonlight_lxc_template_path: images/moonlight-debian-12-amd64.tar.zst
moonlight_ct_ip_offset: 17

# ── Kiosk LXC (custom dashboard on physical display) ─────────────
# Custom image built by build-images.sh --only kiosk: Cage Wayland
# compositor + Chromium kiosk + Mesa VA-API drivers (Intel + AMD).
# Displays a local dashboard as the default idle screen.
# Run ./build-images.sh --only kiosk before first deploy.
kiosk_lxc_template: kiosk-debian-12-amd64.tar.zst
kiosk_lxc_template_path: images/kiosk-debian-12-amd64.tar.zst
kiosk_ct_ip_offset: 19

# ── Desktop VM (Debian 12 + KDE/GNOME baked image) ───────────────
# Custom image built by build-images.sh --only desktop: KDE Plasma,
# GNOME, SDDM, and shared applications pre-installed. GPU drivers
# installed at configure time (host-dependent).
# Base: images/debian-12-generic-amd64.qcow2 (still needed for builds).
desktop_image_path: images/desktop-debian-12-amd64.qcow2

# ── OpenWrt Router (VM) ──────────────────────────────────────────
# Custom image built by build-images.sh: mesh/security/DNS packages baked in.
# Run ./build-images.sh before first deploy.
openwrt_image_path: images/openwrt-router-24.10.0-x86-64-combined.img.gz
openwrt_vm_id: 100
openwrt_vm_name: openwrt-router
openwrt_vm_memory: 512
openwrt_vm_cores: 2
openwrt_vm_disk_size: 512M

# ── WireGuard LXC ─────────────────────────────────────────────────
# Custom image built by build-images.sh: Debian 12 + wireguard-tools,
# iptables, iptables-persistent, sysctl ip_forward pre-configured.
# Run ./build-images.sh before first deploy.
wireguard_lxc_template: wireguard-debian-12-amd64.tar.zst
wireguard_lxc_template_path: images/wireguard-debian-12-amd64.tar.zst

# ── Network Tier (100-199) ───────────────────────────────────────
wireguard_ct_id: 101
pihole_ct_id: 102
meshwifi_ct_id: 103

# ── Service Tier (200-299) ───────────────────────────────────────
homeassistant_ct_id: 200

# ── Media Tier (300-399) ─────────────────────────────────────────
jellyfin_ct_id: 300
kodi_ct_id: 301
moonlight_ct_id: 302

# ── Desktop Tier (400-499) ───────────────────────────────────────
desktop_vm_id: 400
kiosk_ct_id: 401

# ── Observability Tier (500-599) ─────────────────────────────────
netdata_ct_id: 500
rsyslog_ct_id: 501

# ── Gaming LXC (Sunshine host) ───────────────────────────────────
# Custom image built by build-images.sh: Fedora + Sunshine + dsda-doom +
# Mesa VA-API/Vulkan + Xorg headless + PipeWire. GPU render device
# sharing (NOT PCI passthrough) — safe on AMD APU single-GPU hosts.
# Run ./build-images.sh --only gaming before first deploy.
gaming_lxc_template: gaming-fedora-amd64.tar.zst
gaming_lxc_template_path: images/gaming-fedora-amd64.tar.zst
gaming_ct_ip_offset: 18

# ── Windows VM (general-purpose, not active for gaming) ──────────
# Pre-built Windows 11 image with Sunshine, virtio drivers, QEMU GA,
# and dsda-doom baked in. Retained as a general Windows build option.
gaming_image_path: images/sunshine-win11-amd64.qcow2

# ── Gaming (600-699) ─────────────────────────────────────────────
gaming_vm_id: 600
gaming_ct_id: 601

# ── Startup order ────────────────────────────────────────────────
# Maps VMID to Proxmox boot priority. Lower numbers start first.
# On-demand services use onboot: false (no startup order needed).
proxmox_startup_order:
  100: 1     # OpenWrt Router
  101: 2     # WireGuard VPN
  102: 3     # Pi-hole
  500: 3     # Netdata
  501: 3     # rsyslog
  103: 4     # Mesh WiFi Controller
  200: 5     # Home Assistant
  300: 5     # Jellyfin
  401: 6     # Custom UX Kiosk
  601: 1     # Gaming LXC (Sunshine streaming server)

# On-demand services (onboot: false, started manually)
proxmox_ondemand_services:
  - 301      # Kodi
  - 302      # Moonlight
  - 400      # Desktop VM
