---
project_version: "1.2.0"

# ── Project paths ─────────────────────────────────────────────────
# Auto-detect project root: Molecule sets MOLECULE_PROJECT_DIRECTORY,
# production runs from playbooks/ (one level below root).
project_root: >-
  {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY')
     | default(playbook_dir + '/..', true) }}

# Generated secrets file: test.env.generated under Molecule,
# .env.generated in production.
env_generated_path: >-
  {{ project_root }}/{{
     'test.env.generated'
     if lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | length > 0
     else '.env.generated' }}

# ── Callhome fleet management ─────────────────────────────────────
# Sole source of truth: .state/callhome_url written by build.py (production)
# or molecule prepare.yml (test). Empty when file is absent (API disabled).
callhome_server: "{{ lookup('file', project_root + '/.state/callhome_url', errors='ignore') | default('', true) }}"
callhome_public_key: "{{ lookup('env', 'CALLHOME_PUBLIC_KEY') }}"
callhome_private_key: "{{ lookup('env', 'CALLHOME_PRIVATE_KEY') }}"

# Single source of truth for fleet service names used by readiness gates,
# staleness checks, and the heartbeat watchdog. Add new services HERE.
fleet_monitored_services:
  - pihole
  - rsyslog
  - netdata
  - wireguard
  - homeassistant
  - jellyfin
  - kodi
  - moonlight
  - kiosk
  - gaming
  - openwrt-mesh
  - openwrt-bridge

# Subset used for pre-configure readiness (excludes mesh/bridge which
# are provisioned later and don't have callhome yet at that point).
fleet_ready_services:
  - pihole
  - rsyslog
  - netdata
  - wireguard
  - homeassistant
  - jellyfin
  - kodi
  - moonlight
  - kiosk
  - gaming

# ── Container NAT networking ──────────────────────────────────────
# WAN hosts get a private internal bridge for containers. Each host
# has container_subnet_id in host_vars. Container IPs are
# {container_subnet_prefix}.{container_subnet_id}.{offset}.
container_subnet_prefix: "10.99"
container_bridge_name: vmbr_ct

# ── Storage ───────────────────────────────────────────────────────
proxmox_storage: local-lvm

# ── LXC defaults ─────────────────────────────────────────────────
proxmox_lxc_default_template: debian-12-standard_12.12-1_amd64.tar.zst
proxmox_lxc_template_storage: local
proxmox_lxc_template_path: images/debian-12-standard_12.12-1_amd64.tar.zst

# ── Image version manifest ──────────────────────────────────────
# Single source of truth for image versions. Updated by build-images.sh.
# Template names and paths are derived from this manifest so they stay
# in sync with the versioned filenames produced by the build script.
_image_manifest: "{{ lookup('file', project_root + '/images/manifest.json') | from_json }}"

# ── OpenWrt LXC (mesh satellite nodes) ────────────────────────────
openwrt_lxc_template: "{{ _image_manifest.images.mesh.filename }}"
openwrt_lxc_template_path: "images/{{ _image_manifest.images.mesh.filename }}"
openwrt_lxc_image_version: "{{ _image_manifest.images.mesh.version }}"

# ── Pi-hole LXC ──────────────────────────────────────────────────
pihole_lxc_template: "{{ _image_manifest.images.pihole.filename }}"
pihole_lxc_template_path: "images/{{ _image_manifest.images.pihole.filename }}"
pihole_image_version: "{{ _image_manifest.images.pihole.version }}"
pihole_ct_ip_offset: 10

# ── rsyslog LXC ─────────────────────────────────────────────────
rsyslog_lxc_template: "{{ _image_manifest.images.rsyslog.filename }}"
rsyslog_lxc_template_path: "images/{{ _image_manifest.images.rsyslog.filename }}"
rsyslog_image_version: "{{ _image_manifest.images.rsyslog.version }}"
rsyslog_ct_ip_offset: 30

# ── Netdata LXC ─────────────────────────────────────────────────
netdata_lxc_template: "{{ _image_manifest.images.netdata.filename }}"
netdata_lxc_template_path: "images/{{ _image_manifest.images.netdata.filename }}"
netdata_image_version: "{{ _image_manifest.images.netdata.version }}"
netdata_ct_ip_offset: 40
bridge_ct_ip_offset: 27

# ── Home Assistant LXC ──────────────────────────────────────────
homeassistant_lxc_template: "{{ _image_manifest.images.homeassistant.filename }}"
homeassistant_lxc_template_path: "images/{{ _image_manifest.images.homeassistant.filename }}"
homeassistant_image_version: "{{ _image_manifest.images.homeassistant.version }}"
homeassistant_ct_ip_offset: 14

# ── Jellyfin LXC ────────────────────────────────────────────────
jellyfin_lxc_template: "{{ _image_manifest.images.jellyfin.filename }}"
jellyfin_lxc_template_path: "images/{{ _image_manifest.images.jellyfin.filename }}"
jellyfin_image_version: "{{ _image_manifest.images.jellyfin.version }}"
jellyfin_ct_ip_offset: 15
jellyfin_media_path: /mnt/media

# ── Kodi LXC ───────────────────────────────────────────────────
kodi_lxc_template: "{{ _image_manifest.images.kodi.filename }}"
kodi_lxc_template_path: "images/{{ _image_manifest.images.kodi.filename }}"
kodi_image_version: "{{ _image_manifest.images.kodi.version }}"
kodi_ct_ip_offset: 16

# ── Moonlight LXC ────────────────────────────────────────────
moonlight_lxc_template: "{{ _image_manifest.images.moonlight.filename }}"
moonlight_lxc_template_path: "images/{{ _image_manifest.images.moonlight.filename }}"
moonlight_image_version: "{{ _image_manifest.images.moonlight.version }}"
moonlight_ct_ip_offset: 17

# ── Kiosk LXC (custom dashboard on physical display) ─────────────
kiosk_lxc_template: "{{ _image_manifest.images.kiosk.filename }}"
kiosk_lxc_template_path: "images/{{ _image_manifest.images.kiosk.filename }}"
kiosk_image_version: "{{ _image_manifest.images.kiosk.version }}"
kiosk_ct_ip_offset: 20

# ── Desktop VM (Debian 12 + KDE/GNOME baked image) ───────────────
desktop_image_path: "images/{{ _image_manifest.images.desktop.filename }}"
desktop_image_version: "{{ _image_manifest.images.desktop.version }}"

# ── OpenWrt Router (VM) ──────────────────────────────────────────
openwrt_image_path: "images/{{ _image_manifest.images.router.filename }}"
openwrt_image_version: "{{ _image_manifest.images.router.version }}"
openwrt_vm_id: 100
openwrt_vm_name: openwrt-router
openwrt_vm_memory: 512
openwrt_vm_cores: 2
openwrt_vm_disk_size: 512M

# ── WireGuard LXC ─────────────────────────────────────────────────
wireguard_lxc_template: "{{ _image_manifest.images.wireguard.filename }}"
wireguard_lxc_template_path: "images/{{ _image_manifest.images.wireguard.filename }}"
wireguard_image_version: "{{ _image_manifest.images.wireguard.version }}"

# ── Network Tier (100-199) ───────────────────────────────────────
wireguard_ct_id: 101
pihole_ct_id: 102
meshwifi_ct_id: 103
bridge_ct_id: 104

# ── Service Tier (200-299) ───────────────────────────────────────
homeassistant_ct_id: 200

# ── Media Tier (300-399) ─────────────────────────────────────────
jellyfin_ct_id: 300
kodi_ct_id: 301
moonlight_ct_id: 302

# ── Desktop Tier (400-499) ───────────────────────────────────────
desktop_vm_id: 400
kiosk_ct_id: 401
kiosk_manager_port: "{{ lookup('env', 'KIOSK_MANAGER_PORT') | default('9001', true) }}"

# ── Observability Tier (500-599) ─────────────────────────────────
netdata_ct_id: 500
rsyslog_ct_id: 501

# ── Gaming LXC (Sunshine host) ───────────────────────────────────
gaming_lxc_template: "{{ _image_manifest.images.gaming.filename }}"
gaming_lxc_template_path: "images/{{ _image_manifest.images.gaming.filename }}"
gaming_image_version: "{{ _image_manifest.images.gaming.version }}"
gaming_ct_ip_offset: 18

# ── Windows VM (general-purpose, not active for gaming) ──────────
gaming_image_path: "images/{{ _image_manifest.images.sunshine.filename }}"
sunshine_image_version: "{{ _image_manifest.images.sunshine.version }}"

# ── Gaming (600-699) ─────────────────────────────────────────────
gaming_vm_id: 600
gaming_ct_id: 601

# ── Startup order ────────────────────────────────────────────────
# Maps VMID to Proxmox boot priority. Lower numbers start first.
# Services at the same priority level start in parallel (intentional).
# On-demand services use onboot: false (no startup order needed).
proxmox_startup_order:
  100: 1     # OpenWrt Router — network must be first
  601: 1     # Gaming LXC (Sunshine) — independent, can parallel with router
  101: 2     # WireGuard VPN — needs network
  102: 3     # Pi-hole — needs network
  500: 3     # Netdata — parallel with Pi-hole (same tier)
  501: 3     # rsyslog — parallel with Pi-hole (same tier)
  104: 2     # WiFi Bridge — parallel with VPN (after network)
  103: 4     # Mesh WiFi Controller — after DNS/monitoring
  200: 5     # Home Assistant — after infrastructure
  300: 5     # Jellyfin — parallel with HA (same tier)
  401: 6     # Custom UX Kiosk — after all services

# On-demand services (onboot: false, started manually)
proxmox_ondemand_services:
  - 301      # Kodi
  - 302      # Moonlight
  - 400      # Desktop VM
