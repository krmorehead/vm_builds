---
project_version: "1.2.0"

# ── Project paths ─────────────────────────────────────────────────
# Auto-detect project root: Molecule sets MOLECULE_PROJECT_DIRECTORY,
# production runs from playbooks/ (one level below root).
project_root: >-
  {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY')
     | default(playbook_dir + '/..', true) }}

# Generated secrets file: test.env.generated under Molecule,
# .env.generated in production.
env_generated_path: >-
  {{ project_root }}/{{
     'test.env.generated'
     if lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | length > 0
     else '.env.generated' }}

# ── Callhome fleet management ─────────────────────────────────────
# Sole source of truth: .state/callhome_url written by build.py (production)
# or molecule prepare.yml (test). Empty when file is absent (API disabled).
callhome_server: "{{ lookup('file', project_root + '/.state/callhome_url', errors='ignore') | default('', true) }}"
# Direct localhost path — used by plays on hosts: localhost to bypass
# the socat/tunnel relay chain. The API server always listens locally.
callhome_port: "{{ lookup('env', 'WEBUI_PORT') | default('52500', true) }}"
callhome_server_local: "http://localhost:{{ callhome_port }}"
callhome_public_key: "{{ lookup('env', 'CALLHOME_PUBLIC_KEY') }}"
callhome_private_key: "{{ lookup('env', 'CALLHOME_PRIVATE_KEY') }}"

# Single source of truth for fleet service names used by readiness gates,
# staleness checks, and the heartbeat watchdog. Add new services HERE.
fleet_monitored_services:
  - pihole
  - rsyslog
  - netdata
  - wireguard
  - homeassistant
  - jellyfin
  - kodi
  - moonlight
  - desktop
  - kiosk
  - gaming
  - openwrt-mesh
  - openwrt-bridge

# Subset used for pre-configure readiness (excludes mesh/bridge which
# are provisioned later and don't have callhome yet at that point).
fleet_ready_services:
  - pihole
  - rsyslog
  - netdata
  - wireguard
  - homeassistant
  - jellyfin
  - kodi
  - moonlight
  - desktop
  - kiosk
  - gaming

# ── Container NAT networking ──────────────────────────────────────
# WAN hosts get a private internal bridge for containers. Each host
# has container_subnet_id in host_vars. Container IPs are
# {container_subnet_prefix}.{container_subnet_id}.{offset}.
container_subnet_prefix: "10.99"
container_bridge_name: vmbr_ct

# ── Storage ───────────────────────────────────────────────────────
proxmox_storage: local-lvm

# ── LXC defaults ─────────────────────────────────────────────────
proxmox_lxc_default_template: debian-12-standard_12.12-1_amd64.tar.zst
proxmox_lxc_template_storage: local
proxmox_lxc_template_path: images/debian-12-standard_12.12-1_amd64.tar.zst

# ── Image versions (from per-image .version sidecars) ────────────
# Each image has a sidecar file (e.g. images/pihole.version) written
# by build-images.sh. Hard-fails if sidecar is missing — run the build.

# ── OpenWrt LXC (mesh satellite nodes) ────────────────────────────
openwrt_lxc_image_version: "{{ lookup('file', project_root + '/images/mesh.version') }}"
openwrt_lxc_template_path: "images/openwrt-mesh-lxc-{{ openwrt_lxc_image_version }}-24.10.0-x86-64-rootfs.tar.gz"

# ── Pi-hole LXC ──────────────────────────────────────────────────
pihole_image_version: "{{ lookup('file', project_root + '/images/pihole.version') }}"
pihole_lxc_template_path: "images/pihole-{{ pihole_image_version }}-debian-12-amd64.tar.zst"
pihole_ct_ip_offset: 10

# ── rsyslog LXC ─────────────────────────────────────────────────
rsyslog_image_version: "{{ lookup('file', project_root + '/images/rsyslog.version') }}"
rsyslog_lxc_template_path: "images/rsyslog-{{ rsyslog_image_version }}-debian-12-amd64.tar.zst"
rsyslog_ct_ip_offset: 30

# ── Netdata LXC ─────────────────────────────────────────────────
netdata_image_version: "{{ lookup('file', project_root + '/images/netdata.version') }}"
netdata_lxc_template_path: "images/netdata-{{ netdata_image_version }}-debian-12-amd64.tar.zst"
netdata_ct_ip_offset: 40
bridge_ct_ip_offset: 27

# ── Home Assistant LXC ──────────────────────────────────────────
homeassistant_image_version: "{{ lookup('file', project_root + '/images/homeassistant.version') }}"
homeassistant_lxc_template_path: "images/homeassistant-{{ homeassistant_image_version }}-debian-12-amd64.tar.zst"
homeassistant_ct_ip_offset: 14

# ── Jellyfin LXC ────────────────────────────────────────────────
jellyfin_image_version: "{{ lookup('file', project_root + '/images/jellyfin.version') }}"
jellyfin_lxc_template_path: "images/jellyfin-{{ jellyfin_image_version }}-debian-12-amd64.tar.zst"
jellyfin_ct_ip_offset: 15
jellyfin_media_path: /mnt/media

# ── Kodi LXC ───────────────────────────────────────────────────
kodi_image_version: "{{ lookup('file', project_root + '/images/kodi.version') }}"
kodi_lxc_template_path: "images/kodi-{{ kodi_image_version }}-debian-12-amd64.tar.zst"
kodi_ct_ip_offset: 16

# ── Moonlight LXC ────────────────────────────────────────────
moonlight_image_version: "{{ lookup('file', project_root + '/images/moonlight.version') }}"
moonlight_lxc_template_path: "images/moonlight-{{ moonlight_image_version }}-debian-12-amd64.tar.zst"
moonlight_ct_ip_offset: 17

# ── Kiosk LXC (custom dashboard on physical display) ─────────────
kiosk_image_version: "{{ lookup('file', project_root + '/images/kiosk.version') }}"
kiosk_lxc_template_path: "images/kiosk-{{ kiosk_image_version }}-debian-12-amd64.tar.zst"
kiosk_ct_ip_offset: 20

# ── Desktop LXC (XFCE + KasmVNC, shared DRI render node) ─────────
desktop_image_version: "{{ lookup('file', project_root + '/images/desktop.version') }}"
desktop_ct_template_path: "images/desktop-{{ desktop_image_version }}-debian-12-amd64.tar.zst"
desktop_ct_ip_offset: 50

# ── OpenWrt Router (VM) ──────────────────────────────────────────
openwrt_image_version: "{{ lookup('file', project_root + '/images/router.version') }}"
openwrt_image_path: "images/openwrt-router-{{ openwrt_image_version }}-24.10.0-x86-64-combined.img.gz"
openwrt_vm_id: 100
openwrt_vm_name: openwrt-router
openwrt_vm_memory: 512
openwrt_vm_cores: 2
openwrt_vm_disk_size: 512M

# ── WireGuard LXC ─────────────────────────────────────────────────
wireguard_image_version: "{{ lookup('file', project_root + '/images/wireguard.version') }}"
wireguard_lxc_template_path: "images/wireguard-{{ wireguard_image_version }}-debian-12-amd64.tar.zst"
vpn_subnet: "10.0.0.0/24"

# ── Network Tier (100-199) ───────────────────────────────────────
wireguard_ct_id: 101
pihole_ct_id: 102
meshwifi_ct_id: 103
bridge_ct_id: 104

# ── Service Tier (200-299) ───────────────────────────────────────
homeassistant_ct_id: 200

# ── Media Tier (300-399) ─────────────────────────────────────────
jellyfin_ct_id: 300
kodi_ct_id: 301
moonlight_ct_id: 302

# ── Desktop Tier (400-499) ───────────────────────────────────────
desktop_ct_id: 400
kiosk_ct_id: 401
kiosk_manager_port: "{{ lookup('env', 'KIOSK_MANAGER_PORT') | default('9001', true) }}"
kiosk_ws_port: 6080
desktop_ws_port: 6081
kodi_ws_port: 6082
moonlight_ws_port: 6083
lan_display_relay_offset: 100

# ── Observability Tier (500-599) ─────────────────────────────────
netdata_ct_id: 500
rsyslog_ct_id: 501

# ── Gaming LXC (Sunshine host) ───────────────────────────────────
gaming_image_version: "{{ lookup('file', project_root + '/images/gaming.version') }}"
gaming_lxc_template_path: "images/gaming-{{ gaming_image_version }}-fedora-amd64.tar.zst"
gaming_ct_ip_offset: 18

# ── Windows VM (general-purpose, not active for gaming) ──────────
sunshine_image_version: "{{ lookup('file', project_root + '/images/sunshine.version') }}"
gaming_image_path: "images/sunshine-{{ sunshine_image_version }}-win11-amd64.qcow2"

# ── Gaming (600-699) ─────────────────────────────────────────────
gaming_vm_id: 600
gaming_ct_id: 601

# ── Startup order ────────────────────────────────────────────────
# Maps VMID to Proxmox boot priority. Lower numbers start first.
# Services at the same priority level start in parallel (intentional).
# On-demand services use onboot: false (no startup order needed).
proxmox_startup_order:
  100: 1     # OpenWrt Router — network must be first
  601: 1     # Gaming LXC (Sunshine) — independent, can parallel with router
  101: 2     # WireGuard VPN — needs network
  102: 3     # Pi-hole — needs network
  500: 3     # Netdata — parallel with Pi-hole (same tier)
  501: 3     # rsyslog — parallel with Pi-hole (same tier)
  104: 2     # WiFi Bridge — parallel with VPN (after network)
  103: 4     # Mesh WiFi Controller — after DNS/monitoring
  200: 5     # Home Assistant — after infrastructure
  300: 5     # Jellyfin — parallel with HA (same tier)
  401: 6     # Custom UX Kiosk — after all services

# On-demand services (onboot: false, started manually)
proxmox_ondemand_services:
  - 301      # Kodi
  - 302      # Moonlight
  - 400      # Desktop LXC
