---
# ── Phase 0a: Ensure heartbeat API server is running ───────────
# In molecule test, cleanup removes .state/callhome_url but prepare
# may be skipped. This play detects a missing API and starts one.

- name: Ensure heartbeat API server is running
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Check if API server state file exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../.state/callhome_url"
      register: _callhome_state

    - name: Start API server if not running
      ansible.builtin.command:
        cmd: "{{ playbook_dir }}/../.venv/bin/python3 {{ playbook_dir }}/../scripts/start_test_api.py"
      environment:
        MOLECULE_PROJECT_DIRECTORY: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | default('', true) }}"
      register: _api_start
      changed_when: true
      when:
        - not _callhome_state.stat.exists
        - lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | length > 0

    - name: Verify API server is responding
      ansible.builtin.uri:
        url: "{{ callhome_server_local }}/api/fleet/health"
        return_content: true
      register: _api_health
      retries: 5
      delay: 2
      until: _api_health.status == 200
      failed_when: false
      when: callhome_server | default('') | length > 0

    - name: Restart API server if health check failed
      ansible.builtin.command:
        cmd: "{{ playbook_dir }}/../.venv/bin/python3 {{ playbook_dir }}/../scripts/start_test_api.py"
      environment:
        MOLECULE_PROJECT_DIRECTORY: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | default('', true) }}"
      register: _api_restart
      changed_when: true
      when:
        - callhome_server | default('') | length > 0
        - _api_health.status | default(-1) | int != 200
        - lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | length > 0

    - name: Report API server status
      ansible.builtin.debug:
        msg: >-
          {{ 'API server restarted: ' + (_api_restart.stdout | default(''))
             if _api_restart is changed
             else ('API server started: ' + (_api_start.stdout | default('')))
             if _api_start is changed
             else 'API server healthy' }}

# ── Phase 0b: Start heartbeat watchdog ─────────────────────────
# Background process polls /api/fleet/stale every second.
# Kills ansible-playbook the instant any previously-healthy service
# stops heartbeating. No grace period, no waiting for end-of-run.

- name: Start heartbeat watchdog
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Launch watchdog in background
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          CALLHOME_URL="{{ callhome_server_local }}"
          if [ -z "$CALLHOME_URL" ] || [ "$CALLHOME_URL" = "http://localhost:" ]; then
            echo "No callhome port — watchdog skipped"
            exit 0
          fi
          SERVICES="{{ fleet_monitored_services | join(',') }}"
          PARENT_PID=$PPID
          nohup "{{ playbook_dir }}/../scripts/heartbeat_watchdog.sh" \
            "$CALLHOME_URL" "$PARENT_PID" "$SERVICES" 60 \
            >> "{{ playbook_dir }}/../.state/watchdog.log" 2>&1 &
          echo "$!" > "{{ playbook_dir }}/../.state/watchdog.pid"
          echo "Watchdog started (PID $!) monitoring $CALLHOME_URL services=$SERVICES — will kill PID $PARENT_PID on stale heartbeat"
        executable: /bin/bash
      register: _watchdog_start
      changed_when: true

    - name: Report watchdog status
      ansible.builtin.debug:
        msg: "{{ _watchdog_start.stdout }}"

# ── Phase 1: Primary host (directly reachable) ──────────────────

- name: Back up primary Proxmox hosts
  hosts: proxmox:!lan_hosts
  gather_facts: true
  tags: [backup]
  pre_tasks:
    - name: Validate API token is configured
      ansible.builtin.assert:
        that: proxmox_api_token_secret | length > 0
        fail_msg: >-
          {{ _api_token_env_var }} is missing or empty in your .env file.
          Create a token: pveum user token add root@pam ansible --privsep=0
  roles:
    - proxmox_backup
    - role: deploy_stamp
      vars:
        deploy_stamp_play: backup

- name: Configure shared infrastructure on primary hosts
  hosts: proxmox:!lan_hosts
  gather_facts: true
  tags: [infra]
  pre_tasks:
    - name: Disable PVE enterprise repo (requires subscription)
      ansible.builtin.command:
        cmd: mv /etc/apt/sources.list.d/pve-enterprise.sources /etc/apt/sources.list.d/pve-enterprise.sources.disabled
      args:
        removes: /etc/apt/sources.list.d/pve-enterprise.sources

    - name: Disable Ceph enterprise repo (requires subscription)
      ansible.builtin.command:
        cmd: mv /etc/apt/sources.list.d/ceph.sources /etc/apt/sources.list.d/ceph.sources.disabled
      args:
        removes: /etc/apt/sources.list.d/ceph.sources

    - name: Add Proxmox no-subscription repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/pve-no-subscription.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: http://download.proxmox.com/debian/pve
          Suites: {{ ansible_facts['distribution_release'] }}
          Components: pve-no-subscription
          Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg

    - name: Check clock skew
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          chronyc -n tracking 2>/dev/null | awk '/System time/{print $4}' || echo "999"
        executable: /bin/bash
      register: _clock_skew
      changed_when: false
      failed_when: false

    - name: Force NTP clock sync before infrastructure setup
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          if command -v chronyc >/dev/null 2>&1; then
            systemctl restart chronyd 2>/dev/null || true
            chronyc -a 'burst 4/4' 2>/dev/null || true
            sleep 6
            chronyc -a makestep 2>/dev/null || true
          elif command -v ntpdate >/dev/null 2>&1; then
            ntpdate -b pool.ntp.org 2>/dev/null || true
          fi
        executable: /bin/bash
      changed_when: false
      failed_when: false
      when: (_clock_skew.stdout | default('999') | float) > 30.0
  roles:
    - proxmox_bridges
    - proxmox_pci_passthrough
    - proxmox_igpu
    - role: deploy_stamp
      vars:
        deploy_stamp_play: infrastructure

- name: Provision OpenWrt VM
  hosts: router_nodes
  gather_facts: false
  tags: [openwrt]
  roles:
    - openwrt_vm
    - role: deploy_stamp
      vars:
        deploy_stamp_play: openwrt_vm

- name: Configure OpenWrt
  hosts: openwrt
  gather_facts: false
  tags: [openwrt]
  roles:
    - openwrt_configure

# ── Phase 2: LAN satellites (reachable after OpenWrt) ───────────

- name: Bootstrap LAN satellite hosts
  hosts: router_nodes
  gather_facts: true
  tags: [lan-satellite]
  tasks:
    - name: Bootstrap each LAN host
      ansible.builtin.include_tasks: ../tasks/bootstrap_lan_host.yml
      vars:
        _lan_host_ip: "{{ hostvars[item].ansible_host }}"
        _lan_host_name: "{{ item }}"
      loop: "{{ groups['lan_hosts'] | default([]) }}"
      when: groups['lan_hosts'] | default([]) | length > 0

- name: Back up LAN satellite hosts
  hosts: lan_hosts
  gather_facts: true
  tags: [lan-satellite, backup]
  pre_tasks:
    - name: Clear stale SSH state to LAN hosts
      ansible.builtin.meta: reset_connection

    - name: Wait for SSH via ProxyCommand to stabilize
      ansible.builtin.wait_for_connection:
        timeout: 120
        delay: 5
  roles:
    - proxmox_backup
    - role: deploy_stamp
      vars:
        deploy_stamp_play: backup

- name: Configure shared infrastructure on LAN satellites
  hosts: lan_hosts
  gather_facts: true
  tags: [lan-satellite, infra]
  pre_tasks:
    - name: Disable PVE enterprise repo (requires subscription)
      ansible.builtin.command:
        cmd: mv /etc/apt/sources.list.d/pve-enterprise.sources /etc/apt/sources.list.d/pve-enterprise.sources.disabled
      args:
        removes: /etc/apt/sources.list.d/pve-enterprise.sources

    - name: Disable Ceph enterprise repo (requires subscription)
      ansible.builtin.command:
        cmd: mv /etc/apt/sources.list.d/ceph.sources /etc/apt/sources.list.d/ceph.sources.disabled
      args:
        removes: /etc/apt/sources.list.d/ceph.sources

    - name: Add Proxmox no-subscription repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/pve-no-subscription.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: http://download.proxmox.com/debian/pve
          Suites: {{ ansible_facts['distribution_release'] }}
          Components: pve-no-subscription
          Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg

    - name: Check clock skew
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          chronyc -n tracking 2>/dev/null | awk '/System time/{print $4}' || echo "999"
        executable: /bin/bash
      register: _clock_skew
      changed_when: false
      failed_when: false

    - name: Force NTP clock sync before infrastructure setup
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          if command -v chronyc >/dev/null 2>&1; then
            systemctl restart chronyd 2>/dev/null || true
            chronyc -a 'burst 4/4' 2>/dev/null || true
            sleep 6
            chronyc -a makestep 2>/dev/null || true
          elif command -v ntpdate >/dev/null 2>&1; then
            ntpdate -b pool.ntp.org 2>/dev/null || true
          fi
        executable: /bin/bash
      changed_when: false
      failed_when: false
      when: (_clock_skew.stdout | default('999') | float) > 30.0
  roles:
    - proxmox_bridges
    - proxmox_pci_passthrough
    - proxmox_igpu
    - role: deploy_stamp
      vars:
        deploy_stamp_play: infrastructure

# ── Phase 2.5: Kiosk (early deploy for event-driven monitoring) ──

- name: Provision Kiosk LXC
  hosts: kiosk_nodes
  gather_facts: false
  tags: [kiosk]
  roles:
    - kiosk_lxc
    - role: deploy_stamp
      vars:
        deploy_stamp_play: kiosk_lxc

- name: Configure Kiosk
  hosts: kiosk_nodes
  gather_facts: false
  tags: [kiosk]
  roles:
    - kiosk_configure

# ── Distribute Cluster Manager SSH key to all Proxmox hosts ──
# The Cluster Manager (router node's kiosk) needs SSH access to every
# Proxmox host for batman/wifi/bridge fleet operations.  Each kiosk
# generates its own key and authorizes it locally in kiosk_configure.
# This play reads the Cluster Manager's key and authorizes it on
# every other host so _ssh_exec() works across the fleet.

- name: Distribute Cluster Manager SSH key
  hosts: kiosk_nodes
  gather_facts: false
  tags: [kiosk]
  tasks:
    - name: Read Cluster Manager public key
      ansible.builtin.command:
        cmd: pct exec {{ kiosk_ct_id }} -- cat /home/kiosk/.ssh/id_ed25519.pub
      register: _cm_pubkey
      changed_when: false
      when: inventory_hostname in groups.get('router_nodes', [])

    - name: Set Cluster Manager key fact
      ansible.builtin.set_fact:
        _cluster_manager_pubkey: "{{ hostvars[groups['router_nodes'][0]]._cm_pubkey.stdout }}"
      when: groups.get('router_nodes', []) | length > 0

    - name: Authorize Cluster Manager key on this host
      ansible.posix.authorized_key:
        user: root
        key: "{{ _cluster_manager_pubkey }}"
        comment: "cluster-manager-{{ groups['router_nodes'][0] }}"
        state: present
      when:
        - _cluster_manager_pubkey is defined
        - _cluster_manager_pubkey | length > 0
        - inventory_hostname not in groups.get('router_nodes', [])

