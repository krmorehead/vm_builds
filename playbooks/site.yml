---
# ══════════════════════════════════════════════════════════════════
# Phase 1: Ansible bootstrap (management plane)
# ══════════════════════════════════════════════════════════════════
# Stands up the management plane: heartbeat API, backups,
# infrastructure (bridges, PCI, iGPU), OpenWrt router, LAN hosts,
# all service LXC provisioning, and Kiosk/Manager containers.
# After this phase, every NM is running and VPN is configured.
# Phase 2 (API-driven) takes over for all configure plays.
#
# ── Phase 0a: Ensure heartbeat API server is running ───────────
# In molecule test, cleanup removes .state/callhome_url but prepare
# may be skipped. This play detects a missing API and starts one.

- name: Ensure heartbeat API server is running
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Check if API server state file exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../.state/callhome_url"
      register: _callhome_state

    - name: Start API server if not running
      ansible.builtin.command:
        cmd: "{{ playbook_dir }}/../.venv/bin/python3 {{ playbook_dir }}/../scripts/start_test_api.py"
      environment:
        MOLECULE_PROJECT_DIRECTORY: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | default('', true) }}"
      register: _api_start
      changed_when: true
      when:
        - not _callhome_state.stat.exists
        - lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | length > 0

    - name: Verify API server is responding
      ansible.builtin.uri:
        url: "{{ callhome_server_local }}/api/fleet/health"
        return_content: true
      register: _api_health
      retries: 5
      delay: 2
      until: _api_health.status == 200
      failed_when: false
      when: callhome_server | default('') | length > 0

    - name: Restart API server if health check failed
      ansible.builtin.command:
        cmd: "{{ playbook_dir }}/../.venv/bin/python3 {{ playbook_dir }}/../scripts/start_test_api.py"
      environment:
        MOLECULE_PROJECT_DIRECTORY: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | default('', true) }}"
      register: _api_restart
      changed_when: true
      when:
        - callhome_server | default('') | length > 0
        - _api_health.status | default(-1) | int != 200
        - lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | length > 0

    - name: Report API server status
      ansible.builtin.debug:
        msg: >-
          {{ 'API server restarted: ' + (_api_restart.stdout | default(''))
             if _api_restart is changed
             else ('API server started: ' + (_api_start.stdout | default('')))
             if _api_start is changed
             else 'API server healthy' }}

# ── Phase 0b: Start heartbeat watchdog ─────────────────────────
# Background process polls /api/fleet/stale every second.
# Kills ansible-playbook the instant any previously-healthy service
# stops heartbeating. No grace period, no waiting for end-of-run.

- name: Start heartbeat watchdog
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Launch watchdog in background
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          CALLHOME_URL="{{ callhome_server_local }}"
          if [ -z "$CALLHOME_URL" ] || [ "$CALLHOME_URL" = "http://localhost:" ]; then
            echo "No callhome port — watchdog skipped"
            exit 0
          fi
          SERVICES="{{ fleet_monitored_services | join(',') }}"
          PARENT_PID=$PPID
          nohup "{{ playbook_dir }}/../scripts/heartbeat_watchdog.sh" \
            "$CALLHOME_URL" "$PARENT_PID" "$SERVICES" 60 \
            >> "{{ playbook_dir }}/../.state/watchdog.log" 2>&1 &
          echo "$!" > "{{ playbook_dir }}/../.state/watchdog.pid"
          echo "Watchdog started (PID $!) monitoring $CALLHOME_URL services=$SERVICES — will kill PID $PARENT_PID on stale heartbeat"
        executable: /bin/bash
      register: _watchdog_start
      changed_when: true

    - name: Report watchdog status
      ansible.builtin.debug:
        msg: "{{ _watchdog_start.stdout }}"

# ── Phase 1: Primary host (directly reachable) ──────────────────

- name: Back up primary Proxmox hosts
  hosts: proxmox:!lan_hosts
  gather_facts: true
  tags: [backup]
  pre_tasks:
    - name: Validate API token is configured
      ansible.builtin.assert:
        that: proxmox_api_token_secret | length > 0
        fail_msg: >-
          {{ _api_token_env_var }} is missing or empty in your .env file.
          Create a token: pveum user token add root@pam ansible --privsep=0
  roles:
    - proxmox_backup
    - role: deploy_stamp
      vars:
        deploy_stamp_play: backup

- name: Configure shared infrastructure on primary hosts
  hosts: proxmox:!lan_hosts
  gather_facts: true
  tags: [infra]
  pre_tasks:
    - name: Infrastructure pre-flight (repos, health, NTP)
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/infra_pre_tasks.yml"
  roles:
    - proxmox_bridges
    - proxmox_pci_passthrough
    - proxmox_igpu
    - role: deploy_stamp
      vars:
        deploy_stamp_play: infrastructure

- name: Provision OpenWrt VM
  hosts: router_nodes
  gather_facts: false
  tags: [openwrt]
  roles:
    - openwrt_vm
    - role: deploy_stamp
      vars:
        deploy_stamp_play: openwrt_vm

- name: Configure OpenWrt
  hosts: openwrt
  gather_facts: false
  tags: [openwrt]
  roles:
    - openwrt_configure

# ── Phase 2: LAN satellites (reachable after OpenWrt) ───────────

- name: Bootstrap LAN satellite hosts
  hosts: router_nodes
  gather_facts: true
  tags: [lan-satellite]
  tasks:
    - name: Bootstrap each LAN host
      ansible.builtin.include_tasks: ../tasks/bootstrap_lan_host.yml
      vars:
        _lan_host_ip: "{{ hostvars[item].ansible_host }}"
        _lan_host_name: "{{ item }}"
      loop: "{{ groups['lan_hosts'] | default([]) }}"
      when: groups['lan_hosts'] | default([]) | length > 0

# LAN hosts are unreachable during molecule cleanup (router not yet
# deployed).  Containers from the previous run survive.  This pass
# destroys them now that the LAN is reachable, so the NM provision
# handler only does fresh creation — not destroy+create in one request.
- name: Clean stale containers on LAN hosts
  hosts: router_nodes
  gather_facts: false
  tags: [lan-satellite]
  tasks:
    - name: Destroy stale containers on each LAN host
      ansible.builtin.include_tasks: ../tasks/cleanup_lan_host_containers.yml
      vars:
        _lan_host_ip: "{{ hostvars[item].ansible_host }}"
        _lan_host_name: "{{ item }}"
      loop: "{{ groups['lan_hosts'] | default([]) }}"
      when: groups['lan_hosts'] | default([]) | length > 0

- name: Back up LAN satellite hosts
  hosts: lan_hosts
  gather_facts: true
  tags: [lan-satellite, backup]
  pre_tasks:
    - name: Clear stale SSH state to LAN hosts
      ansible.builtin.meta: reset_connection

    - name: Wait for SSH via ProxyCommand to stabilize
      ansible.builtin.wait_for_connection:
        timeout: 60
        delay: 3
  roles:
    - proxmox_backup
    - role: deploy_stamp
      vars:
        deploy_stamp_play: backup

- name: Configure shared infrastructure on LAN satellites
  hosts: lan_hosts
  gather_facts: true
  tags: [lan-satellite, infra]
  pre_tasks:
    - name: Infrastructure pre-flight (repos, health, NTP)
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/infra_pre_tasks.yml"
  roles:
    - proxmox_bridges
    - proxmox_pci_passthrough
    - proxmox_igpu
    - role: deploy_stamp
      vars:
        deploy_stamp_play: infrastructure

# ── Phase 2.5: Kiosk (early deploy for event-driven monitoring) ──

- name: Provision Kiosk LXC
  hosts: kiosk_nodes
  gather_facts: false
  tags: [kiosk]
  roles:
    - kiosk_lxc
    - role: deploy_stamp
      vars:
        deploy_stamp_play: kiosk_lxc

# ── Deploy NM API relay for LAN hosts ─────────────────────────────
# LAN hosts are unreachable from the controller via HTTP. The router
# node (home) relays NM API traffic to each LAN host's Node Manager.
# MUST run BEFORE kiosk_configure (which checks NM API health) and
# before the NM readiness gate.

- name: Deploy LAN NM API relays
  hosts: router_nodes
  gather_facts: false
  tags: [kiosk]
  tasks:
    - name: Deploy LAN NM relay services
      ansible.builtin.include_tasks: "{{ project_root }}/tasks/lan_nm_relay.yml"
      when: groups.get('lan_hosts', []) | length > 0

- name: Configure Kiosk
  hosts: kiosk_nodes
  gather_facts: false
  tags: [kiosk]
  roles:
    - kiosk_configure

# ── Phase 1 boundary: NM API readiness gate ──────────────────────
# Everything ABOVE this point is Ansible bootstrap: infrastructure,
# OpenWrt, LAN bootstrap, and Kiosk/Manager deployment.
# Everything BELOW this point uses NM APIs for all operations.
# The NM gate verifies every Node Manager is responding before
# proceeding to API-driven provisioning and configuration.

- name: Node Manager API readiness gate (hard-fail)
  hosts: kiosk_nodes
  gather_facts: false
  tags: [kiosk]
  vars:
    _nm_api_host: "{{ nm_api_host | default(ansible_host) }}"
    _nm_api_port: "{{ nm_api_port | default(kiosk_manager_port) }}"
  tasks:
    - name: Wait for Node Manager API to respond
      ansible.builtin.uri:
        url: "http://{{ _nm_api_host }}:{{ _nm_api_port }}/api/images/versions"
        return_content: true
        timeout: 5
      register: _nm_ready
      retries: 6
      delay: 3
      until: (_nm_ready.status | default(0)) == 200
      delegate_to: localhost

    - name: Assert Node Manager is responding
      ansible.builtin.assert:
        that: (_nm_ready.status | default(0)) == 200
        fail_msg: >-
          HARD FAILURE: Node Manager on {{ inventory_hostname }}
          ({{ _nm_api_host }}:{{ _nm_api_port }}) did not respond after 60s.
          ALL post-bootstrap operations require the NM API. INVESTIGATE:
          1. Is kiosk CT {{ kiosk_ct_id }} running? → pct status {{ kiosk_ct_id }}
          2. Is kiosk-web service active? → pct exec {{ kiosk_ct_id }} -- systemctl status kiosk-web
          3. Is port 9001 listening? → pct exec {{ kiosk_ct_id }} -- ss -tlnp | grep 9001
          4. For LAN hosts: is the NM relay service active? → systemctl status nm-relay-{{ inventory_hostname }}
          5. Can you reach the NM directly? → curl -s http://{{ _nm_api_host }}:{{ _nm_api_port }}/api/images/versions

# ══════════════════════════════════════════════════════════════════
# Phase 2: API-driven operations (post-bootstrap)
# ══════════════════════════════════════════════════════════════════
# All NMs are verified running. VPN + NM bootstrap complete.
# Service provisioning and configuration uses NM APIs over VPN.
# WireGuard provisions first — VPN IPs needed for cross-host access.
# All containers boot in parallel, then fleet readiness gate waits.

- name: Provision WireGuard LXC
  hosts: vpn_nodes
  gather_facts: false
  tags: [wireguard]
  roles:
    - wireguard_lxc
    - role: deploy_stamp
      vars:
        deploy_stamp_play: wireguard_lxc

- name: Provision Pi-hole LXC (API-driven)
  hosts: dns_nodes
  gather_facts: false
  tags: [pihole]
  roles:
    - pihole_lxc
    - role: deploy_stamp
      vars:
        deploy_stamp_play: pihole_lxc

- name: Provision rsyslog LXC
  hosts: monitoring_nodes
  gather_facts: false
  tags: [monitoring]
  roles:
    - rsyslog_lxc
    - role: deploy_stamp
      vars:
        deploy_stamp_play: rsyslog_lxc

- name: Provision Netdata LXC
  hosts: monitoring_nodes
  gather_facts: false
  tags: [monitoring]
  roles:
    - netdata_lxc
    - role: deploy_stamp
      vars:
        deploy_stamp_play: netdata_lxc

- name: Provision Home Assistant LXC
  hosts: service_nodes
  gather_facts: false
  tags: [homeassistant]
  roles:
    - homeassistant_lxc
    - role: deploy_stamp
      vars:
        deploy_stamp_play: homeassistant_lxc

- name: Provision Jellyfin LXC
  hosts: media_nodes
  gather_facts: false
  tags: [media]
  roles:
    - jellyfin_lxc
    - role: deploy_stamp
      vars:
        deploy_stamp_play: jellyfin_lxc

- name: Provision Kodi LXC
  hosts: media_nodes
  gather_facts: false
  tags: [media]
  roles:
    - kodi_lxc
    - role: deploy_stamp
      vars:
        deploy_stamp_play: kodi_lxc

- name: Provision Moonlight LXC
  hosts: streaming_nodes
  gather_facts: false
  tags: [moonlight]
  roles:
    - moonlight_lxc
    - role: deploy_stamp
      vars:
        deploy_stamp_play: moonlight_lxc

- name: Provision OpenWrt Mesh LXC
  hosts: wifi_nodes:!router_nodes
  gather_facts: false
  tags: [mesh-wifi]
  roles:
    - openwrt_mesh_lxc
    - role: deploy_stamp
      vars:
        deploy_stamp_play: openwrt_mesh_lxc

- name: Provision WiFi Bridge LXC
  hosts: bridge_nodes
  gather_facts: false
  tags: [bridge]
  max_fail_percentage: 100
  roles:
    - openwrt_bridge_lxc
    - role: deploy_stamp
      vars:
        deploy_stamp_play: openwrt_bridge_lxc

- name: Provision Desktop LXC
  hosts: desktop_nodes
  gather_facts: false
  tags: [desktop]
  roles:
    - desktop_lxc
    - role: deploy_stamp
      vars:
        deploy_stamp_play: desktop_lxc

- name: Provision Gaming LXC
  hosts: gaming_nodes
  gather_facts: true
  tags: [gaming]
  roles:
    - gaming_lxc
    - role: deploy_stamp
      vars:
        deploy_stamp_play: gaming_lxc

# ── Post-provision callhome rewrite ─────────────────────────────────
# kiosk_configure runs its sibling callhome rewrite BEFORE other
# services are provisioned (they get 404). Re-run the rewrite now
# that all containers exist and are running.
- name: Post-provision callhome rewrite
  hosts: kiosk_nodes
  gather_facts: false
  tags: [pihole, monitoring, homeassistant, media, moonlight, wireguard, kiosk, gaming]
  tasks:
    - name: Rewrite callhome on all Debian siblings
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/post_provision_callhome.yml"

# ── Fleet readiness gate (hard-fail, no SSH fallback) ─────────────
# All containers have been provisioned and started. Wait for the
# heartbeat system to confirm readiness. If any service fails to
# heartbeat, that IS the failure — no SSH fallback.

- name: Fleet readiness gate (pre-configure)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [pihole, monitoring, homeassistant, media, moonlight, wireguard, kiosk, gaming]
  tasks:
    - name: Query fleet readiness from API
      ansible.builtin.uri:
        url: >-
          {{ callhome_server_local }}/api/fleet/ready?services={{
            fleet_ready_services | join(',')
          }}
        return_content: true
      register: _pre_configure_ready
      retries: 12
      delay: 3
      until: >-
        (_pre_configure_ready.json.services | default({}) | dict2items
         | rejectattr('value.status', 'equalto', 'unknown')
         | selectattr('value.ready', 'equalto', false)
         | list | length == 0)
        and
        (_pre_configure_ready.json.services | default({}) | dict2items
         | rejectattr('value.status', 'equalto', 'unknown')
         | list | length > 0)

    - name: Report services that were never provisioned (unreachable hosts)
      ansible.builtin.debug:
        msg: >-
          Skipping fleet check for unprovisioned services (host unreachable):
          {{ _pre_configure_ready.json.services | dict2items
             | selectattr('value.status', 'equalto', 'unknown')
             | map(attribute='key') | list | join(', ') }}
      when: >-
        (_pre_configure_ready.json.services | default({}) | dict2items
         | selectattr('value.status', 'equalto', 'unknown')
         | list | length > 0)

    - name: Hard-fail if any provisioned service is not ready
      ansible.builtin.assert:
        that: >-
          (_pre_configure_ready.json.services | default({}) | dict2items
           | rejectattr('value.status', 'equalto', 'unknown')
           | selectattr('value.ready', 'equalto', false)
           | list | length == 0)
        fail_msg: >-
          HARD FAILURE: Fleet not ready after 36s. Services not heartbeating: {{
            _pre_configure_ready.json.services | dict2items
            | rejectattr('value.status', 'equalto', 'unknown')
            | selectattr('value.ready', 'equalto', false)
            | map(attribute='key') | list | join(', ')
          }}. There is NO SSH fallback — the heartbeat system IS the verification path.
          INVESTIGATE:
          1. Check which containers are not heartbeating: curl {{ callhome_server_local }}/api/fleet/ready?services={{ fleet_ready_services | join(',') }}
          2. For each missing service, check if the container is running on its host
          3. Check callhome service inside the container: systemctl status callhome
          4. Check if callhome can reach the Node Manager: /etc/default/callhome has CALLHOME_SERVER set
          5. Check the Node Manager relay chain: Container → NM → CM → SM

# ── Service configuration (API-driven) ────────────────────────────
# WireGuard configured first — VPN tunnel must be up before any
# cross-host display proxy can target VPN IPs.
# All containers confirmed ready via heartbeat API. Configure plays
# apply host-specific settings via NM API calls.
#
# WireGuard uses hub-spoke: home's container is the hub (ListenPort
# 51820), all others are clients connecting to it. The hub needs
# every client's public key, so configure runs on ALL hosts at once
# (no serial). Key generation + peer list assembly + config
# templating all happen within the role.

- name: Configure WireGuard (API-driven)
  hosts: vpn_nodes
  gather_facts: false
  tags: [wireguard]
  roles:
    - wireguard_configure

# ── VPN host-side routing ──────────────────────────────────────
# Each Proxmox host needs a route to the VPN subnet (10.0.0.0/24)
# through its local WireGuard container. This lets host-level socat
# proxies reach any peer via VPN IP — one path for all topologies.
- name: Configure VPN routing on Proxmox hosts
  hosts: vpn_nodes
  gather_facts: false
  tags: [wireguard]
  tasks:
    - name: Get WireGuard container IP from pct config
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          pct config {{ wireguard_ct_id }} | awk -F'[=,/]' '/^net0:/{for(i=1;i<=NF;i++) if($i~"ip") print $(i+1)}'
        executable: /bin/bash
      register: _wg_ct_ip
      changed_when: false

    - name: Add VPN subnet route via WireGuard container
      ansible.builtin.command:
        cmd: ip route replace {{ vpn_subnet }} via {{ _wg_ct_ip.stdout | trim }}
      changed_when: true
      when: _wg_ct_ip.stdout | trim | length > 0

    - name: Export host VPN IP fact
      ansible.builtin.set_fact:
        host_vpn_ip: "{{ vpn_ip }}"
        cacheable: true

# ── Controller VPN (wg0 on the build/test machine) ──────────────
# The SuperManager resolves display URLs via VPN IPs. The controller
# needs a wg0 interface to reach those IPs. All keys are already in
# env.generated (controller keypair from prepare.yml, hub pubkey from
# wireguard_configure). This play reads them and brings up wg0.
- name: Configure controller VPN tunnel
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [wireguard]
  tasks:
    - name: Read controller private key from env.generated (fallback)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          grep '^WIREGUARD_PRIVATE_KEY_CONTROLLER=' "{{ env_generated_path }}" 2>/dev/null | cut -d= -f2-
        executable: /bin/bash
      register: _ctrl_privkey_file
      changed_when: false
      failed_when: false

    - name: Read hub public key from env.generated (fallback)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          grep '^WIREGUARD_HUB_PUBLIC_KEY=' "{{ env_generated_path }}" 2>/dev/null | cut -d= -f2-
        executable: /bin/bash
      register: _hub_pubkey_file
      changed_when: false
      failed_when: false

    - name: Resolve VPN keys (env var → file fallback)
      vars:
        _raw_ctrl: "{{ lookup('env', 'WIREGUARD_PRIVATE_KEY_CONTROLLER') | default('', true) }}"
        _raw_hub: "{{ lookup('env', 'WIREGUARD_HUB_PUBLIC_KEY') | default('', true) }}"
        _env_ctrl: "{{ _raw_ctrl if (_raw_ctrl | length == 44 and '$' not in _raw_ctrl) else '' }}"
        _env_hub: "{{ _raw_hub if (_raw_hub | length == 44 and '$' not in _raw_hub) else '' }}"
        _file_ctrl: "{{ _ctrl_privkey_file.stdout | default('') | trim }}"
        _file_hub: "{{ _hub_pubkey_file.stdout | default('') | trim }}"
      ansible.builtin.set_fact:
        _ctrl_privkey: "{{ (_env_ctrl if _env_ctrl | length > 0 else _file_ctrl) | trim }}"
        _hub_pubkey: "{{ (_env_hub if _env_hub | length > 0 else _file_hub) | trim }}"
        _server_endpoint: "{{ lookup('env', 'WIREGUARD_SERVER_ENDPOINT') | default('', true) }}"
        _ctrl_ip: "{{ lookup('env', 'CONTROLLER_VPN_IP') | default('10.0.0.7', true) }}"

    - name: Skip if controller keys not yet generated
      ansible.builtin.meta: end_play
      when: >-
        _ctrl_privkey | length != 44
        or '$' in _ctrl_privkey
        or _hub_pubkey | length != 44
        or '$' in _hub_pubkey

    - name: Ensure wireguard config directory exists
      ansible.builtin.command:
        cmd: sudo install -d -m 700 /etc/wireguard
      changed_when: false

    - name: Write controller wg0 configuration
      ansible.builtin.shell:
        cmd: |
          sudo install -m 600 /dev/stdin /etc/wireguard/wg0.conf << 'WGEOF'
          [Interface]
          PrivateKey = {{ _ctrl_privkey }}
          Address = {{ _ctrl_ip }}/24

          [Peer]
          PublicKey = {{ _hub_pubkey }}
          Endpoint = {{ _server_endpoint }}
          AllowedIPs = 10.0.0.0/24
          PersistentKeepalive = 25
          WGEOF
      changed_when: true

    - name: Check if wg0 interface exists
      ansible.builtin.command:
        cmd: ip link show wg0
      register: _wg0_exists
      changed_when: false
      failed_when: false

    - name: Bring up wg0 if not running
      ansible.builtin.command:
        cmd: sudo wg-quick up wg0
      changed_when: true
      when: _wg0_exists.rc != 0

    - name: Sync wg0 config if already running
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          if [ -f /etc/wireguard/wg0.conf ]; then
            sudo wg syncconf wg0 <(sudo wg-quick strip wg0)
          fi
        executable: /bin/bash
      changed_when: true
      when: _wg0_exists.rc == 0

    - name: Verify wg0 is up
      ansible.builtin.command:
        cmd: sudo wg show wg0
      changed_when: false

    - name: Wait for WireGuard handshakes to establish
      ansible.builtin.pause:
        seconds: 5

# ── VPN NM reachability gate ─────────────────────────────────────
# Controller VPN is up. Verify all NMs are reachable via VPN IPs.
# This confirms the VPN tunnel is functional for API-driven config.

- name: NM reachability via VPN (post-WireGuard)
  hosts: kiosk_nodes
  gather_facts: false
  tags: [wireguard, kiosk]
  tasks:
    - name: Verify NM reachable via host proxy
      ansible.builtin.uri:
        url: >-
          http://{{ nm_api_host | default(ansible_host) }}:{{
          nm_api_port | default(kiosk_manager_port) }}/api/health
        return_content: true
        timeout: 10
      register: _nm_vpn_ready
      retries: 6
      delay: 5
      until: (_nm_vpn_ready.status | default(0)) == 200
      delegate_to: localhost

    - name: Assert NM reachable
      ansible.builtin.assert:
        that: (_nm_vpn_ready.status | default(0)) == 200
        fail_msg: >-
          HARD FAILURE: Node Manager on {{ inventory_hostname }}
          not reachable after 30s. All configure plays route through NM API.
          INVESTIGATE:
          1. Is kiosk container running? → pct status {{ kiosk_ct_id }}
          2. Is socat proxy running? → systemctl status kiosk-manager-proxy
          3. Is kiosk-web running? → pct exec {{ kiosk_ct_id }} -- systemctl status kiosk-web
          5. Check DNAT rules in WireGuard CT: pct exec {{ wireguard_ct_id }} -- iptables -t nat -S
          6. Is the hub AllowedIPs correct? Hub config should have {{ vpn_ip }}/32

