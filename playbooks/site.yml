        deploy_stamp_play: netdata_lxc

- name: Configure Netdata
  hosts: monitoring_nodes
  gather_facts: false
  tags: [monitoring]
  tasks:
    - name: Check netdata service health inside container
      ansible.builtin.command:
        cmd: pct exec {{ netdata_ct_id }} -- systemctl is-active netdata
      register: _netdata_check
      changed_when: false
      failed_when: false
      retries: 10
      delay: 3
      until: _netdata_check.stdout | trim == 'active'

    - name: Report netdata status
      ansible.builtin.debug:
        msg: >-
          Netdata on {{ inventory_hostname }}: {{ _netdata_check.stdout | trim }},
          streaming=disabled (local dashboard only)

