# ── Attach display-exclusive hookscripts (post-configure) ────────
# Hookscripts are deployed by kiosk_lxc but not attached until after
# all configure plays finish. Attaching during provisioning would stop
# DRI containers (Kodi, Moonlight, Kiosk) when the Desktop VM starts,
# breaking their configure plays.

- name: Attach display-exclusive hookscripts
  hosts: desktop_nodes
  gather_facts: false
  tags: [kiosk, desktop, media, moonlight]
  tasks:
    - name: Check display-exclusive hookscript exists
      ansible.builtin.stat:
        path: /var/lib/vz/snippets/display-exclusive.sh
      register: _hookscript_exists

    - name: Attach hookscript to display containers
      ansible.builtin.command:
        cmd: pct set {{ item }} --hookscript local:snippets/display-exclusive.sh
      loop:
        - "{{ kiosk_ct_id }}"
        - "{{ kodi_ct_id }}"
        - "{{ moonlight_ct_id }}"
      loop_control:
        label: "CT {{ item }}"
      register: _attach_ct
      failed_when: false
      changed_when: _attach_ct.rc == 0
      when: _hookscript_exists.stat.exists | default(false)

    - name: Attach hookscript to Desktop VM
      ansible.builtin.command:
        cmd: qm set {{ desktop_vm_id }} --hookscript local:snippets/display-exclusive.sh
      register: _attach_vm
      failed_when: false
      changed_when: _attach_vm.rc == 0
      when: _hookscript_exists.stat.exists | default(false)

# ── Heartbeat circuit breaker (post-configure) ──────────────────
# All configure plays have run. Verify that every container that was
# healthy at the Phase 3b gate is still heartbeating. If any
# previously-healthy service has gone stale, abort immediately.

- name: Heartbeat circuit breaker (post-configure)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [pihole, monitoring, homeassistant, media, moonlight, wireguard, kiosk, gaming, mesh-wifi, bridge]
  tasks:
    - name: Run heartbeat staleness check
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/fleet_heartbeat_gate.yml"
      vars:
        gate_services: "{{ fleet_monitored_services }}"
        gate_max_age_seconds: 180
      when: callhome_server | default('') | length > 0

# ── Configure callhome agents on all LXC containers ──────────────

- name: Configure callhome on LXC containers
  hosts: proxmox
  gather_facts: false
  tags: [kiosk, pihole, monitoring, homeassistant, media, moonlight, wireguard, gaming, mesh-wifi, bridge]
  tasks:
    - name: Detect kiosk container IP for local Manager
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          pct config {{ kiosk_ct_id }} 2>/dev/null | grep -oP 'ip=\K[^/]+' | head -1
        executable: /bin/bash
      register: _kiosk_ip_result
      changed_when: false
      failed_when: false

    - name: Write callhome config to each running container
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          KIOSK_IP="{{ _kiosk_ip_result.stdout | default('') | trim }}"
          KIOSK_CTID="{{ kiosk_ct_id }}"
          if [ -n "$KIOSK_IP" ]; then
            CALLHOME_TARGET="http://${KIOSK_IP}:{{ kiosk_manager_port | default('9001') }}"
          else
            CALLHOME_TARGET="{{ callhome_server }}"
          fi
          CALLHOME_KEY="{{ callhome_public_key }}"
          for ctid in $(pct list 2>/dev/null | awk 'NR>1 && $2=="running" {print $1}'); do
            # Skip the kiosk container — it IS the Manager
            [ "$ctid" = "$KIOSK_CTID" ] && continue
            # Debian containers (Python callhome agent + systemd)
            pct exec "$ctid" -- bash -c "
              [ -d /opt/callhome ] || exit 0
              cat > /etc/default/callhome << EOF
          CALLHOME_SERVER=$CALLHOME_TARGET
          CALLHOME_PUBLIC_KEY=$CALLHOME_KEY
          EOF
              PROBES=''
              [ -x /usr/bin/jellyfin ] && PROBES='http://127.0.0.1:8096'
              [ -f /usr/share/netdata/web/index.html ] && PROBES='http://127.0.0.1:19999'
              [ -x /usr/bin/pihole-FTL ] && PROBES='http://127.0.0.1/admin/'
              [ -x /usr/bin/sunshine ] && PROBES='https://127.0.0.1:47990'
              command -v docker >/dev/null 2>&1 && [ -f /opt/homeassistant/config/docker-compose.yml ] && PROBES='http://127.0.0.1:8123'
              [ -n \"\$PROBES\" ] && echo \"CALLHOME_HTTP_PROBES=\$PROBES\" >> /etc/default/callhome
              systemctl restart callhome.service 2>/dev/null || true
            " 2>/dev/null || true
            # OpenWrt containers (shell callhome agent + cron)
            pct exec "$ctid" -- sh -c "
              [ -x /usr/sbin/callhome.sh ] || exit 0
              [ -d /opt/callhome ] && exit 0
              CT_HOSTNAME=\$(hostname 2>/dev/null || echo unknown)
              cat > /etc/default/callhome << EOF
          CALLHOME_SERVER=$CALLHOME_TARGET
          CALLHOME_PUBLIC_KEY=$CALLHOME_KEY
          CALLHOME_CONTAINER=\$CT_HOSTNAME
          EOF
              /etc/init.d/cron restart 2>/dev/null || true
            " 2>/dev/null || true
          done
        executable: /bin/bash
      changed_when: true
      failed_when: false

# ── Kiosk config refresh (populate service URLs discovered above) ──

- name: Refresh Kiosk Config
  hosts: kiosk_nodes
  gather_facts: false
  tags: [kiosk]
  roles:
    - kiosk_configure

- name: Redistribute Cluster Manager SSH key (post-refresh)
  hosts: kiosk_nodes
  gather_facts: false
  tags: [kiosk]
  tasks:
    - name: Read Cluster Manager public key
      ansible.builtin.command:
        cmd: pct exec {{ kiosk_ct_id }} -- cat /home/kiosk/.ssh/id_ed25519.pub
      register: _cm_pubkey
      changed_when: false
      when: inventory_hostname in groups.get('router_nodes', [])

    - name: Set Cluster Manager key fact
      ansible.builtin.set_fact:
        _cluster_manager_pubkey: "{{ hostvars[groups['router_nodes'][0]]._cm_pubkey.stdout }}"
      when: groups.get('router_nodes', []) | length > 0

    - name: Authorize Cluster Manager key on this host
      ansible.posix.authorized_key:
        user: root
        key: "{{ _cluster_manager_pubkey }}"
        comment: "cluster-manager-{{ groups['router_nodes'][0] }}"
        state: present
      when:
        - _cluster_manager_pubkey is defined
        - _cluster_manager_pubkey | length > 0
        - inventory_hostname not in groups.get('router_nodes', [])

