# ── WiFi Bridge Link Negotiation ────────────────────────────────
# Collects WiFi capabilities from both bridge endpoints and runs
# the Python negotiation module to determine optimal shared band,
# channel, and htmode. Results stored as hostvars on bridge_nodes
# for consumption by openwrt_bridge_configure.

- name: Negotiate WiFi bridge link parameters
  hosts: bridge_nodes
  gather_facts: false
  tags: [bridge]
  max_fail_percentage: 100
  tasks:
    - name: Run WiFi negotiation
      ansible.builtin.include_tasks:
        file: "{{ project_root }}/tasks/negotiate_wifi_bridge.yml"

- name: Reconstruct WiFi bridge group (in case provision was skipped)
  hosts: bridge_nodes
  gather_facts: false
  tags: [bridge]
  max_fail_percentage: 100
  tasks:
    - name: Check if openwrt_bridge group is already populated
      ansible.builtin.set_fact:
        _bridge_group_exists: "{{ groups['openwrt_bridge'] | default([]) | length > 0 }}"
      run_once: true

    - name: Reconstruct bridge group from existing containers
      ansible.builtin.include_tasks: "{{ project_root }}/tasks/reconstruct_bridge_group.yml"
      when: not (_bridge_group_exists | bool)

- name: Configure WiFi Bridge
  hosts: openwrt_bridge
  gather_facts: false
  tags: [bridge]
  max_fail_percentage: 100
  roles:
    - openwrt_bridge_configure

