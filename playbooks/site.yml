---
# ══════════════════════════════════════════════════════════════════
# site.yml — Full deployment: base state + all services
# ══════════════════════════════════════════════════════════════════
# This is a thin wrapper that imports base.yml and services.yml in
# order. The two layers are independently testable:
#
#   molecule test -s base       → validates base state only
#   molecule test -s default    → validates base + services (this file)
#
# Base state (base.yml):
#   Infra, OpenWrt, LAN bootstrap, Kiosk/NM, WireGuard VPN
#
# Services (services.yml):
#   Pi-hole, rsyslog, Netdata, Home Assistant, Jellyfin, Kodi,
#   Moonlight, Mesh WiFi, Bridge, Desktop, Gaming, per-feature
#   OpenWrt config, hookscripts, circuit breakers
#
# Skip base when it's already established:
#   ansible-playbook playbooks/services.yml
#   (has built-in gate that validates base prerequisites)

- name: Base state
  ansible.builtin.import_playbook: base.yml

- name: Services
  ansible.builtin.import_playbook: services.yml
