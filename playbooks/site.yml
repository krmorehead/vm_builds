# ── Phase 3b: Fleet readiness gate ────────────────────────────────
# All containers have been created and started. Wait for them to
# report ready via the callhome API before running configure plays.
# This replaces per-service sequential waiting with a single
# aggregate check, allowing containers to boot in parallel.

- name: Fleet readiness gate (pre-configure)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [pihole, monitoring, homeassistant, media, moonlight, wireguard, kiosk, gaming]
  tasks:
    - name: Query fleet readiness from API
      ansible.builtin.uri:
        url: >-
          {{ callhome_server_local }}/api/fleet/ready?services={{
            fleet_ready_services | join(',')
          }}
        return_content: true
      register: _pre_configure_ready
      retries: 24
      delay: 5
      until: (_pre_configure_ready.json.all_ready | default(false)) | bool
      failed_when: false
      when: callhome_server | default('') | length > 0

    - name: Report fleet readiness
      ansible.builtin.debug:
        msg: >-
          Pre-configure fleet gate:
          {{ 'ALL READY — proceeding to configure phase'
             if (_pre_configure_ready.json.all_ready | default(false)) | bool
             else 'Some services not ready — configures will use SSH fallback' }}

    - name: Report stale services
      ansible.builtin.debug:
        msg: >-
          Not ready: {{
            _pre_configure_ready.json.services | dict2items
            | selectattr('value.ready', 'equalto', false)
            | map(attribute='key') | list | join(', ')
          }}
      when:
        - _pre_configure_ready.json is defined
        - not (_pre_configure_ready.json.all_ready | default(false)) | bool

