- name: Reconstruct openwrt group for syslog forwarding
  hosts: router_nodes
  gather_facts: true
  tags:
    - openwrt-syslog
    - openwrt-syslog-rollback
  tasks:
    - name: Include group reconstruction
      ansible.builtin.include_tasks: "{{ project_root }}/tasks/reconstruct_openwrt_group.yml"

- name: Apply syslog forwarding to OpenWrt
  hosts: openwrt
  gather_facts: false
  tags: [openwrt-syslog]
  tasks:
    - name: Include syslog tasks
      ansible.builtin.include_role:
        name: openwrt_configure
        tasks_from: syslog.yml

- name: Record syslog forwarding
