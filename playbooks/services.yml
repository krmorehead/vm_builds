  tags: [monitoring]
  roles:
    - netdata_lxc
    - role: deploy_stamp
      vars:
        deploy_stamp_play: netdata_lxc

- name: Provision Home Assistant LXC
  hosts: service_nodes
  gather_facts: false
  tags: [homeassistant]
  roles:
    - homeassistant_lxc
    - role: deploy_stamp
      vars:
        deploy_stamp_play: homeassistant_lxc

- name: Provision Jellyfin LXC
  hosts: media_nodes
  gather_facts: false
  tags: [media]
  roles:
    - jellyfin_lxc
