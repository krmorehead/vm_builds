---
# ══════════════════════════════════════════════════════════════════
# SERVICES LAYER: All services that build on top of base state
# ══════════════════════════════════════════════════════════════════
# Requires base state to be established first (infra, OpenWrt, LAN,
# Kiosk/NM, WireGuard VPN). All plays here use NM APIs via VPN.
#
# Run independently: molecule converge -s default (after base passes)
# Run as part of full deploy: molecule test -s default (imports site.yml)
#
# The base state gate at the top validates prerequisites. When called
# from site.yml (which runs base.yml first), the gate always passes.
# When called standalone, it confirms that:
#   - Controller has wg0 up
#   - All Node Manager APIs are responding
#   - All WireGuard tunnels have active handshakes
#   - Fleet health API is available

# ── Base state prerequisite gate ────────────────────────────────
- name: Validate base state prerequisites
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Check base state
      ansible.builtin.include_tasks: "{{ project_root }}/tasks/base_state_gate.yml"

    - name: Fail if base state is not established
      ansible.builtin.assert:
        that: _base_state_valid | bool
        fail_msg: >-
          HARD FAILURE: Base state is not established.
          {{ _base_state_details | to_nice_json }}
          Run base.yml first: molecule converge -s base
          Or run the full pipeline: molecule test -s default

# ── SM liveness gate (pre-provision) ──────────────────────────────
# The SM IS the heartbeat. If it's dead, nothing else matters.
# This check takes <1 second. No retries. No fallbacks.

- name: "SM liveness gate: pre-provision"
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [pihole, monitoring, homeassistant, media, moonlight, wireguard, kiosk, gaming, mesh-wifi, bridge, desktop]
  tasks:
    - name: Assert SM is alive before provisioning
      ansible.builtin.include_tasks: "{{ project_root }}/tasks/sm_liveness_gate.yml"

# ── Service provisioning (API-driven via NM) ──────────────────────
# All NMs are verified running and VPN is up. Service provisioning
# and configuration uses NM APIs. Containers boot in parallel, then
# fleet readiness gate waits for heartbeats.

- name: Provision Pi-hole LXC (API-driven)
  hosts: dns_nodes
  gather_facts: false
  tags: [pihole]
  roles:
    - pihole_lxc
    - role: deploy_stamp
      vars:
        deploy_stamp_play: pihole_lxc

- name: Provision rsyslog LXC
