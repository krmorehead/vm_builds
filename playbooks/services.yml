  gather_facts: false
  tags: [openwrt-security]
  tasks:
    - name: Apply security hardening
      ansible.builtin.include_role:
        name: openwrt_configure
        tasks_from: security.yml

- name: Record security hardening
  hosts: router_nodes
  gather_facts: false
  tags: [openwrt-security]
  roles:
    - role: deploy_stamp
