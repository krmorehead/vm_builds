# ── WiFi Bridge Link Negotiation ────────────────────────────────
# Collects WiFi capabilities from both bridge endpoints and runs
# the Python negotiation module to determine optimal shared band,
# channel, and htmode. Results stored as hostvars on bridge_nodes
# for consumption by openwrt_bridge_configure.

- name: Negotiate WiFi bridge link parameters
  hosts: bridge_nodes
  gather_facts: false
  tags: [bridge]
  max_fail_percentage: 100
  tasks:
    - name: Run WiFi negotiation
      ansible.builtin.include_tasks:
        file: "{{ project_root }}/tasks/negotiate_wifi_bridge.yml"

- name: Reconstruct WiFi bridge group (in case provision was skipped)
  hosts: bridge_nodes
  gather_facts: false
  tags: [bridge]
  max_fail_percentage: 100
  tasks:
    - name: Check if openwrt_bridge group is already populated
      ansible.builtin.set_fact:
        _bridge_group_exists: "{{ groups['openwrt_bridge'] | default([]) | length > 0 }}"
      run_once: true

    - name: Reconstruct bridge group from existing containers
      ansible.builtin.include_tasks: "{{ project_root }}/tasks/reconstruct_bridge_group.yml"
      when: not (_bridge_group_exists | bool)

- name: Configure WiFi Bridge
  hosts: openwrt_bridge
  gather_facts: false
  tags: [bridge]
  max_fail_percentage: 100
  roles:
    - openwrt_bridge_configure

- name: Configure Desktop LXC (API-driven)
  hosts: desktop_nodes
  gather_facts: false
  tags: [desktop]
  roles:
    - desktop_configure

- name: Configure Gaming LXC (API-driven)
  hosts: gaming_nodes
  gather_facts: false
  tags: [gaming]
  roles:
    - gaming_lxc_configure

# ── Attach display-exclusive hookscripts (post-configure) ────────
# Hookscripts are deployed by kiosk_lxc but not attached until after
# all configure plays finish. The kiosk is NOT a display-exclusive app
# (it uses headless rendering and stays alive during display launches).

- name: Attach display-exclusive hookscripts
  hosts: desktop_nodes
  gather_facts: false
  tags: [kiosk, desktop, media, moonlight]
  tasks:
    - name: Check display-exclusive hookscript exists
      ansible.builtin.stat:
        path: /var/lib/vz/snippets/display-exclusive.sh
      register: _hookscript_exists

    - name: Attach hookscript to display containers
      ansible.builtin.command:
        cmd: pct set {{ item }} --hookscript local:snippets/display-exclusive.sh
      loop:
        - "{{ kodi_ct_id }}"
        - "{{ moonlight_ct_id }}"
        - "{{ desktop_ct_id }}"
      loop_control:
        label: "CT {{ item }}"
      register: _attach_ct
      failed_when: false
      changed_when: _attach_ct.rc == 0
      when: _hookscript_exists.stat.exists | default(false)

# ── Heartbeat circuit breaker (post-configure) ──────────────────
# All configure plays have run. Verify that every container that was
# healthy at the Phase 3b gate is still heartbeating. If any
# previously-healthy service has gone stale, abort immediately.

- name: Heartbeat circuit breaker (post-configure)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [pihole, monitoring, homeassistant, media, moonlight, wireguard, kiosk, gaming, mesh-wifi, bridge]
  tasks:
    - name: Run heartbeat staleness check
      ansible.builtin.include_tasks: "{{ project_root }}/tasks/fleet_heartbeat_gate.yml"
      vars:
        gate_services: "{{ fleet_monitored_services }}"
        gate_max_age_seconds: 180
      when: callhome_server | default('') | length > 0

# Callhome sibling rewrite is now baked into kiosk_configure. No separate
# "Configure callhome on LXC containers" play needed — kiosk_configure
# rewrites all sibling containers on each host during its run, using sed
# to preserve baked CALLHOME_HTTP_PROBES.

# ── Kiosk config refresh (populate service URLs + callhome rewrite) ──

- name: Refresh Kiosk Config
  hosts: kiosk_nodes
  gather_facts: false
  tags: [kiosk, pihole, monitoring, homeassistant, media, moonlight, wireguard, gaming, mesh-wifi, bridge]
  roles:
    - kiosk_configure

# ── LAN display relays (router → LAN hosts) ──────────────────────
# LAN hosts are unreachable from the operator's browser. The router
# node relays KasmVNC traffic at offset ports (base + 100) to each
# LAN host's display services.
- name: Deploy LAN display relays
  hosts: router_nodes
  gather_facts: false
  tags: [kiosk]
  tasks:
    - name: Deploy LAN display relay services
      ansible.builtin.include_tasks: "{{ project_root }}/tasks/lan_display_relay.yml"
      when: groups.get('lan_hosts', []) | length > 0

# ── Per-feature plays ────────────────────────────────────────────
# The openwrt dynamic group's SSH connection goes stale during the 20+
# min of service plays. Reconstruct the group with fresh SSH args
# before the first per-feature play.

- name: Reconstruct openwrt group for per-feature plays
  hosts: router_nodes
  gather_facts: true
  tags:
    - openwrt-security
    - openwrt-vlans
    - openwrt-dns
    - openwrt-mesh
  tasks:
    - name: Include group reconstruction
      ansible.builtin.include_tasks: "{{ project_root }}/tasks/reconstruct_openwrt_group.yml"

