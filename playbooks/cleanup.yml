# ── Per-feature rollback: OpenWrt syslog forwarding ──────────────

- name: Rollback OpenWrt syslog forwarding
  hosts: openwrt
  gather_facts: false
  tags: [openwrt-syslog-rollback, never]
  tasks:
    - name: Remove syslog remote settings
      ansible.builtin.raw: |
        uci delete system.@system[0].log_ip 2>/dev/null
        uci delete system.@system[0].log_port 2>/dev/null
        uci delete system.@system[0].log_proto 2>/dev/null
        uci commit system
        /etc/init.d/log restart
      changed_when: true

