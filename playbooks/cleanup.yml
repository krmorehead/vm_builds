# ── Per-feature rollback: Gaming VM (legacy Windows build) ─────

- name: Rollback Gaming VM
  hosts: gaming_nodes
  gather_facts: false
  tags: [gaming-vm-rollback]
  tasks:
    - name: Skip unless rollback requested
      ansible.builtin.meta: end_play
      when: not (rollback | default(false) | bool)

    - name: Compute per-host VMID for Gaming VM
      ansible.builtin.set_fact:
        _gaming_rollback_id: "{{ (gaming_vm_id | int) + groups['gaming_nodes'].index(inventory_hostname) }}"

    - name: Stop and destroy Gaming VM
      ansible.builtin.shell:
        cmd: |
          qm stop {{ _gaming_rollback_id }} 2>/dev/null || true
          sleep 3
          qm destroy {{ _gaming_rollback_id }} --purge 2>/dev/null || true
        executable: /bin/bash
      changed_when: true

    - name: Find all vfio-pci bound devices
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ls /sys/bus/pci/drivers/vfio-pci/ 2>/dev/null | grep '^0000:' || true
        executable: /bin/bash
      register: _gaming_vfio_devs
      changed_when: false
      failed_when: false

    - name: Restore vfio-pci devices to native drivers
      ansible.builtin.shell:
        cmd: |
          pci_addr="{{ item }}"
          echo "$pci_addr" > /sys/bus/pci/drivers/vfio-pci/unbind 2>/dev/null || true
          echo "" > "/sys/bus/pci/devices/${pci_addr}/driver_override" 2>/dev/null || true
        executable: /bin/bash
      loop: "{{ _gaming_vfio_devs.stdout_lines | default([]) }}"
      when: _gaming_vfio_devs.stdout | trim | length > 0
      changed_when: true
      failed_when: false

    - name: Rescan PCI bus to auto-bind native drivers
      ansible.builtin.shell:
        cmd: echo 1 > /sys/bus/pci/rescan
        executable: /bin/bash
      changed_when: true
      failed_when: false

    - name: Remove hookscript state files
      ansible.builtin.shell:
        cmd: rm -f /run/gpu-passthrough/vm-*.state
        executable: /bin/bash
      changed_when: true
      failed_when: false

    - name: Remove GPU hookscript
      ansible.builtin.file:
        path: /var/lib/vz/snippets/gpu-passthrough-hook.sh
        state: absent

