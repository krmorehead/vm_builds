  hosts: gaming_nodes
  gather_facts: false
  tags: [gaming-lxc-rollback, never]
  tasks:
    - name: Check if Gaming LXC container exists
      ansible.builtin.command:
        cmd: pct status {{ gaming_ct_id }}
      register: _gaming_rollback_status
      failed_when: false
      changed_when: false

    - name: Stop and destroy Gaming LXC container
      ansible.builtin.shell:
        cmd: |
          pct stop {{ gaming_ct_id }} 2>/dev/null || true
          sleep 3
          pct destroy {{ gaming_ct_id }} --purge 2>/dev/null || true
        executable: /bin/bash
      when: _gaming_rollback_status.rc == 0
      changed_when: true

# ── Per-feature rollback: Gaming VM (legacy Windows build) ─────

- name: Rollback Gaming VM
  hosts: gaming_nodes
  gather_facts: false
  tags: [gaming-vm-rollback, never]
  tasks:
    - name: Compute per-host VMID for Gaming VM
      ansible.builtin.set_fact:
        _gaming_rollback_id: "{{ (gaming_vm_id | int) + groups['gaming_nodes'].index(inventory_hostname) }}"

    - name: Stop and destroy Gaming VM
      ansible.builtin.shell:
        cmd: |
          qm stop {{ _gaming_rollback_id }} 2>/dev/null || true
          sleep 3
          qm destroy {{ _gaming_rollback_id }} --purge 2>/dev/null || true
        executable: /bin/bash
      changed_when: true

    - name: Find all vfio-pci bound devices
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ls /sys/bus/pci/drivers/vfio-pci/ 2>/dev/null | grep '^0000:' || true
        executable: /bin/bash
      register: _gaming_vfio_devs
      changed_when: false
      failed_when: false

    - name: Restore vfio-pci devices to native drivers
      ansible.builtin.shell:
        cmd: |
          pci_addr="{{ item }}"
          echo "$pci_addr" > /sys/bus/pci/drivers/vfio-pci/unbind 2>/dev/null || true
          echo "" > "/sys/bus/pci/devices/${pci_addr}/driver_override" 2>/dev/null || true
        executable: /bin/bash
      loop: "{{ _gaming_vfio_devs.stdout_lines | default([]) }}"
      when: _gaming_vfio_devs.stdout | trim | length > 0
      changed_when: true
      failed_when: false

    - name: Rescan PCI bus to auto-bind native drivers
      ansible.builtin.shell:
        cmd: echo 1 > /sys/bus/pci/rescan
        executable: /bin/bash
      changed_when: true
      failed_when: false

    - name: Remove hookscript state files
      ansible.builtin.shell:
        cmd: rm -f /run/gpu-passthrough/vm-*.state
        executable: /bin/bash
      changed_when: true
      failed_when: false

    - name: Remove GPU hookscript
      ansible.builtin.file:
        path: /var/lib/vz/snippets/gpu-passthrough-hook.sh
        state: absent

# ── Full host restore (existing) ────────────────────────────────

- name: Restore Proxmox host from backup
  hosts: proxmox:!lan_hosts
  gather_facts: false
  vars:
    backup_dir: /var/lib/ansible-backup

  tasks:
    # ── Shared: verify backup exists ──────────────────────────────
    - name: Check for backup manifest
      ansible.builtin.stat:
        path: "{{ backup_dir }}/manifest.json"
      register: manifest_stat
      tags: [restore, full-restore, clean]

    - name: Fail if no backup exists
      ansible.builtin.fail:
        msg: >-
          No backup found at {{ backup_dir }}/manifest.json.
          Run the playbook first to create a backup.
      when: not manifest_stat.stat.exists
      tags: [restore, full-restore, clean]

    - name: Read backup manifest
      ansible.builtin.slurp:
        src: "{{ backup_dir }}/manifest.json"
      register: manifest_raw
      tags: [restore, full-restore, clean]

    - name: Parse manifest
      ansible.builtin.set_fact:
        manifest: "{{ manifest_raw.content | b64decode | from_json }}"
      tags: [restore, full-restore, clean]

    # ── Destroy VMs (full-restore and clean) ──────────────────────
    - name: List all current VMs
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          qm list 2>/dev/null | awk 'NR>1 {print $1}'
        executable: /bin/bash
      register: current_vms
      changed_when: false
      tags: [full-restore, clean, never]

    - name: Stop all VMs
      ansible.builtin.command:
        cmd: qm stop {{ item }}
      loop: "{{ current_vms.stdout_lines | default([]) }}"
      failed_when: false
      tags: [full-restore, clean, never]

    - name: Wait for VMs to stop
      ansible.builtin.pause:
        seconds: 5
      when: current_vms.stdout_lines | default([]) | length > 0
      tags: [full-restore, clean, never]

    - name: Destroy all VMs
      ansible.builtin.command:
        cmd: qm destroy {{ item }} --purge
      loop: "{{ current_vms.stdout_lines | default([]) }}"
      failed_when: false
      tags: [full-restore, clean, never]

    # ── Destroy LXC containers (full-restore and clean) ───────────
    - name: List all current containers
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          pct list 2>/dev/null | awk 'NR>1 {print $1}'
        executable: /bin/bash
      register: current_cts
      changed_when: false
      tags: [full-restore, clean, never]

    - name: Stop all containers
      ansible.builtin.command:
        cmd: pct stop {{ item }}
      loop: "{{ current_cts.stdout_lines | default([]) }}"
      failed_when: false
      tags: [full-restore, clean, never]

    - name: Wait for containers to stop
      ansible.builtin.pause:
        seconds: 3
      when: current_cts.stdout_lines | default([]) | length > 0
      tags: [full-restore, clean, never]

    - name: Destroy all containers
      ansible.builtin.command:
        cmd: pct destroy {{ item }} --purge
      loop: "{{ current_cts.stdout_lines | default([]) }}"
      failed_when: false
      tags: [full-restore, clean, never]

    # ── Restore VMs from vzdump (full-restore only) ───────────────
    - name: Restore backed-up VMs
      ansible.builtin.command:
        cmd: qmrestore {{ item }} {{ vm_id }} --force true
      loop: "{{ manifest.vms | default([]) }}"
      loop_control:
        index_var: _idx
      vars:
        vm_id: "{{ manifest.vm_ids[_idx] }}"
      when: manifest.vms | default([]) | length > 0
      tags: [full-restore, never]

    - name: Start restored VMs
      ansible.builtin.command:
        cmd: qm start {{ item }}
      loop: "{{ manifest.vm_ids | default([]) }}"
      failed_when: false
      when: manifest.vm_ids | default([]) | length > 0
      tags: [full-restore, never]

    # ── Restore host config (all modes) ───────────────────────────
    - name: Unbind devices from vfio-pci and restore native drivers
      ansible.builtin.shell:
        cmd: |
          for dev in /sys/bus/pci/drivers/vfio-pci/0000:*/; do
            [ -d "$dev" ] || continue
            addr=$(basename "$dev")
            echo "$addr" > /sys/bus/pci/drivers/vfio-pci/unbind 2>/dev/null || true
            echo "" > "/sys/bus/pci/devices/${addr}/driver_override" 2>/dev/null || true
          done
          echo 1 > /sys/bus/pci/rescan 2>/dev/null || true
          sleep 2
        executable: /bin/bash
      changed_when: true
      failed_when: false
      tags: [restore, full-restore, clean]

    - name: Remove GPU hookscript state files
      ansible.builtin.shell:
        cmd: rm -f /run/gpu-passthrough/vm-*.state
        executable: /bin/bash
      changed_when: true
      failed_when: false
      tags: [restore, full-restore, clean]

    - name: Remove ansible-managed config files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/network/interfaces.d/ansible-bridges.conf
        - /etc/network/interfaces.d/ansible-proxmox-lan.conf
        - /etc/network/interfaces.d/ansible-temp-lan.conf
        - /etc/modprobe.d/blacklist-wifi.conf
        - /etc/modprobe.d/vfio-pci.conf
        - /etc/ansible/facts.d/vm_builds.fact
        - /etc/apt/sources.list.d/pve-no-subscription.sources
        - /etc/modules-load.d/wireguard.conf
        - /tmp/openwrt-router-24.10.0-x86-64-combined.img.gz
        - /tmp/openwrt-router-24.10.0-x86-64-combined.img
      tags: [restore, full-restore, clean]

    - name: Remove cached LXC templates
      ansible.builtin.shell:
        cmd: |
          rm -f /var/lib/vz/template/cache/debian-*.tar.zst \
               /var/lib/vz/template/cache/openwrt-*.tar.gz \
               /var/lib/vz/template/cache/pihole-*.tar.zst \
               /var/lib/vz/template/cache/rsyslog-*.tar.zst \
               /var/lib/vz/template/cache/netdata-*.tar.zst \
               /var/lib/vz/template/cache/jellyfin-*.tar.zst \
               /var/lib/vz/template/cache/homeassistant-*.tar.zst \
               /var/lib/vz/template/cache/wireguard-*.tar.zst
        executable: /bin/bash
      changed_when: true
      failed_when: false
      tags: [full-restore, clean]

    - name: Remove hookscripts from snippets
      ansible.builtin.shell:
        cmd: |
          rm -f /var/lib/vz/snippets/mesh-wifi-phy-*.sh
          rm -f /var/lib/vz/snippets/gpu-passthrough-hook.sh
          rm -f /var/lib/vz/snippets/display-exclusive.sh
        executable: /bin/bash
      changed_when: true
      failed_when: false
      tags: [full-restore, clean]

    - name: Re-enable enterprise repos if disabled
      ansible.builtin.shell:
        cmd: |
          for f in /etc/apt/sources.list.d/pve-enterprise.sources.disabled \
                   /etc/apt/sources.list.d/ceph.sources.disabled; do
            [ -f "$f" ] && mv "$f" "${f%.disabled}"
          done
        executable: /bin/bash
      changed_when: true
      failed_when: false
      tags: [restore, full-restore, clean]

    - name: Tear down stale bridges
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          for br in $(ip -o link show type bridge | awk -F': ' '{print $2}'); do
            grep -q "auto $br" /etc/network/interfaces 2>/dev/null && continue
            ip link set "$br" down 2>/dev/null || true
            ip link delete "$br" 2>/dev/null || true
          done
        executable: /bin/bash
      changed_when: true
      tags: [restore, full-restore, clean]

    - name: Restore host configuration from backup
      ansible.builtin.unarchive:
        src: "{{ manifest.host_config }}"
        dest: /
        remote_src: true
      tags: [restore, full-restore, clean]

    - name: Update initramfs
      ansible.builtin.command:
        cmd: update-initramfs -u -k all
      changed_when: true
      tags: [restore, full-restore, clean]

    - name: Reload WiFi kernel modules
      ansible.builtin.shell:
        cmd: |
          modprobe -r iwlmvm iwlwifi 2>/dev/null || true
          modprobe iwlwifi 2>/dev/null || true
        executable: /bin/bash
      changed_when: true
      failed_when: false
      tags: [restore, full-restore, clean]

    - name: Rescan PCI bus to restore original drivers
      ansible.builtin.shell:
        cmd: echo 1 > /sys/bus/pci/rescan
        executable: /bin/bash
      changed_when: true
      failed_when: false
      tags: [restore, full-restore, clean]

    - name: Bring up interfaces from restored config
      ansible.builtin.command:
        cmd: ifup --all --force
      changed_when: true
      failed_when: false
      tags: [restore, full-restore, clean]

    - name: Remove local state file from controller
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../.state/addresses.json"
        state: absent
      delegate_to: localhost
      tags: [restore, full-restore, clean]

    - name: Report restore result
      ansible.builtin.debug:
        msg: >-
          Restore complete.
          Host config: restored from {{ manifest.host_config }}.
          VMs backed up: {{ manifest.vm_ids | default([]) | join(', ') | default('none') }}.
      tags: [restore, full-restore, clean]

# ── LAN host cleanup (runs from router_nodes via SSH) ─────────────

- name: Clean up LAN satellite hosts
  hosts: router_nodes
  gather_facts: false
  tags: [restore, full-restore, clean]
  tasks:
    - name: Process each LAN host
      ansible.builtin.include_tasks: ../tasks/cleanup_lan_host.yml
      vars:
        _lan_host_ip: "{{ hostvars[item].ansible_host }}"
        _lan_host_name: "{{ item }}"
      loop: "{{ groups['lan_hosts'] | default([]) }}"
      when: groups['lan_hosts'] | default([]) | length > 0
