---
# Reconstruct the rsyslog dynamic group.
# Thin wrapper around the shared LXC group reconstruction.
#
# Consumed by:
#   - Per-feature molecule converge.yml (rsyslog-lxc scenario)
#   - Per-feature molecule verify.yml
#   - playbooks/cleanup.yml (rollback plays)
#
# Must run on a host in the monitoring_nodes/proxmox group.

- name: Reconstruct rsyslog dynamic group
  ansible.builtin.include_tasks: reconstruct_lxc_group.yml
  vars:
    reconstruct_service_name: rsyslog
    reconstruct_service_prefix: rsyslog
    reconstruct_ct_id: "{{ rsyslog_ct_id }}"
