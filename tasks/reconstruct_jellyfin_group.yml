---
# Reconstruct the jellyfin dynamic group.
# Thin wrapper around the shared LXC group reconstruction.
#
# Consumed by:
#   - Per-feature molecule converge.yml (jellyfin-lxc scenario)
#   - Per-feature molecule verify.yml
#   - playbooks/cleanup.yml (rollback plays)
#
# Must run on a host in the media_nodes/proxmox group.

- name: Reconstruct Jellyfin dynamic group
  ansible.builtin.include_tasks: reconstruct_lxc_group.yml
  vars:
    reconstruct_service_name: Jellyfin
    reconstruct_service_prefix: jellyfin
    reconstruct_ct_id: "{{ jellyfin_ct_id }}"
