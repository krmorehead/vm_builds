---
# Reusable task file: reconstruct the jellyfin dynamic group.
#
# Consumed by:
#   - Per-feature molecule converge.yml (jellyfin-lxc scenario)
#   - Per-feature molecule verify.yml
#   - playbooks/cleanup.yml (rollback plays)
#
# Must run on a host in the media_nodes/proxmox group.
# Simpler than OpenWrt reconstruction: pct_remote is always the
# connection method (no SSH auth detection needed).

- name: Verify Jellyfin container is running
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      pct status {{ jellyfin_ct_id | default(300) }} | grep -c running
    executable: /bin/bash
  register: _jellyfin_ct_status
  changed_when: false
  failed_when: (_jellyfin_ct_status.stdout | trim | int) == 0

- name: Add Jellyfin containers to dynamic group
  ansible.builtin.add_host:
    name: "jellyfin-{{ item }}"
    groups: jellyfin
    ansible_connection: community.proxmox.proxmox_pct_remote
    ansible_host: "{{ hostvars[item].ansible_host }}"
    ansible_user: root
    proxmox_vmid: "{{ jellyfin_ct_id | default(300) }}"
    ansible_paramiko_host_key_checking: false
    ansible_paramiko_proxy_command: >-
      {{ 'ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p root@'
         + lookup('env', 'PRIMARY_HOST')
         if 'lan_hosts' in (hostvars[item].group_names | default([]))
         else omit }}
  loop: "{{ ansible_play_hosts }}"

- name: Report reconstructed jellyfin group
  ansible.builtin.debug:
    msg: >-
      Reconstructed jellyfin group: host=jellyfin-{{ inventory_hostname }},
      proxmox_host={{ ansible_host }},
      vmid={{ jellyfin_ct_id | default(300) }},
      connection=pct_remote
