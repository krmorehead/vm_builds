---
# Reconstruct the 'gaming' dynamic group from a running VM.
# Include this from plays that target gaming_nodes when the dynamic
# group is lost between playbook invocations (molecule verify, cleanup,
# per-feature scenarios).

- name: Check if Gaming VM is running
  ansible.builtin.command:
    cmd: qm status {{ gaming_vm_id }}
  register: _gvm_recon_status
  failed_when: false
  changed_when: false

- name: Skip reconstruction if VM is not running
  ansible.builtin.debug:
    msg: "Gaming VM {{ gaming_vm_id }} is not running -- skipping group reconstruction"
  when: _gvm_recon_status.rc != 0 or 'running' not in _gvm_recon_status.stdout

- name: Discover Gaming VM IP via QEMU Guest Agent
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      qm guest cmd {{ gaming_vm_id }} network-get-interfaces | \
        python3 -c "
      import sys, json
      data = json.load(sys.stdin)
      for iface in data:
          if iface.get('name', '').startswith('Loopback'):
              continue
          for addr in iface.get('ip-addresses', []):
              if addr.get('ip-address-type') == 'ipv4' and not addr['ip-address'].startswith('127.'):
                  print(addr['ip-address'])
                  sys.exit(0)
      sys.exit(1)
      "
    executable: /bin/bash
  register: _gvm_recon_ip
  changed_when: false
  when: _gvm_recon_status.rc == 0 and 'running' in _gvm_recon_status.stdout

- name: Register Gaming VM in dynamic group
  ansible.builtin.add_host:
    name: "gaming-{{ inventory_hostname }}"
    groups: gaming
    ansible_host: "{{ _gvm_recon_ip.stdout | trim }}"
    ansible_connection: ssh
    ansible_user: "{{ gaming_vm_admin_user | default('admin') }}"
    ansible_password: "{{ gaming_vm_admin_password | default('Passw0rd!') }}"
    ansible_shell_type: powershell
    ansible_become: false
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
      -o ConnectTimeout=30
    gaming_vm_proxmox_host: "{{ inventory_hostname }}"
    gaming_vm_id_ref: "{{ gaming_vm_id }}"
  when:
    - _gvm_recon_status.rc == 0
    - "'running' in _gvm_recon_status.stdout"
    - _gvm_recon_ip.rc == 0
