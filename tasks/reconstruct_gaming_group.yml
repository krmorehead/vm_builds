---
# Reconstruct the 'gaming' dynamic group from a running LXC container.
# Include this from plays that target gaming_nodes when the dynamic
# group is lost between playbook invocations (molecule verify, cleanup,
# per-feature scenarios).

- name: Check if Gaming LXC container is running
  ansible.builtin.command:
    cmd: pct status {{ gaming_ct_id }}
  register: _gaming_recon_status
  failed_when: false
  changed_when: false

- name: Skip reconstruction if container is not running
  ansible.builtin.debug:
    msg: "Gaming LXC {{ gaming_ct_id }} is not running -- skipping group reconstruction"
  when: _gaming_recon_status.rc != 0 or 'running' not in _gaming_recon_status.stdout

- name: Register Gaming LXC container in dynamic group
  ansible.builtin.add_host:
    name: "gaming-{{ inventory_hostname }}"
    groups: gaming
    ansible_host: "{{ ansible_host }}"
    ansible_connection: community.proxmox.proxmox_pct_remote
    ansible_user: root
    proxmox_vmid: "{{ gaming_ct_id }}"
    ansible_pct_remote_python: /usr/bin/python3
    gaming_ct_proxmox_host: "{{ inventory_hostname }}"
    gaming_ct_id_ref: "{{ gaming_ct_id }}"
  when:
    - _gaming_recon_status.rc == 0
    - "'running' in _gaming_recon_status.stdout"
