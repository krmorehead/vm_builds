---
# ── Base state gate ──────────────────────────────────────────────
# NM with no heartbeat = DEAD
# CM with no heartbeat = DEAD
# SM with no heartbeat = DEAD
#
# fleet/ready is driven by the host registry. all_ready means:
# every registered NM has the service AND it's heartbeating.
# 6 registered, 1 reporting = NOT ready.

# ── Controller VPN ──────────────────────────────────────────────

- name: Check controller wg0 interface
  ansible.builtin.command:
    cmd: ip link show wg0
  register: _gate_wg0
  changed_when: false
  failed_when: false

- name: "DEAD — Controller VPN is down"
  ansible.builtin.assert:
    that: _gate_wg0.rc == 0
    fail_msg: "Controller VPN (wg0) is DOWN. Run base.yml or: sudo wg-quick up wg0"

# ── Every NM API MUST respond ──────────────────────────────────

- name: "Every NM API MUST respond — {{ item }}"
  ansible.builtin.uri:
    url: "{{ hostvars[item].nm_api_url }}/api/health"
    timeout: 5
  loop: "{{ groups['kiosk_nodes'] | default([]) }}"

# ── Every VPN tunnel MUST be active ────────────────────────────

- name: "Every VPN tunnel MUST be active — {{ item }}"
  ansible.builtin.uri:
    url: "{{ hostvars[item].nm_api_url }}/api/provision/{{ wireguard_ct_id }}/exec"
    method: POST
    body_format: json
    body:
      cmd: "wg show wg0 latest-handshakes 2>/dev/null | head -1 | awk '{print $2}'"
      timeout: 5
    timeout: 10
    headers: "{{ nm_auth_headers }}"
  loop: "{{ groups['vpn_nodes'] | default([]) }}"

# ── SM kiosk heartbeats — all registered NMs must report ───────

- name: "SM KIOSK HEARTBEATS — all registered NMs must report"
  ansible.builtin.uri:
    url: "{{ callhome_server_local }}/api/fleet/ready?services=kiosk"
    return_content: true
    timeout: 10
    headers: "{{ nm_auth_headers }}"
  register: _gate_sm_kiosk

- name: "DEAD — KIOSK HEARTBEATS"
  ansible.builtin.assert:
    that: _gate_sm_kiosk.json.all_ready | bool
    fail_msg: >-
      {{ _gate_sm_kiosk.json.ready_count }}/{{ _gate_sm_kiosk.json.registered_hosts }}
      registered NMs have kiosk heartbeating. MISSING KIOSKS ARE DEAD.
      Response: {{ _gate_sm_kiosk.json }}

# ── SM wireguard heartbeats — all registered NMs must report ───

- name: "SM WIREGUARD HEARTBEATS — all registered NMs must report"
  ansible.builtin.uri:
    url: "{{ callhome_server_local }}/api/fleet/ready?services=wireguard"
    return_content: true
    timeout: 10
    headers: "{{ nm_auth_headers }}"
  register: _gate_sm_wg

- name: "DEAD — WIREGUARD HEARTBEATS"
  ansible.builtin.assert:
    that: _gate_sm_wg.json.all_ready | bool
    fail_msg: >-
      {{ _gate_sm_wg.json.ready_count }}/{{ _gate_sm_wg.json.registered_hosts }}
      registered NMs have wireguard heartbeating. MISSING VPN TUNNELS ARE DEAD.
      Response: {{ _gate_sm_wg.json }}

# ── ALL CHECKS PASSED ─────────────────────────────────────────

- name: Set gate results
  ansible.builtin.set_fact:
    _base_state_valid: true

- name: Base state verified
  ansible.builtin.debug:
    msg: >-
      BASE STATE VERIFIED: wg0=UP, all NMs responding, all VPN tunnels active,
      {{ _gate_sm_kiosk.json.ready_count }}/{{ _gate_sm_kiosk.json.registered_hosts }} kiosks,
      {{ _gate_sm_wg.json.ready_count }}/{{ _gate_sm_wg.json.registered_hosts }} wireguard.
