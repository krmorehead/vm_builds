---
# Shared task: compute container networking based on host topology.
#
# LAN hosts (router_nodes, lan_hosts) use the OpenWrt LAN subnet (10.10.10.x).
# WAN hosts use a private NAT bridge (10.99.{container_subnet_id}.x) with
# host-side MASQUERADE — no IPs on the household subnet, no collisions.
#
# Required variables (set via include_tasks vars:):
#   lxc_net_service_name  — human-readable name for debug output
#   lxc_net_ip_offset     — service IP offset (last octet)
#   lxc_net_flavor_group  — inventory group (used for LAN per-host indexing)
#
# Exported facts:
#   _lxc_net_on_lan     — whether host is behind OpenWrt
#   _lxc_net_gateway    — container gateway IP
#   _lxc_net_cidr       — subnet prefix length
#   _lxc_net_ip         — computed container IP
#   _lxc_net_nameserver — DNS nameserver for the container
#   _lxc_net_bridge     — Proxmox bridge to attach to

- name: Read LAN topology facts
  ansible.builtin.include_tasks: "{{ project_root }}/tasks/read_lan_topology.yml"

- name: "Fail if LAN_GATEWAY is missing — {{ lxc_net_service_name }}"
  ansible.builtin.fail:
    msg: >-
      LAN_GATEWAY not found in {{ env_generated_path }}.
      Run the OpenWrt baseline first — it writes LAN_GATEWAY during configure.
  when:
    - _lxc_net_on_lan | bool
    - (_lan_gateway | default('') | trim) | length == 0

- name: "Fail if LAN_CIDR is missing — {{ lxc_net_service_name }}"
  ansible.builtin.fail:
    msg: >-
      LAN_CIDR not found in {{ env_generated_path }}.
      Run the OpenWrt baseline first — it writes LAN_CIDR during configure.
  when:
    - _lxc_net_on_lan | bool
    - (_lan_cidr | default('') | trim) | length == 0

- name: "Fail if bridge list is missing on LAN host — {{ lxc_net_service_name }}"
  ansible.builtin.fail:
    msg: >-
      proxmox_all_bridges is undefined on {{ inventory_hostname }}.
      Run infra plays first (--tags infra) or use full converge.
      LAN hosts require proxmox_bridges to detect the correct bridge.
  when:
    - _lxc_net_on_lan | bool
    - "'router_nodes' in group_names"
    - proxmox_all_bridges is not defined

- name: "Set container network for OpenWrt LAN — {{ lxc_net_service_name }}"
  ansible.builtin.set_fact:
    _lxc_net_gateway: "{{ _lan_gateway }}"
    _lxc_net_cidr: "{{ _lan_cidr }}"
    _lxc_net_ip: >-
      {{ _lan_prefix }}.{{
         lxc_net_ip_offset + groups[lxc_net_flavor_group].index(inventory_hostname) }}
    _lxc_net_nameserver: "{{ _lan_gateway }}"
    _lxc_net_bridge: >-
      {{ (proxmox_all_bridges[1] | default('vmbr0'))
         if proxmox_all_bridges is defined
         else 'vmbr0' }}
  when: _lxc_net_on_lan | bool

- name: "Set container network for NAT bridge — {{ lxc_net_service_name }}"
  ansible.builtin.set_fact:
    _lxc_net_gateway: "{{ container_subnet_prefix }}.{{ container_subnet_id }}.1"
    _lxc_net_cidr: "24"
    _lxc_net_ip: "{{ container_subnet_prefix }}.{{ container_subnet_id }}.{{ lxc_net_ip_offset }}"
    _lxc_net_nameserver: "8.8.8.8"
    _lxc_net_bridge: "{{ proxmox_container_bridge }}"
  when: not (_lxc_net_on_lan | bool)

- name: "Report container IP — {{ lxc_net_service_name }}"
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: {{ lxc_net_service_name }}
      IP={{ _lxc_net_ip }}/{{ _lxc_net_cidr }}
      gw={{ _lxc_net_gateway }}
      bridge={{ _lxc_net_bridge }}
      ({{ 'OpenWrt LAN' if (_lxc_net_on_lan | bool) else 'NAT bridge' }})
