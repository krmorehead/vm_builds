---
# Reconstruct the wireguard dynamic group.
# Thin wrapper around the shared LXC group reconstruction.
#
# Consumed by:
#   - Per-feature molecule converge.yml (wireguard-lxc scenario)
#   - Per-feature molecule verify.yml
#   - playbooks/cleanup.yml (rollback plays)
#
# Must run on a host in the vpn_nodes/proxmox group.

- name: Reconstruct WireGuard dynamic group
  ansible.builtin.include_tasks: reconstruct_lxc_group.yml
  vars:
    reconstruct_service_name: WireGuard
    reconstruct_service_prefix: wireguard
    reconstruct_ct_id: "{{ wireguard_ct_id }}"
