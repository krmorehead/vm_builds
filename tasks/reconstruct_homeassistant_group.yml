---
# Reusable task file: reconstruct the homeassistant dynamic group.
#
# Consumed by:
#   - Per-feature molecule converge.yml
#   - Per-feature molecule verify.yml
#   - playbooks/cleanup.yml (rollback plays)
#
# Delegates to the shared reconstruct_lxc_group.yml helper for
# consistency with all other LXC service reconstruct wrappers.

- name: Reconstruct Home Assistant group
  ansible.builtin.include_tasks: "{{ project_root }}/tasks/reconstruct_lxc_group.yml"
  vars:
    reconstruct_service_name: Home Assistant
    reconstruct_service_prefix: homeassistant
    reconstruct_ct_id: "{{ homeassistant_ct_id }}"
