---
# Reconstruct the pihole dynamic group.
# Thin wrapper around the shared LXC group reconstruction.
#
# Consumed by:
#   - Per-feature molecule converge.yml (pihole-lxc scenario)
#   - Per-feature molecule verify.yml
#   - playbooks/cleanup.yml (rollback plays)
#
# Must run on a host in the dns_nodes/proxmox group.

- name: Reconstruct Pi-hole dynamic group
  ansible.builtin.include_tasks: reconstruct_lxc_group.yml
  vars:
    reconstruct_service_name: Pi-hole
    reconstruct_service_prefix: pihole
    reconstruct_ct_id: "{{ pihole_ct_id }}"
