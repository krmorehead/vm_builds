---
# Reconstruct the moonlight dynamic group.
# Thin wrapper around the shared LXC group reconstruction.
#
# Consumed by:
#   - Per-feature molecule converge.yml (moonlight-lxc scenario)
#   - Per-feature molecule verify.yml
#   - playbooks/cleanup.yml (rollback plays)
#
# Must run on a host in the streaming_nodes/proxmox group.

- name: Reconstruct Moonlight dynamic group
  ansible.builtin.include_tasks: reconstruct_lxc_group.yml
  vars:
    reconstruct_service_name: Moonlight
    reconstruct_service_prefix: moonlight
    reconstruct_ct_id: "{{ moonlight_ct_id }}"
