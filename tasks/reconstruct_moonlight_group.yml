---
# Reusable task file: reconstruct the moonlight dynamic group.
#
# Consumed by:
#   - Per-feature molecule converge.yml (moonlight-lxc scenario)
#   - Per-feature molecule verify.yml
#   - playbooks/cleanup.yml (rollback plays)
#
# Must run on a host in the streaming_nodes/proxmox group.

- name: Verify Moonlight container is running
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      pct status {{ moonlight_ct_id | default(302) }} | grep -c running
    executable: /bin/bash
  register: _moonlight_ct_status
  changed_when: false
  failed_when: (_moonlight_ct_status.stdout | trim | int) == 0

- name: Add Moonlight containers to dynamic group
  ansible.builtin.add_host:
    name: "moonlight-{{ item }}"
    groups: moonlight
    ansible_connection: community.proxmox.proxmox_pct_remote
    ansible_host: "{{ hostvars[item].ansible_host }}"
    ansible_user: root
    proxmox_vmid: "{{ moonlight_ct_id | default(302) }}"
    ansible_paramiko_host_key_checking: false
    ansible_paramiko_proxy_command: >-
      {{ 'ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p root@'
         + lookup('env', 'PRIMARY_HOST')
         if 'lan_hosts' in (hostvars[item].group_names | default([]))
         else omit }}
  loop: "{{ ansible_play_hosts }}"

- name: Report reconstructed moonlight group
  ansible.builtin.debug:
    msg: >-
      Reconstructed moonlight group: host=moonlight-{{ inventory_hostname }},
      proxmox_host={{ ansible_host }},
      vmid={{ moonlight_ct_id | default(302) }},
      connection=pct_remote
