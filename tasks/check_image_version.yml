---
# Shared image version check for LXC containers.
# Compares the deployed version (from /etc/image_version inside the container)
# against the manifest version (from group_vars). If they differ, the
# container is destroyed so it can be recreated from the new template.
#
# Required variables (set via include_tasks vars:):
#   image_version_ct_id       — container VMID
#   image_version_expected    — version from the manifest (e.g., "1.0.0")
#   image_version_service     — human-readable name for log messages

- name: "Read deployed image version — {{ image_version_service }}"
  ansible.builtin.command:
    cmd: >-
      pct exec {{ image_version_ct_id }} --
      cat /etc/image_version
  register: _deployed_version
  changed_when: false
  failed_when: false

- name: "Set version comparison facts — {{ image_version_service }}"
  ansible.builtin.set_fact:
    _image_version_deployed: "{{ _deployed_version.stdout | default('') | trim }}"
    _image_version_match: >-
      {{ (_deployed_version.stdout | default('') | trim) == image_version_expected }}

- name: "Image version status — {{ image_version_service }}"
  ansible.builtin.debug:
    msg: >-
      {{ image_version_service }}: deployed={{ _image_version_deployed | default('unknown') }},
      manifest={{ image_version_expected }},
      {{ 'up-to-date' if _image_version_match | bool else 'OUTDATED — will rebuild' }}

- name: "Stop outdated container — {{ image_version_service }}"
  ansible.builtin.command:
    cmd: pct stop {{ image_version_ct_id }}
  changed_when: true
  failed_when: false
  when: not _image_version_match | bool

- name: "Destroy outdated container — {{ image_version_service }}"
  ansible.builtin.command:
    cmd: pct destroy {{ image_version_ct_id }} --purge
  changed_when: true
  when: not _image_version_match | bool

- name: "Set rebuild flag — {{ image_version_service }}"
  ansible.builtin.set_fact:
    _image_version_rebuild: "{{ not _image_version_match | bool }}"
