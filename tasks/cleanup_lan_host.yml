---
# Per-LAN-host cleanup tasks, included by playbooks/cleanup.yml.
# Runs on a router_node — cleans the LAN host via SSH.
#
# Required vars:
#   _lan_host_ip   – LAN IP of the target (e.g. 10.10.10.210)
#   _lan_host_name – inventory hostname (e.g. mesh1)

- name: Check if LAN host is reachable -- {{ _lan_host_name }}
  ansible.builtin.command:
    cmd: >-
      ssh -o ConnectTimeout=5
      -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
      -o BatchMode=yes -o PasswordAuthentication=no
      root@{{ _lan_host_ip }} hostname
  register: _key_check
  failed_when: false
  changed_when: false

- name: Set reachability fact
  ansible.builtin.set_fact:
    _host_reachable: "{{ _key_check.rc == 0 }}"
    _cleanup_ssh: >-
      ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
      -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=3
      root@{{ _lan_host_ip }}

- name: Skip cleanup if LAN host is unreachable
  ansible.builtin.debug:
    msg: "{{ _lan_host_name }} is unreachable -- skipping cleanup"
  when: not (_host_reachable | bool)

- name: Stop and destroy project containers on LAN host  # noqa command-instead-of-shell
  ansible.builtin.shell:
    cmd: >-
      timeout 180 {{ _cleanup_ssh }} "
      for vm in {{ gaming_vm_id }}; do
        qm status \$vm >/dev/null 2>&1 || continue;
        qm stop \$vm --timeout 15 2>/dev/null || true;
        qm destroy \$vm --purge 2>/dev/null || true;
      done;
      for ct in {{ wireguard_ct_id }} {{ meshwifi_ct_id }}
      {{ bridge_ct_id }} {{ netdata_ct_id }} {{ rsyslog_ct_id }}
      {{ pihole_ct_id }} {{ homeassistant_ct_id }} {{ jellyfin_ct_id }}
      {{ kodi_ct_id }} {{ moonlight_ct_id }} {{ kiosk_ct_id }}
      {{ gaming_ct_id }} {{ desktop_ct_id }}; do
        pct status \$ct >/dev/null 2>&1 || continue;
        pct stop \$ct 2>/dev/null || true;
        pct destroy \$ct --purge 2>/dev/null || true;
      done"
  when: _host_reachable | bool
  changed_when: true
  failed_when: false

- name: Clean stale pmxcfs node configs on LAN host  # noqa command-instead-of-shell
  ansible.builtin.shell:
    cmd: >-
      {{ _cleanup_ssh }} "
      local_node=\$(hostname);
      for nodedir in /etc/pve/nodes/*/; do
        node=\$(basename \"\$nodedir\");
        [ \"\$node\" = \"\$local_node\" ] && continue;
        for conf in \"\$nodedir\"lxc/*.conf \"\$nodedir\"qemu-server/*.conf; do
          [ -f \"\$conf\" ] && rm -v \"\$conf\";
        done;
      done"
  when: _host_reachable | bool
  changed_when: true
  failed_when: false

- name: Deregister LAN host containers from Manager
  ansible.builtin.include_tasks: "{{ project_root }}/tasks/manager_register.yml"
  vars:
    register_path: "api/host/{{ _lan_host_name }}/containers/{{ _deregister_vmid }}"
    register_body: {}
    register_method: DELETE
    register_ignore_errors: true
  loop:
    - "{{ wireguard_ct_id }}"
    - "{{ pihole_ct_id }}"
    - "{{ meshwifi_ct_id }}"
    - "{{ netdata_ct_id }}"
    - "{{ rsyslog_ct_id }}"
    - "{{ homeassistant_ct_id }}"
    - "{{ jellyfin_ct_id }}"
    - "{{ kodi_ct_id }}"
    - "{{ moonlight_ct_id }}"
    - "{{ desktop_ct_id }}"
    - "{{ kiosk_ct_id }}"
    - "{{ gaming_ct_id }}"
  loop_control:
    loop_var: _deregister_vmid

- name: Stop and remove host-level socat proxy units on LAN host  # noqa command-instead-of-shell
  ansible.builtin.shell:
    cmd: >-
      {{ _cleanup_ssh }} "
      for svc in kiosk-manager-proxy kiosk-display-proxy
      kiosk-vnc-proxy manager-api-proxy supermanager-relay
      desktop-display-proxy desktop-vnc-ws
      kodi-display-proxy kodi-vnc-proxy
      moonlight-display-proxy moonlight-vnc-proxy; do
        systemctl stop \$svc 2>/dev/null || true;
        systemctl disable \$svc 2>/dev/null || true;
        rm -f /etc/systemd/system/\${svc}.service;
      done;
      for unit in /etc/systemd/system/kiosk-display-relay-*.service
      /etc/systemd/system/kiosk-vnc-relay-*.service
      /etc/systemd/system/*-display-proxy.service
      /etc/systemd/system/*-vnc-proxy.service; do
        [ -f \"\$unit\" ] || continue;
        svc=\$(basename \"\$unit\");
        systemctl stop \"\$svc\" 2>/dev/null || true;
        systemctl disable \"\$svc\" 2>/dev/null || true;
        rm -f \"\$unit\";
      done;
      systemctl daemon-reload 2>/dev/null || true"
  when: _host_reachable | bool
  changed_when: true
  failed_when: false

- name: Remove ansible-managed files on LAN host  # noqa command-instead-of-shell
  ansible.builtin.shell:
    cmd: >-
      {{ _cleanup_ssh }} "rm -f
      /etc/network/interfaces.d/ansible-bridges.conf
      /etc/network/interfaces.d/ansible-container-bridge.conf
      /etc/network/interfaces.d/ansible-proxmox-lan.conf
      /etc/network/interfaces.d/ansible-temp-lan.conf
      /etc/modprobe.d/blacklist-wifi.conf
      /etc/modprobe.d/vfio-pci.conf
      /etc/modprobe.d/iwlwifi-options.conf
      /etc/ansible/facts.d/vm_builds.fact
      /etc/apt/sources.list.d/pve-no-subscription.sources
      /etc/modules-load.d/wireguard.conf"
  when: _host_reachable | bool
  changed_when: true
  failed_when: false

- name: Remove hookscripts on LAN host  # noqa command-instead-of-shell
  ansible.builtin.shell:
    cmd: |
      {{ _cleanup_ssh }} "rm -f
        /var/lib/vz/snippets/mesh-wifi-phy-*.sh
        /var/lib/vz/snippets/bridge-wifi-phy-*.sh
        /var/lib/vz/snippets/gpu-passthrough-hook.sh
        /var/lib/vz/snippets/display-exclusive.sh"
  when: _host_reachable | bool
  changed_when: true
  failed_when: false

- name: Flush container NAT rules on LAN host  # noqa command-instead-of-shell
  ansible.builtin.shell:
    cmd: >-
      {{ _cleanup_ssh }} "
      set -o pipefail;
      cnt=\$(iptables -t nat -S 2>/dev/null | grep -c '10\.99\.' || true);
      [ \"\${cnt:-0}\" -gt 0 ] && iptables -t nat -F || true;
      iptables -S FORWARD 2>/dev/null | grep 'vmbr_ct\|10\.99\.' | while read -r rule; do
        iptables \$(echo \"\$rule\" | sed 's/^-A/-D/') 2>/dev/null || true;
      done;
      ip link set vmbr_ct down 2>/dev/null || true;
      ip link delete vmbr_ct 2>/dev/null || true"
    executable: /bin/bash
  when: _host_reachable | bool
  changed_when: true
  failed_when: false

- name: Unbind vfio-pci devices and restore native drivers on LAN host  # noqa command-instead-of-shell
  ansible.builtin.shell:
    cmd: >-
      {{ _cleanup_ssh }} "
      for dev in /sys/bus/pci/drivers/vfio-pci/0000:*/; do
        [ -d \"\$dev\" ] || continue;
        addr=\$(basename \"\$dev\");
        echo \"\$addr\" > /sys/bus/pci/drivers/vfio-pci/unbind 2>/dev/null || true;
        echo '' > /sys/bus/pci/devices/\${addr}/driver_override 2>/dev/null || true;
      done;
      echo 1 > /sys/bus/pci/rescan 2>/dev/null || true;
      rm -f /run/gpu-passthrough/vm-*.state"
  when: _host_reachable | bool
  changed_when: true
  failed_when: false

- name: Re-enable enterprise repos on LAN host  # noqa command-instead-of-shell
  ansible.builtin.shell:
    cmd: >-
      {{ _cleanup_ssh }} "
      for f in /etc/apt/sources.list.d/pve-enterprise.sources.disabled
               /etc/apt/sources.list.d/ceph.sources.disabled; do
        [ -f \"\$f\" ] && mv \"\$f\" \"\${f%.disabled}\";
      done; true"
  when: _host_reachable | bool
  changed_when: true
  failed_when: false

- name: Tear down stale bridges on LAN host  # noqa command-instead-of-shell
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      {{ _cleanup_ssh }} "
      for br in \$(ip -o link show type bridge | awk -F': ' '{print \$2}'); do
        grep -q \"auto \$br\" /etc/network/interfaces 2>/dev/null && continue;
        ip link set \"\$br\" down 2>/dev/null || true;
        ip link delete \"\$br\" 2>/dev/null || true;
      done"
    executable: /bin/bash
  when: _host_reachable | bool
  changed_when: true
  failed_when: false

- name: Reload kernel modules and rescan PCI on LAN host  # noqa command-instead-of-shell
  ansible.builtin.shell:
    cmd: >-
      {{ _cleanup_ssh }} "
      modprobe -r wireguard 2>/dev/null || true;
      modprobe -r iwlmvm iwlwifi 2>/dev/null || true;
      modprobe iwlwifi 2>/dev/null || true;
      echo 1 > /sys/bus/pci/rescan 2>/dev/null || true"
  when: _host_reachable | bool
  changed_when: true
  failed_when: false

- name: Bring up original interfaces on LAN host  # noqa command-instead-of-shell
  ansible.builtin.shell:
    cmd: >-
      {{ _cleanup_ssh }} "ifup --all --force 2>/dev/null || true"
  when: _host_reachable | bool
  changed_when: true
  failed_when: false

- name: Check if OpenWrt is running (for DHCP lease cleanup)
  ansible.builtin.command:
    cmd: qm status {{ openwrt_vm_id }}
  register: _vm_status
  changed_when: false
  failed_when: false

- name: Remove DHCP lease from OpenWrt for LAN host  # noqa command-instead-of-shell
  ansible.builtin.shell:
    cmd: |
      sshpass -p '' ssh \
        -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
        -o PubkeyAuthentication=no -o ConnectTimeout=10 \
        root@10.10.10.1 "
      changed=0;
      while uci show dhcp 2>/dev/null | grep -q \"name='{{ _lan_host_name }}'\"; do
        idx=\$(uci show dhcp | grep \"name='{{ _lan_host_name }}'\" | head -1 | sed -n 's/.*@host\[\([0-9]*\)\].*/\1/p');
        [ -z \"\$idx\" ] && break;
        uci delete dhcp.@host[\$idx];
        changed=1;
      done;
      [ \"\$changed\" = '1' ] && uci commit dhcp && /etc/init.d/dnsmasq restart;
      echo done"
  when: "'running' in (_vm_status.stdout | default(''))"
  changed_when: true
  failed_when: false
