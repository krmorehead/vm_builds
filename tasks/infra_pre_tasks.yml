---
# Shared pre_tasks for infrastructure plays (primary + LAN hosts).
# Disables enterprise repos, runs PVE health check, adds no-subscription
# repo, and syncs NTP when clock skew exceeds 30 seconds.

- name: Disable PVE enterprise repo (requires subscription)
  ansible.builtin.command:
    cmd: mv /etc/apt/sources.list.d/pve-enterprise.sources /etc/apt/sources.list.d/pve-enterprise.sources.disabled
  args:
    removes: /etc/apt/sources.list.d/pve-enterprise.sources

- name: Disable Ceph enterprise repo (requires subscription)
  ansible.builtin.command:
    cmd: mv /etc/apt/sources.list.d/ceph.sources /etc/apt/sources.list.d/ceph.sources.disabled
  args:
    removes: /etc/apt/sources.list.d/ceph.sources

- name: Detect PCIe safety properties (AMD APU, USB NIC)
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/detect_pcie_safety.yml"

- name: PVE health check (SSL, API, stale nodes)
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/pve_health_check.yml"

- name: Add Proxmox no-subscription repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pve-no-subscription.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: http://download.proxmox.com/debian/pve
      Suites: {{ ansible_facts['distribution_release'] }}
      Components: pve-no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg

- name: Check clock skew
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      chronyc -n tracking 2>/dev/null | awk '/System time/{print $4}' || echo "999"
    executable: /bin/bash
  register: _clock_skew
  changed_when: false
  failed_when: false

- name: Force NTP clock sync before infrastructure setup
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      if command -v chronyc >/dev/null 2>&1; then
        systemctl restart chronyd 2>/dev/null || true
        chronyc -a 'burst 4/4' 2>/dev/null || true
        sleep 3
        chronyc -a makestep 2>/dev/null || true
      elif command -v ntpdate >/dev/null 2>&1; then
        ntpdate -b pool.ntp.org 2>/dev/null || true
      fi
    executable: /bin/bash
  changed_when: false
  failed_when: false
  when: (_clock_skew.stdout | default('999') | float) > 30.0
