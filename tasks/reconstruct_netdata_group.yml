---
# Reconstruct the netdata dynamic group.
# Thin wrapper around the shared LXC group reconstruction.
#
# Consumed by:
#   - Per-feature molecule converge.yml (netdata-lxc scenario)
#   - Per-feature molecule verify.yml
#   - playbooks/cleanup.yml (rollback plays)
#
# Must run on a host in the monitoring_nodes/proxmox group.

- name: Reconstruct netdata dynamic group
  ansible.builtin.include_tasks: reconstruct_lxc_group.yml
  vars:
    reconstruct_service_name: Netdata
    reconstruct_service_prefix: netdata
    reconstruct_ct_id: "{{ netdata_ct_id }}"
