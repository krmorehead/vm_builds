---
# Bootstrap callhome on an LXC container via pct exec.
#
# BOOTSTRAP EXCEPTION: The callhome agent can't be configured via the
# NM HTTP API because the agent's HTTP listener (port 9002) doesn't start
# until CALLHOME_SERVER is set. This is a one-time bootstrap write.
# After the agent starts, the kiosk_configure sibling rewrite corrects
# the server URL to the local NM via HTTP.
#
# Required input variables:
#   _callhome_vmid         (str) — container VMID
#   _service_up_to_date    (bool) — set by check_service_version.yml

- name: "Check current callhome config — CT {{ _callhome_vmid }}"
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      pct exec {{ _callhome_vmid }} -- grep -E '^CALLHOME_(SERVER|PUBLIC_KEY)=' /etc/default/callhome 2>/dev/null || true
    executable: /bin/bash
  register: _callhome_current
  changed_when: false
  when:
    - not (_service_up_to_date | default(false) | bool)
    - callhome_server | default('') | length > 0

- name: "Bootstrap callhome config — CT {{ _callhome_vmid }}"
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      pct exec {{ _callhome_vmid }} -- sed -i \
        's|^CALLHOME_SERVER=.*|CALLHOME_SERVER={{ callhome_server }}|' \
        /etc/default/callhome
      pct exec {{ _callhome_vmid }} -- sed -i \
        's|^CALLHOME_PUBLIC_KEY=.*|CALLHOME_PUBLIC_KEY={{ callhome_public_key }}|' \
        /etc/default/callhome
      pct exec {{ _callhome_vmid }} -- sed -i \
        's|^CALLHOME_INTERVAL=.*|CALLHOME_INTERVAL={{ callhome_heartbeat_interval }}|' \
        /etc/default/callhome
    executable: /bin/bash
  register: _callhome_bootstrap
  changed_when: true
  when:
    - not (_service_up_to_date | default(false) | bool)
    - callhome_server | default('') | length > 0
    - >-
      'CALLHOME_SERVER=' + callhome_server not in (_callhome_current.stdout | default(''))
      or 'CALLHOME_PUBLIC_KEY=' + callhome_public_key not in (_callhome_current.stdout | default(''))

- name: "Restart callhome service — CT {{ _callhome_vmid }}"
  ansible.builtin.command:
    cmd: "pct exec {{ _callhome_vmid }} -- systemctl restart callhome"
  changed_when: true
  register: _callhome_restart
  failed_when: false
  when: _callhome_bootstrap is defined and (_callhome_bootstrap.rc | default(1)) == 0

- name: "Warn if callhome restart failed — CT {{ _callhome_vmid }}"
  ansible.builtin.debug:
    msg: >-
      callhome restart on CT {{ _callhome_vmid }} returned rc={{ _callhome_restart.rc | default('N/A') }}.
      Service will self-heal via Restart=always. stderr={{ _callhome_restart.stderr | default('') }}
  when:
    - _callhome_restart is defined
    - (_callhome_restart.rc | default(0)) != 0
