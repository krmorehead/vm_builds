---
# Reconstruct the 'desktop' dynamic group from a running VM.
# Include this from plays that target desktop_nodes when the dynamic
# group is lost between playbook invocations (molecule verify, cleanup,
# per-feature scenarios).

- name: Check if Desktop VM is running
  ansible.builtin.command:
    cmd: qm status {{ desktop_vm_id }}
  register: _desktop_recon_status
  failed_when: false
  changed_when: false

- name: Skip reconstruction if VM is not running
  ansible.builtin.debug:
    msg: "Desktop VM {{ desktop_vm_id }} is not running -- skipping group reconstruction"
  when: _desktop_recon_status.rc != 0 or 'running' not in _desktop_recon_status.stdout

- name: Get Desktop VM MAC address
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      qm config {{ desktop_vm_id }} | grep '^net0' | sed -n 's/.*\(..:..:..:..:..:..\).*/\1/p'
    executable: /bin/bash
  register: _desktop_recon_mac
  changed_when: false
  when:
    - _desktop_recon_status.rc == 0
    - "'running' in _desktop_recon_status.stdout"

- name: Look up Desktop VM IP from ARP/DHCP
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      awk '/{{ _desktop_recon_mac.stdout | lower }}/{print $3}' /var/lib/misc/dnsmasq.leases 2>/dev/null ||
      ip -4 neigh | awk '/{{ _desktop_recon_mac.stdout | lower }}/{print $1}'
    executable: /bin/bash
  register: _desktop_recon_ip
  changed_when: false
  when:
    - _desktop_recon_status.rc == 0
    - "'running' in _desktop_recon_status.stdout"

- name: Check for temporary SSH key from provisioning
  ansible.builtin.stat:
    path: /tmp/desktop_tmp_key
  delegate_to: localhost
  register: _desktop_recon_tmpkey

- name: Register Desktop VM in dynamic group
  ansible.builtin.add_host:
    name: "desktop-{{ inventory_hostname }}"
    groups: desktop
    ansible_host: "{{ _desktop_recon_ip.stdout | trim }}"
    ansible_user: "{{ lookup('env', 'DESKTOP_USER') | default('desktop', true) }}"
    ansible_connection: ansible.builtin.ssh
    ansible_ssh_private_key_file: "{{ '/tmp/desktop_tmp_key' if _desktop_recon_tmpkey.stat.exists else '' }}"
    ansible_ssh_common_args: >-
      -o ProxyJump=root@{{ ansible_host }}
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
      -o ServerAliveInterval=15
      -o ServerAliveCountMax=4
      -o ConnectTimeout=30
    ansible_ssh_timeout: 30
    desktop_proxmox_host: "{{ inventory_hostname }}"
    desktop_vm_id_ref: "{{ desktop_vm_id }}"
  when:
    - _desktop_recon_status.rc == 0
    - "'running' in _desktop_recon_status.stdout"
    - _desktop_recon_ip.stdout | trim | length > 0
