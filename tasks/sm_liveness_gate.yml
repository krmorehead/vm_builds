---
# ── SuperManager liveness gate ────────────────────────────────
# SM API must respond AND all registered NMs must have kiosk
# heartbeating. Driven by host registry — not inventory count.

- name: "SM API — MUST respond or system is DEAD"
  ansible.builtin.uri:
    url: "{{ callhome_server_local }}/api/fleet/health"
    timeout: 5
    return_content: true
    headers: "{{ nm_auth_headers }}"

- name: "SM KIOSK HEARTBEATS — all registered NMs must report"
  ansible.builtin.uri:
    url: "{{ callhome_server_local }}/api/fleet/ready?services=kiosk"
    timeout: 5
    return_content: true
    headers: "{{ nm_auth_headers }}"
  register: _sm_kiosk

- name: "DEAD — KIOSK HEARTBEATS"
  ansible.builtin.assert:
    that: _sm_kiosk.json.all_ready | bool
    fail_msg: >-
      {{ _sm_kiosk.json.ready_count }}/{{ _sm_kiosk.json.registered_hosts }}
      registered NMs have kiosk heartbeating. MISSING KIOSKS ARE DEAD.
      Response: {{ _sm_kiosk.json }}
