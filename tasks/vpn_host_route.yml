---
# Add a VPN subnet route on the Proxmox host pointing to the local
# WireGuard container. Idempotent: checks existing route first.
# Also exports host_vpn_ip fact for downstream plays.

- name: Get WireGuard container IP from pct config
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      pct config {{ wireguard_ct_id }} | awk -F'[=,/]' '/^net0:/{for(i=1;i<=NF;i++) if($i~"ip") print $(i+1)}'
    executable: /bin/bash
  register: _wg_ct_ip
  changed_when: false

- name: Check existing VPN subnet route
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      ip route show {{ vpn_subnet }} 2>/dev/null | grep -c 'via {{ _wg_ct_ip.stdout | trim }}' || echo 0
    executable: /bin/bash
  register: _vpn_route_exists
  changed_when: false
  when: _wg_ct_ip.stdout | trim | length > 0

- name: Add VPN subnet route via WireGuard container
  ansible.builtin.command:
    cmd: ip route replace {{ vpn_subnet }} via {{ _wg_ct_ip.stdout | trim }}
  changed_when: true
  when:
    - _wg_ct_ip.stdout | trim | length > 0
    - (_vpn_route_exists.stdout | default('0') | trim | int) == 0

- name: Enable VPN forwarding in WireGuard container (wg0 MASQUERADE + eth0→wg0 FORWARD)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      pct exec {{ wireguard_ct_id }} -- bash -c '
        iptables -t nat -C POSTROUTING -o wg0 -j MASQUERADE 2>/dev/null || \
          iptables -t nat -A POSTROUTING -o wg0 -j MASQUERADE
        iptables -C FORWARD -i eth0 -o wg0 -j ACCEPT 2>/dev/null || \
          iptables -A FORWARD -i eth0 -o wg0 -j ACCEPT
      '
    executable: /bin/bash
  changed_when: true
  when: _wg_ct_ip.stdout | trim | length > 0

- name: Get host bridge IP for kiosk VPN routing (LAN hosts only)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      BRIDGE=$(pct config {{ kiosk_ct_id }} 2>/dev/null | awk -F'[=,]' '/^net0:/{for(i=1;i<=NF;i++) if($i~"bridge") print $(i+1)}')
      [ -z "$BRIDGE" ] && exit 0
      ip -4 addr show "$BRIDGE" 2>/dev/null | awk '/inet /{sub(/\/.*/, "", $2); print $2; exit}'
    executable: /bin/bash
  register: _host_bridge_ip
  changed_when: false
  when:
    - inventory_hostname in groups.get('router_nodes', []) or inventory_hostname in groups.get('lan_hosts', [])
    - _wg_ct_ip.stdout | trim | length > 0

- name: Add VPN subnet route inside kiosk container (LAN hosts bypass OpenWrt for VPN traffic)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      EXISTING=$(pct exec {{ kiosk_ct_id }} -- ip route show {{ vpn_subnet }} 2>/dev/null || echo "")
      if [ -z "$EXISTING" ]; then
        pct exec {{ kiosk_ct_id }} -- ip route add {{ vpn_subnet }} via {{ _host_bridge_ip.stdout | trim }}
        echo ADDED
      else
        echo EXISTS
      fi
    executable: /bin/bash
  register: _kiosk_vpn_route
  changed_when: "'ADDED' in _kiosk_vpn_route.stdout"
  when:
    - inventory_hostname in groups.get('router_nodes', []) or inventory_hostname in groups.get('lan_hosts', [])
    - _host_bridge_ip is defined
    - _host_bridge_ip.stdout | default('') | trim | length > 0

- name: Export host VPN IP fact
  ansible.builtin.set_fact:
    host_vpn_ip: "{{ vpn_ip }}"
    cacheable: true
