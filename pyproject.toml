[project]
name = "vm-builds"
version = "1.0.0"
description = "Ansible automation for Proxmox VE VM and LXC provisioning with interactive Web UI"
requires-python = ">=3.10"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/webui/app.py" = ["E402"]
"scripts/webui/data.py" = ["E402"]
"scripts/webui/kiosk_server.py" = ["E402"]
"tests/*.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 15
markers = [
    "integration: Tests requiring real infrastructure (SSH, Proxmox hosts, deployed containers).",
    "no_infra: Pure unit tests exempt from the VPN+Kiosk infrastructure gate.",
]
