<!DOCTYPE html>
<html>
<head>
    <title>noVNC Standalone Test</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        #info { position: fixed; top: 0; left: 0; right: 0; height: 32px;
                background: #222; color: #0f0; font-family: monospace;
                font-size: 12px; line-height: 32px; padding: 0 12px; z-index: 99999; }
        #vnc-container { position: fixed; top: 32px; left: 0; right: 0; bottom: 0; }
    </style>
</head>
<body>
    <div id="info">Loading noVNC standalone test...</div>
    <div id="vnc-container"></div>
    <script type="module">
        import RFB from '/static/noVNC/core/rfb.js';

        const info = document.getElementById('info');
        const container = document.getElementById('vnc-container');

        // Get VNC URL from query param: ?url=ws://ip:port
        const params = new URLSearchParams(window.location.search);
        const url = params.get('url');

        if (!url) {
            info.textContent = 'ERROR: No ?url= param. Use ?url=ws://kiosk-ip:6080';
            info.style.color = 'red';
        } else {
            info.textContent = 'Connecting to ' + url + '...';
            try {
                const rfb = new RFB(container, url);
                rfb.scaleViewport = true;
                rfb.resizeSession = true;
                rfb.showDotCursor = true;

                rfb.addEventListener('connect', () => {
                    info.textContent = 'CONNECTED to ' + url + ' — move mouse over canvas to test interaction';
                    info.style.color = '#0f0';
                    rfb.focus();
                });

                rfb.addEventListener('disconnect', (e) => {
                    info.textContent = 'DISCONNECTED: ' + (e.detail.clean ? 'clean' : 'error');
                    info.style.color = e.detail.clean ? '#ff0' : '#f00';
                });

                // Log mouse events hitting the canvas
                container.addEventListener('mousedown', (e) => {
                    info.textContent = 'mousedown at ' + e.clientX + ',' + e.clientY;
                });
                container.addEventListener('mousemove', (e) => {
                    info.textContent = 'mousemove at ' + e.clientX + ',' + e.clientY;
                });
            } catch(err) {
                info.textContent = 'ERROR: ' + err.message;
                info.style.color = 'red';
            }
        }
    </script>
</body>
</html>
